    - repository: hakoniwalab/hakoniwa-core-pro
      pull_request: 76
      title: "Fix relocatable Core include export"
      merged_at: "2026-07-26T10:22:07Z"
  verified: true
  promoted_to: []
  executable_guardrails:
    - "hakoniwalab/hakoniwa-pdu-endpoint:.github/workflows/hako-core-integration.yml
      (added by PR #59)"
  notes:
    - "Verified 2026-07-28, external contributor's Windows 11 x86_64 verification
      environment (native): hakoniwa-core-pro revision 576f40e, hakoniwa-pdu-endpoint
      revision f395a92. `hako.py doctor` (exit 0, 0.6s), `configure` (exit 0, prints the
      core_callback/core_polling variants-enabled line), `build` (exit 0, 6m05s, zero
      C1083 errors), `test` (exit 0, python import smoke passed) all green. Artifacts
      confirmed: hakoniwa_pdu_endpoint.dll, hakoniwa_pdu_endpoint_core_callback.dll,
      hakoniwa_pdu_endpoint_core_polling.dll, _c_endpoint_ffi.cp312-win_amd64.pyd."
    - "Implementation issue: hakoniwa-pdu-endpoint #58 (state at time of writing: open;
      confirmed via `gh issue view` read, not assumed)."
    - "This candidate's own diagnosis was correct about which layer owned the bug (the
      Core package's CMake export, not the endpoint's core_variants/CMakeLists.txt, and
      not an MSVC-only defect) -- see Correction 1/2 in validation.notes for the two
      places this candidate's own record-keeping was imprecise (a misleading --config
      description, and citing a pre-fix Core revision as if it were 'the current Core')."
