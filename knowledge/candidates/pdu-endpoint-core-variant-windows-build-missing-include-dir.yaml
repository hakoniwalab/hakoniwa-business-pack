validation:
  status: partially_verified
  required:
    - Independently re-read src/core_variants/CMakeLists.txt and src/CMakeLists.txt at
      revision 5c2b815ae661f6063a91840c356717558dab9ab3 directly (this candidate's
      citation of hako_configure_core_endpoint_variant() at lines 89-94 and the legacy
      target's include additions at src/CMakeLists.txt:265-268 relies on this workspace's
      earlier reading of that exact revision, which is no longer checked out locally for
      independent re-confirmation in this pass; the compiler error pattern is fully
      consistent with that account but the specific line numbers were not re-verified in
      this session).
    - Confirm on a non-Windows platform (Linux or macOS) whether a clean
      find_package(hakoniwa-core CONFIG)-only consumption of a hakoniwa-core-pro install
      tree (no system package /usr/include/hakoniwa, no pkg-config-based consumer)
      reproduces the same missing-include-directory failure, to settle whether other
      platforms are unaffected or merely masked.
    - Apply and build-test either fix direction (Core package export correction, or
      symmetric include addition in core_variants/CMakeLists.txt) before claiming
      resolution.
  notes:
    - "The .pc-vs-CMake-export mismatch (Cflags: -I${includedir}/hakoniwa vs.
      INTERFACE_INCLUDE_DIRECTORIES ${_IMPORT_PREFIX}/include) was independently
      re-verified in this pass by reading the actual installed files, not taken on the
      strength of the parallel review alone."
    - No upstream issue has been filed for this defect yet.

