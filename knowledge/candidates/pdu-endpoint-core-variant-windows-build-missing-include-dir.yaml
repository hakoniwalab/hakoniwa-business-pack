  runtime_evidence:
    - description: >-
        External contributor's Windows 11 x86_64 verification environment (native,
        upstream sources unmodified), 2026-07-26, revision
        5c2b815ae661f6063a91840c356717558dab9ab3: `hako.py doctor` and `hako.py configure`
        both EXITCODE=0 for the core-enabled manifest (`-- Hakoniwa Core endpoint variants
        enabled: core_callback, core_polling` printed); `hako.py build --config Release`
        EXITCODE=1 after 7m02s with the four C1083 errors quoted above, while the
        default (core-disabled) manifest built cleanly in 2m31s in the same session.
    - description: >-
        Same verification environment and date: directly reading the installed
        hakoniwa-core-pro package tree's lib/pkgconfig/hakoniwa-core.pc and
        lib/cmake/hakoniwa-core/hakoniwa-core-targets.cmake (read-only, the workspace's own
        installed hakoniwa-core-pro build artifacts, not edited) confirmed the
        Cflags-vs-CMake-export include-path mismatch described above, and a directory
        listing of the install tree's include/ directory (maxdepth 2) confirmed
        hako_asset.h and hakoniwa_asset_polling.h exist only under
        <install-prefix>/include/hakoniwa/, not directly under <install-prefix>/include/.
  expert_input:
    - source: an independent AI-assisted parallel second-opinion diagnosis, obtained per
        this contributor's own build-failure escalation policy
      statement: >-
        Independently proposed the same direct cause (core_variants/CMakeLists.txt only
        adding the endpoint's own include directory) and additionally flagged the
        Cflags-vs-CMake-export mismatch in the installed hakoniwa-core-pro package as a
        more fundamental, platform-independent defect, plus the framing that this is not
        an MSVC-specific issue but an install-tree/export-metadata mismatch that other
        platforms may currently avoid through different, unrelated include paths. This
        workspace independently re-read the actual .pc and *-targets.cmake files (see
        runtime_evidence above) before recording the Cflags-vs-CMake-export claim here;
        it is not accepted on the parallel review's authority alone.

