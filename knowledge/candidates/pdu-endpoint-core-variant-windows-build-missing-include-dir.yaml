  runtime_evidence:
    - description: >-
        External contributor's Windows 11 x86_64 verification environment (native,
        upstream sources unmodified), 2026-07-26, revision
        5c2b815ae661f6063a91840c356717558dab9ab3: `hako.py doctor` and `hako.py configure`
        both EXITCODE=0 for the core-enabled manifest (`-- Hakoniwa Core endpoint variants
        enabled: core_callback, core_polling` printed); `hako.py build --config Release`
        EXITCODE=1 after 7m02s with the four C1083 errors quoted above, while the
        default (core-disabled) manifest built cleanly in 2m31s in the same session.
    - description: >-
        Same verification environment and date: directly reading the installed
        hakoniwa-core-pro package tree's lib/pkgconfig/hakoniwa-core.pc and
        lib/cmake/hakoniwa-core/hakoniwa-core-targets.cmake (read-only, the workspace's own
        installed hakoniwa-core-pro build artifacts, not edited) confirmed the
        Cflags-vs-CMake-export include-path mismatch described above, and a directory
        listing of the install tree's include/ directory (maxdepth 2) confirmed
        hako_asset.h and hakoniwa_asset_polling.h exist only under
        <install-prefix>/include/hakoniwa/, not directly under <install-prefix>/include/.
  expert_input:
    - source: an independent AI-assisted parallel second-opinion diagnosis, obtained per
        this contributor's own build-failure escalation policy
      statement: >-
        Independently proposed the same direct cause (core_variants/CMakeLists.txt only
        adding the endpoint's own include directory) and additionally flagged the
        Cflags-vs-CMake-export mismatch in the installed hakoniwa-core-pro package as a
        more fundamental, platform-independent defect, plus the framing that this is not
        an MSVC-specific issue but an install-tree/export-metadata mismatch that other
        platforms may currently avoid through different, unrelated include paths. This
        workspace independently re-read the actual .pc and *-targets.cmake files (see
        runtime_evidence above) before recording the Cflags-vs-CMake-export claim here;
        it is not accepted on the parallel review's authority alone.

confidence: high

contradictions: []

validation:
  status: verified
  required: []
  notes:
    - "The .pc-vs-CMake-export mismatch (Cflags: -I${includedir}/hakoniwa vs.
      INTERFACE_INCLUDE_DIRECTORIES ${_IMPORT_PREFIX}/include) was independently
      re-verified in this pass by reading the actual installed files, not taken on the
      strength of the parallel review alone."
    - "2026-07-28 re-verification, external contributor's Windows 11 x86_64 verification
      environment (native, 2026-07-28), hakoniwa-core-pro revision 576f40e (includes
      merged PR #75 'Export Core frontend include requirements' and PR #76 'Fix
      relocatable Core include export'), hakoniwa-pdu-endpoint revision f395a92 (includes
      merged PR #59 'ci: reproduce Windows Core build through hako.py'): the installed
      hakoniwa-core-targets.cmake's INTERFACE_INCLUDE_DIRECTORIES for the assets/shakoc
      frontend targets now reads '${_IMPORT_PREFIX}/include/hakoniwa;
      ${_IMPORT_PREFIX}/include/hakoniwa/pdu;${_IMPORT_PREFIX}/include' (previously
      '${_IMPORT_PREFIX}/include' only, confirmed by directly diffing the old install
      tree against the new one). `hako.py doctor` (0.6s), `configure` (prints '--
      Hakoniwa Core endpoint variants enabled: core_callback, core_polling'), and
      `build` (6m05s) all exited 0 with zero C1083 errors in the build log; `test`
      passed the python import smoke (HAKO_PYTHON_IMPORT_OK <class
      'hakoniwa_pdu_endpoint.c_endpoint.Endpoint'>). All four expected artifacts were
      produced: hakoniwa_pdu_endpoint.dll, hakoniwa_pdu_endpoint_core_callback.dll,
      hakoniwa_pdu_endpoint_core_polling.dll, and _c_endpoint_ffi.cp312-win_amd64.pyd.
      This confirms the fix landed in the Core package export (fix direction (a)
      above), not as an endpoint-side compatibility patch (fix direction (b)) -- the
      direction this candidate's diagnosis judged more durable."
    - "Correction 1 (self-reported): this candidate's own reproduction steps used
      `hako.py build --config Release`, which misreads what --config means -- it is the
      path to an alternate manifest file, not a CMake configuration selector; the build
      type comes from the manifest's own build.type field. The correct standard sequence
      is `doctor` -> `configure` -> `build` (+ `test`), passing `--config <manifest
      path>` only when substituting a non-default manifest. This mis-description is
      believed to be why the maintainer's first draft CI run (before PR #59) exercised
      `build --config Release` and went RED for the wrong reason: that RED was an
      artifact of the CLI-usage description here, not evidence of the Core defect itself
      (the maintainer documents this in upstream issue #58 and PR #59). A proposal to
      promote --config to a documented common hako.py CLI contract is tracked separately
      as hakoniwa-business-pack issue #49."
    - "Correction 2 (self-reported): the C1083 failure this candidate originally recorded
      was observed against hakoniwa-core-pro revision 98a057a (an install built on
      2026-07-10), which predates both PR #75 (merged 2026-07-26T02:46Z) and PR #76
      (merged 2026-07-26T10:22Z). The candidate's original framing as 'a defect in the
      current Core' was therefore imprecise; the accurate framing is 'reproduced against
      a pre-fix Core revision.' The diagnosis content itself -- that the Core CMake
      export omitted the ${prefix}/include/hakoniwa directory its own headers live under
      -- was correct, and is exactly what PR #75/#76 corrected."
    - "Honest unresolved observation (do not overstate): in this same 2026-07-28
      environment, `hako.py test`'s python-import smoke passed for the core-enabled
      build without any custom os.add_dll_directory() launcher. This appears to
      contradict a 2026-07-26 finding (see the companion
      pdu-endpoint-python-binding-windows-recipe.yaml candidate) that the DLL-search gap
      -- c_endpoint.py never reading hako.py's own computed
      HAKO_PDU_ENDPOINT_RUNTIME_DIRS -- reproduces on a core-enabled build. Reading the
      2026-07-28 revision's python/hakoniwa_pdu_endpoint/c_endpoint.py confirms
      HAKO_PDU_ENDPOINT_RUNTIME_DIRS is still not read (add_dll_directory is only called
      for candidate lib dirs), and both the old and new Core installs' bin directories
      contain shakoc.dll. The reason the trap did not reproduce this time is not
      identified. Do not record this as 'the DLL-search trap is fixed' -- record it
      as 'did not reproduce in this configuration, reason unconfirmed.' This is relevant
      to hakoniwa-business-pack issue #51 (common Python environment / install boundary
      for Hakoniwa bindings)."

tracking:
  implementation_status: open
  issues:
