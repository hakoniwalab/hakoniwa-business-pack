      number: 58
      relation: fix
      status: open

promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-pdu-endpoint
      kind: ci
      path: .github/workflows/hako-core-integration.yml
      mode: detect-and-suggest-remediation
      notes:
        - "PR #59 ('ci: reproduce Windows Core build through hako.py') added this
          workflow, turning this candidate's reproduction into a standing regression
          guardrail for the Windows Core-enabled manifest build."

promotion_rationale:
  - This is a concrete, reproducible Windows build failure in the current manifest-driven
    architecture with a plausible cross-platform root cause (a CMake-export/pkg-config
    metadata mismatch in the owning Core package), making it good material for an
    upstream issue in either or both of hakoniwa-pdu-endpoint and hakoniwa-core-pro.
  - "Promoted beyond detect-only now that hakoniwa-core-pro PR #75/#76 and
    hakoniwa-pdu-endpoint PR #59 landed a durable fix plus a standing CI guardrail,
    independently re-verified in this workspace's own native Windows build."

