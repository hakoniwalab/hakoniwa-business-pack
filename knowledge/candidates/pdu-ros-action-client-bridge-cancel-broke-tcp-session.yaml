promotion_targets:
  catalog:
    - hakoniwa-pdu-ros
    - hakoniwa-pdu-endpoint
  runtime_primer: true
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-pdu-ros
      kind: test
      path: test/native/test_native_action_client_node.py
      mode: detect-only
      notes:
        - >-
          If this repository's native integration suite gains a cross-boundary
          (non-loopback) Cancel scenario, it would be the natural home for a
          regression guardrail for this exact defect; this candidate does not
          author one, only flags where it belongs.

promotion_rationale:
  - >-
    Anyone bridging Action over a real Windows-WSL2 TCP boundary needs to know
    that Cancel was a known session-killing path before pdu-endpoint b089e0e /
    pdu-rpc 7ed378b, and that pinning read_timeout_ms=0 was part of what made
    the fixed behavior reproducible in this workspace's retest. That is
    runtime-primer-level guidance, not a single component's catalog fact, since
    it spans two repositories' fixes acting together.
  - >-
    No new executable guardrail is authored here. The fix already lives in two
    upstream repositories' own source; a regression test belongs in
    hakoniwa-pdu-ros's own native suite if and when it adds cross-boundary
    coverage, not as a workspace-side check.

resolution:
  status: fixed
  fixed_by:
    - repository: hakoniwalab/hakoniwa-pdu-endpoint
      issue: 65
      pull_request: null
      revision: b089e0e
    - repository: hakoniwalab/hakoniwa-pdu-rpc
      issue: 78
      pull_request: null
      revision: 7ed378b
  verified: true
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      Full cycle completed in this workspace: reproduced (4/4) -> filed as
      hakoniwa-pdu-ros#20 -> tmori shipped hakoniwa-pdu-endpoint#65 and
      hakoniwa-pdu-rpc#78 -> this workspace re-tested A/B on the same real
      Windows-host/WSL2 TCP boundary where the defect was found -> confirmed
      resolved (4/4) -> issue closed as COMPLETED.
    - >-
      The A/B retest used read_timeout_ms=0, which this configuration's
      "options": {} resolves to by default (see the companion
      pdu-endpoint-tcp-options-empty-means-no-read-timeout candidate). This is
      recorded explicitly because a reader who instead sets a short nonzero
      read_timeout_ms should not assume this retest covers that configuration.
