id: pdu-generated-converter-leaves-primitive-varray-undecoded
title: hakoniwa-pdu 1.4.3 returned primitive varrays as raw bytes; current hakoniwa-pdu-python main decodes them as numeric values
status: candidate

knowledge_type:
  - known_pitfall
  - validation_rule

summary: >
  The PyPI hakoniwa-pdu 1.4.3 generated converter for `sensor_msgs/JointState`
  decoded the variable-length `string` array but assigned primitive variable-length
  arrays directly from the raw byte slice. `position`, `velocity`, and `effort` therefore
  looked populated while containing byte values rather than float64 values. This produced
  a plausible false success when validation checked only that arrays were non-empty.
  The current `hakoniwa-pdu-python` main implementation at revision
  ee6e5ec3fe6b324e9ba2a2ae821ff5a275b20a54 calls
  `binToArrayValues("float64", ...)` for these fields, so this specific JointState decode
  problem is historical rather than an unresolved defect in current main.

observation:
  context: >
    Decoding `sensor_msgs/JointState` PDUs received over TCP from a hakoniwa-pdu-ros bridge
    on native Windows 11 x86_64 with CPython 3.12.7 and hakoniwa-pdu 1.4.3 from PyPI,
    2026-07-31.
  details:
    - "In hakoniwa-pdu 1.4.3, `name` was decoded through binToArrayValues while primitive varrays were assigned directly from `array_value`."
    - "A four-joint message returned position, velocity, and effort as 32 integers in the range 0..255 rather than four float64 values."
    - "The underlying data was intact: interpreting the effort bytes as little-endian float64 recovered [0.1, 0.2, 0.3, 0.4], and position/velocity matched the sender's waveform."
    - "The first end-to-end check passed because it asserted only that the arrays were non-empty. Value equality is required to distinguish decoded numbers from raw bytes."
    - "The current hakoniwa-pdu-python main JointState converter uses binToArrayValues for position, velocity, and effort."

sources:
  repositories:
    - repository: hakoniwalab/hakoniwa-pdu-python
      path: src/hakoniwa_pdu/pdu_msgs/sensor_msgs/pdu_conv_JointState.py
      revision: "PyPI 1.4.3"
    - repository: hakoniwalab/hakoniwa-pdu-python
      path: src/hakoniwa_pdu/pdu_msgs/sensor_msgs/pdu_conv_JointState.py
      revision: ee6e5ec3fe6b324e9ba2a2ae821ff5a275b20a54
  runtime_evidence:
    - description: >-
        On hakoniwa-pdu 1.4.3, 1222 received JointState PDUs returned name correctly while
        numeric varrays were raw byte lists. Unpacking those bytes recovered the expected
        physical values.
    - description: >-
        Source inspection of current hakoniwa-pdu-python main at ee6e5ec confirms that the
        JointState numeric fields are decoded with binToArrayValues("float64", ...).
  expert_input: []

confidence: high

contradictions: []

validation:
  status: partially_verified
  required:
    - Run a current-release round-trip test with known float values to confirm the source-level fix in an installed artifact.
    - Determine whether any other generated types or older released package versions retain the same primitive-varray pattern.
    - Check other generated target languages separately; this observation covers the Python JointState converter only.
  notes:
    - The old behavior is verified at runtime and the current source-level correction is verified by inspection. A current installed-artifact rerun remains desirable.

tracking:
  implementation_status: resolved
  issues: []

promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: true
  recipes: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-pdu-python
      kind: test
      path: src/hakoniwa_pdu/pdu_msgs
      mode: detect-only
      notes:
        - Round-trip known primitive-varray values and compare decoded numbers element by element. Non-emptiness alone is not sufficient evidence.

promotion_rationale:
  - The historical failure remains useful because users may still encounter older PyPI packages and because it demonstrates why value-level validation is required.
  - The owning repository is hakoniwalab/hakoniwa-pdu-python, whose current main already contains the corrected decode path.

resolution:
  status: fixed
  fixed_by:
    - repository: hakoniwalab/hakoniwa-pdu-python
      revision: ee6e5ec3fe6b324e9ba2a2ae821ff5a275b20a54
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - This candidate records a problem observed in PyPI hakoniwa-pdu 1.4.3, not a claim that current main still returns raw bytes.
    - Current main contains the numeric decode calls, but a released-artifact end-to-end rerun has not yet been recorded here.
