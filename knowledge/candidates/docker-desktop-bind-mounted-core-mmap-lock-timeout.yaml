id: docker-desktop-bind-mounted-core-mmap-lock-timeout
title: Keep Hakoniwa Core mmap and file locks off Docker Desktop bind mounts
status: candidate

knowledge_type:
  - runtime_rule
  - known_pitfall
  - deployment_rule

summary: >
  When a Hakoniwa work directory is bind-mounted from a macOS host through
  Docker Desktop, Core mmap files and file locks under
  foundation/runtime/mmap can fail to provide the synchronization semantics
  expected by the runtime. Keep the Foundation path contract unchanged, but
  back that path with container-local tmpfs for a single-container deployment.

observation:
  context: >
    A Docker-only Nova5 environment used one Ubuntu Jazzy container on an
    Apple Silicon macOS host. Source, Foundation output, configuration, and
    logs were stored in a host bind-mounted HAKONIWA_WORK_DIR.
  details:
    - >-
      Foundation configure and build completed, and all assets registered,
      but hako-cmd start failed with "file-lock wait timed out after 3000 ms"
      while foundation/runtime/mmap was backed by the host bind mount.
    - >-
      With the same arm64 image, binaries, configuration, and work directory,
      overlaying only foundation/runtime/mmap with container-local tmpfs made
      hako-cmd start reach RUNNING.
    - >-
      In the tmpfs-backed run, the ROS 2 bridge exposed /joint_trajectory and
      /pdu/joint_states, and a trajectory command changed the observed six
      joint positions.
    - >-
      Build output, installed tools, generated configuration, and logs do not
      need this treatment and can remain on the host bind mount.

sources:
  repositories:
    - path: hakoniwa-robot-arm-pack
      revision: b40af372b4bd5297a8f604377649c8df50f15b0a
      files:
        - docker/run.bash
        - docker/Dockerfile.jazzy
        - tools/recipe/nova5.py
  runtime_evidence:
    - description: >-
        Reproduced on 2026-09-08 using Docker Desktop on macOS with an Ubuntu
        24.04 / ROS 2 Jazzy arm64 image. The bind-mounted run timed out; adding
        --tmpfs at the configured Foundation mmap path passed start and the
        end-to-end ROS 2 trajectory check.
  expert_input: []

confidence: high

contradictions:
  - target: work-directory persistence assumption
    existing_claim: Every path below HAKONIWA_WORK_DIR can be backed by the same Docker Desktop bind mount.
    new_evidence: The volatile Core mmap and lock directory required container-local backing in the reproduced environment.

validation:
  status: verified
  required:
    - Use the exact core_mmap_path generated by the active Foundation configuration as the tmpfs destination.
    - Keep every process sharing the mmap domain in the same container when using container-local tmpfs.
    - Re-run the runtime start and data-flow check after changing container storage or host platform.
  notes:
    - >-
      The controlled comparison changed only the backing storage for the mmap
      directory; it did not require a different CPU architecture or Viewer.

tracking:
  implementation_status: in_progress
  issues: []

promotion_targets:
  catalog: []
  runtime_primer: true
  base_ecosystem_guide: true
  component_asset_guide: false
  recipes: []

promotion_rationale:
  - >-
    This is a deployment boundary shared by any Hakoniwa component that runs
    Core from a Docker Desktop container while persisting its work directory
    through a host bind mount.

resolution:
  status: implemented
  fixed_by:
    - repository: hakoniwa-robot-arm-pack
      revision: uncommitted
      path: docker/run.bash
  verified: true
  promoted_to: []
  executable_guardrails:
    - >-
      The Arm Pack Docker launcher mounts
      HAKONIWA_WORK_DIR/foundation/runtime/mmap as tmpfs and tests that the
      selected work directory and tmpfs destination remain aligned.
  notes:
    - >-
      tmpfs is suitable for the current one-container Docker-only topology.
      Multiple containers cannot share a container-local tmpfs and require a
      separately designed shared backing store.
