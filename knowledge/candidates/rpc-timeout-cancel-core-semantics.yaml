promotion_rationale:
  - The timeout/cancel lifecycle is a reusable RPC interface contract, not a one-off Conductor Light implementation detail.
  - The exact state-machine semantics belong in the owning RPC and Conductor component catalogs; broader ecosystem documents do not need this low-level race detail.
  - The regression tests and cross-platform CI are the durable executable form of the discovered runtime rule.

