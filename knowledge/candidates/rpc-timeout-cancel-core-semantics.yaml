id: rpc-timeout-cancel-core-semantics
title: Preserve Core-compatible timeout/cancel race semantics across PDU-RPC and Conductor Light
status: promoted

knowledge_type:
  - interface_contract
  - runtime_rule
  - design_intent
  - validation_rule
  - known_pitfall

summary: >
  Hakoniwa RPC timeout is an event, not an implicit request termination. The client remains
  in the in-flight state until the caller explicitly sends cancel and the request is resolved
  by either a normal response or cancel completion. A normal response is allowed to win the
  timeout/cancel race. This contract originates in hakoniwa-core-pro and should remain
  consistent in hakoniwa-pdu-rpc and synchronous users such as hakoniwa-conductor-light.

observation:
  context: >
    Cross-platform validation of hakoniwa-conductor-light exposed an Ubuntu ARM64 startup
    failure. Investigation first found that Conductor Light collapsed RPC timeout/transport
    failures into NOT_SUPPORTED, then found that hakoniwa-pdu-rpc had drifted from the
    timeout/cancel state machine already implemented and regression-tested in hakoniwa-core-pro.
  details:
    - hakoniwa-core-pro reports request timeout without automatically cancelling; explicit cancel transitions the client into a canceling state.
    - While cancel is racing with normal completion, either the normal response or the cancel completion may win; a late cancel received after normal completion is ignored by the server.
    - hakoniwa-pdu-rpc previously auto-cancelled on timeout and could re-evaluate the expired request timeout while already cancelling, which could destroy the intended state-machine lifecycle.
    - hakoniwa-pdu-rpc PR #9 aligned timeout handling with Core semantics and added regression coverage for both cancel-wins and normal-response-wins races.
    - hakoniwa-conductor-light PR #5 explicitly cancels after timeout, keeps polling until the in-flight RPC reaches a terminal state, preserves a normal response that wins the race, and only retries event discovery after the endpoint is reusable.
    - Correcting the semantics exposed several tests that intentionally stopped the RPC server and then attempted client cleanup RPCs. Those tests were fixed instead of weakening production timeout semantics.
    - A peer/server disappearance is not treated as a normal RPC timeout recovery case. For Conductor Light, loss of the time-coordination server means the simulation itself is already failed; transparent HA/recovery is outside the Light product scope.

