    - description: >-
        Local WSL2 Ubuntu x64 verification on 2026-07-27 completed all 9 Conductor Light
        tests successfully after the timeout/cancel and test-lifecycle fixes; rpc_integration_test,
        rpc_client_facade_test, and rpc_server_transport_test all completed without hangs.
    - description: >-
        Conductor Light cross-platform workflow run 30247538916 on revision
        ce2635ec48634555f383eb5073806de2a2aacc6c passed Doctor, Build, Test, Smoke auto,
        and Smoke manual on Ubuntu x64, Ubuntu ARM64, macOS, and Windows x64. That verified
        tree was subsequently merged through PR #5 and PR #4 into main revision
        d4d1543161f6e5e1cf07452fbb90aae03211c30b.
  expert_input:
    - source: Hakoniwa developer
      statement: >-
        hakoniwa-core-pro is the source of truth for the RPC timeout/cancel state machine;
        timeout must not silently collapse the request lifecycle or erase the normal-response
        versus cancel race.
    - source: Hakoniwa developer
      statement: >-
        Conductor Light does not need transparent recovery if the conductor server itself
        disappears during simulation; losing the shared-time server means the simulation has failed.

confidence: high

contradictions:
  - target: hakoniwalab/hakoniwa-pdu-rpc timeout behavior before PR #9
    existing_claim: Timeout handling could automatically cancel and effectively recover the client endpoint without an explicit caller-controlled cancel lifecycle.
    new_evidence: Core Pro keeps timeout and cancellation separate, and the corrected PDU-RPC implementation now preserves that contract.
  - target: hakoniwalab/hakoniwa-conductor-light event capability detection before PR #5
    existing_claim: RPC_TIMEOUT and TRANSPORT_ERROR during GetEvent startup probing could be normalized into NOT_SUPPORTED.
    new_evidence: Capability rejection, transport failure, and timeout are distinct states; only an actual NOT_SUPPORTED response is a capability mismatch.

