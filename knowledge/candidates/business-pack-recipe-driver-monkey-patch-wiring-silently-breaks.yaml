validation:
  status: verified
  required:
    - >-
      Confirm the fix landing in PR #121 (once merged) preserves the identity
      assertion's guarantee -- i.e. that impl.pid_alive is process_liveness.pid_alive
      after driver-module import -- and re-run the 3/3-vs-0/3 host-worker
      liveness measurement against the merged revision, not only against this
      workspace's local reordering.
    - Confirm whether the same copy-loop-before-override hazard exists for any
      other symbol beyond pid_alive in this driver, or in the analogous driver
      for the Action Recipes, since only pid_alive was measured directly here.
  notes:
    - Verified by direct source reading of the exact ordering (import, copy
      loop, override, and the impl-side bare-name call site) plus a live 3/3
      vs 0/3 measurement in this workspace on real Windows hardware, not by
      inference from the commit messages alone.

