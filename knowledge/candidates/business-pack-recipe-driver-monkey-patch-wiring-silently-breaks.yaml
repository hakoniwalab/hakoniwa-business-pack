promotion_targets:
  catalog:
    - hakoniwa-business-pack
  runtime_primer: true
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes:
    - ros2-service-add-two-ints-host-docker
    - ros2-service-add-two-ints-client-host-docker
    - ros2-action-fibonacci-server-host-docker
    - ros2-action-fibonacci-client-host-docker
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-business-pack
      kind: test
      path: tools/recipe/test_ros2_service_add_two_ints.py
      mode: detect-only
      notes:
        - >-
          Per MAINTAINER.md's executable-knowledge-reflection ladder
          (lines 134-150), this is a textbook case for a guardrail: the
          failure condition (an override silently reverting to the original
          via self-assignment) is deterministically detectable by software --
          an assertIs identity check run once at driver-module import time --
          and the preferred remediation (reorder so overrides run after the
          copy loop, or make the copy loop skip names that have already been
          explicitly overridden) is low-risk and software-only. Detect-only is
          the right mode rather than detect-and-suggest-remediation, because
          the correct reordering is a small, repository-owned source change
          that should not be auto-applied by a generic guardrail.
        - >-
          A behavioral test (call pid_alive against a real or fake pid and
          check the boolean) was deliberately rejected as the guardrail shape,
          because this workspace measured that both a mock-based
          patch.object test and an in-process real-pid probe test stay green
          under the broken wiring. Only an identity assertion
          (assertIs(impl.pid_alive, process_liveness.pid_alive) evaluated
          after driver-module import) reliably distinguishes the two wirings.

promotion_rationale:
  - >-
    The underlying shape -- "preserve a wrapper module's full public API by
    copying everything from an implementation module, then separately try to
    override one symbol" -- is a reusable pitfall for any Recipe driver or
    similar wrapper module in this codebase, not specific to pid_alive or to
    AddTwoInts. It belongs in the runtime primer so the next symbol override
    (in this driver or a sibling one) does not repeat the same ordering
    mistake, which is why runtime_primer is set rather than only catalog.
  - >-
    catalog is set to hakoniwa-business-pack itself, not to an external
    component, because the defect lives in business-pack's own Recipe driver
    tooling (tools/recipe/), not in a vendored dependency.
  - >-
    All four Recipes reachable through ros2_bridge_examples.py's `import
    ros2_service_add_two_ints as common` are listed under recipes, since the
    same managed_host_alive path backs start/status/stop for all of them, and
    scoping this to only the AddTwoInts service pair would understate the
    blast radius that was actually confirmed by reading ros2_bridge_examples.py.
  - >-
    An executable guardrail is proposed and justified in detail above, because
    this is exactly the "runtime_rule / known_pitfall detectable by software"
    case the ladder in MAINTAINER.md lines 134-150 describes, and because two
    prior remediation attempts (08d44eb, e04f3d4) already failed to close this
    gap through source changes alone without a guardrail catching regressions.

resolution:
  status: pending
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      hakoniwalab/hakoniwa-business-pack PR #121
      (https://github.com/hakoniwalab/hakoniwa-business-pack/pull/121) is open
      but not yet merged, so resolution.status is pending and
      resolution.verified is false. The fix's effect has already been measured
      in this workspace against a local reordering (3/3 host-worker
      terminations before, 0/3 after), but that is a workspace-side
      reproduction of the intended fix, not a re-verification against the
      actual merged upstream revision -- per MAINTAINER.md, closing an issue
      or merging a PR is not by itself sufficient evidence, and this candidate
      additionally has not yet reached even that merge point.
    - >-
      issue #105 (closed) is the original os.kill(pid, 0)-on-Windows report
      that PR #110 was written against. It is tracked here, alongside the
      still-open PR #121, because #105's closure is what makes this
      candidate's finding notable: the wiring defect described here caused
      PR #110's intended fix to never actually reach managed_host_alive,
      despite #105 having been closed as resolved.
