promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-business-pack
      kind: test
      path: tools/test_foundation.py
      mode: detect-only
      notes:
        - The suite currently cannot distinguish "Foundation is broken here" from "the
          fixture wrote a receipt this platform's own writer would never produce". Making
          the fixture use the production writer (_yaml_string / json.dumps) would both fix
          the Windows failures and keep the test honest about the format it claims to
          exercise.

promotion_rationale:
  - The valuable knowledge is the pairing -- the Foundation implementation is Windows-ready
    for the paths/doctor surface AND its main Foundation test suite currently reports nine
    false failures there. Recording only the red test result would misrepresent the layer;
    recording only the passing doctor run would leave the next Windows contributor to
    rediscover the test portability problem.
  - The promotion target is the Business Pack's own test tooling rather than any component
    repository, because that is where the demonstrated defect is. The separate
    drone_threejs assertion can be made serialization-aware or explicitly platform-scoped
    without implying that the macOS-oriented Recipe itself is Windows-supported.

