id: foundation-test-suite-windows-path-assumptions
title: The Local Foundation paths and doctor surfaces work on Windows, but Foundation tests contain POSIX path assumptions
status: candidate

knowledge_type:
  - known_pitfall
  - validation_rule

summary: >
  Scope first, because the headline is easy to over-read: only the `paths` and `doctor`
  subcommands were exercised on Windows. `prepare`, `plan` and `build` were not run, so
  this candidate is NOT a Windows acceptance statement for the Foundation layer as a
  whole -- nothing here covers the shared Foundation venv, the primer's
  same-interpreter ABI rule, or component build orchestration.
  Within that scope, the Local Foundation layer added in hakoniwa-business-pack PR #57
  (foundation/, tools/foundation.py, tools/drone_threejs.py) runs correctly: `paths`
  resolves Windows paths, and `doctor` evaluated against a real Component Receipt written
  by hakoniwa-core-pro's `tools/hako.py install` reports SATISFIED for a satisfied
  requirement and INCOMPATIBLE with a correct reason and exit code 1 for an unsatisfiable
  one. The main Foundation test suite, however, fails on Windows -- 9 of 21 tests in
  tools/test_foundation.py. A separate assertion in tools/test_drone_threejs.py also fails
  on Windows because it compares a raw path against JSON-escaped output; that Recipe is
  macOS-oriented, so this is tracked as assertion portability rather than evidence that the
  Recipe itself must execute on Windows. Every Foundation failure examined is in TEST code,
  not in foundation.py: fixtures interpolate Windows paths into double-quoted YAML scalars
  without escaping backslashes, assertions compare unescaped paths against correctly
  escaped YAML/JSON output, or hard-code a POSIX separator. A Windows contributor running
  the suite today gets a red result that looks like a Foundation defect and is not one.

observation:
  context: >
    First acceptance evaluation of the Local Foundation layer on an external contributor's
    native Windows 11 x86_64 workspace, 2026-07-30, at hakoniwa-business-pack revision
    ed04582 with CPython 3.12.7, against a real hakoniwa-core-pro install produced in the
    same session by `python tools/hako.py install --install-dir <prefix>` (Core revision
    9727e1d).
  details:
    - "Production path works. `python tools/foundation.py paths --recipe-id
      drone-single-mujoco-threejs-mac` printed all fourteen workspace paths with correct
      Windows separators and created nothing. `python tools/foundation.py doctor --recipe
      <recipe> --install-dir <core install prefix>` printed 'Foundation: SATISFIED /
      [SATISFIED] hakoniwa-core-pro' for a recipe requiring capabilities shared_memory +
      hako_cmd and build_limits.asset_num.min=16. Raising the requirement to
      asset_num.min=32 produced 'Foundation: INCOMPATIBLE' with the reason
      'build_limits.asset_num.min: required=32, installed=16' and exit code 1, which
      satisfies the hako CLI contract's rule that a readiness failure MUST be non-zero."
    - "The receipt consumed above was written by hako.py install, not hand-authored. It
      records platform.os 'windows', architecture 'x64', install.prefix as a
      backslash-escaped double-quoted scalar, ten artifacts, and the resolved capacity
      limits -- i.e. the Receipt half of the Foundation contract is already being produced
      correctly by a component repository on Windows."
    - "Test suite result: tools/test_foundation.py -> Ran 21 tests, FAILED (failures=9).
      tools/test_drone_threejs.py -> Ran 3 tests, FAILED (failures=1). Failing names:
      test_satisfied, test_plan_has_no_actions_when_foundation_is_satisfied,
      test_incompatible_reports_capability_limit_platform_and_artifact,
      test_dependency_receipt_mismatch_is_incompatible,
      test_aggregate_status_uses_actionable_priority,
      test_plan_adds_dependencies_and_rebuilds_downstream,
      test_force_rebuilds_component_and_downstream_dependencies,
      test_component_commands_keep_shared_python_before_endpoint_cffi,
      test_cli_paths_json_does_not_create_workspace, and
      test_generated_launcher_uses_only_local_foundation_and_recipe_paths."
    - "Cause 1 (7 of the failures, all the UNKNOWN/BLOCKED/short-plan ones): the fixture
      helper FoundationInspectorTest.write_receipt() emits `install:\\n  prefix:
      \"{self.prefix}\"` with self.prefix being a pathlib Path. On Windows that yields a
      double-quoted YAML scalar containing single backslashes, e.g. \"C:\\Users\\...\".
      foundation.py's _scalar() parses double-quoted scalars with json.loads(), which
      raises 'Invalid \\escape' on that input, so the receipt cannot be loaded and the
      component degrades to UNKNOWN (and, transitively, aggregate status BLOCKED and
      truncated build plans). Confirmed directly: feeding foundation.load_receipt() a
      fixture-style unescaped scalar raises JSONDecodeError, while feeding it the
      hako.py-install-style escaped scalar returns the correct path. The production writer
      _yaml_string() is json.dumps(), so real receipts are symmetric with the reader and
      round-trip correctly -- only the test fixture is inconsistent with both."
    - "Cause 2 (2 failures): substring assertions compare an unescaped path against output
      that is correctly escaped. test_component_commands_keep_shared_python_before_endpoint_cffi
      asserts that `hakoniwa_core_root: \"C:\\Users\\...\"` appears in a manifest whose
      actual (correct) text is `hakoniwa_core_root: \"C:\\\\Users\\\\...\"`;
      test_generated_launcher_uses_only_local_foundation_and_recipe_paths asserts
      str(paths.install_prefix) appears verbatim in a JSON document where it is, correctly,
      JSON-escaped."
    - "Cause 3 (1 failure): test_cli_paths_json_does_not_create_workspace asserts
      data['foundation_root'].endswith('work/foundation'), a hard-coded POSIX separator.
      The value is correct on Windows; only the assertion is not portable."
    - "One further Windows-specific detail worth upstream's attention, seen in the
      test_drone_threejs failure output but not itself a failure cause: the generated
      launcher document mixes 8.3 short-form paths (C:\\Users\\<SHORT~1>\\...) for some
      external roots with long-form paths (C:\\Users\\<LongUserName>\\...) for
      Foundation-owned paths within the same document. Two spellings of one directory in
      one generated artifact is a portability hazard for any later string comparison; not
      investigated further in this session."

