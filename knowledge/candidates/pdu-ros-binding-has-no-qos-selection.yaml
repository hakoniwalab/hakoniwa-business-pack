confidence: high

contradictions: []

validation:
  status: verified
  required: []
  notes:
    - The binding parser validates supported history, depth, reliability, and durability values before startup.
    - Omitting qos preserves the original RELIABLE, VOLATILE, KEEP_LAST depth-10 behavior.
    - Native verification currently targets rmw_cyclonedds_cpp; other RMW implementations may differ in event behavior, but that does not leave the original CycloneDDS finding unresolved.

