        External contributor WSL2 Ubuntu 24.04 / ROS 2 Jazzy evidence showed zero direct
        deliveries from a BEST_EFFORT Tobas publisher and successful 50 Hz delivery through
        a temporary BEST_EFFORT-to-RELIABLE relay.
    - description: >-
        Maintainer Docker run on 2026-07-31 used ROS 2 Jazzy and rmw_cyclonedds_cpp. A
        BEST_EFFORT publisher delivered three JointState messages to a BEST_EFFORT binding;
        the same publisher produced no PDU and an explicit RELIABILITY diagnostic with a
        RELIABLE binding; a RELIABLE publisher delivered three messages to a binding with
        qos omitted.
