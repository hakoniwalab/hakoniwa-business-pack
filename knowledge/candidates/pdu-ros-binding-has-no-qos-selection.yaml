        BEST_EFFORT-to-RELIABLE relay sustained 50 Hz and made the bridge receive normally.
  expert_input: []

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - Define the binding contract for reliability, durability, history, and depth rather than adding only an isolated reliability flag.
    - Decide the backward-compatible behavior when QoS is omitted.
    - Add diagnostics that distinguish an absent publisher from an incompatible discovered publisher.
    - Re-verify against other RMW implementations when practical.
  notes:
    - Verified on one machine and one RMW implementation. The compatibility rule is DDS-level, but only rmw_cyclonedds_cpp was measured.

