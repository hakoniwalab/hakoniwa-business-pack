id: pdu-ros-binding-has-no-qos-selection
title: hakoniwa-pdu-ros subscribes with the rclpy default RELIABLE QoS and its binding config cannot change it, so a BEST_EFFORT publisher yields zero messages with no error
status: candidate

knowledge_type:
  - known_pitfall

summary: >
  hakoniwa-pdu-ros's bridge node creates its ROS subscription as
  `self.create_subscription(msg_cls, binding.topic, _on_msg, 10)`, which uses the rclpy
  default reliability of RELIABLE. DDS QoS compatibility rules forbid a RELIABLE
  subscription from matching a BEST_EFFORT publisher, so when the source topic is
  BEST_EFFORT the bridge simply never receives anything. There is no error, no warning and
  no diagnostic; the bridge looks healthy and the PDU channel stays empty. The binding
  configuration has no QoS field, so a caller cannot fix it from configuration, and when
  the publisher belongs to a third-party stack that must not be modified there is no fix on
  that side either. Tobas publishes joint_states as BEST_EFFORT, which is how this was
  found.

observation:
  context: >
    Bridging Tobas's `joint_states` topic (ROS 2 Jazzy, WSL2 Ubuntu 24.04,
    rmw_cyclonedds_cpp) into a Hakoniwa PDU channel for the Tobas bridge prototype named in
    hakoniwa-business-pack's Tobas catalog entry, 2026-07-30.
  details:
    - "Publisher side. Tobas publishes `<ns>/joint_states` with BEST_EFFORT reliability. The
      Tobas workspace is read-only for this exercise, so changing the publisher was not an
      option, which is the normal situation when bridging a third-party stack."
    - "Subscriber side. hakoniwa_pdu_ros/bridge_node.py creates the subscription with a
      plain depth argument and no QoS profile, so rclpy applies its default sensor-agnostic
      profile with RELIABLE reliability."
    - "Result. Incompatible QoS means the subscription never matches the publisher. The
      bridge process starts, loads its PDU definition, reports itself running and receives
      exactly zero messages. Nothing in its output indicates a QoS mismatch."
    - "Confirmed by working around it rather than by inference. A minimal relay node that
      subscribes BEST_EFFORT and republishes the identical message on a second topic with
      RELIABLE was inserted, and the bridge was pointed at the relayed topic. The relay
      sustained the source rate without loss, reporting 250 messages per 5 s (50 Hz) and
      1194 messages relayed in total, and the bridge then received normally."
    - "The relay is not a solution, it is the evidence. It exists only to change one QoS
      setting that the binding config cannot express. Every consumer bridging a BEST_EFFORT
      sensor topic would have to ship the same node."
    - "Diagnostic cost. Because the failure is silent, this presents identically to 'the
      bridge is misconfigured', 'the topic name is wrong' and 'the publisher is not running'.
      A QoS-mismatch warning, or simply logging the resolved subscription QoS at startup,
      would separate those cases immediately."

