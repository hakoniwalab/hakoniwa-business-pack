  runtime_evidence:
    - description: >-
        External contributor's WSL2 Ubuntu 24.04 / ROS 2 Jazzy environment, 2026-07-30.
        Bridge subscribed to a BEST_EFFORT Tobas topic received 0 messages with no error
        output. With a BEST_EFFORT-to-RELIABLE relay node inserted, the same bridge received
        normally and the relay logged a sustained 50 Hz (250 messages per 5 s, 1194 total).
  expert_input: []

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - Confirm the intended shape of a QoS option in the binding contract. Reliability alone
      would have covered this case, but durability, history and depth have the same
      compatibility consequences and a partial option risks a second round of this.
    - Decide whether the bridge should default to a sensor-data profile for topics it
      recognizes as sensor streams, or stay explicit and require configuration. This
      candidate does not assume which upstream prefers.
    - Not tested against other RMW implementations. QoS compatibility is a DDS-level rule,
      so the behavior should be implementation-independent, but only rmw_cyclonedds_cpp was
      measured.
  notes:
    - Verified on one machine with one publisher whose QoS could not be changed, which is
      what makes the missing configuration surface actionable rather than cosmetic.

tracking:
  implementation_status: none
  issues: []

promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-pdu-ros
      kind: doctor
      path: hakoniwa_pdu_ros/bridge_node.py
      mode: detect-only
      notes:
        - After subscribing, the node can compare its own QoS against the discovered
          publishers on that topic and log an actionable warning when they are
          incompatible. That turns a silent zero-message run into a named cause without
          waiting for the configuration surface to be designed.

promotion_rationale:
  - The missing capability is in the component's configuration contract, so the fix belongs
    to the owning repository. A Recipe cannot express what the binding schema does not
    accept.
  - The detect-only guardrail is proposed separately from the feature because the diagnostic
    gap hurts even after a QoS option exists -- a mismatch will still be the most common
    first-run failure when bridging third-party sensor topics.

