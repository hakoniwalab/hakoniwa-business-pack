id: pdu-ros-binding-has-no-qos-selection
title: hakoniwa-pdu-ros originally fixed subscriptions to RELIABLE QoS and could not consume BEST_EFFORT publishers
status: promoted

knowledge_type:
  - known_pitfall
  - interface_contract
  - validation_rule

summary: >
  Before hakoniwa-pdu-ros issue #3 was fixed, a binding could not declare ROS 2 QoS and
  subscriptions used the rclpy RELIABLE default. A BEST_EFFORT publisher such as Tobas
  joint_states therefore matched no subscription and produced a silent zero-message run.
  Bindings can now configure history, depth, reliability, and durability while preserving
  the previous RELIABLE / VOLATILE / KEEP_LAST depth-10 defaults when qos is omitted.
  Subscription startup logs expose the resolved profile, and incompatible publisher QoS
  events produce actionable warnings. Docker-based native CycloneDDS tests verify the
  compatible, incompatible, and backward-compatible paths.

observation:
  context: >
    Bridging Tobas joint_states on ROS 2 Jazzy / WSL2 Ubuntu 24.04 with
    rmw_cyclonedds_cpp into a Hakoniwa PDU channel, 2026-07-30.
  details:
    - "Tobas published joint_states with BEST_EFFORT reliability while the original bridge subscription used rclpy's RELIABLE default."
    - "The bridge started successfully but received zero messages and emitted no QoS-specific diagnostic."
    - "A temporary BEST_EFFORT-to-RELIABLE relay sustained 50 Hz and allowed the unchanged bridge to receive, proving the incompatibility mechanism."
    - "The relay was evidence only; the durable solution was to make QoS part of the binding contract and diagnose incompatible discovered publishers."

