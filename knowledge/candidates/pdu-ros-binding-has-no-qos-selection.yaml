id: pdu-ros-binding-has-no-qos-selection
title: hakoniwa-pdu-ros subscribes with the rclpy default RELIABLE QoS and its binding config cannot change it, so a BEST_EFFORT publisher yields zero messages with no error
status: candidate

knowledge_type:
  - known_pitfall

summary: >
  hakoniwa-pdu-ros's bridge node creates its ROS subscription as
  `self.create_subscription(msg_cls, binding.topic, _on_msg, 10)`, which uses the rclpy
  default reliability of RELIABLE. DDS QoS compatibility rules forbid a RELIABLE
  subscription from matching a BEST_EFFORT publisher, so when the source topic is
  BEST_EFFORT the bridge never receives anything. There is no error, warning, or diagnostic;
  the bridge looks healthy and the PDU channel stays empty. The binding configuration has no
  QoS field, so callers cannot fix the mismatch from configuration. Tobas publishes
  `joint_states` as BEST_EFFORT, which is how this was found.

observation:
  context: >
    Bridging Tobas's `joint_states` topic on ROS 2 Jazzy / WSL2 Ubuntu 24.04 with
    rmw_cyclonedds_cpp into a Hakoniwa PDU channel, 2026-07-30.
  details:
    - "Tobas publishes `<ns>/joint_states` with BEST_EFFORT reliability, and the third-party publisher was not modified."
    - "hakoniwa_pdu_ros/bridge_node.py creates the subscription with a plain depth argument and no QoS profile, so rclpy uses RELIABLE reliability."
    - "The bridge starts and loads its PDU definition but receives zero messages, with no indication that the cause is QoS incompatibility."
    - "A temporary relay that subscribed BEST_EFFORT and republished RELIABLE sustained 50 Hz and allowed the unchanged bridge to receive normally."
    - "The relay proves the cause but is not the intended solution; the binding contract must be able to express the source topic's QoS."

