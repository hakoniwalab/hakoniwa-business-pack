      notes:
        - Log the resolved subscription QoS and compare it with discovered publishers so a silent zero-message run becomes an actionable mismatch warning.

promotion_rationale:
  - The missing capability belongs to the component's binding contract; a Recipe cannot express QoS that the binding schema does not accept.
  - Runtime diagnosis remains useful even after configuration support is added because users can still choose an incompatible profile.

