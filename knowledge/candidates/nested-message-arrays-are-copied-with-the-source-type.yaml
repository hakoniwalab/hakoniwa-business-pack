promotion_rationale:
  - >-
    It is the reason a byte[] corruption could not be fixed at the byte[] handling, and
    it silently disables destination-type-aware behaviour for the whole contents of any
    nested message array.

resolution:
  status: pending
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      The fix measured here falls back to `get_fields_and_field_types()` when
      `__annotations__` carries nothing for the field, resolving
      `sequence<pkg/Type>` to `pkg.msg.Type`. With it, and with the octet normalisation
      it enables, a nested varray round-trips exactly in both directions.
    - >-
      A fix is proposed upstream as hakoniwalab/hakoniwa-pdu-ros#23, with five tests that
      fail against the current mapper and pass with the change. The existing suite is
      unchanged by it: 117 passed excluding test/native, and test/native fails identically
      with and without the change because it needs the built native libraries.
