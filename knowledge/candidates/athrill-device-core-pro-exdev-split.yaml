id: athrill-device-core-pro-exdev-split
title: Athrill time-only and EV3 PDU EXDEV split over Core Pro
status: promoted
knowledge_type: [architectural_principle, interface_contract, usage_pattern]
summary: Standalone targets need a loadable hakotime library while the EV3 composite must statically embed the same time core; both use Core Pro polling APIs rather than a private Unity connection.
observation:
  context: Rebuilding Athrill EXDEV support for native Windows and Business Pack use.
  details:
    - hakotime builds as static and shared libraries.
    - hakopdu_ev3 links the static time core and exposes one EXDEV descriptor.
    - Core Pro polling APIs own asset lifecycle, time, and PDU exchange.
sources:
  repositories:
    - repository: toppers/athrill-device
      path: device/hako-exdev
      revision: 016b3765305d8ccdbcff15cd9238967b892c978c
  runtime_evidence:
    - description: Linux and Windows Release builds and four CTest cases passed; dependency inspection confirmed hakopdu_ev3 has no dynamic hakotime dependency.
  expert_input:
    - source: project developer
      statement: RH850 needs the standalone hakotime library, while hakopdu_ev3 should embed the static time implementation.
confidence: high
