promotion_rationale:
  - Directly reusable for future Windows work involving the Foxglove SDK, especially archive selection, MSVC compatibility, dependency discovery, and separating repository defects from local connectivity policy.

resolution:
  status: fixed
  fixed_by:
    - repository: hakoniwalab/hakoniwa-pdu-foxglove
      issue: 5
      pull_request: 6
      revision: d961217b2dba6fa6c1a2bf062278f0d8a47ae03b
  verified: true
  promoted_to: []
  executable_guardrails:
    - tools/run_windows_smoke.ps1
    - .github/workflows/windows-x64.yml
  notes:
    - Upstream PR #6 merged the Windows x86_64 implementation and CI guardrail; its final PR-head Windows CI run completed successfully.
    - "2026-07-26: the merged revision d961217b2dba6fa6c1a2bf062278f0d8a47ae03b was built and run natively on Windows and reached exit 0 for build, ctest (1/1 passed), and the publisher lifecycle smoke (tools/run_windows_smoke.ps1, ~4 minutes). This is a genuine re-verification of the merged revision itself, superseding the original external reproduction which had used this workspace's own now-superseded fork implementation (ykikuchii/hakoniwa-pdu-foxglove@3cc7b29, sharing common ancestor 909f507 with d961217 but never merged upstream)."
    - "2026-07-28: resolution.verified changed from false to true. An external contributor's Windows 11 verification environment connected the official Foxglove Desktop application (version 2.57.0) to the merged revision's cdr_publisher_example, listening on ws://127.0.0.1:8765, and confirmed the connection succeeded and the application operated normally. This closes the one remaining gap noted below: the smoke script verifies build/tests/publisher lifecycle only, and this additional interactive step confirms official Foxglove Desktop connectivity against the merged revision itself (not the superseded fork)."
    - "Separate operational note, not a defect: the same 2026-07-28 session found that generic WebSocket clients (a Python websockets-library client and a hand-rolled raw socket, both declaring the documented foxglove.websocket.v1 subprotocol) were rejected by the same running merged-revision server with HTTP/1.1 400 Bad Request, while the official Foxglove Desktop app connected successfully to the identical server/config. This was not filed as an SDK/protocol defect. It is recorded as an operational rule: automated end-to-end connectivity checks for this server need a handshake equivalent to the official client's, not merely a matching subprotocol string; the exact handshake difference was not isolated. This also supports why tools/run_windows_smoke.ps1 intentionally stops short of an automated client-connect check."
    - "Historical note (superseded by the entry above): this candidate previously kept resolution.verified=false because the smoke script itself documents that it verifies build/tests/publisher lifecycle only, and does not prove official Foxglove Desktop connectivity. That gap is now closed."
