id: pdu-foxglove-windows-port-recipe
title: Porting hakoniwa-pdu-foxglove to Windows (MSVC) -- build requirements and a firewall diagnostic pitfall
status: candidate

knowledge_type:
  - known_pitfall
  - runtime_rule
  - validation_rule

summary: >
  hakoniwa-pdu-foxglove now has an upstream Windows x86_64 / MSVC path. The
  durable repository-level requirements are explicit selection of the pinned
  x86_64-pc-windows-msvc Foxglove SDK archive, linking ntdll for the SDK's
  Windows implementation, and an MSVC-only /Zc:twoPhase- compatibility
  workaround for the current Foxglove SDK parameter.hpp template-ordering
  issue. A clean Windows build also needs Boost.Asio, Boost.Beast, and Fast-CDR
  to be discoverable. An external Windows 11 reproduction observed that
  Foxglove Desktop connectivity changed after adding a Windows Defender
  Firewall inbound rule, but the exact mechanism was not isolated; treat that
  as an environment diagnostic signal rather than a code-level root cause.

observation:
  context: >
    Adding Windows support to hakoniwalab/hakoniwa-pdu-foxglove (initially
    reproduced in ykikuchii/hakoniwa-pdu-foxglove, branch
    win-foxglove-sdk-support) as a new Foxglove visualization path for a
    Hakoniwa deployment's PDU output, after confirming the official Foxglove
    SDK release contains a foxglove-v0.25.2-cpp-x86_64-pc-windows-msvc.zip
    archive (SHA256: 02b27c7ecb5a0124eebb6e925586a45487d56da708d0088dedb770007fb4a849).
  details:
    - "Gap 1 (CMake archive selection): cmake/FoxgloveSdk.cmake had
      if(APPLE)...elseif(UNIX)...else() message(FATAL_ERROR ...) -- WIN32 is
      neither APPLE nor UNIX in CMake, so it fell straight to the FATAL_ERROR.
      Durable fix: add an elseif(WIN32) branch for verified Windows x86_64 with
      the pinned x86_64-pc-windows-msvc archive and SHA256. Windows ARM64 is
      deliberately not claimed as supported until separately verified."
    - "Gap 2 (Windows dependency discovery): hakoniwa-pdu-endpoint uses both
      Boost.Asio and Boost.Beast headers, while the bundled publisher examples
      use Fast-CDR. A clean CI environment exposed that installing only
      boost-asio was insufficient because comm_websocket.hpp also includes
      boost/beast.hpp. The reproducible Windows path therefore installs
      boost-asio:x64-windows, boost-beast:x64-windows, and fastcdr:x64-windows
      through vcpkg and configures CMake with the vcpkg toolchain."
    - "Gap 3 (link error): the Rust-built foxglove core's
      std::process::windows::child_pipe calls NtCreateNamedPipeFile directly,
      which lives in ntdll.dll/ntdll.lib and is not pulled in by the default
      MSVC import libraries, producing `error LNK2019: unresolved external
      symbol __imp_NtCreateNamedPipeFile` at the final executable link step.
      Durable fix: `target_link_libraries(foxglove_cpp PUBLIC ntdll)` in
      cmake/FoxgloveSdk.cmake."
    - "Gap 4 (MSVC-only compile error in Foxglove SDK parameter.hpp): Foxglove
      SDK v0.25.2 defines ParameterView::isArray<T>()/isDict<T>() bodies that
      reference get<Array>()/get<Dict>() before those explicit specializations
      are defined later in the header. MSVC's strict two-phase lookup diagnoses
      C2908/C3856 on the consuming translation unit, while GCC/Clang accept the
      same header. The upstream hakoniwa-pdu-foxglove fix intentionally does
      not patch the downloaded SDK header; instead it scopes
      `target_compile_options(hakoniwa_pdu_foxglove PRIVATE /Zc:twoPhase-)` to
      MSVC as a compatibility workaround. Re-evaluate this workaround when the
      pinned Foxglove SDK changes."
    - "Gap 5 (environment diagnostic, not a code fix): after the code-level
      Windows gaps were fixed, an external Windows 11 reproduction observed
      that cdr_publisher_example.exe ran without server-side errors but local
      clients could not connect; connectivity then succeeded after an elevated
      Windows Defender Firewall inbound rule was added for the executable.
      This before/after observation is useful troubleshooting evidence, but it
      does not by itself prove that Windows Defender Firewall prevented the
      process from binding/listening. The exact mechanism was not isolated, so
      the upstream repository does not modify firewall rules automatically and
      does not treat firewall state as a code-level root cause."
    - "Once the external environment allowed connectivity, the official
      Foxglove Desktop app connected to ws://127.0.0.1:8765, showed the server
      name 'hakoniwa-pdu-foxglove', and displayed
      /hakoniwa/FoxgloveDemo/sim_time with time_usec advancing in real time.
      Earlier synthetic-client HTTP 400 results should therefore not be used as
      evidence of a protocol defect without first establishing stable TCP-level
      connectivity."
    - "Unrelated but easy to misread: cdr_publisher_example's second CLI
      argument is max_samples, not duration in seconds. Samples are spaced
      100ms apart; 600 means about 60 seconds. Omitting the argument sets
      max_samples=0, which runs until Ctrl-C/SIGINT and is the appropriate form
      for interactive verification."

