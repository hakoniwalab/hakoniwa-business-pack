  runtime_evidence:
    - description: >-
        External Windows 11 x86_64 reproduction on 2026-07-24: native MSVC
        build reached a clean build of hakoniwa_pdu_foxglove.lib,
        cdr_publisher_example.exe, cdr_stdin_publisher.exe, and
        hakoniwa_pdu_foxglove_tests.exe with all 18 tests passing; the official
        Foxglove Windows desktop app then connected and showed the
        /hakoniwa/FoxgloveDemo/sim_time topic updating live after the local
        connectivity/firewall state was adjusted.
    - description: >-
        Upstream PR #6 CI run 30139461812 on windows-2022 completed successfully
        after the Windows path was made reproducible. It verified dependency
        installation, CMake configure, MSVC build/link, CTest, and the
        cdr_publisher_example lifecycle smoke. The CI refinement also exposed
        two previously implicit assumptions: Boost.Beast was required in
        addition to Boost.Asio, and PowerShell helper arguments such as `-C`
        must be passed as an explicit argument array to avoid parameter-binding
        ambiguity.
    - description: >-
        External contributor's Windows 11 x86_64 verification environment (native, no
        WSL/Docker), 2026-07-26: built and ran the merged upstream revision
        d961217b2dba6fa6c1a2bf062278f0d8a47ae03b directly (not the earlier fork
        implementation). tools/run_windows_smoke.ps1 completed with exit 0: ctest
        reported "1/1 Test #1: hakoniwa_pdu_foxglove_tests ... Passed", the publisher
        smoke started a server at "Foxglove WebSocket: ws://127.0.0.1:8765" and
        published "time_usec=0/100000/200000 bytes=12" for three samples, and the
        script printed "[run_windows_smoke.ps1] passed" (total run time approximately
        4 minutes). The smoke script's own final line states its verification
        boundary: "this smoke verifies build/tests and publisher lifecycle only; it
        does not prove a Foxglove Desktop client can connect through the local
        Windows network/firewall configuration" -- i.e. the remaining unverified gap
        is now exactly the official Foxglove Desktop end-to-end connection, not the
        build/test/publisher lifecycle.
    - description: >-
        This workspace's earlier fork implementation (ykikuchii/hakoniwa-pdu-foxglove,
        branch win-foxglove-sdk-support, commit 3cc7b29) was compared against the
        merged upstream revision d961217b2dba6fa6c1a2bf062278f0d8a47ae03b: both share a
        common git ancestor (909f507fd5ea14d281a1ee52f63f4d6efb09a6bf), but 3cc7b29 is
        not an ancestor of d961217 -- upstream implemented the same Windows port
        independently from that common point, and the fork branch was never merged.
        The fork's Windows implementation is therefore superseded by the merged
        upstream implementation; no further action is planned on the fork branch.
    - description: >-
        External contributor's Windows 11 x86_64 verification environment
        (native, 2026-07-28): a human operator connected the official
        Foxglove Desktop application (version 2.57.0) to the merged upstream
        revision's cdr_publisher_example, started with only a config
        argument and listening on ws://127.0.0.1:8765, and reported the
        connection succeeded and the application operated normally. This is
        the specific end-to-end official-Foxglove-Desktop connection step
        that the 2026-07-26 re-verification had identified as the one
        remaining unverified item against the merged revision. Detail beyond
        "connected, operated normally" was not reported by the operator and
        is not asserted here.
    - description: >-
        Separately, in the same 2026-07-28 session, an automated attempt to
        connect to the same running merged-revision server with a generic
        WebSocket client (a Python websockets-library client and a
        hand-rolled raw-socket client, both declaring the documented
        foxglove.websocket.v1 subprotocol) was rejected every time with
        HTTP/1.1 400 Bad Request / "Missing expected sec-websocket-protocol
        header," while the official Foxglove Desktop app connected to the
        identical server/config without issue. Because the official client
        succeeded against the same server, this is not treated as an
        hakoniwa-pdu-foxglove protocol defect. It is recorded as an
        operational rule instead: automated end-to-end connectivity checks
        for this server need a handshake equivalent to the official
        client's, not merely a matching subprotocol string. The exact
        byte-level handshake difference was not isolated.
  expert_input:
    - description: >-
        An AI-assisted root-cause analysis of the C2908/C3856 MSVC template
        error identified Foxglove SDK parameter.hpp specialization ordering as
        the trigger and proposed /Zc:twoPhase-. The workaround was confirmed by
        the external Windows reproduction and is now scoped to the MSVC
        hakoniwa_pdu_foxglove consumer target upstream rather than patching the
        fetched SDK header.

confidence: high

contradictions:
  - target: "Initial hypothesis: 'HTTP 400 Missing expected sec-websocket-protocol header' meant the Windows Foxglove SDK build had a real WebSocket subprotocol negotiation bug"
    existing_claim: "Multiple synthetic WebSocket clients failed, suggesting a server-side protocol handling defect specific to the Windows build."
    new_evidence: "The official Foxglove Desktop app connected and displayed live Hakoniwa SimTime data once the external machine's connectivity/firewall state was adjusted. This rules out treating the earlier HTTP 400 observations alone as proof of a Foxglove protocol defect, while leaving the exact firewall/network mechanism intentionally unspecified."

validation:
  status: verified
  required:
    - "Windows ARM64 remains unsupported/unverified; do not claim ARM64 Windows support until its SDK archive/checksum and runtime path are independently validated."
    - "Repository CI validates build/tests/publisher lifecycle, not end-to-end official Foxglove Desktop connectivity through arbitrary local Windows firewall/network policy."
  notes:
    - Verified end-to-end in the original external Windows 11 reproduction with the official Foxglove Desktop app (against the earlier fork implementation, since superseded).
    - Upstream PR #6 CI independently verifies the durable Windows x86_64 build, tests, and publisher smoke path on windows-2022 / Visual Studio 2022.
    - "2026-07-26 re-verification ran the merged upstream revision d961217b2dba6fa6c1a2bf062278f0d8a47ae03b directly on native Windows and reached exit 0 for build, tests, and publisher lifecycle via tools/run_windows_smoke.ps1. This narrows the remaining gap to exactly one item: an end-to-end connection from the official Foxglove Desktop application to the merged revision's WebSocket server has not yet been independently re-confirmed (the original Desktop-app confirmation was against the now-superseded fork implementation, not this merged revision)."
    - "2026-07-28: that remaining gap was closed. An external contributor's Windows 11 verification environment connected the official Foxglove Desktop application (version 2.57.0) to the merged revision's cdr_publisher_example and confirmed the connection succeeded and the application operated normally."

