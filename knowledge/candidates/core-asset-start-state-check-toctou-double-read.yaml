  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - Core issue 80 reads the state once, reports Stopping/Resetting as expected transition
      retries, preserves error diagnostics for invalid states, and adds focused tests.
    - The workspace-side regex tolerance remains historical evidence only; the upstream
      implementation is the actual fix.
    - Native Windows re-verification of the original smoke scenario is still required
      before marking this resolution verified.
