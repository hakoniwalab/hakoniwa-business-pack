promotion_rationale:
  - The reusable asset-side lesson is not to ignore the state number. Use one simulation
    state snapshot for both the decision and its diagnostic, and distinguish expected
    lifecycle transitions (Stopping/Resetting) from genuinely invalid states. That belongs
    with component/asset guidance rather than in the Catalog or a Recipe.
  - No Business Pack executable guardrail is proposed. The owning Core repository now has
    a focused helper and C++ tests for this behavior; duplicating that check in a doctor
    command would add little value.

