promotion_rationale:
  - The actionable knowledge for anyone writing an asset or a verification harness is
    "this specific stderr line is transient and self-healing at stop/reset boundaries; do
    not treat it as fatal, and do not treat its state number as meaningful". That belongs
    with component/asset guidance rather than in the catalog or a Recipe.
  - No executable guardrail is proposed -- a doctor-style check cannot detect a race, and
    the correct fix (single read, or demotion of the message severity) is a two-line
    change in the owning repository.

resolution:
  status: pending
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - Diagnosis only; no upstream issue filed (issue filing for implementation work is
      owned by upstream maintainers per the agreed role split).
    - The workspace-side change made in this session (tolerating this exact line, by
      regex, in the smoke test's log scanner, with the mechanism documented at the call
      site) is a false-positive suppression, not a fix. Positive pass evidence -- the
      on_simulation_step callback log plus a clean process outcome -- was deliberately
      left required.
