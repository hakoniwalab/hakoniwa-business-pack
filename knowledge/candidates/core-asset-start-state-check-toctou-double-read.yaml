  repositories:
    - repository: hakoniwalab/hakoniwa-core-pro
      path: sources/assets/callback/src/hako_asset.cpp
      revision: 9727e1d
    - repository: hakoniwalab/hakoniwa-core-pro
      path: examples/hello_world/src/hello_world.c
      revision: 9727e1d
  runtime_evidence:
    - description: >-
        External contributor's Windows 11 x86_64 verification environment (native, MSVC
        x64/Release build produced via tools/hako.py, external/ unmodified), 2026-07-30.
        Four consecutive smoke runs before any workspace change: FAIL, PASS, PASS, FAIL,
        with every failure attributable to the single stderr line above and to nothing
        else. Four consecutive runs after tolerating that exact line in the workspace log
        scanner: PASS, PASS, PASS, PASS, all exit code 0, with the step-callback evidence
        and process-outcome checks left unchanged.
  expert_input: []

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - Confirm whether upstream considers the double read worth fixing (read the state once
      into a local and report that value) or considers the message cosmetic. The
      functional behavior -- reject and let the caller retry -- is arguably correct; it is
      the diagnostics that mislead.
    - Determine whether the intended contract is that an asset MAY spin on
      hako_asset_start() the way the vendored hello_world example does. If that loop is
      the recommended pattern, the transient error is guaranteed for every asset at every
      stop, and downgrading it from stderr "Error:" to an informational retry line would
      remove a permanent source of false positives in log-scanning harnesses.
    - Not measured on POSIX. The race is in platform-neutral C++ and the reasoning does not
      depend on Windows, but the ~50% hit rate was measured only on this Windows machine
      and will depend on scheduling.
  notes:
    - Verified by source reading plus eight measured runs (four before, four after), on one
      machine, at one Core revision.

