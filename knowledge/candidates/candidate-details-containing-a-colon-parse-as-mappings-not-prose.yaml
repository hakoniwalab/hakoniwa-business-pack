    - repository: hakoniwalab/hakoniwa-business-pack
      path: knowledge/candidates
      revision: fb5d80c9a2dfee54da17104d7011dcb5e61de4e7
  runtime_evidence:
    - description: >
        External contributor's Windows verification environment
        (Windows 11 x86_64, native, os Windows, measured 2026-09-09). Parsing
        knowledge/candidates at fb5d80c and counting entries of
        observation.details that are not strings gives 16 entries in 11 of 68
        files: athrill-doctor-probes-ambient-path-not-the-build-shell,
        athrill-windows-smoke-covers-exdev-shared-library-load,
        catalog-index-generation-rewrites-every-line-on-windows,
        envsim-plateau-citygml-to-mujoco-pipeline,
        foundation-toolchain-config-is-not-reachable-from-an-alternate-install-dir,
        mujoco-first-actuator-sensor-validation-sequence,
        mujoco-viewer-runtime-config-must-be-semantically-aligned,
        named-actuator-command-space-for-tendon-coupled-mujoco-models,
        offline-artifact-generation-and-foundation-runtime-must-be-separate-recipes,
        primitive-collision-overlays-must-match-visual-scale-and-contact-height and
        recipe-local-requirements-cannot-pin-a-commit-sha.
    - description: >
        ruby knowledge/tools/validate_candidates.rb on that same tree prints
        "knowledge candidates valid: candidates=68, tracked=57, warnings=0".
    - description: >
        Converting the affected entries to folded block scalars and reparsing
        returns the same prose as strings. Each rewritten entry was reconstructed
        from its mapping as "key: value" and compared to the reparsed result, one
        by one, so the conversion is verified rather than assumed.

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - >-
      Whether observation.details should be strings only, or whether a mapping is
      meaningful somewhere, is a maintainer decision. The count above assumes
      prose was intended in all 16, which is how each of them reads.
  notes:
    - Measured against main at fb5d80c on 2026-09-09.
    - >-
      Only observation.details was surveyed. promotion_rationale and the various
      notes lists can take the same shape and were not counted.
    - >-
      A type check catches more than accidental colons. Integers, booleans, dates
      and nulls in a details entry are rejected too, which is correct under a
      string contract but is a different cause than the one this candidate
      describes.

tracking:
  implementation_status: resolved
  issues:
    - repository: hakoniwalab/hakoniwa-business-pack
      number: 189
      relation: fix
      status: closed

promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails:
    - knowledge/tools/validate_candidates.rb

promotion_rationale:
  - >-
    A guardrail is the whole remedy here. The condition is mechanically
    detectable, the validator already runs in CI, and no author has to learn a
    YAML rule if the tool states it.
  - >-
    No guide layer is proposed, because there is nothing a reader needs to know
    that the check cannot say at the moment it matters.

resolution:
  status: fixed
  fixed_by:
    - repository: hakoniwalab/hakoniwa-business-pack
      issue: null
      pull_request: 189
      revision: de1dc01ee3345d013a8cb0401bc13b3b34e37096
  verified: true
  promoted_to: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-business-pack
      kind: validator
      path: knowledge/tools/validate_candidates.rb
      mode: reject
      notes:
        - >-
          Every element of observation.details must be a String, reported with
          the file, the index and the reason. It runs for every candidate rather
          than only the tracking-gated ones, and validates the parent shapes
          first so a malformed candidate produces an ordinary error instead of
          aborting the run.
  notes:
    - >-
      The pull request carrying this candidate also carries the proposed fix. It
      adds the type check to validate_candidates.rb and converts the 16 entries
      so the check passes. The check was added first and reported exactly those
      16 entries and nothing else, which is what shows it detects the condition
      rather than merely passing afterwards.
    - >-
      The check guards its parent types, so a candidate whose observation or
      details is not of the expected shape produces an ordinary validation error
      and the remaining candidates are still checked.
    - >-
      Merged on 2026-09-09. The guardrail and the 16 conversions landed together,
      so the check now runs in CI on every candidate change.
    - >-
      After merging, the maintainer pinned this candidate's claims to the
      measured revision and moved them to past tense, since the counts describe
      main at fb5d80c rather than main as it stands. The measurements themselves
      were not changed.
