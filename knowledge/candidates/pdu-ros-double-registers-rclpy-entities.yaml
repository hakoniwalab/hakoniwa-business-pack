id: pdu-ros-double-registers-rclpy-entities
title: hakoniwa-pdu-ros reused rclpy internal entity lists and registered publishers and subscriptions twice
status: candidate

knowledge_type:
  - known_pitfall
  - interface_contract
  - validation_rule

summary: >
  rclpy Node owns internal _publishers and _subscriptions collections and
  create_publisher() / create_subscription() register returned entities there automatically.
  HakoniwaRosBridgeNode originally replaced those internal collections and manually appended
  the same returned entities again. Message delivery still worked, but destroy_node() later
  processed duplicate subscriptions and attempted to remove an already-removed QoS event
  waitable, raising ValueError. The fix is to leave rclpy-owned collections untouched and
  never append entities returned by Node creation methods manually.

observation:
  context: >
    Running the Docker native ROS 2 Jazzy / CycloneDDS integration suite introduced by
    hakoniwalab/hakoniwa-pdu-ros#4 on 2026-07-31 after the array.array and binding QoS fixes.
  details:
    - "All three native QoS cases reached their expected receive or incompatibility condition, then failed during bridge.destroy_node()."
    - "rclpy Node.create_subscription() had already inserted the subscription into Node._subscriptions, and HakoniwaRosBridgeNode appended the same object a second time."
    - "The first destruction removed the subscription QoS event waitable; the duplicate entry then raised ValueError: list.remove(x): x not in list."
    - "Repeated rosout warnings about the hakoniwa_pdu_ros_bridge node name were a secondary effect of the previous node failing to clean up."
    - "The same ownership mistake existed for publishers through Node._publishers, even though the observed failure was on subscription cleanup."
    - "After removing the replacement lists and manual appends, the native suite completed with 6 passed in 0.26 seconds."

