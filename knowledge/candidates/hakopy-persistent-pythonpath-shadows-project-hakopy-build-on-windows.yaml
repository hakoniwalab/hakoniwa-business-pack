promotion_rationale:
  - "Generalizes to any Hakoniwa Python asset/sender on a Windows machine that
    has more than one Hakoniwa Core install on PYTHONPATH: launch wrappers
    should not assume `import hakopy` resolves the current project's own
    build, and should make the current project's core-install bin directory
    win module resolution explicitly rather than relying on DLL search path
    fixes alone."
  - "Establishes a reusable distinction for Windows Python packaging pitfalls
    in the Hakoniwa ecosystem: hakopy is a module-resolution-order concern,
    hakoniwa_pdu_endpoint's cffi binding is a DLL-search-path concern, and a
    fix for one does not address the other."
  - The associated hakoniwa_pdu_endpoint Windows packaging gap (cffi extension
    not auto-wired into a venv via pip) is a concrete, reusable installation
    documentation gap for Windows users of the Python sender/asset samples.

