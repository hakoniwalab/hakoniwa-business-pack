validation:
  status: pending
  required:
    - Confirm on another Windows workspace with a clean PYTHONPATH (or a
      deliberately reintroduced stale entry) that the same symptom (per-step
      PDU conversion error masking a silent asset_register failure) reproduces
      and that the sys.path-ordering fix resolves it there too.
    - "Optional deeper verification: inspect HakoMasterData layout across the
      two hakopy builds (or attach a debugger) to confirm or rule out an ABI
      struct-layout mismatch as the actual mechanism, rather than relying on
      the observed symptom sequence alone."
  notes:
    - The environment/module-resolution observation (two hakopy.pyd builds,
      wrong one resolved via persistent PYTHONPATH, fix via sys.path ordering)
      is directly reproduced and confirmed on one external contributor's
      Windows workspace.
    - The ABI/ mechanism claim (why the wrong module produces a PDU conversion
      error rather than an immediate crash or import error) is an inference
      from the observed sequence, not independently verified at the binary
      level; keep this distinction explicit rather than asserting it as fact.

