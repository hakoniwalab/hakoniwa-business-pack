        External contributor's Windows 11 x86_64 verification environment
        (native, no WSL/Docker), 2026-07-28: reproduced the failure (plant
        logging a PDU conversion error on effectively every step of a run) and
        traced it to `import hakopy` resolving an unrelated project's older
        hakopy.pyd (2025-10-12, 734,720 bytes) ahead of the current project's
        own build (2026-07-10, 354,304 bytes), due to a persistent PYTHONPATH
        entry from the unrelated project. After inserting the current
        project's own Hakoniwa Core install bin directory at the front of
        sys.path (plus os.add_dll_directory() for the same directory) in the
        launch wrapper, hakopy.asset_register() succeeded and the plant/sender
        pair ran cleanly for the rest of the verification session.
    - description: >-
        Same verification session: getting the sender to run at all also
        required manually placing a matching hakoniwa_pdu_endpoint cffi build
        artifact into the venv's site-packages, since no Windows pip-driven
        step wired it in automatically; this is recorded as a separate
        packaging-recipe gap rather than folded into the hakopy pitfall above.
