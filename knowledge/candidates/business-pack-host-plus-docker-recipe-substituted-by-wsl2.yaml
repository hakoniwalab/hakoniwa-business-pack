promotion_rationale:
  - >-
    This is squarely a Recipe-authoring concern: a Recipe's mode should list
    host-plus-wsl2 as a viable substitution for host-plus-docker on Windows
    machines without Docker Desktop, since the underlying boundary contract
    (PDU-RPC over TCP) is unchanged and only the container half is replaced.
    It belongs with the Recipe rather than the runtime primer or a component
    catalog entry because the two traps (ros2 run process-group kill,
    PYTHONPATH ordering) are specific to standing up ROS 2 inside WSL2 for this
    purpose, not to the RPC or endpoint components themselves.
  - >-
    No executable guardrail is proposed. Both traps are process-launch and
    environment-ordering mistakes made by whoever writes the launch tooling,
    not conditions the shipped components could detect at runtime.

