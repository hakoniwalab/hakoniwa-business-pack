validation:
  status: verified
  required: []
  notes:
    - The original three failure modes and their manual workarounds were verified by a full clean Windows run ending in HAKO_CORE_SMOKE_OK.
    - The durable implementation is merged, and the merged runner has now been re-run on the native Windows environment at revision 5ca7e06007bcd7838419181344714a24649a1446, reaching HAKO_CORE_SMOKE_OK with an explicit -HakoConfigPath, and reproducing the original stale-config failure mode when -HakoConfigPath is omitted (confirming the warning path is exercised, not merely present in source).
    - "Residual gap outside this candidate's verified scope: tools/run_codec_smoke.ps1 (the basic_subscriber / codec smoke path) was not part of hakoniwa-godot#6 and still fails by default with 'SCRIPT ERROR: Parse Error: Preload file \"res://addons/...\" does not exist' (exit 1) unless -SyncAddons is passed explicitly, at which point it reaches HAKONIWA_CODEC_SMOKE_OK / exit 0 / '[run-codec-smoke.ps1] passed'. This means the automatic addons-normalization fix from Pitfall 1 is applied asymmetrically: core_pro_smoke normalizes addons automatically, while codec smoke still requires an explicit flag. This asymmetry is recorded here as a known limitation of the current fix, not a regression of the three original pitfalls."

