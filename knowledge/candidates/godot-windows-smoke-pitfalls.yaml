promotion_rationale:
  - Directly reusable for anyone on a multi-project Windows dev machine bringing up hakoniwa-godot.
  - Generalizes into an executable-smoke rule: normalize platform-specific filesystem assumptions, make runtime configuration selection explicit, and do not use engine-level early-exit flags for asynchronous lifecycle tests.

resolution:
  status: fixed
  fixed_by:
    - repository: hakoniwalab/hakoniwa-godot
      issue: 5
      pull_request: 6
      revision: 5ca7e06007bcd7838419181344714a24649a1446
  verified: true
  promoted_to: []
  executable_guardrails:
    - tools/run_core_pro_smoke.ps1
    - tools/run_core_pro_smoke_wsl.sh
  notes:
    - hakoniwa-godot#5 is resolved by merged PR #6.
    - The Windows runner now turns the three previously implicit assumptions into executable checks, normalization, warnings, or guards.
    - "verified: true is scoped specifically to the three core_pro smoke pitfalls (symlink-to-plain-file addons, implicit/stale HAKO_CONFIG_PATH, --quit racing the async lifecycle), re-verified on native Windows at the merged revision with tools/run_core_pro_smoke.ps1 reaching HAKO_CORE_SMOKE_OK, and with the omitted-HakoConfigPath path independently re-confirmed to still fail with the original hakoniwa_simevent_init error=-1 symptom (i.e. the warning is not a false negative)."
    - "Not covered by this verified=true: tools/run_codec_smoke.ps1 (basic_subscriber / codec smoke) still fails by default without -SyncAddons, since PR #6's automatic addons normalization was applied to the core_pro_smoke runner only. This asymmetry is a residual gap, not a re-opening of the three original pitfalls; see validation.notes above."
