  runtime_evidence:
    - description: >-
        Reproduced on an external contributor's Windows 11 x86_64 workspace (native build,
        no WSL/Docker), 2026-07-24: the exact SCRIPT ERROR (broken symlink),
        then hakoniwa_simevent_init error=-1 (implicit HAKO_CONFIG_PATH), then a
        run truncated right after HAKO_CORE_SMOKE_START_FEEDBACK_OK
        (--quit race) were each reproduced, diagnosed, and worked around in
        sequence, ending in a clean HAKO_CORE_SMOKE_OK / exit 0 /
        "[run-core-pro-smoke.ps1] passed" run showing the full
        start/stop/reset/restart lifecycle plus 3 time-synced simulation
        steps (simtime=20000/40000/60000 matching world time exactly).
    - description: >-
        hakoniwa-godot#6 merged the durable runner changes: automatic Windows addons
        normalization, explicit HakoConfigPath support with warnings for inherited/default
        configuration, removal of QuitAfterRun, WSL rejection of --quit, and updated test
        documentation. The merged revision still requires a post-fix native Windows runtime
        re-verification before resolution.verified can become true.
