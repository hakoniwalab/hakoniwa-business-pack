  runtime_evidence:
    - description: >-
        Reproduced on an external contributor's Windows 11 x86_64 workspace (native build,
        no WSL/Docker), 2026-07-24: the exact SCRIPT ERROR (broken symlink),
        then hakoniwa_simevent_init error=-1 (implicit HAKO_CONFIG_PATH), then a
        run truncated right after HAKO_CORE_SMOKE_START_FEEDBACK_OK
        (--quit race) were each reproduced, diagnosed, and worked around in
        sequence, ending in a clean HAKO_CORE_SMOKE_OK / exit 0 /
        "[run-core-pro-smoke.ps1] passed" run showing the full
        start/stop/reset/restart lifecycle plus 3 time-synced simulation
        steps (simtime=20000/40000/60000 matching world time exactly).
    - description: >-
        hakoniwa-godot#6 merged the durable runner changes: automatic Windows addons
        normalization, explicit HakoConfigPath support with warnings for inherited/default
        configuration, removal of QuitAfterRun, WSL rejection of --quit, and updated test
        documentation. The merged revision still requires a post-fix native Windows runtime
        re-verification before resolution.verified can become true.
    - description: >-
        External contributor's Windows 11 x86_64 verification environment (native, no
        WSL/Docker), 2026-07-26, re-run at the merged revision
        5ca7e06007bcd7838419181344714a24649a1446 with an explicit -HakoConfigPath pointing
        at the intended Hakoniwa Core config: tools/run_core_pro_smoke.ps1 reached
        HAKO_CORE_SMOKE_OK / exit 0 / "[run-core-pro-smoke.ps1] passed", showing the full
        START/STOP/RESET/RESTART lifecycle plus three time-synced simulation steps
        (STEP:1/2/3, simtime=20000/40000/60000 matching world time exactly). Addons
        normalization ran automatically (no manual copy needed), logging the expected
        warning "Project addons path is not a symbolic link. Replacing it with a copy of
        the repository addons directory: ...". Omitting -HakoConfigPath was also
        re-verified as still reproducing the original pitfall in the new runner: it
        printed the expected warning about inheriting HAKO_CONFIG_PATH, then failed with
        HAKO_CORE_SMOKE_INITIALIZE_FAILED / "hakoniwa_simevent_init error=-1" against a
        stale inherited config from another workspace -- confirming both the original
        trap and the effectiveness of the -HakoConfigPath guard in the same session.
