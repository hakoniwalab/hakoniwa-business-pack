id: godot-windows-smoke-pitfalls
title: hakoniwa-godot Windows smoke tests -- make environment assumptions explicit and executable
status: candidate

knowledge_type:
  - known_pitfall
  - runtime_rule
  - validation_rule

summary: >
  hakoniwa-godot's native Windows build works, but its core-pro smoke workflow exposed three
  environment-level pitfalls: Git symlinks may be checked out as plain files, HAKO_CONFIG_PATH
  may silently inherit configuration from another Hakoniwa workspace, and Godot's --quit flag
  terminates the asynchronous multi-frame lifecycle before completion. The durable fix is to
  make these assumptions executable in the Windows smoke runner: normalize project addons,
  support an explicit Hakoniwa Core config path while warning when inherited/default config is
  used, and prevent --quit from being used for core_pro_smoke.

observation:
  context: >
    Cloning hakoniwalab/hakoniwa-godot (recursive, with godot-cpp /
    hakoniwa-core-pro / hakoniwa-pdu-endpoint submodules) and running its
    two documented Windows smoke tests: `tests/smoke/basic_subscriber`
    (codec smoke, no conductor) and `tests/smoke/core_pro_smoke`
    (core-pro smoke, needs a running conductor process), using an existing
    Godot 4.6.1 mono Windows binary that exactly matched the repo's
    "Verified Environment" section.
  details:
    - "Pitfall 1 (git symlink -> plain text file on Windows): the repo's own
      per-project addons/ entries (e.g.
      tests/smoke/basic_subscriber/addons, tests/smoke/core_pro_smoke/addons,
      tests/integration/core_pro_two_asset/addons) are POSIX symlinks in git
      (`git ls-tree` shows mode 120000) pointing at the repo-root addons/
      directory. With Windows' default `core.symlinks=false`, `git clone`
      silently checks these out as ordinary 15-byte text files containing
      the literal target path string (`../../../addons`), NOT as a
      directory or a working symlink. Godot then fails with
      `SCRIPT ERROR: Parse Error: Preload file \"res://addons/...\" does not
      exist` because it sees an empty/nonexistent directory where the addon
      should be. The durable runner now keeps a working symbolic link as-is,
      but replaces a plain-file/broken checkout or missing path with a real
      copy of the repository addons/ tree."
    - "Pitfall 2 (implicit HAKO_CONFIG_PATH from another workspace): the
      reproduced machine inherited %APPDATA%\\hakocore-win\\config\\cpp_core_config.json,
      whose `core_mmap_path` was `Z:\\mmap` on a machine without that drive.
      This produced HAKO_CORE_SMOKE_INITIALIZE_FAILED / hakoniwa_simevent_init
      error=-1. The durable runner does not guess which config is correct:
      `-HakoConfigPath` / `--hako-config-path` makes the intended Hakoniwa Core
      configuration explicit, while omission preserves compatibility but emits
      a warning showing that inherited HAKO_CONFIG_PATH or the core default will
      be used."
    - "Pitfall 3 (Godot --quit conflicts with asynchronous lifecycle):
      tests/smoke/core_pro_smoke/main.gd drives start/stop/reset/restart and
      simulation steps across multiple Godot frames before printing
      HAKO_CORE_SMOKE_OK and calling get_tree().quit(0). Passing --quit caused
      the reproduced run to stop after HAKO_CORE_SMOKE_START_FEEDBACK_OK. The
      durable runner no longer exposes -QuitAfterRun, and its WSL wrapper rejects
      --quit for core_pro_smoke with an actionable error."

