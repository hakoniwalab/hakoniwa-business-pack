promotion_rationale:
  - Directly reusable for anyone on a multi-project Windows dev machine bringing up hakoniwa-godot.
  - Generalizes into an executable-smoke rule: normalize platform-specific filesystem assumptions, make runtime configuration selection explicit, and do not use engine-level early-exit flags for asynchronous lifecycle tests.

