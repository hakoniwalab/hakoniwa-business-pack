promotion_rationale:
  - The component README and detailed guide own the concrete operator entry point.
  - The Catalog should expose the current component command.
  - The Recipe should preserve the current multi-component launch sequence and human browser step.
  - The component launch wrapper should fail before asset startup when the common Python 3.12 runtime contract is not satisfied.

resolution:
