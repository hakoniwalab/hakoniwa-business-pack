  required: []
  notes:
    - The launch wrapper and process composition are directly supported by the current source files.
    - The operator procedure is confirmed by expert input.
    - The current browser composition and human-visible 3D motion were re-verified on 2026-07-26.
    - Python 3.12 is promoted as a common Runtime Primer contract; it is not a Shadow Hand-specific Recipe constraint.

