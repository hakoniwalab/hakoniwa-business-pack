id: athrill-windows-smoke-covers-exdev-shared-library-load
title: The Athrill V850E2M Windows smoke already covers EXDEV shared-library loading, which the catalog limitation understates

status: candidate

knowledge_type:
  - capability

summary: >
  The catalog entry describes the component smoke as verifying executable
  startup and usage only. On native Windows the smoke actually runs three CTest
  cases, and one of them exercises EXDEV shared-library loading. That is
  stronger coverage than the limitation implies, and it is the part of the
  EXDEV story that the b94b0ff capability flip depends on, so recording it
  narrows what is still unverified to target-program behaviour.

observation:
  context: >
    Independent Windows reproduction of recipes/examples/athrill-v850e2m-build.yaml
    at the revisions named in its validation evidence, capturing the smoke output.
  details:
    - The Windows smoke step runs "ctest --test-dir <build> -C Release --output-on-failure" and executes athrill2-usage, athrill-argument-parser, and athrill-exdev-shared-library.
    - athrill-exdev-shared-library is registered in the component CMakeLists.txt and builds an athrill-shared-library-test executable, so the EXDEV loading path is compiled and executed on Windows rather than only compiled.
    - The generated component manifest carried exdev true, and the configure line shows -DATHRILL_ENABLE_EXDEV=ON, so the passing test corresponds to the capability the Recipe requires.
    - The installed Receipt reports capabilities.exdev true, platform.os windows, architecture x64, toolchain msvc, and artifacts bin/athrill2.exe, and Foundation reported the component SATISFIED.
    - What remains uncovered is the behavioural layer the Recipe itself names: no target ELF or memory configuration is run, so simulated timing and live Hakoniwa time/PDU exchange are still untested.

sources:
  repositories:
    - repository: hakoniwalab/hakoniwa-business-pack
      path: catalog/components/athrill-target-v850e2m.yaml
      revision: 046f14b
    - repository: toppers/athrill-target-v850e2m
      path: CMakeLists.txt
      revision: 1c2cea9dd518dfad1388ef91c2c3068815702fc3
  runtime_evidence:
    - description: >
        Windows 11 x64 smoke output: "1/3 Test #1: athrill2-usage ... Passed",
        "2/3 Test #2: athrill-argument-parser ... Passed", "3/3 Test #3:
        athrill-exdev-shared-library ... Passed", "100% tests passed, 0 tests
        failed out of 3".
    - description: >
        Installed Receipt at
        work/foundation/install/share/hakoniwa/receipts/athrill-target-v850e2m.yaml
        contains component.version 1.0.2, source_revision
        1c2cea9dd518dfad1388ef91c2c3068815702fc3, platform.os windows,
        architecture x64, toolchain msvc, capabilities.exdev true, and artifacts
        bin/athrill2.exe (present, 511488 bytes).
    - description: >
        Negative control on the same install: setting capabilities.exdev to false
        in the Receipt made "tools/foundation.py doctor --json" exit 1 with status
        INCOMPATIBLE and exactly one reason,
        {field: capabilities.exdev, required: true, installed: false}; restoring
        the Receipt returned the component to SATISFIED. This confirms the
        capability equality check in evaluate_component is live rather than
        nominally present.

confidence: high

contradictions:
  - target: catalog/components/athrill-target-v850e2m.yaml
    existing_claim: >
      "The smoke test verifies executable startup/usage only; target-program
      behavioral tests require a separate ELF and memory configuration."
    new_evidence: >
      The first half understates the Windows smoke, which also runs an argument
      parser test and an EXDEV shared-library loading test. The second half is
      accurate and is the limitation worth keeping.

validation:
  status: partially_verified
  required:
    - Run an Athrill target ELF against live Hakoniwa time and EV3 PDU traffic to close the behavioural gap; the shared-library test covers loading, not exchange.
  notes:
    - Verified on one Windows 11 x64 host on 2026-08-31 with the component and common source pinned to the revisions in the Recipe evidence.
    - This candidate refines a limitation wording; it does not claim that EXDEV runtime behaviour is proven.

