  runtime_evidence:
    - description: >
        Hakoniwa Launcher started ShadowHandAsset, the TCP-to-CDR Foxglove
        publisher, the SHM-to-TCP bridge asset, and the Shadow Hand sender.
    - description: >
        hako-cmd start returned 0, Shadow Hand joint values changed, and the
        Foxglove publisher logged repeated CDR conversion and publication
        samples.
    - description: >
        On 2026-07-26, the browser launch published 24-joint, 908-byte CDR
        frames while port 8766 had an established browser connection and the
        user confirmed visible Shadow Hand finger motion. The Endpoint
        `No subscribers found` warning continued during that successful
        visualization, proving that it is not a Foxglove connection-status
        signal.
    - description: >
        On 2026-07-26, separate local Core-free and Core-enabled Endpoint
        packages were built and installed, Foxglove tests passed against the
        Core-free package, Bridge and the Python FFI loaded core_callback, and
        the local MuJoCo Shadow Hand target linked successfully.

confidence: high

validation:
  status: verified
  notes:
    - Native PDU receive, generated CDR conversion, and FoxgloveComm publication were verified locally.
    - Manual Foxglove UI connection and Raw Messages decoding were confirmed by user observation.
    - URDF-backed 3D motion was re-verified by user observation on 2026-07-26.
    - Endpoint callback warnings must not be used as a Foxglove WebSocket connection check.
    - Separate local Endpoint package prefixes and explicit core_callback shared-library loading were verified on macOS arm64.
    - Endpoint and Bridge manifest resolution is required before claiming the local build flow is cross-platform.
    - Clean manifest-owned Endpoint builds, Python 3.12 FFI import, explicit core_callback loading, and the Bridge manifest build were verified on macOS arm64.
    - The final manifest-built browser composition was visually re-verified by the user on 2026-07-26 with an established Foxglove connection and moving Shadow Hand.

