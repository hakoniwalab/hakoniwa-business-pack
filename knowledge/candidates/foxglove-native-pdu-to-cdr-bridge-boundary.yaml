id: foxglove-native-pdu-to-cdr-bridge-boundary
title: Foxglove publication requires an explicit native-PDU to CDR bridge boundary
status: candidate

knowledge_type:
  - integration_pattern
  - validation_rule
  - runtime_lifecycle

summary: >
  hakoniwa-pdu-foxglove publishes caller-provided CDR payloads. When the source
  is Hakoniwa native PDU bytes, use an explicit bridge/application layer that
  receives the native PDU, decodes it with a registry-generated native
  converter, encodes it with a registry-generated CDR converter, and only then
  forwards it to FoxgloveComm.

observation:
  context: >
    Validating the Shadow Hand Hakoniwa JointState to Foxglove recipe on
    2026-07-23.
  details:
    - The Shadow Hand plant publishes native Hakoniwa sensor_msgs/JointState PDU bytes.
    - hakoniwa-pdu-bridge-core can move those native bytes from callback SHM to TCP when launched as a Hakoniwa asset.
    - The Foxglove side should be a downstream TCP reader, not a callback SHM reader, so the Foxglove publisher process does not need to join the Hakoniwa asset lifecycle.
    - The Python bridge decoded native JointState bytes with the generated native converter, encoded complete CDR with the generated CDR converter, and passed length-prefixed frames to cdr_stdin_publisher.
    - Smoke logs showed `sent JointState CDR samples=160 joints=24 bytes=908 ...` and `published CDR frame samples=160 bytes=908`.
    - Foxglove Web UI decoded /hakoniwa/ShadowHandAsset/joint_states as sensor_msgs/msg/JointState and displayed header, 24 joint names, position, velocity, and effort arrays.
    - >
      `WARNING: No subscribers found ...` is emitted by the Endpoint receive
      callback dispatcher when no callback is registered for the received PDU.
      The current converter polls with `recv_by_name()`, so the warning can
      continue while native PDU polling, CDR publication, the Foxglove
      WebSocket connection, and 3D visualization are all working.
    - Python Endpoint FFI runtime variables must be scoped per asset in Launcher configs; relative native-library paths in defaults.env can break other Python assets whose cwd differs.
    - Processes that do not register as Hakoniwa assets can often be placed in
      a Launcher's `after_start` timing phase to avoid blocking asset
      registration before `hako-cmd start`.
    - This Shadow Hand smoke did not use `after_start`; it launched the
      downstream Foxglove TCP-to-CDR publisher before `hako-cmd start` so the
      TCP server endpoint was already available when the SHM-to-TCP bridge
      asset started.
    - Recipe authors should explicitly distinguish Hakoniwa asset processes
      from non-registering helper processes and choose `before_start` or
      `after_start` timing intentionally.
    - >
      The demo must build and select Endpoint variants by runtime role.
      Foxglove consumes a separately installed Core-free base package, while
      the SHM-facing Bridge and Python sender consume the Core-enabled
      core_callback package/shared library.
    - >
      Repository-local application binaries and separate Core-free/Core-enabled
      Endpoint build directories prevent a stale system install or cached
      find_library result from silently changing the composition under test.
    - >
      Endpoint and Bridge capability selection must be expressed through their
      hakoniwa-build manifests. Direct CMake remains a maintainer/debugging
      path, not the cross-platform user-facing build contract.
    - >
      Keep manifest-owned Endpoint build directories separate from legacy or
      raw-CMake build directories. Reusing an old cache can retain a stale Core
      prefix in macOS RPATH/install processing even when the manifest resolves
      the new prefix correctly.
    - >
      A local manifest-built Python FFI still links the base Endpoint shared
      library while the runtime explicitly preloads core_callback. Launcher
      children therefore need both the Hakoniwa Core lib directory and the
      local Endpoint package lib directory in their dynamic-library search
      path.
    - >
      When Bridge consumes an installed Core-enabled Endpoint package,
      HAKO_PDU_BRIDGE_HAKONIWA_CORE_ROOT alone does not control Endpoint's
      find_dependency(hakoniwa-core). The manifest resolver must also place the
      resolved Endpoint and Core prefixes in CMAKE_PREFIX_PATH.
    - >
      Launcher substitution uses ${VAR}. Writing ${ENV:VAR} in lib_path or PATH
      entries passes a literal value and can leave @rpath dependencies
      unresolved.
    - >
      When switching between locally built Core installations with the mmap
      backend, use an isolated HAKO_CONFIG_PATH/core_mmap_path or deliberately
      reinitialize the old mmap state. Reusing files created by a different
      Core build can fail during hako_mmap_create before asset registration.

