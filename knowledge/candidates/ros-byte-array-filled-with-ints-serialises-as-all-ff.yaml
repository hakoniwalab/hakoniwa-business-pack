promotion_rationale:
  - >-
    Any vendor type with a `byte[]` field is affected, and the failure is silent on both
    sides: the sender sees a correct message, the receiver sees a correctly shaped one,
    and only the values are wrong. Nothing short of a serialisation round trip detects it.

resolution:
  status: pending
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      A fix was written and measured against a work copy: the copy site normalises on
      whichever side declares the field as octet. Its detection power is shown by an A/B
      run in which only the library differs -- the check fails against the pinned library
      and passes against the patched one, in both directions -- and by a negative path in
      the full configuration that restores the pinned library and requires the payload to
      arrive as all-0xff.
    - >-
      A fix is proposed upstream as hakoniwalab/hakoniwa-pdu-ros#23, with five tests that
      fail against the current mapper and pass with the change. The existing suite is
      unchanged by it: 117 passed excluding test/native, and test/native fails identically
      with and without the change because it needs the built native libraries.
