promotion_rationale:
  - >-
    A vendor type with a `byte[]` field is affected whenever the payload reaches it as a
    sequence of ints, which is what a PDU uint8[] field decodes to, and the failure is
    silent on both sides: the sender sees a correct message, the receiver sees a correctly
    shaped one, and only the values are wrong. An assertion on the values read back does
    not detect it; one on the stored representation, or a serialisation round trip, does.

resolution:
  status: pending
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      A fix was written and measured against a work copy: the copy site normalises to
      bytes for a destination that declares octet, and to integers for an undeclared
      destination fed from an octet source. Its detection power is shown by a negative
      path in the full configuration that restores the pinned library and requires the
      payload to arrive as all-0xff, and by unit tests of which ten fail against the
      unpatched mapper and pass with the change. An earlier A/B run reported one aggregate
      verdict per library rather than one per direction, so it is not cited as evidence
      that both directions failed beforehand.
    - >-
      A fix is proposed upstream as hakoniwalab/hakoniwa-pdu-ros#23. Of its 13 tests, ten
      fail against the current mapper and pass with the change; three guard existing
      behaviour, and one of those was verified to fail against the fix's own first version.
      The existing suite goes from 111 to 125 passed excluding test/native, and test/native
      fails on the same 19 node ids with and without the change because it needs the built
      native libraries.
