confidence: high

contradictions: []

validation:
  status: verified
  required:
    - >-
      The fix is a maintainer call. From the code and the control, the
      extraction step needs the Recipe runtime that materialize produces, and
      does not need the dependency installation that configure adds. A
      Ruby-free way to load the Recipe at extraction time would also be needed
      for the README's promise to hold. That last point is an inference; no
      Ruby-free path was tried.
  notes:
    - >-
      Measured on one Windows host. Hosts that do have Ruby on PATH and a pip
      in the packaged Python were not available to test. Whether pip would
      need the network there was not measured; at c4fac99 the Recipe
      requirements file asks only for pydantic, which the package already
      contains.

