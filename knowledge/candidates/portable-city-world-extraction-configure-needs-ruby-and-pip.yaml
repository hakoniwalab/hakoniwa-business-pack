confidence: high

contradictions: []

validation:
  status: verified
  required:
    - >-
      The fix is a maintainer call. From the code and the controls, start
      needs the Recipe runtime that materialize produces. It does not need the
      dependency installation that configure adds, which the packager's own
      comment rules out. For a start that needs no extra installation, the
      Recipe would also have to be loaded without Ruby. The pre-start doctor
      would also have to stop requiring the packaging host's vcpkg, or the
      package would have to carry or relocate what it checks. Both points are
      inferences; no Ruby-free or vcpkg-free start was run.
  notes:
    - >-
      Measured on one Windows host, which is also the packaging host. The
      vcpkg finding comes from rewriting vcpkg_root in the extracted package,
      not from a second host.
    - >-
      Revised on 2026-10-03 after a review. Added: the vcpkg dependency and its
      control, the doctor's own Ruby dependency, the packager's no-pip
      contract, and that the sequence runs on every start. Corrected: the
      control is described against the batch run with Ruby (two differences),
      Windows paths in block scalars use single backslashes, the portable-case
      sentence was narrowed, and the baseline now also notes the port change.
      Removed: the note that treated pip in the packaged Python as a host
      condition.

