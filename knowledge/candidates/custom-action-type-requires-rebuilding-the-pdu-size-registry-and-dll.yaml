promotion_rationale:
  - >-
    "Generate the Python and point a config at it" is the reasonable expectation, and it
    is wrong for Actions. The cost of finding that out by experiment is a full rebuild
    cycle plus the locale detour.

resolution:
  status: pending
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      Related but distinct from the cp932 finding recorded for the business-pack recipe
      loader: that one is a Python decode, this one is MSVC's source-charset default.
