id: mujoco-viewer-runtime-config-must-be-semantically-aligned
title: MuJoCo viewer startup requires semantic alignment across physics, model, robot, and PDU configuration
status: promoted

knowledge_type:
  - interface_contract
  - runtime_rule
  - known_pitfall
  - validation_rule

summary: >
  A Launcher configuration can be structurally valid and all referenced files can
  exist while the runtime composition is still invalid. When a Drone service is
  started with `--mujoco-viewer`, the selected physics configuration must actually
  create a MuJoCo model, the configured model and propeller names must exist in the
  loaded MJCF, and the Drone service, controller, visual-state publisher, and PDU
  definition must agree on robot names and PDU assignments. File-existence checks
  alone do not establish this contract.

observation:
  context: >
    Validating the Business Pack Drone Gamepad Exhibition Recipe on macOS after
    Launcher background lifecycle support and pygame installation had been fixed.
  details:
    - The generated Launcher passed structural tests and started the Drone service with `--mujoco-viewer`, but selected `config/drone/fleets/api-current.json`, whose type used `physicsEquation: BodyFrame`.
    - The native Drone service crashed on the main thread with SIGSEGV in `mj_name2id()` during viewer initialization because no compatible MuJoCo model had been created for that configuration.
    - The same generated topology used robot name `Drone-1`, while `rc-custom.py` defaults to robot name `Drone`.
    - Aligning the topology on `config/drone/mujoco`, `config/pdudef/drone-pdudef-1.json`, `visual_state_publisher-1.json`, and `--real-sleep-msec 1` allowed all Launcher assets to stabilize and kept the session RUNNING.
    - The corrected unit test asserts the complete Drone service argument set and the matching PDU and visual-state configuration, rather than checking only for the presence of `--mujoco-viewer`.

