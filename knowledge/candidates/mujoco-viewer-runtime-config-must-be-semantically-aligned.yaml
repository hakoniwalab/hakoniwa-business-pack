promotion_rationale:
  - The general rule belongs in the Runtime Primer because it applies to any Recipe that composes a native MuJoCo viewer with simulator and PDU participants.
  - The concrete file set belongs in the Drone Gamepad Recipe and its generator test.
  - The owning Drone Core source remains unchanged because the failure came from an invalid composition selected by the Business Pack Recipe.

