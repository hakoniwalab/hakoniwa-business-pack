  runtime_evidence:
    - description: >-
        macOS 26.5.2 arm64 crash report, 2026-07-31: the Drone service terminated
        with EXC_BAD_ACCESS / SIGSEGV on the main thread in mj_name2id(), called
        from viewer_thread(), when the BodyFrame fleet configuration was combined
        with --mujoco-viewer.
    - description: >-
        macOS re-verification, 2026-07-31: after configuration alignment, Drone
        service, visual-state publisher, WebBridge, rc-custom.py, and the HTTP
        server all stabilized; Launcher reported RUNNING; ports 8000 and 8765
        listened; session-file termination produced TERMINATED and released both
        ports.
  expert_input: []

confidence: high

contradictions:
  - target: File-existence-only Recipe preflight
    existing_claim: Existing configuration files and a present --mujoco-viewer flag are sufficient evidence that the native viewer topology is valid.
    new_evidence: The files existed and structural tests passed, but the selected physics type did not create the MuJoCo model required by viewer initialization.

validation:
  status: verified
  required:
    - Preserve platform-neutral semantic checks when adding other MuJoCo-based Recipes.
    - Keep actual gamepad flight and browser rendering as separate behavioral validation from process startup.
  notes:
    - Process lifecycle, listener readiness, and graceful cleanup were verified on macOS.
    - Human gamepad operation and visual acceptance remain Recipe-level human validation.

