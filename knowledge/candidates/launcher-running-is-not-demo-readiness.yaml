id: launcher-running-is-not-demo-readiness
title: A RUNNING Launcher session does not prove that a background Demo is ready
status: promoted

knowledge_type:
  - runtime_rule
  - known_pitfall
  - validation_rule
  - usage_pattern

summary: >
  A background Launcher session can report RUNNING while its managed Demo assets
  have exited or its expected HTTP and WebSocket endpoints are absent. Consumers
  must parse the session state and then evaluate Recipe-specific active readiness
  checks. When the start command returns, it must explicitly hand the still-running
  background session to the operator with observation, viewer, status, stop,
  session-file, and log instructions.

observation:
  context: >
    Running the Drone Shibuya Map Gamepad Recipe on macOS arm64 on 2026-07-31.
    The initial start command returned after the background Launcher control
    endpoint became available, but no MuJoCo Viewer appeared and browser access
    failed.
  details:
    - The session file and hako_launcher_ctl status both reported RUNNING.
    - Process inspection showed that only the Launcher parent remained; the expected Drone, visual-state publisher, WebBridge, controller, and HTTP server processes were absent.
    - Neither TCP port 8000 nor TCP port 8765 was listening in the failed run.
    - The Shibuya MJCF took longer to initialize than the original two-second inter-asset delay, allowing dependent assets to start before the Drone runtime was ready.
    - Increasing the provisional Drone delay and requiring MuJoCo Viewer startup, WAIT RUNNING, TCP 8000, and TCP 8765 prevented the false-success result.
    - After the change, start reported Demo ready only when all four checks passed; the Viewer page and generated config returned HTTP 200, and the user confirmed operation.
    - The immediate return of a successful background start was itself confusing until the command explained that the Demo continued running and printed the next viewer, status, and stop operations.

