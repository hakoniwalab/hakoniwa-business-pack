promotion_rationale:
  - Launcher lifecycle versus Demo readiness is a cross-Recipe runtime rule and belongs in the Runtime Primer.
  - Concrete checks and operator actions belong in each executable Recipe because ports, logs, GUIs, and data-flow evidence vary by composition.
  - A Recipe validator can guard declaration shape, while Recipe-specific tests guard the actual readiness implementation.
  - A generic fixed delay is intentionally not promoted because it cannot prove readiness.

