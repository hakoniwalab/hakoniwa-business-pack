  runtime_evidence:
    - description: >
        Failed macOS run: Launcher session state RUNNING, only Launcher parent
        present, no listeners on 8000/8765, MuJoCo Viewer absent, browser access
        failed.
    - description: >
        Re-verification on the same macOS machine: start waited for `Viewer thread
        started.`, `WAIT RUNNING`, TCP 8000, and TCP 8765; both HTTP resources
        returned 200 and the user confirmed the Demo operated correctly.
  expert_input:
    - source: user-and-Hakoniwa-maintainer
      statement: >
        A background start that returns immediately is easy to misinterpret;
        the operator must be shown how to confirm the running Demo and what to do next.

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - Re-evaluate the provisional fixed delay when Launcher gains a first-class asset readiness dependency.
    - Re-verify equivalent active readiness checks on native Windows and Linux when this Recipe is ported.
  notes:
    - The runtime rule and Business Pack guardrail were verified on macOS arm64.
    - The eight-second delay is a Recipe-specific provisional ordering measure, not promoted as readiness evidence.

