      notes:
        - Validates the `version.min` requirement shape.
    - repository: hakoniwalab/hakoniwa-business-pack
      kind: test
      path: tools/test_foundation.py
      mode: detect-only
      notes:
        - Verifies numeric minimum-version comparison and INCOMPATIBLE/SATISFIED outcomes.
    - repository: hakoniwalab/hakoniwa-pdu-python
      kind: test
      path: tools/test_hako.py
      mode: detect-only
      notes:
        - Issue 48 tracks Receipt Capability, smoke imports, and stale-wheel cleanup tests.

promotion_rationale:
  - The cross-repository release sequence belongs in a maintainer checklist.
  - Exact Python environment identity and the distinction between lifecycle and behavioral validation belong in the Runtime Primer.
  - Component-specific capability and release evidence belong in the PDU Python Catalog entry.
  - Machine-detectable parts are guarded by Foundation validators and component-owned tests.

