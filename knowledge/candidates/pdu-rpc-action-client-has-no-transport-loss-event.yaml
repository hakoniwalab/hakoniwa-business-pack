id: pdu-rpc-action-client-has-no-transport-loss-event
title: An Action Client has no event for transport loss; the only way to notice a killed server is to poll is_running() and wait roughly 1.8s for it to flip
status: candidate

knowledge_type:
  - runtime_rule
  - known_pitfall
  - interface_contract

summary: >
  hakoniwa-pdu-rpc's Action Client CFFI surface (action_cffi.py) exposes exactly
  seven ActionClientEvent values -- NONE, GOAL_RESPONSE, FEEDBACK,
  CANCEL_RESPONSE, RESULT, TIMEOUT, ERROR -- and none of them fires when the
  Action Server process is killed mid-goal. SIGKILLing the server does not hang
  the client and does not raise an exception; it simply stops delivering any
  further event, forever, unless the caller separately polls is_running() and
  treats a False return as the signal. Measured on a real Windows host to WSL2
  TCP boundary, that flip from True to False took 1.75-1.84 seconds after the
  kill, which is the client's only path to a finite-time conclusion. This is not
  an oversight: the design document that owns Action Client state
  (05-client-state-model.md, section 11) explicitly says the Runtime does not
  infer Server death from missing traffic and leaves it to the caller. The
  candidate records this as an observability gap for Client implementers, not
  as a protocol defect.

observation:
  context: >
    Measuring cross-boundary (Windows host, WSL2 Ubuntu-24.04) Action Client
    behavior under a real TCP transport, 2026-08-09/08-10, as part of comparing
    disconnect and cancel handling to the same scenarios over loopback.
    hakoniwa-pdu-rpc revision 501ce5a.
  details:
    - "The enum, read directly from source. action_cffi.py:45-52 defines
      ActionClientEvent as NONE = 0, GOAL_RESPONSE = 1, FEEDBACK = 2,
      CANCEL_RESPONSE = 3, RESULT = 4, TIMEOUT = 5, ERROR = 6. There is no
      DISCONNECTED, no TRANSPORT_LOST, and no CONNECTION_ERROR value in this
      set."
    - "RuntimeCancelCause::TRANSPORT_DISCONNECTED exists, but it is a
      Server-side-only concept. action_services_server.cpp:258 uses it to decide
      how the Server reacts when ITS peer connection drops mid-goal; nothing
      analogous is wired into the Client's event surface or into the seven
      values above."
    - "The design document treats this as intentional, not missing. Section 11
      of hakoniwa-pdu-rpc's docs/design/action/05-client-state-model.md states
      that on transport loss the Client does not infer or guess the Server's
      state (NOP): it simply stops receiving events, and it is Application
      Policy, not Runtime Policy, to decide how long to wait before giving up."
    - "Measured client-visible behavior. With a goal in flight over a real
      Windows-to-WSL2 TCP socket, killing the Action Server process with SIGKILL
      produced zero ActionClientEvent deliveries afterward -- no TIMEOUT, no
      ERROR -- while the process itself did not hang: pyactionclient.is_running()
      continued returning True for a window and then flipped to False. Across
      repeated trials the flip landed between 1.75s and 1.84s after the kill,
      consistent with the underlying TCP stack's own dead-peer detection rather
      than any explicit event from the Action protocol."
    - "Practical consequence for Client implementers: there is no push-style
      notification to react to. A Client that only awaits FEEDBACK/RESULT/ERROR
      events will wait indefinitely (in wall-clock terms, until the caller gives
      up) with no protocol signal that the peer is gone. Detecting the loss
      requires a separate poll loop on is_running() with an application-chosen
      interval, and the ~1.8s figure measured here is a TCP-stack artifact, not
      a documented or configurable protocol bound."

