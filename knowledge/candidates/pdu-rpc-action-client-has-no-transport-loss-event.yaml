      revision: 501ce5a
    - repository: hakoniwalab/hakoniwa-pdu-rpc
      path: docs/design/action/05-client-state-model.md
      revision: 501ce5a
  runtime_evidence:
    - description: >-
        This workspace's own measurement, Windows 11 Pro x64 host to WSL2
        Ubuntu-24.04, real TCP (not loopback), 2026-08-09/08-10. Killed the
        Action Server with SIGKILL mid-goal across multiple trials; zero
        ActionClientEvent deliveries followed, is_running() flipped from True to
        False after 1.75-1.84s in each trial, and the client process itself
        never hung or raised.
  expert_input: []

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - Not measured on a Windows-to-Windows or WSL2-to-WSL2 boundary; the
      1.75-1.84s figure is specific to this Windows-host/WSL2-peer TCP path and
      should not be assumed to generalize to other transports or OS pairs.
  notes:
    - Verified by direct source reading of the enum and the Server-only cancel
      cause, cross-checked against the design document's explicit NOP policy,
      and confirmed against a real cross-boundary TCP measurement performed in
      this workspace. All three lines of evidence agree, which is why this is
      verified rather than partially_verified.
    - >-
      Reframed on 2026-08-31 after maintainer review. Server process crash and
      SIGKILL are stated to be outside the runtime contract, so the measured
      behavior documents where that boundary lies rather than an observability
      gap to close. Transport disconnect, the case the Runtime does support,
      is tracked separately in hakoniwa-pdu-rpc#78.
    - >-
      The candidate id still says "has-no-transport-loss-event" because
      renaming it would detach the review thread it was raised in; the title
      and framing carry the corrected meaning, and the id can be renamed on
      merge if the maintainers prefer.

