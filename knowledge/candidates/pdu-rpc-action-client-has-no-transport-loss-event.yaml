promotion_targets:
  catalog:
    - hakoniwa-pdu-rpc
  runtime_primer: true
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails: []

promotion_rationale:
  - >-
    Every Action Client implementer will eventually kill or lose a Server and
    expect some event to fire. Recording that none does, and that is_running()
    polling is the only path, belongs in the runtime primer so it is learned
    once rather than rediscovered per binding.
  - >-
    No executable guardrail is proposed. Server process failure is out of
    contract by design (confirmed by the maintainers) and the absence of an
    event is documented upstream (05-client-state-model.md section 11), so
    there is nothing here a doctor or validator could flag without
    contradicting the stated design.

resolution:
  status: documented
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      Recorded as documented because the behavior is intended: the design
      document states the NOP policy, and the maintainers have confirmed that
      Server Runtime crash and SIGKILL sit outside the supported contract.
      Nothing in hakoniwa-pdu-rpc needs to change for this candidate.
      resolution.verified stays false because no documentation change stating
      the boundary in these words has been merged upstream; the supported
      neighbouring case, transport disconnect, was addressed in #78.
