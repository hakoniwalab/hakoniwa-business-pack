promotion_rationale:
  - This is a recipe/tooling pitfall specific to Windows-to-WSL orchestration and applies to any recipe that launches a WSL-side process from a PowerShell script with arguments containing quotes, backslashes, or parentheses.

resolution:
  status: documented
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - Candidate only. No upstream implementation issue has been filed -- this
      is a documented quoting/argument-passing quirk of Microsoft's wsl.exe
      CLI itself, not of any hakoniwalab repository. It was observed and
      worked around (using -e) only inside private Windows-to-WSL bridge
      configurations. resolution.verified is left false because no upstream
      fix/PR/revision exists to verify against.
