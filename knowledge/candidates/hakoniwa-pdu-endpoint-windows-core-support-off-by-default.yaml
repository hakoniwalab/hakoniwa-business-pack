id: hakoniwa-pdu-endpoint-windows-core-support-off-by-default
title: hakoniwa-pdu-endpoint's Windows build has Hakoniwa core (SHM) support OFF by default
status: candidate

knowledge_type:
  - known_pitfall
  - runtime_rule
  - validation_rule

summary: >
  hakoniwa-pdu-endpoint's CMake option HAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE defaults to
  OFF on Windows (it defaults ON on macOS/Linux). A plain `build-win.ps1` run therefore
  produces a hakoniwa_pdu_endpoint.dll that cannot open an "shm" protocol endpoint at
  runtime; the fix is to explicitly pass -EnableHakoniwaCore -HakoniwaCoreRoot
  <hakoniwa-core-pro install prefix> and rebuild.

observation:
  context: >
    Building hakoniwa-mujoco-robots' native Windows TurtleBot3 simulator, which links
    against hakoniwa-pdu-endpoint for its Hakoniwa asset lifecycle (register/conductor)
    and PDU I/O, on Windows 11 x86_64 (native build, no WSL/Docker).
  details:
    - "First build-win.ps1 run (no -EnableHakoniwaCore flag) completed with 0 CMake
      errors and produced a working-looking hakoniwa_pdu_endpoint.dll."
    - "At runtime, tb3_sim_burger.exe got past manifest loading, MuJoCo model loading, and
      PDU definition loading, then failed at endpoint.open() with:
      'PduComm Factory Error: protocol shm requested but Hakoniwa core support is
      disabled.' / 'Failed to create PDU Comm module.'"
    - "hakoniwa-pdu-endpoint's own CMakeLists.txt: `if(WIN32) option(...ENABLE_HAKONIWA_CORE
      ... OFF) else() option(...ENABLE_HAKONIWA_CORE ... ON) endif()` -- confirmed by
      reading the actual CMakeLists.txt, not guessed from a comment."
    - "Fix: rebuild with `-EnableHakoniwaCore -HakoniwaCoreRoot
      <hakoniwa-core-pro install-win>` -- the resulting build compiles comm_shm.cpp,
      comm_shm_poll.cpp, comm_shm_callback.cpp, hakoniwa_time_source*.cpp (absent from the
      first build's compiler output), and the rebuilt DLL works."
    - "This gap can silently bite anyone following hakoniwa-mujoco-robots' own README
      Windows section: it correctly says hakoniwa-pdu-endpoint must already be built and
      installed, but it never states that installing a STANDALONE hakoniwa-pdu-endpoint on
      Windows for SHM/Hakoniwa-core use requires -EnableHakoniwaCore -HakoniwaCoreRoot at
      that repo's own build-win.ps1 step -- -EnableHakoniwaCore is only ever mentioned in
      the README in the context of the PYTHON binding build
      (build-python-win.ps1 -EnableHakoniwaCore), so the requirement for the native C++
      dependency build is an implicit prerequisite left undocumented rather than a wrong
      command shown in the README."
    - "A later re-verification against a manifest-driven build (tools/hako.py +
      hakoniwa-build.yaml, following the manifest architecture introduced after this
      candidate was first recorded) changes the premise of the original OFF-by-default
      observation: the manifest's own features.hakoniwa_core flag now defaults to false
      identically on every platform the manifest models, not just Windows. The raw
      CMakeLists.txt's OS-conditional default (`if(WIN32) ... OFF ... else() ... ON ...
      endif()`) was not directly re-read in that session to confirm whether it still
      exists verbatim, but tools/hako.py always passes an explicit
      -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=ON/OFF derived from the manifest's
      features.hakoniwa_core value, so that raw CMake default is no longer reachable
      through the documented (manifest-driven) build path on any OS. The
      'off by default on Windows specifically' framing is therefore no longer accurate for
      anyone using tools/hako.py; it would still describe a hypothetical caller who invokes
      raw cmake directly and bypasses tools/hako.py entirely."
    - "Setting features.hakoniwa_core: true through the manifest was confirmed to reach
      configure correctly (the resolved manifest printed the expected
      -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=ON argument for every platform), but the
      resulting Windows build itself then failed for a separate, newly discovered reason
      unrelated to the OFF-by-default question (a missing include directory in a
      core-variants split introduced by the same manifest work). So while the
      OFF-by-default framing itself is resolved by the manifest's now-uniform
      cross-platform default, a working Hakoniwa-core-enabled Windows build was still not
      achievable end to end through the manifest at that revision, for an unrelated cause."

sources:
  repositories:
    - repository: hakoniwalab/hakoniwa-pdu-endpoint
      path: CMakeLists.txt
      revision: main
    - repository: hakoniwalab/hakoniwa-pdu-endpoint
      path: build-win.ps1
      revision: main
    - repository: hakoniwalab/hakoniwa-mujoco-robots
      path: README.md
      revision: main
  runtime_evidence:
    - description: >-
        Reproduced on an external contributor's Windows 11 x86_64 workspace (native build,
        no WSL/Docker), 2026-07-23: the exact "protocol 'shm' requested but Hakoniwa core
        support is disabled" failure with the first build, then a successful run after
        rebuilding with -EnableHakoniwaCore -HakoniwaCoreRoot.
    - description: >-
        Re-verification session on a native Windows 11 x86_64 workspace (external code
        unmodified), against a manifest-driven revision of hakoniwa-pdu-endpoint:
        `hako.py doctor`/`configure` with features.hakoniwa_core: true resolved cleanly and
        printed the same -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=ON cmake argument the
        manifest computes for every platform, confirming the default is now
        manifest-controlled rather than an OS-conditional CMake option default.
  expert_input: []

confidence: high

contradictions:
  - target: "Reading hakoniwa-mujoco-robots' Windows README section alone"
    existing_claim: "The documented build-win.ps1 invocation for hakoniwa-pdu-endpoint is sufficient for the Windows TB3 build."
    new_evidence: "That exact invocation produces a DLL that fails at runtime for any SHM-based (Hakoniwa asset) use case; -EnableHakoniwaCore -HakoniwaCoreRoot must be added."

validation:
  status: partially_verified
  required:
    - Confirm whether hakoniwa-pdu-endpoint's raw CMakeLists.txt still contains the OS-conditional (`if(WIN32) ... OFF ... else() ... ON ... endif()`) branch at the manifest-driven revision -- not directly re-read in the manifest re-verification session, which only inspected the manifest's resolved output (always an explicit ON/OFF flag regardless of that raw default).
  notes:
    - Verified by an actual runtime failure, then an actual runtime success after the fix, against the pre-manifest build-win.ps1 entry point.
    - "Manifest re-verification confirms the manifest-driven tools/hako.py flow no longer exposes an OS-conditional default at all: features.hakoniwa_core defaults to false identically across platforms, and the manifest always passes an explicit -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE value. This narrows the original Windows-specific framing to only the legacy/raw-CMake entry point, which was not re-tested in that session. A working Hakoniwa-core-enabled Windows build via the manifest was also not achieved end to end, for a separate, unrelated missing-include-directory reason."

promotion_targets:
  catalog:
    - hakoniwa-pdu-endpoint
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes:
    - mujoco-turtlebot3-mbody

promotion_rationale:
  - This is a reusable cross-repo (hakoniwa-pdu-endpoint x hakoniwa-mujoco-robots) Windows build gap, relevant to any Windows consumer of hakoniwa-pdu-endpoint that needs Hakoniwa core/SHM support specifically (non-SHM transports are unaffected).

resolution:
  promoted_to: []
  notes:
    - Candidate only.
    - "Filed as an actionable follow-up (documentation gap, not a business-pack knowledge
      change): hakoniwalab/hakoniwa-pdu-endpoint#37."
    - "Follow-up: the manifest-driven build architecture (tools/hako.py) has changed the
      premise of this candidate's title -- the default is no longer Windows-specific, it is
      now a cross-platform manifest default (false) with an always-explicit CMake flag
      derived from it. Whether the legacy CMakeLists.txt OS-conditional default still
      exists was not directly re-read; even with features.hakoniwa_core: true correctly
      resolved and passed through by the manifest, the resulting Windows build then failed
      for a different, separately tracked reason (a missing include directory in a
      core-variants split), so a working Hakoniwa-core-enabled Windows build still could
      not be produced end to end via the manifest path at that revision."
