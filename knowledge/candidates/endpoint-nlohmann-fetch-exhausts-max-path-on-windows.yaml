promotion_rationale:
  - >-
    base_ecosystem_guide because the constraint is on where a user puts the
    checkout, which is setup guidance rather than component behaviour.
  - >-
    The component entry is listed as a secondary target because the fetch that
    consumes the budget belongs to pdu-endpoint.

resolution:
  status: pending
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      Documentation would be enough on its own. A sentence in the Windows setup
      path saying to keep the checkout root short and to set core.longpaths=true
      would have saved the whole investigation.
    - implementation_status is none because no follow-up issue exists yet.
