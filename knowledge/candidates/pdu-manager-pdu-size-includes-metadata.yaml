promotion_rationale:
  - Recipe and PDU authors must not confuse a message's raw serialized size with PduManager's actual runtime channel byte length; this is a recurring, easy-to-miss source of read failures for any new custom PDU type.

resolution:
  status: documented
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
