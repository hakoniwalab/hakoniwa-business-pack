promotion_targets:
  catalog:
    - hakoniwa-pdu-ros
  runtime_primer: true
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-pdu-ros
      kind: test
      path: test/native/test_native_action_client_node.py
      mode: detect-only
      notes:
        - >-
          test_hakoniwa_action_client_bridges_goal_feedback_result_and_reject and
          test_hakoniwa_action_client_bridges_cancel_accept_and_reject already exercise the
          SUCCEEDED / ABORTED / cancel-accept / cancel-reject / CANCELED-after-accepted-cancel
          mapping this candidate describes; no new guardrail needs to be authored here, only
          referenced.

promotion_rationale:
  - >-
    The mapping rule -- external, non-client-initiated termination is ABORTED with the cause in
    the payload, not a runtime cancel -- is the kind of thing every Action binding author needs
    and nobody will derive independently. It belongs in the runtime guidance rather than in one
    Recipe.
  - >-
    hakoniwa-pdu-ros is now the concrete component that implements this contract, so the
    component-specific fact belongs in its Catalog entry. component_asset_guide is dropped in
    favor of catalog because this is an interface-contract detail of one component's Action
    bridge, not ecosystem positioning of a major component category.
  - >-
    On executable guardrails: previously none seemed possible, because a checker cannot detect
    that a binding chose a semantically wrong but structurally valid event type in the
    abstract. The landed implementation changes that -- hakoniwa-pdu-ros ships a native test
    that already asserts the exact mapping end to end, so the guardrail exists at the component
    level; this candidate only needs to point at it, not author a new one.

resolution:
