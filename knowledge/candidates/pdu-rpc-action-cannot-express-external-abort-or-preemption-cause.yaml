      The original validation.required items are resolved by upstream maintainer tmori's PR #96
      comments (2026-08-04 and 2026-08-08): an externally caused termination does not need a
      protocol-level cause distinct from the Result payload, by design; preemption is
      intentionally not made observable in the protocol, and no dedicated terminal cause was
      added; and the "re-check once PDU-RPC has an Action client implementation" item is
      satisfied now that the client exists (pdu-rpc 501ce5a / pdu-ros f17e1cc).
    - >-
      Deliberately not marked verified. The mapping is confirmed by source reading
      (action_client_node.py::_terminal_status) and by hakoniwa-pdu-ros's own native test file,
