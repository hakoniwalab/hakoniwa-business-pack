  notes:
    - >-
      Not filed upstream yet. The preemption half already exists as an open question
      in upstream's own design document, so raising it is a matter of contributing a
      concrete case rather than reporting something unknown to them. Worth doing once
      there is an implementation to discuss against.
    - >-
      This came out of a design pass mapping a real third-party ROS 2 action onto
      the PDU-RPC Action protocol. The concrete case is available on request if it
      would help the preemption-observability discussion.
