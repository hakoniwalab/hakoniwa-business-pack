promotion_rationale:
  - >-
    The mapping rule -- external, non-client-initiated termination is ABORTED with the
    cause in the payload, not a runtime cancel -- is the kind of thing every Action
    binding author needs and nobody will derive independently. It belongs in the
    runtime guidance rather than in one Recipe.
  - >-
    On executable guardrails: none is proposed, and none seems possible. A checker
    cannot detect that a binding chose a semantically wrong but structurally valid
    event type. This is a review concern, not a machine-detectable one.

