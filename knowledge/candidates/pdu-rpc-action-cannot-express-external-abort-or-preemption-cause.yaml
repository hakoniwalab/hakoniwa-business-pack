      Reframed 2026-08-09 at upstream maintainer tmori's request (PR
      hakoniwalab/hakoniwa-business-pack#96, 2026-08-04T22:30:59Z comment): this was never a
      Protocol-level gap. Manual override, goal supersede, and preemption are Action Server
      Application policy; RUNTIME_CANCEL_REQUEST / RuntimeCancelCause is a Runtime-initiated
      stop-request path only. The corrected framing is a Binding-authoring pitfall: do not map
      an Application-decided, externally caused ABORTED onto RUNTIME_CANCEL_REQUEST.
    - >-
      tmori's 2026-08-08T05:33:56Z comment on the same PR confirms the boundary is implemented
      in hakoniwa-pdu-ros's Action Client Bridge (HakoniwaRosActionClientNode._terminal_status,
      commit f99d6c1, closing hakoniwa-pdu-ros#17) and exercised by that repository's own native
      integration tests (test/native/test_native_action_client_node.py) at revisions pdu-rpc
      501ce5a / pdu-ros f17e1cc. hakoniwa-business-pack#101 (tracked in tracking.issues as
      relation: documentation, closed) is deliberately not listed under fixed_by: its scope is
      the broader four-direction Catalog/Recipe normalization for ROS Service/Action, not a fix
      specific to this candidate's mapping detail. Listing it as fixed_by would overstate that
      #101 was filed for this pitfall; it is only where the four-direction feature that includes
      this mapping became user-facing Catalog/Recipe documentation.
    - >-
      verified: false is deliberate: this workspace confirmed the mapping by reading
      action_client_node.py and the native test source at the cited revisions, and from tmori's
      report that upstream's own native CI is green, but has not executed hakoniwa-pdu-ros's
      test suite itself. Re-verification here should flip this to true once that run happens in
      this workspace.
    - >-
      Original notes preserved for the record: the original observation's factual reading (the
      RuntimeCancelCause enumeration values, and rclcpp_action's abort-not-cancel behavior for
      externally caused termination) was correct throughout. What changed is the interpretation
      that this constituted a Protocol-level gap -- it did not; it was an unstated
      Binding-authoring boundary that upstream has now both explained and implemented.
