      path: test/native/test_native_action_client_node.py
      revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80
  runtime_evidence:
    - description: >-
        Upstream-reported native integration evidence, not independently re-executed in this
        workspace: tmori's 2026-08-08 comment on hakoniwalab/hakoniwa-business-pack#96 states
        hakoniwa-pdu-ros's ROS 2 Jazzy + real CFFI/TCP native integration CI is green at
        revision f17e1cc. This workspace's own reading of
        test/native/test_native_action_client_node.py at the same revision (local checkout)
        confirms that test_hakoniwa_action_client_bridges_goal_feedback_result_and_reject and
        test_hakoniwa_action_client_bridges_cancel_accept_and_reject assert exactly the
        SUCCEEDED / ABORTED / cancel-accept / cancel-reject / CANCELED-after-accepted-cancel
        outcomes this candidate describes. Reading the test source is not the same as running
        it; this workspace has not executed hakoniwa-pdu-ros's test suite itself.
  expert_input:
    - source: >-
        tmori (hakoniwa-pdu-rpc / hakoniwa-business-pack maintainer), PR
        hakoniwalab/hakoniwa-business-pack#96, comment 2026-08-04T22:30:59Z
      statement: >-
        Manual override, goal supersede, and preemption are Action Server Application policy
        (docs/design/action/01-concepts.md and 02-responsibility-boundaries.md); the RPC Runtime
        does not infer external causes and auto-preempt a Goal. When Tobas hits MANUAL_OVERRIDE
        or MISSION_SUPERSEDED, the Server Application is expected to call abort(goal_id, result)
        and return ABORTED with an Action-specific reason in the Result body.
        RUNTIME_CANCEL_REQUEST / RuntimeCancelCause exists only for Runtime-initiated stop
        requests (transport disconnect, server shutdown, internal policy); an
        Application-decided abort should not be mapped onto that path. This is therefore not a
        Protocol-level gap; requested the candidate be deleted or reframed as a Binding pitfall
        ("do not map an Application-originated ABORTED onto Runtime Cancel"). Preemption reason
        detail is meant to live in the Action-specific Result body by policy, not in a common
        Protocol field.
    - source: >-
        tmori (hakoniwa-pdu-rpc / hakoniwa-business-pack maintainer), PR
        hakoniwalab/hakoniwa-business-pack#96, comment 2026-08-08T05:33:56Z
      statement: >-
        The boundary discussed above is now implemented in the PDU-ROS Action Client Bridge:
        ROS ABORTED converts to Hakoniwa ABORTED; CANCELED is used only when the Hakoniwa-side
        Cancel request was accepted; a ROS CANCELED without an accepted Hakoniwa Cancel is
        logged as a diagnostic and treated as ABORTED; externally caused or preemption-driven
        business decisions remain Application Policy with reason detail in the Result payload;
        no preemption-specific Protocol terminal cause was added. Native tests confirm
        SUCCEEDED, ABORTED, cancel accept/reject, and CANCELED. Current revisions: pdu-rpc
        501ce5a (package-contract green), pdu-ros f17e1cc (native integration green). This is no
        longer an unimplemented gap; it can now be recorded as a design decision plus an
        implemented, tested mapping.

confidence: high

contradictions:
  - target: >-
      this candidate's own original framing (2026-08-03): PDU-RPC's RuntimeCancelCause
      enumeration is missing a value for externally caused abort/preemption, making this a
      Protocol-level gap, and preemption's Result-only observability is an open design question
      this third-party case should inform.
    existing_claim: >-
      An externally caused ROS 2 action abort has no corresponding Protocol cause value, and
      that absence is a protocol-shaped gap rather than an intentional boundary.
    new_evidence: >-
      Upstream maintainer tmori clarified (business-pack PR #96, 2026-08-04) that manual
      override, goal supersede, and preemption are Action Server Application policy by design,
      not something the RPC Runtime infers or needs a cause value for; RUNTIME_CANCEL_REQUEST /
      RuntimeCancelCause covers only Runtime-initiated stops. Confirmed again on 2026-08-08 with
      the mapping now implemented and native-tested in hakoniwa-pdu-ros's Action Client Bridge,
      with no preemption-specific Protocol terminal cause added. The original source reading
      (enumeration values, rclcpp_action's abort-not-cancel behavior) was correct throughout;
      only the "this is a protocol gap" interpretation was wrong.

