id: pdu-rpc-action-cannot-express-external-abort-or-preemption-cause
title: "Binding authors: map externally caused ROS ABORTED to Hakoniwa ABORTED, not Runtime Cancel; PDU-ROS now implements the ABORTED/CANCELED boundary"
status: candidate

knowledge_type:
  - known_pitfall
  - runtime_rule
  - interface_contract

summary: >
  PDU-RPC's Action protocol deliberately keeps RuntimeCancelCause (TRANSPORT_DISCONNECTED,
  SERVER_SHUTDOWN, INTERNAL_POLICY) limited to reasons the Runtime itself owns for asking an
  Application to stop. A real ROS 2 action server also terminates goals for reasons that are
  external and not client-initiated -- an operator taking manual control, or a newer goal
  superseding a running one -- and rclcpp_action expresses both by aborting the goal, so the
  observed ROS 2 status is ABORTED, not CANCELED. The pitfall this candidate now records is for
  Binding authors: do not map that externally caused ABORTED onto RUNTIME_CANCEL_REQUEST just
  because it "feels external." Upstream maintainer tmori clarified on 2026-08-04 that manual
  override, goal supersede, and preemption are Action Server Application policy, not something
  the RPC Runtime infers, and confirmed on 2026-08-08 that the boundary is implemented: ROS
  ABORTED maps to Hakoniwa ABORTED; CANCELED is used only when a Hakoniwa-side Cancel was
  accepted; a ROS CANCELED that arrives without an accepted Hakoniwa Cancel is logged as a
  diagnostic and delivered as ABORTED; reason detail stays in the Result payload; and no
  preemption-specific Protocol terminal cause was added. This is live in hakoniwa-pdu-ros's
  Action Client Bridge (`_terminal_status` in `action_client_node.py`, revision f17e1cc /
  commit f99d6c1, closing hakoniwa-pdu-ros#17) and is exercised by that repository's own native
  integration tests.

observation:
  context: >
    Comparing the PDU-RPC Action design documents (hakoniwa-pdu-rpc 4f5471d, all eleven marked
    Draft) against a real third-party ROS 2 action server, the Tobas multicopter mission
    executor for tobas_mission_msgs/ExecuteMission, 2026-08-03. Neither side was run against
    the other at the time; this was a documentation and source reading comparison. Upstream
    maintainer tmori resolved the interpretation in hakoniwalab/hakoniwa-business-pack#96
    (2026-08-04 and 2026-08-08 comments): the underlying source reading below was correct, but
    it did not constitute a Protocol-level gap. This record was reframed on 2026-08-09 from a
    protocol-gap claim into a Binding-authoring pitfall plus the now-implemented mapping, per
    tmori's request. See `contradictions` and `resolution` for how the original framing was
    corrected.
  details:
    - "The cause enumeration. action_types.hpp defines RuntimeCancelCause as
      UNSPECIFIED, TRANSPORT_DISCONNECTED, SERVER_SHUTDOWN and INTERNAL_POLICY. Read
      as a set, these are all conditions the simulation infrastructure knows about
      itself. There is no value for an external actor intervening in the controlled
      system."
    - "What the real server does instead. The Tobas mission executor terminates a
      running mission with an error code of MANUAL_OVERRIDE when an operator takes
      control, and MISSION_SUPERSEDED when a newer mission displaces it. In both
      cases it aborts the goal rather than cancelling it, so a ROS 2 client observes
      ABORTED. Only a client-initiated cancel produces CANCELED."
    - "The pitfall this observation actually describes. MANUAL_OVERRIDE is external and not
      client-initiated, so it can be tempting to confuse it with RUNTIME_CANCEL_REQUEST; that
      is incorrect because RUNTIME_CANCEL_REQUEST is only for Runtime-initiated stop requests.
      Upstream maintainer tmori clarified (business-pack PR #96, 2026-08-04) that this is not a
      Protocol gap: manual override, goal supersede, and preemption are Action Server
      Application policy, and the RPC Runtime does not infer or need a cause value for them.
      The correct binding is ABORTED with the reason carried in the Result payload, not a
      runtime cancel. Getting this wrong would make the two sides silently disagree about a
      goal's terminal status while both looked internally consistent."
    - "Preemption is deliberately invisible, by design rather than by omission.
      docs/design/action/01-concepts.md assigns queueing and preemption to the Application and
      states they are not observable in the protocol. tmori confirmed on 2026-08-08 that no
      preemption-specific Protocol terminal cause was added: a superseded goal still terminates
      as ABORTED, with the specific reason left to the Result payload by design."
    - "Practically this is survivable because the vendor's result payload carries an error
      code, and that is now the confirmed, not merely lucky, design: the common Protocol does
      not judge the business meaning of an abort, only the Action-specific Result body does. A
      vendor action without such a field would still lose the distinction, which is why this
      remains a reusable Binding-authoring rule rather than a Tobas-specific detail."
    - "The cancel-versus-result race is a separate matter and is compatible. PDU-RPC's
      rule is that the first decision committed to the runtime wins, and no
      CANCEL_RESPONSE is sent when a terminal result wins. The Tobas executor checks
      whether the goal is already cancelling before it switches status, so a
      client cancel arriving in the same tick as a supersede wins there too. The
      ordering does not need reconciling."
    - "The implemented mapping, read directly from source. hakoniwa-pdu-ros revision
      f17e1cc (commit f99d6c1, closing hakoniwa-pdu-ros#17) implements exactly this boundary in
      `HakoniwaRosActionClientNode._terminal_status()`
      (hakoniwa_pdu_ros/action_client_node.py): ROS `GoalStatus.STATUS_SUCCEEDED` maps to
      `ActionTerminalStatus.SUCCEEDED`, `STATUS_ABORTED` maps to `ActionTerminalStatus.ABORTED`,
      and Hakoniwa terminal CANCELED is emitted only when the bridge has recorded an accepted
      Hakoniwa-side Cancel request (`context.cancel_accepted` is true); otherwise it logs \"ROS
      Goal became CANCELED without an accepted Hakoniwa Cancel\" and returns ABORTED.
      `test/native/test_native_action_client_node.py::test_hakoniwa_action_client_bridges_goal_feedback_result_and_reject`
      and `::test_hakoniwa_action_client_bridges_cancel_accept_and_reject` exercise SUCCEEDED,
      ABORTED, cancel accept, cancel reject, and CANCELED-after-accepted-cancel end to end
      through this bridge."

