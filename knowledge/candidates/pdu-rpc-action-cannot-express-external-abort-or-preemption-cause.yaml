validation:
  status: not_tested
  required:
    - >-
      Decide whether an externally caused termination needs a protocol-level cause
      distinct from the result payload, or whether carrying it in the payload is the
      intended design. Either answer is defensible; what matters is that binding
      authors are told which.
    - >-
      Decide whether preemption should be observable in the protocol. Upstream
      already asks this in docs/design/action/01-concepts.md; a concrete third-party
      action that relies on preemption is now available as a case for that
      discussion.
    - >-
      Re-check both once PDU-RPC has an Action client implementation. Until then
      neither side can be driven against the other, so nothing here can be confirmed
      by measurement.
  notes:
    - >-
      Deliberately not marked verified. This is a reading of two systems that have
      never been connected: a Draft protocol specification on one side and a
      third-party implementation on the other. The reasoning may be sound and still
      be wrong about what the eventual implementation does. Being honest about that
      matters more here than the finding does.
    - >-
      confidence is medium for the same reason. The enumeration values and the
      abort-versus-cancel behaviour are both directly observed in source; the
      inference that this constitutes a gap is not.

