resolution:
  status: fixed
  fixed_by:
    - repository: hakoniwalab/hakoniwa-mujoco-robots
      issue: null
      pull_request: 55
      revision: a22c70347b242f5d3f6a0ac2a26eb49977916b42
  verified: true
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      A cheap improvement is to surface the failure that find_package already
      saw, for instance by retrying without QUIET before aborting, so the message
      can name the dependency rather than asserting the config is absent. That
      does not make discovery succeed; it makes the diagnosis point at the right
      thing.
    - >-
      Checking whether the config file exists at the searched prefixes before
      claiming it was not found would also stop the message from sending readers
      to re-run an install that already happened.
    - >-
      Fixed as suggested. The quiet probe is kept, and when it fails the package
      is looked up again without QUIET so CMake prints the real diagnostic; the
      fatal message now says the config may be absent or a dependency may be
      unavailable, rather than asserting the first.
    - >-
      Re-verified on the same Windows host on 2026-09-10 by configuring the
      consumer against an installed Foundation with no vcpkg discovery context
      and changing only the hakoniwa-mujoco-robots revision. Before a22c703 the
      output says "package config not found" and "run cmake --install ... first",
      and the word Boost does not appear at all. After it, the output carries
      "retrying with dependency diagnostics enabled", CMake's own "Could not find
      a package configuration file provided by Boost", the
      hakoniwa_pdu_endpointConfig.cmake:33 find_dependency call site, and
      "hakoniwa_pdu_endpoint could not be found because dependency Boost could
      not be found".
    - >-
      The separate question of whether the Foundation should propagate its vcpkg
      dependency context to consumers is tracked upstream as
      hakoniwalab/hakoniwa-business-pack#191, and is not part of this fix.
