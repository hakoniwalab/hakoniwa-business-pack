id: mujoco-robots-reports-a-present-package-config-as-missing
title: hakoniwa-mujoco-robots tells the consumer to run cmake --install when the endpoint package config is already installed, because find_package CONFIG QUIET hides a failed find_dependency

status: candidate

knowledge_type:
  - known_pitfall

summary: >
  When find_package(hakoniwa_pdu_endpoint CONFIG QUIET) fails,
  hakoniwa-mujoco-robots aborts with a message saying the package config was not
  found and that cmake --install should be run first. Both statements can be
  false at the same time. The config file is installed and sits at the very
  prefix the message prints; what actually failed is the find_dependency(Boost)
  inside that config, which QUIET suppressed. The message sends the reader to
  re-install a component that is already installed.

observation:
  context: >
    Building a Recipe on Windows, where the Foundation installs
    hakoniwa-pdu-endpoint through vcpkg and the consumer build is invoked
    without that toolchain.
  details:
    - >-
      src/CMakeLists.txt calls find_package(hakoniwa-core CONFIG QUIET) and
      find_package(hakoniwa_pdu_endpoint CONFIG QUIET), and on failure of the
      second raises FATAL_ERROR with
      "hakoniwa_pdu_endpoint package config not found." followed by
      "Passing a build directory such as build-win or build-shared is not
      supported here; run cmake --install for hakoniwa-pdu-endpoint first."
    - >-
      In the observed failure the install had already completed and
      lib/cmake/hakoniwa_pdu_endpoint/hakoniwa_pdu_endpointConfig.cmake existed
      at the prefix printed in the message. hakoniwa-core, from the same prefix,
      was found in the same run.
    - >-
      Isolated with a twelve-line CMake probe that adds the same prefix and calls
      the same three find_package invocations. With no toolchain file
      Boost_FOUND is FALSE and hakoniwa_pdu_endpoint_FOUND is 0. With the vcpkg
      toolchain file both are true. With no toolchain file but the vcpkg
      installed tree added to CMAKE_PREFIX_PATH, both are also true. So the
      determining condition is whether Boost is discoverable, not whether the
      endpoint is installed.
    - >-
      The reason Boost is involved at all is that
      hakoniwa_pdu_endpointConfig.cmake begins with find_dependency(Boost 1.70),
      which is correct for a package that links Boost. QUIET at the call site is
      forwarded by find_dependency by design, so the underlying failure is not
      reported anywhere.
    - >-
      Not intrinsically a Windows issue. Any host where Boost lives in a prefix
      CMake does not search reproduces it. What makes it easy to hit on Windows
      is that the Foundation build itself introduces the vcpkg prefix, which the
      Recipe build then does not inherit.

sources:
  repositories:
    - repository: hakoniwalab/hakoniwa-mujoco-robots
      path: src/CMakeLists.txt
      revision: 326ff7c7ccfa79bf735671c4ba7009cb629a3271
    - repository: hakoniwalab/hakoniwa-pdu-endpoint
      path: cmake/hakoniwa_pdu_endpointConfig.cmake.in
      revision: 3e06ca5f4bd8
  runtime_evidence:
    - description: >
        External contributor's Windows verification environment
        (Windows 11 x86_64, native, os Windows, CMake 3.31.6-msvc6, generator
        Visual Studio 17 2022, measured 2026-09-09). The FATAL_ERROR fired while
        the named config file was present at the printed prefix.
    - description: >
        Probe results on the same host, three configurations of the same twelve
        lines. Without a toolchain, Boost_FOUND=FALSE, hakoniwa-core_FOUND=1,
        hakoniwa_pdu_endpoint_FOUND=0. With
        -DCMAKE_TOOLCHAIN_FILE=<vcpkg>/scripts/buildsystems/vcpkg.cmake, all
        found. With env CMAKE_PREFIX_PATH=<vcpkg>/installed/x64-windows and no
        toolchain file, all found.

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - >-
      Whether the consumer or the Foundation should carry the dependency context
      is a separate question and is not claimed here. This candidate is only
      about the message.
  notes:
    - Measured on one Windows 11 host on 2026-09-09.
    - >-
      The Boost case is the one observed. Any other failing find_dependency in
      that config would be hidden the same way, but only Boost was exercised.

