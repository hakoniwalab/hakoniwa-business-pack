resolution:
  status: pending
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      A cheap improvement is to retry without QUIET before aborting, so the
      message can name the dependency that failed instead of asserting the config
      is absent. Dropping QUIET does not make discovery succeed; it makes the
      diagnosis true.
    - >-
      Checking whether the config file exists at the searched prefixes before
      claiming it was not found would also stop the message from sending readers
      to re-run an install that already happened.
    - implementation_status is none because no follow-up issue exists yet.
