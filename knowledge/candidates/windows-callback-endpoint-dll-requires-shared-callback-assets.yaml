      path: recipes/business-pack/fpv-drone-design-angle-flight.yaml
      revision: f0dae56
  runtime_evidence:
    - description: >-
        2026-09-23 (Urban workspace, Windows 11) and 2026-09-26 (FPV drone
        workspace, Windows 11): hakoniwa-pdu-web-bridge.exe crashed in
        hakoniwa_pdu_endpoint_core_callback.dll with 0xc0000005 at offset
        0x132097, recorded in the Windows Application event log.
  expert_input:
    - source: Hakoniwa maintainer
      statement: >-
        The Urban Windows port hit the same crash and it was resolved without code
        changes by enabling Core PRO `callback_assets_shared`. Do not add a local
        time source to hakoniwa-pdu-bridge-core as a workaround.

confidence: high

contradictions:
  - target: Windows WebBridge Recipes built through the Foundation defaults
    existing_claim: >-
      A Recipe that declares Endpoint `hakoniwa_core`/`core_callback` and WebBridge
      `hakoniwa_app` gets a working Core-aware WebBridge on every OS.
    new_evidence: >-
      On Windows it also needs Core PRO `callback_assets_shared: true`; without it
      the WebBridge crashes right after "building bridge core".

validation:
  status: partially_verified
  required:
    - >-
      Re-run the FPV Three.js Recipe on Windows after the forced Foundation rebuild,
      confirm `HAKO_CALLBACK_ASSETS_SHARED:BOOL=ON` in the Core PRO CMakeCache, and
      confirm the WebBridge reaches `initialized asset=WebBridge` and the browser
      shows the vehicle.
    - >-
      Decide which Business Pack example Recipes with WebBridge/core_callback are
      meant to run on Windows and add the capability to them.
  notes:
    - The Urban Windows port was fixed with this option (maintainer statement); the FPV re-run is pending.
    - The option is `experimental` in Core PRO's own manifest wording.

