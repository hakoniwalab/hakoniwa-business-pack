  runtime_primer: true
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes:
    - fpv-drone-design-angle-flight
    - drone-single-mujoco-threejs-gamepad
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-business-pack
      kind: doctor
      path: tools/foundation_lib/inspection.py
      mode: detect-and-suggest-remediation
      notes:
        - >-
          On Windows, when a Recipe requires Endpoint `core_callback` together with
          a Core-aware asset EXE (WebBridge `hakoniwa_app`) but not Core PRO
          `callback_assets_shared`, report it before build instead of letting the
          WebBridge crash at runtime.

promotion_rationale:
  - >-
    Runtime Primer: the rule is an operational contract for every Windows user of a
    Core-aware asset EXE plus an Endpoint callback DLL, not a property of one
    Recipe. The failure is silent at build time and looks like a hang at runtime.
  - >-
    A doctor guardrail is appropriate because the condition is fully determined by
    the Recipe's declared capabilities and the host OS.

