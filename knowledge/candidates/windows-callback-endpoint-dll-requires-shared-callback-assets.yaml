id: windows-callback-endpoint-dll-requires-shared-callback-assets
title: On Windows, an asset EXE that loads the Endpoint core_callback DLL needs Core PRO callback_assets_shared
status: validating

knowledge_type:
  - runtime_rule
  - known_pitfall
  - usage_pattern

summary: >
  On Windows, hakoniwa-core-pro builds the callback `assets` runtime as a static
  library by default. A Hakoniwa asset executable (for example
  hakoniwa-pdu-web-bridge.exe) and the hakoniwa-pdu-endpoint core_callback DLL it
  loads then each embed their own copy of the asset runtime state. The EXE calls
  `hako_asset_register()` on its copy; any `hako_asset_*` call made from inside the
  DLL (notably the `hakoniwa_callback` time source) hits the DLL's uninitialized
  copy and crashes with 0xc0000005. The existing fix is a build choice, not a code
  change: the Recipe declares `callback_assets_shared: true` on
  `foundation_requirements.hakoniwa-core-pro.capabilities`, the Foundation passes
  it to Core PRO's `features.callback_assets_shared`, and Core PRO builds `assets`
  as a DLL on Windows (HAKO_CALLBACK_ASSETS_SHARED=ON). The option is ignored on
  Linux/macOS, where `assets` is already a shared library.

observation:
  context: >
    Running the hakoniwa-fpv-drone Three.js Recipe (Drone Core + WebBridge) on
    native Windows 11 through the Business Pack Foundation. The same failure had
    already occurred in the Urban Windows port the week before and was solved there
    with the same Core PRO option.
  details:
    - >-
      Symptom seen by the operator: `fpv.py start` reports the Launcher as RUNNING,
      but the simulation never reaches Running. Drone service, pacer, and visual
      state publisher stay at `WAIT RUNNING`; the WebBridge log stops at
      `[web_bridge][info] building bridge core`; the native `.exe` assets are gone
      from the process list.
    - >-
      Windows Application event log (Id 1000): faulting application
      hakoniwa-pdu-web-bridge.exe, faulting module
      hakoniwa_pdu_endpoint_core_callback.dll, exception 0xc0000005, the same fault
      offset on every run.
    - >-
      Call chain: web_bridge_daemon.cpp `create_time_source("hakoniwa_callback")` ->
      `BridgeCore::start()` -> `time_source_->get_microseconds()` ->
      `HakoniwaTimeSourceCallbackImpl::get_microseconds()` (compiled into the
      Endpoint DLL) -> `hako_asset_simulation_time()` on the DLL's never-registered
      asset instance.
    - >-
      The Endpoint and WebBridge were correctly built with Hakoniwa Core support
      (`hakoniwa_core: true`, `core_callback: true`, `hakoniwa_app: true`); the
      core_callback DLL only exists in that configuration. This is not the
      "Endpoint built without SHM support" failure mode (hakoniwalab/hakoniwa-pdu-endpoint#76).
    - >-
      This is the build-time counterpart of
      pdu-endpoint-windows-shm-callback-requires-asset-context: passing the asset
      name to `Endpoint::open()` fixes the Endpoint's SHM attach, but other
      `hako_asset_*` calls made from the DLL still need one shared asset runtime.
    - >-
      The Foundation only turns the option on when a Recipe asks for it; its
      default is `false`. None of the Business Pack example Recipes that use
      WebBridge or `core_callback` declare it yet.
    - >-
      Changing the capability makes an existing Windows Foundation INCOMPATIBLE.
      Core PRO, hakoniwa-pdu-endpoint, and hakoniwa-pdu-bridge-core must all be
      rebuilt (`foundation.py build --force` for each) so the Endpoint DLL and the
      WebBridge relink against the new assets DLL.

