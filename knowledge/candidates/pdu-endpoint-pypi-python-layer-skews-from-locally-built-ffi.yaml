  runtime_evidence:
    - description: >-
        PyPI Python layer plus a locally built extension imported and started successfully
        but failed at the first recv_next() with a C declaration mismatch.
    - description: >-
        Pairing the Python layer and extension from the same source tree removed the mismatch
        and allowed 1222 JointState PDUs to be received.
  expert_input:
    - source: Hakoniwa maintainer
      statement: >-
        The current solution is to create a Business Pack workspace that owns and
        materializes the Python layer, CFFI extension, and DLLs from one pinned revision
        instead of asking users to combine them manually.

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - Keep Python source, CFFI extension, native DLLs, and the runtime interpreter under one workspace receipt or equivalent pinned revision contract.
    - Add a workspace smoke that reaches `recv_next()` with a minimal endpoint peer; import/open/start alone cannot detect this mismatch.
    - Verify the workspace DLL layout on native Windows rather than relying on an unrelated Python installation or ambient PATH.
  notes:
    - The generation-skew mechanism and same-source workaround were measured directly. The workspace architecture is the current maintained solution direction.

tracking:
  implementation_status: resolved
  issues: []

promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-business-pack
      kind: test
      path: tools/foundation.py
      mode: detect-only
      notes:
        - After the workspace materializes one pinned generation, use the workspace Python to exercise import, open, start, and recv_next against a minimal peer.

promotion_rationale:
  - The historical defect belongs to the old mixed-installation workflow, while the current solution belongs to Business Pack workspace ownership.
  - Recording the distinction prevents maintainers from treating the symptom as an unresolved generic CFFI defect or reintroducing manual cross-generation copying.
  - recv_next-level smoke remains the important regression guard because all earlier lifecycle calls succeeded in the failed configuration.

resolution:
  status: fixed
  fixed_by:
    - repository: hakoniwalab/hakoniwa-business-pack
      revision: ef416438645374330e2e505a136ce353db6e3f35
  verified: false
  promoted_to:
    - docs/hakoniwa-foundation-recipe-design-ja.md
  executable_guardrails: []
  notes:
    - The maintained resolution is workspace-owned, same-revision materialization rather than revision comparison inside the legacy copy script.
    - A dedicated native-Windows recv_next smoke should still be recorded before marking the resolution runtime-verified in this candidate.
