id: pdu-endpoint-pypi-python-layer-skews-from-locally-built-ffi
title: Legacy Windows installation mixed a released Python layer with a locally built CFFI extension; the current workspace model keeps one source generation together
status: candidate

knowledge_type:
  - known_pitfall
  - validation_rule

summary: >
  The legacy Windows installation flow combined the released PyPI
  hakoniwa-pdu-endpoint Python layer with a CFFI extension and DLL built from a separate
  source checkout. That combination could import, open, start, and reach post_start while
  failing at the first `recv_next()` because the Python layer and extension disagreed on a
  C declaration type. The problem is not an inherent CFFI limitation; it is a generation
  ownership problem caused by manually mixing artifacts. The current Business Pack
  direction resolves it by creating a workspace that materializes the Python layer, CFFI
  extension, and required DLLs from the same pinned source revision and runs them through
  the workspace's exact Python environment.

observation:
  context: >
    Standing up the Windows peer of a Tobas-to-Hakoniwa PDU bridge on native Windows 11
    x86_64 with CPython 3.12.7, using the earlier PyPI-plus-local-extension installation
    flow, 2026-07-30/31.
  details:
    - "The PyPI Python layer allocated `ffi.new(\"unsigned long long*\")` while the locally built extension expected `uint64_t *`."
    - "Import, Endpoint.open(), start(), and post_start() succeeded; the first recv_next() raised a CFFI TypeError."
    - "Using the repository's Python layer with the extension built from the same source tree removed the mismatch and delivered 1222 PDUs."
    - "The failure was created by combining independently versioned artifacts, not by the endpoint protocol or received PDU data."
    - "The modern resolution is to let a Business Pack workspace own the pinned source, build products, Python layer, DLL placement, and runtime interpreter as one artifact set."
    - "Because the old combination failed only at recv_next(), a workspace smoke that stops at import or start is insufficient."
    - "DLL search-path failures are related deployment evidence but conceptually separate from the Python/CFFI generation skew; the workspace must materialize and test its DLL layout explicitly."

