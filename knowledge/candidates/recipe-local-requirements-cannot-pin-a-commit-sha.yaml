id: recipe-local-requirements-cannot-pin-a-commit-sha
title: Recipe source materialization cannot pin a commit SHA, and this Recipe's evidence names SHAs it cannot re-materialize

status: candidate

knowledge_type:
  - implementation_fact
  - known_pitfall

summary: >
  Source materialization clones with "git clone --branch <revision>
  --single-branch", so a revision may be a branch or a tag but not a raw commit
  ID. athrill-v850e2m-build records its verification evidence as commit SHAs
  while declaring athrill at master, and the component carries no revision in
  catalog/foundation-components.json, so a fresh run builds the current default
  branches. Both dependencies have already moved past the recorded evidence, so
  this Recipe can no longer re-materialize the state it declares verified. That
  is a limitation of raw-commit pinning plus one unpinned Recipe, not a claim
  that Recipes are generally unreproducible: a tag would materialize exactly.

observation:
  context: >
    Preparing an independent Windows reproduction of
    recipes/examples/athrill-v850e2m-build.yaml at exactly the revisions named in
    its validation evidence.
  details:
    - tools/recipe.py::_clone_repository builds "git clone --recurse-submodules [--branch <revision> --single-branch] <url> <target>", so revision is passed to --branch.
    - git accepts only a branch or tag name for --branch; a full commit SHA fails with "fatal: Remote branch <sha> not found in upstream origin".
    - recipes/examples/athrill-v850e2m-build.yaml declares recipe_local_requirements.athrill.source.revision as master, and catalog/foundation-components.json registers athrill-target-v850e2m with no revision key, so neither dependency is pinned.
    - The same Recipe records validation evidence at athrill 9b3190a0509310c5e02ba88fa47aa6a3fc58462f and athrill-target-v850e2m 1c2cea9dd518dfad1388ef91c2c3068815702fc3.
    - _resolve_source_requirement reports provenance.reproducibility as pinned whenever a revision string is present, so a branch name such as master is labelled pinned even though it is a moving target.
    - When the sibling directory already exists the action becomes reuse and the resolved revision is read from the existing checkout, which is the only currently available way to run a Recipe at a chosen SHA.

sources:
  repositories:
    - repository: hakoniwalab/hakoniwa-business-pack
      path: tools/recipe.py
      revision: 046f14b
    - repository: hakoniwalab/hakoniwa-business-pack
      path: catalog/foundation-components.json
      revision: 046f14b
  runtime_evidence:
    - description: >
        "git clone --branch 9b3190a0509310c5e02ba88fa47aa6a3fc58462f
        --single-branch <athrill> <target>" exits 128 with "fatal: Remote branch
        9b3190a0509310c5e02ba88fa47aa6a3fc58462f not found in upstream origin",
        while the same command with --branch master exits 0 (positive control on
        the same source repository).
    - description: >
        On 2026-08-31 the default branches had moved beyond the recorded
        evidence: toppers/athrill HEAD was edc75f2f14c21f185ef4ddc388c68be659d503ea
        (evidence 9b3190a0...) and toppers/athrill-target-v850e2m HEAD was
        d7123b6c36ccb36b71ce7ec3940b53199f1f719c (evidence 1c2cea9d...).
    - description: >
        Reproduction at the recorded SHAs succeeded only by pre-creating both
        sibling checkouts at detached HEADs, after which "python tools/recipe.py
        plan" reported "reuse ... resolved=1c2cea9d..." and
        "reuse ... requested=master, resolved=9b3190a0...", and the run reached
        Foundation SATISFIED.
    - description: >
        The unpinned path was then measured as well: with both siblings replaced
        by fresh clones of the default branches (edc75f2f / d7123b6c), the same
        build reached Foundation SATISFIED with CTest 3/3 and a Receipt recording
        source_revision d7123b6c and capabilities.exdev true. The default
        branches are healthy on Windows; what the Recipe cannot do is re-create
        the state its evidence names.

confidence: high

contradictions:
  - target: tools/recipe.py
    existing_claim: >
      provenance.reproducibility is reported as pinned when the source declares a
      revision.
    new_evidence: >
      A branch name is accepted as a revision and labelled pinned, so the field
      does not distinguish an immutable commit from a moving branch. The only
      value that would make the label true is the one value the clone path
      rejects.

validation:
  status: verified
  required: []
  notes:
    - The git behaviour was verified locally with a positive control rather than inferred from documentation.
    - The open question in this note was answered by 6be515bc, which accepts a raw commit ID in source.revision and materializes it by clone-then-checkout.
    - The current default branches were then built as a separate observation and are healthy on Windows (see the last runtime_evidence entry), so the finding is purely about pinning, not about breakage on master.

tracking:
  implementation_status: open
  issues:
    - repository: hakoniwalab/hakoniwa-business-pack
      number: 180
      relation: follow_up
      status: open

promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes:
    - athrill-v850e2m-build
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-business-pack
      kind: validator
      path: recipes/tools/validate_recipes.rb
      mode: detect-only
      notes:
        - Flag a Recipe whose validation evidence names commit SHAs while its source requirements resolve to a branch, since that combination cannot be re-run as recorded.

promotion_rationale:
  - The mismatch between recorded evidence and materializable revisions is detectable from the Recipe files alone, so a validator check is the cheapest guard.
  - Retained after the fix as the historical record of the defect and its workaround, per MAINTAINER.md's instruction to preserve the original observation once a fix lands.
  - No catalog claim is wrong on its own; the gap is in the materialization contract, so this belongs with the Recipe tooling rather than a component entry.

resolution:
  status: fixed
  fixed_by:
    - repository: hakoniwalab/hakoniwa-business-pack
      issue: null
      pull_request: 178
      revision: 6be515bcb3f91fbc8d8de2a6f649cc7d600af9ad
  verified: true
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      Fixed in 6be515bc (PR #178). A full commit SHA is now materialized with
      git clone --no-checkout followed by checkout --detach and a recursive
      submodule update, while branch and tag revisions keep the previous
      --branch path. An existing clean checkout is moved to the requested SHA,
      and a dirty one is refused rather than rewritten.
    - >-
      resolution.verified is true on the strength of a Windows measurement of
      the fix against real repositories, in four configurations, each covering
      a distinct property: a fresh clone landing on the pinned SHA and a clean
      checkout at another SHA being moved to the requested one show that the
      requested commit is actually materialized; a dirty checkout refused with
      HEAD unchanged shows that an unsynchronized working tree is not rewritten;
      and a well-formed but nonexistent SHA failing at fetch with HEAD unchanged
      shows that an unresolvable revision is reported rather than quietly
      replaced by the default branch.
    - >-
      Pre-created sibling checkouts, the workaround this candidate originally
      described, are no longer needed: writing the full SHA in the Recipe now
      materializes it directly.
    - >-
      resolution.status is fixed for the materialization defect this candidate
      reported, while tracking.implementation_status stays open because #180 is
      open and asks for implementation and regression coverage of the remaining
      part: a branch or tag name is still labelled provenance.reproducibility
      "pinned". The maintainers have separated that from the materialization
      defect as a provenance-reporting question.
