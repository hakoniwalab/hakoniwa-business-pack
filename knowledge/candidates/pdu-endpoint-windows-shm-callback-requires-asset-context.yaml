  runtime_evidence:
    - description: >-
        hakoniwalab/hakoniwa-core-pro#90 records the native Windows Nova5 failure:
        shared memory is created and one Core instance loads PDU data, while a second
        module-local Core instance reaches receive-event registration with
        `recv_event_table_ == nullptr`. The downstream caller was found to be opening the
        Endpoint with the one-argument overload; hakoniwalab/hakoniwa-robot-runtime#7
        changes that caller to pass the runtime asset name. Windows re-verification of
        that exact failure is still pending at the time this candidate is written.
  expert_input:
    - source: hakoniwalab/hakoniwa-pdu-endpoint design contract
      statement: >-
        Shared memory is shared storage; Core/Asset runtime state is not automatically
        shared across binary-module boundaries. External Endpoints use
        `open(config_path)` intentionally, while Endpoints owned by a registered Hakoniwa
        asset use `open(config_path, asset_name)` with the same asset identity.

confidence: high

contradictions:
  - target: same-process SHM integration assumption
    existing_claim: >-
      If Hakoniwa shared memory already exists in a process, every DLL in that process can
      safely use the callback SHM path without additional Core/Asset attach context.
    new_evidence: >-
      Windows DLL/static-library boundaries can produce independent module-local
      Core/Asset state. One module can have a valid mapped event table while another has
      `recv_event_table_ == nullptr` against the same OS shared-memory objects.

validation:
  status: partially_verified
  required:
    - >-
      Re-run the native Windows Nova5 procedure from hakoniwalab/hakoniwa-core-pro#90
      with hakoniwalab/hakoniwa-robot-runtime#7 applied and confirm that Endpoint
      `post_start()` completes and the `recv_event_table_ is null` failure disappears.
  notes:
    - >-
      The API contract, lazy attach path, Windows vs. non-Windows link layout, and
      module-local-vs-shared-memory model are verified directly from the current source
      and the merged Endpoint design document.
    - >-
      The candidate remains partially_verified only because the exact downstream Windows
      failure that motivated the documentation is awaiting reporter re-test after the
      robot-runtime caller correction.

