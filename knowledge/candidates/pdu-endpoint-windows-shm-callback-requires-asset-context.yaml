promotion_rationale:
  - >-
    This is a reusable integration rule for any callback SHM consumer that embeds an
    Endpoint inside a Hakoniwa asset, especially on Windows. The full architectural
    explanation belongs in hakoniwa-pdu-endpoint and is already documented there; the
    Business Pack should retain only the discoverable usage rule and link to that source
    of truth.
  - >-
    The rule also belongs in runtime guidance because future C++, Python, C#, or other
    module-separated integrations can encounter the same ownership distinction even when
    the immediate symptom differs from `recv_event_table_ == nullptr`.
  - >-
    No new executable guardrail is proposed here. The correct asset name and ownership
    intent are application semantics that cannot be inferred reliably from a generic
    Endpoint config alone. Downstream runtime-specific tests should verify `post_start()`
    and receive-event registration on Windows.

