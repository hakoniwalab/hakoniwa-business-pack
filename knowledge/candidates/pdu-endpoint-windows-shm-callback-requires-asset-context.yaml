id: pdu-endpoint-windows-shm-callback-requires-asset-context
title: Windows SHM callback endpoints owned by a Hakoniwa asset require explicit asset context
status: candidate

knowledge_type:
  - runtime_rule
  - usage_pattern
  - known_pitfall
  - architectural_principle

summary: >
  Hakoniwa Shared Memory is OS-owned shared storage, but the Core/Asset objects and
  pointers that map into it are local to the binary module that contains them. This
  distinction is especially visible on Windows, where callback `assets`, `conductor`,
  and Core code can be statically embedded into both an application executable and an
  Endpoint DLL. Therefore an SHM callback Endpoint that operates as part of a registered
  Hakoniwa asset must preserve that asset identity by calling
  `Endpoint::open(config_path, asset_name)`. The one-argument
  `Endpoint::open(config_path)` intentionally selects the external-use context and must
  not be used as a substitute for an asset-owned Endpoint. The detailed memory and link
  model is documented upstream in
  `hakoniwalab/hakoniwa-pdu-endpoint/docs/shm-callback-module-boundary.md`.

observation:
  context: >
    Investigating a native Windows Nova5 runtime failure where Endpoint `post_start()`
    reached receive-event registration but the Endpoint-side Core instance reported
    `recv_event_table_ == nullptr`, even though Hakoniwa shared memory had already been
    created and loaded by another module in the same process.
  details:
    - >-
      The OS shared-memory region and module-local Core/Asset state have different
      lifecycles. A valid shared-memory object does not prove that every DLL or executable
      module has initialized its own `asset_ptr`, `pro_data_ptr`, or
      `recv_event_table_` state.
    - >-
      On Windows, the callback `assets` and `conductor` frontends are built as static
      libraries, and Core `hako` is static as well. An executable and an Endpoint DLL can
      therefore each carry independent copies of Core/Asset implementation state even
      though they access the same OS shared memory.
    - >-
      On Linux/macOS, callback `assets` and `conductor` are shared libraries, so duplicate
      callback frontend state is normally less likely. This must not be generalized into
      "Linux shares all static state"; the portable rule is to make the Endpoint ownership
      context explicit rather than infer readiness from process identity.
    - >-
      `Endpoint::open(config_path)` passes no asset identity and the SHM callback backend
      uses the external attach path (`hako_asset_attach_core()`).
    - >-
      `Endpoint::open(config_path, asset_name)` stores the asset context and the SHM
      callback backend lazily attaches with
      `hako_asset_attach_core_with_name(asset_name, pdu_config_path)` when SHM access or
      receive-event registration first requires Core access.
    - >-
      Passing `asset_name` does not register the asset. It identifies the already-defined
      Hakoniwa asset context whose PDU I/O semantics the Endpoint must use.
    - >-
      Asset-context open requires a resolvable `pdu_def_path` in the Endpoint configuration,
      because that PDU definition path is passed to the Core attach path.
    - >-
      This rule is separate from the build-time requirement that the Endpoint package be
      built with Hakoniwa Core/SHM support enabled. A correct SHM integration needs both
      the build capability and the correct runtime asset context.

