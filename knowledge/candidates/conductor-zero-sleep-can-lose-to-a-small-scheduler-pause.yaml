    - repository: hakoniwalab/hakoniwa-business-pack
      path: docs/drone-fleet-multi-host-configuration.md
      revision: working-tree-after-2c77f09
  runtime_evidence:
    - description: Paired 64-UAV summary for real_sleep_msec=10 reported server RTF 0.890020 and success on both hosts.
    - description: Paired 64-UAV summary for real_sleep_msec=1 reported server RTF 2.544892 and success on both hosts.
    - description: Paired 64-UAV summary for real_sleep_msec=0 reported server RTF 2.455646 and success on both hosts.
  expert_input:
    - source: Hakoniwa maintainer
      statement: Record why 1 ms was selected so the experimental choice can be explained later.

confidence: medium

contradictions:
  - target: Multi-host scaling pacing assumption
    existing_claim: real_sleep_msec=0 should be the final profile because it removes wall-clock sleep.
    new_evidence: The zero-sleep 64-UAV run was slower and consumed more CPU than the 1 ms run.

validation:
  status: partially_verified
  required:
    - Repeat the 1 ms and 0 ms comparison at 256 UAV with otherwise identical conditions.
    - Use repeated attempts if the 256-UAV difference is close enough to plausible run-to-run noise.
  notes:
    - RTF evidence is tightly matched across hosts, but each condition currently has one attempt.
    - macOS CPU averages contain fewer valid CPU samples than Linux because of the shorter high-RTF runs.

