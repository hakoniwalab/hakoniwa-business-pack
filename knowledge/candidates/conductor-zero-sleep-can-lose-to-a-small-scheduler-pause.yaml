id: conductor-zero-sleep-can-lose-to-a-small-scheduler-pause
title: Zero Conductor sleep can lose to a small scheduler pause
status: validating

knowledge_type:
  - runtime_rule
  - known_pitfall
  - validation_rule

summary: >
  Removing Conductor wall-clock sleep does not guarantee the highest RTF. In a
  controlled 64-UAV two-host pilot, a 1 ms sleep produced higher RTF and lower
  CPU use than the zero-sleep yield-only loop. Select the pacing profile from
  paired measurements instead of assuming zero is optimal.

observation:
  context: >
    Comparing real_sleep_msec values 10, 1, and 0 for the headless 64-UAV
    multi-host scaling preflight on macOS srv-01 and WSL2 cli-01.
  details:
    - All conditions used 32 UAV per host, 4 server processes, 12 client processes, a 1 ms Conductor step, a 20 ms maximum delay, and a 10 ms SimTime publication interval.
    - All three paired runs passed preflight and every fleet phase with matching host configuration hashes.
    - Server RTF was 0.8900 at 10 ms, 2.5449 at 1 ms, and 2.4556 at 0 ms.
    - From 1 ms to 0 ms, server average CPU increased from 45.10% to 60.60% and client average CPU increased from 64.43% to 69.17%.
    - The 1 ms profile provisionally Pareto-dominated 0 ms for this condition.
    - Scheduler contention from the yield-only loop is a plausible explanation, not yet a proven causal mechanism.

sources:
  repositories:
    - repository: hakoniwalab/hakoniwa-business-pack
      path: recipes/experiments/drone-fleet-performance/multi-host-scaling.yaml
