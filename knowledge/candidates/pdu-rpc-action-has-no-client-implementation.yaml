promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: true
  recipes: []
  executable_guardrails: []

promotion_rationale:
  - >-
    Anyone planning an Action integration will read the headers and the eleven design
    documents and reasonably conclude the feature is available. The correction
    belongs with component guidance, where implementation status is the subject.
  - >-
    On executable guardrails: none is proposed. The condition is "a source file does
    not exist yet", which disappears the moment the work lands, and a check asserting
    its absence would have to be deleted immediately afterwards.

resolution:
  status: fixed
  fixed_by:
    - repository: hakoniwalab/hakoniwa-pdu-ros
      issue: 1
      revision: f17e1cc
    - repository: hakoniwalab/hakoniwa-pdu-rpc
      issue: 21
      revision: 501ce5a
    - repository: hakoniwalab/hakoniwa-pdu-rpc
      issue: 44
      revision: 501ce5a
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      Not filed upstream as a defect, deliberately. Incremental landing of a feature
      is not a bug, and upstream is visibly mid-implementation (the Action headers and
      server skeleton arrived in hakoniwa-pdu-rpc#64). What is worth recording is that
      the surface currently over-promises relative to the implementation, so downstream
      planning does not assume drivability.
    - >-
      This workspace has offered upstream a verification environment for
      RuntimeCancelCause::TRANSPORT_DISCONNECTED once a client exists, in
      hakoniwa-pdu-rpc#67, because a real cross-OS boundary that can be severed on
      demand is available here.
    - >-
      Corrected 2026-08-04 after the upstream maintainer responded. The absence of
      a client implementation and a C API is not an unnoticed gap: it is the
      in-progress scope of hakoniwa-pdu-ros#1 (ROS 2 service/action server bridges
      backed by PDU-RPC), hakoniwa-pdu-rpc#21 (backward-compatible Action feedback),
      and hakoniwa-pdu-rpc#44 (Action Protocol design documentation). The framing
      "filed as a candidate rather than an issue because incremental landing is not
      a defect" was correct, but this candidate was written without knowing those
      three existed. What remains useful here is only the reader-facing warning --
      that the header surface and the passing contract tests together imply
      drivability that does not exist yet.
    - >-
      Corrected 2026-08-08: upstream maintainer tmori reported, in a PR #96 comment,
      that the Action Client, Server, and Mux Server, plus the C API, Python CFFI API,
      and TypedActionClient/TypedActionServer, are implemented, at pdu-rpc revision
      501ce5a (package-contract test green) and pdu-ros revision f17e1cc (native
      integration green). All three tracked issues -- hakoniwa-pdu-ros#1,
      hakoniwa-pdu-rpc#21, and hakoniwa-pdu-rpc#44 -- are closed as done.
      `resolution.verified` remains false: upstream's own confirmation ran on macOS
      arm64 + Docker, and this candidate's authoring environment (Windows x64 native)
      has not yet re-executed a client run against these revisions. Flip
      `resolution.verified` to true only after that Windows-native re-check, per
      MAINTAINER.md ("closing an issue is not sufficient evidence for
      resolution.verified: true").
