id: pdu-rpc-action-has-no-client-implementation
title: The PDU-RPC Action API has headers and a server skeleton but no client implementation and no C API, so no goal can be originated from Python
status: candidate

knowledge_type:
  - known_pitfall

summary: >
  hakoniwa-pdu-rpc ships a complete-looking Action surface -- six headers covering
  client and server endpoints, services client and server, types, and a C API -- plus
  eleven design documents. The implementation behind it is two source files:
  action_configuration.cpp and action_server_endpoint_impl.cpp. There is no
  implementation for action_client_endpoint.hpp and no C source for c_action.h.
  Because the Python CFFI binding reaches the library only through the C API, there
  is no path from Python to originate a goal, and therefore no way to drive an Action
  from a ROS 2 bridge or from a test harness today. The three Action contract tests
  that pass on Windows exercise configuration parsing, server initialization, and
  packet codec -- all server-side or pure-data concerns -- so a green test run does
  not contradict any of this.

observation:
  context: >
    Assessing whether a third-party ROS 2 action (Tobas
    tobas_mission_msgs/ExecuteMission) could be bridged into Hakoniwa, at
    hakoniwa-pdu-rpc revision 4f5471d, 2026-08-03. The assessment was source
    inspection, not an attempted client run.
  details:
    - "What exists as headers: include/hakoniwa/pdu/action/ contains
      action_client_endpoint.hpp, action_server_endpoint.hpp,
      action_services_client.hpp, action_services_server.hpp, action_types.hpp and
      c_action.h. The type surface is fully specified -- ClientEventType,
      ServerEventType, Decision, TerminalStatus, GoalState and RuntimeCancelCause are
      all defined with values."
    - "What exists as implementation: src/ contains action_configuration.cpp and
      action_server_endpoint_impl.cpp, and nothing else matching action. There is no
      c_action.cpp. So the C API that the Python binding depends on is declared but
      not defined."
    - "Why that specifically blocks Python: the CFFI layer loads the shared library
      and calls C entry points. With no C implementation for the Action surface, the
      binding cannot expose goal origination at all -- this is not a matter of a
      missing convenience wrapper."
    - "Why the passing tests do not contradict it. On Windows all thirteen ctest
      cases pass, and the first three are the Action ones:
      hakoniwa_pdu_action_configuration_test, _server_initialization_test and
      _packet_codec_test. Reading their names against their subjects: configuration
      parsing, server-side initialization, and codec round-tripping. None of them
      originates a goal from a client. A reader who sees 13/13 and concludes the
      Action API is usable would be wrong."
    - "Note that tools/hako.py test does not run them either -- it filters to four
      RPC contract tests, so the Action tests only appear if every target is built
      and ctest is invoked directly. That is a separate observation, raised upstream
      as hakoniwa-pdu-rpc#67."
    - "All eleven documents under docs/design/action/ carry an explicit
      'Status: Draft' banner, so the protocol is not settled either."

sources:
  repositories:
    - repository: hakoniwalab/hakoniwa-pdu-rpc
      path: include/hakoniwa/pdu/action
      revision: 4f5471d
    - repository: hakoniwalab/hakoniwa-pdu-rpc
      path: src
      revision: 4f5471d
    - repository: hakoniwalab/hakoniwa-pdu-rpc
      path: docs/design/action/09-implementation-policy.md
      revision: 4f5471d
  runtime_evidence:
    - description: >-
        External contributor's Windows 11 Pro x86_64 native environment, 2026-08-03.
        Building every test target and running the full suite gives 13/13 pass, of
        which ctest cases 1-3 are the Action contract tests. This is cited as
        server-side and data-level coverage, not as evidence that a client works.
  expert_input: []

confidence: high

contradictions:
  - target: the shape of the Action header surface
    existing_claim: >-
      A repository carrying client endpoint, services client, and C API headers for a
      feature normally implies that feature can be driven.
    new_evidence: >-
      Here the headers are ahead of the implementation by design (the work is landing
      incrementally), so header presence is not a usability signal for this feature
      at this revision.

validation:
  status: verified
  required:
    - >-
      Re-check once a client implementation and a C API land. Everything downstream
      of this -- type mapping, state-machine bindings, ROS 2 conversion -- is
      untestable until then.
    - >-
      Confirm with upstream whether the C API is intended to arrive with the client
      implementation or separately, since a C API without a client is also possible
      and would change what becomes drivable first.
  notes:
    - >-
      IMPORTANT about how this was verified: by reading the source tree and by
      observing that the passing contract tests are server-side and data-level. No
      client run was attempted, so there is no failure output to show. The claim is
      "the code to do this does not exist", which source inspection can establish;
      it is not "we tried and it broke".

tracking:
  # MAINTAINER.md defines `open` as at least one follow-up issue existing.
  # No issue was filed, deliberately -- incremental landing of a feature is not
  # a defect -- so the honest value is `none`.
  implementation_status: none
  issues: []

promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: true
  recipes: []
  executable_guardrails: []

promotion_rationale:
  - >-
    Anyone planning an Action integration will read the headers and the eleven design
    documents and reasonably conclude the feature is available. The correction
    belongs with component guidance, where implementation status is the subject.
  - >-
    On executable guardrails: none is proposed. The condition is "a source file does
    not exist yet", which disappears the moment the work lands, and a check asserting
    its absence would have to be deleted immediately afterwards.

resolution:
  status: pending
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      Not filed upstream as a defect, deliberately. Incremental landing of a feature
      is not a bug, and upstream is visibly mid-implementation (the Action headers and
      server skeleton arrived in hakoniwa-pdu-rpc#64). What is worth recording is that
      the surface currently over-promises relative to the implementation, so downstream
      planning does not assume drivability.
    - >-
      This workspace has offered upstream a verification environment for
      RuntimeCancelCause::TRANSPORT_DISCONNECTED once a client exists, in
      hakoniwa-pdu-rpc#67, because a real cross-OS boundary that can be severed on
      demand is available here.
