promotion_rationale:
  - Directly reusable for external robot models whose MJCF/URDF depends on mesh assets that should not be hand-vendored into runtime repositories.
  - Establishes the responsibility boundary: mbody-registry owns reproducible body-model acquisition/materialization; mujoco-robots owns Hakoniwa/MuJoCo runtime integration.

