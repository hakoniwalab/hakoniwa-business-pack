id: mujoco-menagerie-shadow-hand-assets-not-vendored
title: Shadow Hand mesh assets must be reproducibly materialized instead of hand-vendored
status: candidate

knowledge_type:
  - known_pitfall
  - validation_rule

summary: >
  The original hakoniwa-mujoco-robots Shadow Hand sample hand-vendored only part of the
  MuJoCo Menagerie shadow_hand tree, so right_hand.xml referenced an assets/ directory
  whose OBJ meshes were absent. The durable fix is not to commit the upstream mesh files
  directly into hakoniwa-mujoco-robots. Instead, hakoniwa-mbody-registry owns a pinned
  MuJoCo Menagerie source definition and forge.mode=mjcf_passthrough materialization flow,
  while hakoniwa-mujoco-robots consumes that materialized model through its mbody-registry
  submodule. Missing-model failures should therefore be addressed by reproducing the
  pinned materialization flow, not by manually copying individual OBJ/STL/DAE assets.

observation:
  context: >
    Running the Hakoniwa PDU Smoke section of examples/actuators/shadow_hand/README.md
    (shadow-hand-hakoniwa-asset.exe --no-viewer) on Windows, after the unitree_go1 sibling
    sample worked correctly with the same launch pattern (WorkingDirectory =
    hakoniwa-mujoco-robots repo root, --no-viewer, no config path argument).
  details:
    - "Before the durable fix, `find thirdparty/mujoco_menagerie/unitree_go1 -maxdepth 1 -type d`
      showed an assets/ subdirectory while the identical find for shadow_hand did not."
    - "right_hand.xml declares `<compiler angle=\"radian\" meshdir=\"assets\" autolimits=\"true\"/>`,
      so the model depends on local mesh files under assets/."
    - "The external contributor verified the immediate workaround by fetching the missing OBJ
      meshes from upstream MuJoCo Menagerie; after doing so, shadow-hand-hakoniwa-asset.exe
      loaded correctly and reached `Shadow Hand Hakoniwa asset started.` / WAIT START."
    - "The durable fix moved source ownership to hakoniwa-mbody-registry: the Menagerie revision,
      selected shadow_hand/ tree, and MJCF passthrough behavior are versioned, while the external
      mesh assets are materialized locally and remain outside Git history."
    - "hakoniwa-mujoco-robots now updates the mbody-registry submodule and documents a
      prepare-model.bash flow instead of relying on the incomplete hand-vendored Menagerie copy."

