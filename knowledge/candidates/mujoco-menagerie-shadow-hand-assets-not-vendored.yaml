validation:
  status: verified
  required: []
  notes:
    - Verified by an actual model-load failure, then an actual successful run after fetching the missing assets.
    - The replacement materialization mechanism is CI-verified, but the merged fix still needs an explicit Hakoniwa runtime re-verification before resolution.verified can become true.
    - "2026-07-26: the merged materialization flow was re-run on native Windows and successfully produced the materialized Shadow Hand model (scene_right.xml plus 14 .obj meshes and a model-local LICENSE), confirming the forge/materialization mechanism itself works end-to-end on Windows. Two Windows-only portability gaps in the forge tooling had to be worked around (a python3 shim and a venv PATH addition) and are recorded as separate candidates rather than folded into this one. The Hakoniwa Shadow Hand asset runtime was not launched against the materialized model in this session, so resolution.verified remains false."
    - "2026-07-28: the Hakoniwa Shadow Hand asset runtime was launched against the materialized model by two independent external contributors on native Windows 11 x86_64, closing the gap left open above. Both runs reproduced the README's expected representative plant output values exactly and confirmed tendon-coupled actuator/joint readback via the sender. resolution.verified is now true. One run showed a single transient ConvertorError immediately at startup (0 in the other run); this is recorded as a residual known pitfall, not treated as evidence against verification, since every subsequent step in that run was correct."

