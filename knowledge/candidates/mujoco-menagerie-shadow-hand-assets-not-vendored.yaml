  runtime_evidence:
    - description: >-
        Reproduced on an external contributor's Windows 11 x86_64 workspace (native build,
        no WSL/Docker), 2026-07-24: the plant asset's stderr log showed
        "[ERROR] Failed to initialize Shadow Hand model: Model loading failed" before the
        assets/ directory was fetched, and a full successful run (WAIT START through
        WAIT STOP/WAIT RESET, tendon-coupled joint readback matching the README's expected
        signals) after fetching it.
    - description: >-
        The durable materialization path was CI-validated in hakoniwa-mbody-registry#16 and
        hakoniwa-mujoco-robots#38, including a real sparse fetch of the pinned Menagerie
        revision, recursive MJCF include/mesh validation, submodule initialization, and
        creation of the materialized scene_right.xml.
    - description: >-
        External contributor's Windows 11 x86_64 verification environment (native, no
        WSL/Docker), 2026-07-26: ran the merged forge/materialization flow at
        hakoniwa-mujoco-robots revision 1abffe415e15635503a46de2d2c50b246ca52545 with the
        hakoniwa-mbody-registry submodule pinned to 8b14d5366e156f3147a69c37cf953f7f8a1ab9fb.
        Mesh materialization succeeded: bodies/shadow_hand/source/shadow_hand/scene_right.xml
        was produced along with 14 .obj mesh files under assets/ (matching the prior manual
        vendoring's mesh count 1:1) and a model-local LICENSE file. On this Windows machine
        the flow did not succeed unmodified out of the box -- a `python3` shim was required
        for hakoniwa-mbody-registry's tools/forge.sh to run at all, because of two
        Windows-specific portability gaps recorded as separate candidates in this batch
        (mbody-registry-forge-sh-python3-hardcoded-windows.yaml and
        mujoco-robots-prepare-model-venv-layout-windows.yaml). Actually launching the
        Shadow Hand Hakoniwa asset runtime against the materialized model was not attempted
        in this session.
    - description: >-
        Two independent external contributors' Windows 11 x86_64 verification environments
        (native, no WSL/Docker), 2026-07-28: each ran the Hakoniwa PDU Smoke procedure from
        examples/actuators/shadow_hand/README.md (plant asset launch with the materialized
        bodies/shadow_hand/source/shadow_hand/scene_right.xml passed as a CLI argument,
        Python sender, hako-cmd start, --no-viewer) against hakoniwa-mujoco-robots revision
        1abffe415e15635503a46de2d2c50b246ca52545 with the hakoniwa-mbody-registry submodule
        pinned to 8b14d5366e156f3147a69c37cf953f7f8a1ab9fb, with the runtime source itself
        left unmodified. Both runs reached the runtime state the README documents as
        expected: representative plant output matched the README's expected values exactly,
        e.g. "time=  1.002 FFJ0_target=0.738 FFJ2=0.295 FFJ1=0.347 THJ1_target=0.359
        THJ1=0.316" and "time=  2.002 FFJ0_target=1.739 FFJ2=0.804 FFJ1=0.901
        THJ1_target=0.845 THJ1=0.828". The sender's own output additionally confirmed
        tendon-coupled actuator-target/joint-state readback (an FFJ0 command driving FFJ2
        and FFJ1 to follow). One of the two runs logged a single
        "[ConvertorError][Float64MultiArray] hako_get_base_ptr_pdu returned null"
        immediately after startup (the other run logged zero occurrences); every subsequent
        step in that run produced correct values, so this reads as a one-time startup race
        rather than a steady-state defect, and is recorded here as a known residual pitfall
        rather than silently absorbed into a clean pass. For scale, the same error class
        occurred on every one of roughly 1470 steps before the module-resolution fix
        described in hakopy-persistent-pythonpath-shadows-project-hakopy-build-on-windows.yaml,
        i.e. this residual occurrence is several orders of magnitude smaller and of a
        different character (transient at startup vs. sustained for the whole run).
