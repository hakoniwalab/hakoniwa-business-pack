promotion_rationale:
  - Any real-device telemetry bridge recipe needs this semantic-mapping discipline (do not conflate different physical quantities that happen to share a similar name or scale) and fail-closed write validation, since silent success-logging on a write failure is a dangerous default for anything touching real hardware.

