promotion_rationale:
  - >-
    Which side listens is a deployment property, not a protocol property. Saying so in
    the runtime primer lets a Recipe be placed on a network where only one direction
    is open.
  - The max_clients coupling is the kind of thing that reads as a broken component
    unless it is written down, since the error surfaces as a socket bind failure deep
    inside client-pool construction.

