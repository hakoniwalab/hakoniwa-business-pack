validation:
  status: verified
  required:
    - Ask upstream whether client-side multiplexing is intended to exist. Without it,
      the reversed topology cannot serve concurrent ROS 2 requests, which weakens the
      Recipe's max_clients/BUSY semantics on any host where inbound is blocked.
    - Confirm whether the Recipe should expose the connection direction as an explicit
      option rather than assuming the host listens.
    - Not measured on macOS or Linux hosts; there the normal direction works, so the
      reversal is untested outside this topology.
  notes:
    - Verified by a single-variable check of the reversal itself (contract test,
      config-only change) before the full bridge was attempted, so the pool failure
      could not be misread as the reversal being unsupported.

