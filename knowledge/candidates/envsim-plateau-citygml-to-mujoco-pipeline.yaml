id: envsim-plateau-citygml-to-mujoco-pipeline
title: Envsim owns query-centered PLATEAU CityGML to MuJoCo and GLB pipelines
status: promoted

knowledge_type:
  - capability
  - interface_contract
  - validation_rule

summary: >
  hakoniwa-envsim can resolve PLATEAU building CityGML from a latitude,
  longitude, and metric half extents, convert official EPSG:6697 coordinates
  into a query-centered local ENU frame, and generate MuJoCo wall MJCF while
  preserving original LOD1 footprints and recording source URLs, resolved
  dataset years, actual sizes, and SHA-256. The same building selection also
  generates a self-contained GLB directly from CityGML, preferring textured
  LOD2 surfaces and falling back to LOD1 solids. A 0-to-1 OBB empty-area
  threshold controls the MuJoCo tradeoff between compact OBBs and detailed boundary walls.

observation:
  context: >
    Extending the existing local CityGML conversion scripts into a
    component-owned hako.py workflow backed by the official PLATEAU
    Distribution Service API.
  details:
    - The official range API returns matching city datasets and individual bldg CityGML URLs.
    - The inspected official Shibuya CityGML declares EPSG:6697 and stores positions as latitude, longitude, height.
    - API fileSize metadata differed from the downloaded object size, so it is informational rather than an integrity check.
    - The downloaded object SHA-256 and actual byte count are recorded in download-manifest.json.
    - The default waste threshold 1.0 emits one compact OBB per building; lowering it selectively emits the original exterior and interior boundary edges as wall boxes.
    - Adjacent municipality datasets can publish the same mesh and building IDs; identical geometry is deduplicated and conflicting geometry fails closed.
    - The API r: rectangle response omitted an intermediate third-level mesh in the verified Shibuya range; Envsim therefore enumerates every intersecting third-level mesh and queries them explicitly with m:.
    - The Map Viewer Shibuya origin is 35.6625,139.70625 and must not be replaced by Drone Core simulation.location longitude 139.69375.
    - A pinned historical rebuild reproduced all 4266 building geoms in the Drone Core Shibuya XML with zero numeric error.
    - Direct GLB output uses Three.js-native X=East, Y=Up, Z=-North coordinates aligned with the same origin and altitude offset as the MuJoCo asset.
    - Texture acquisition is selective: only images referenced by selected LOD2 surfaces are downloaded, hashed, and embedded in the GLB.

