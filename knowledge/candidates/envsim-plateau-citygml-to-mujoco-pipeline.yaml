  runtime_evidence:
    - description: >
        A one-kilometer query at the Map Viewer Shibuya origin selected three
        2025 CityGML objects, deduplicated 101 overlapping building records,
        preserved 58 concave footprints among 114 unique buildings, and
        generated 114 geoms with the default compact OBB policy.
    - description: >
        The same one-kilometer selection generated a 1.45 MB GLB with 3572
        triangles in 25 meshes: 7 buildings used LOD2, 107 used LOD1 fallback,
        and 24 selected textures were embedded.
    - description: >
        The pinned historical 600m selection rebuilt 801 buildings and matched
        all 4266 Drone Core reference geoms with maximum numeric error 0.0.
  expert_input:
    - source: user
      statement: >
        Given latitude, longitude, and a range, download the matching CityGML
        and feed it into the current tools to generate MuJoCo wall data.

