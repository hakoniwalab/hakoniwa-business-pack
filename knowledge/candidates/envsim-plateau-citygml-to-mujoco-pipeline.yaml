  runtime_evidence:
    - description: >
        A one-kilometer query at the Map Viewer Shibuya origin enumerated all
        three intersecting third-level meshes, selected five 2025 CityGML
        objects, deduplicated 1850 overlapping building records, and generated
        1863 geoms with the default compact OBB policy. Forty building
        centroids lie within the center +/-100m square.
    - description: >
        The same one-kilometer selection generated a 176 MB GLB with 171365
        triangles in 2333 meshes: 653 buildings used LOD2, 1210 used LOD1
        fallback, and 2332 selected textures were embedded.
    - description: >
        The pinned historical 600m selection rebuilt 801 buildings and matched
        all 4266 Drone Core reference geoms with maximum numeric error 0.0.
  expert_input:
    - source: user
      statement: >
        Given latitude, longitude, and a range, download the matching CityGML
        and feed it into the current tools to generate MuJoCo wall data.

confidence: high

contradictions:
  - target: catalog/components/hakoniwa-envsim.yaml
    existing_claim: Exact CLI entrypoints and MuJoCo conversion capabilities were unknown.
    new_evidence: A component-owned hako.py and offline/online pipeline now define and verify those contracts.

validation:
  status: verified
  required: []
  notes:
    - Unit tests cover bbox construction and catalog selection.
    - Offline smoke covers CityGML through MJCF without relying on network availability.
    - Online E2E was verified against the official PLATEAU API and a real CityGML object.
    - Business Pack regression separates the current one-kilometer API build from the immutable historical Drone Core comparison.

