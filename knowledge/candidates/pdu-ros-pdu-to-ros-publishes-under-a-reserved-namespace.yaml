  runtime_evidence:
    - description: >-
        Windows 11 x64 host with WSL Ubuntu 24.04 / ROS 2 Jazzy, 2026-09-11. A
        tobas_std_msgs/PairFloat64 stream written on the Hakoniwa side reached
        /pdu/hako_probe/pair (50/50 exact) while a subscriber on the configured
        /hako_probe/pair received nothing.
  expert_input: []

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - >-
      Decide where the rule should be stated: the binding schema description, the README's
      binding section, or a log line at bridge startup naming the effective topic per
      binding. A startup log line would have made this self-diagnosing.
    - >-
      Confirm the same rewrite applies to action bindings, which were not exercised here.
  notes:
    - >-
      Measured on one host with one ROS distribution, against two message types.

