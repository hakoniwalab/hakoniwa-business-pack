    Anyone wiring the command direction for the first time can still hit this by not
    reading the README section first, and at the measured revision the failure mode gave
    no signal at all -- the bridge looked healthy while the subscriber starved.

resolution:
  status: documented
  fixed_by: []
  verified: true
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      No code change was needed and none was made. The behaviour is correct and the
      contract was already written down; hakoniwalab/hakoniwa-pdu-ros#25 was closed as
      already satisfied. This entry records a correction of our diagnosis, not an
      implemented fix -- which is why `fixed_by` is empty while the status is documented.
    - >-
      Verified by reading README.md at the measured revision 8693f4d and by diffing
      bridge_node.py between that revision and current main, 2026-09-15.
