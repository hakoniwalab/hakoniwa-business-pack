id: pdu-ros-pdu-to-ros-publishes-under-a-reserved-namespace
title: A pdu_to_ros binding does not publish on the topic it names -- the configured name is the ROS-owned one and the bridge publishes on its /pdu mirror
status: candidate

knowledge_type:
  - interface_contract
  - known_pitfall

summary: >
  hakoniwa-pdu-ros rewrites the topic name of every `pdu_to_ros` TOPIC binding: the
  configured name is prefixed with `/pdu`, and a configured name that already begins with
  `/pdu` is rejected outright. A binding that says `/hako_probe/pair` therefore publishes
  on `/pdu/hako_probe/pair`. The rule looks deliberate -- `/pdu` reads as reserved for
  PDU-owned mirror topics, which keeps the bridge from publishing onto a ROS-owned name.
  It constrains where the bridge publishes; it is not access control over subscribers,
  and action bindings were not exercised. The rule IS documented -- the README's "Minimal
  Config" section states it at the revision measured here -- and an earlier version of
  this candidate wrongly claimed otherwise; see the correction in `observation.details`.
  What remains true is that the failure is silent on both sides: the bridge connects,
  receives, and publishes, while a subscriber on the configured name receives nothing.
  `ros_to_pdu` is unaffected, which is why this surfaces only for whoever uses the command
  direction first.

observation:
  context: >
    First use of the `pdu_to_ros` direction on this workspace's Tobas bridge (case T34),
    Windows 11 native sender to WSL Ubuntu 24.04 / ROS 2 Jazzy, 2026-09-11. The state
    direction (`ros_to_pdu`) had been in use since 2026-07-31 and never exercised this
    path.
  details:
    - >-
      Symptom. With `"topic": "/hako_probe/pair"` and `"direction": "pdu_to_ros"`, a
      subscriber on `/hako_probe/pair` received zero messages while the bridge reported no
      error. `ros2 topic list` showed `/pdu/hako_probe/pair` alongside the configured name.
    - >-
      Mechanism. `config_loader._topic_for_direction` returns `f"/pdu{normalized}"` when the
      direction is `pdu_to_ros`, and `_validate_ros_topic` raises for any configured name
      that is `/pdu` or begins with `/pdu/`, so the caller cannot write the effective name
      either.
    - >-
      After changing the subscriber to `/pdu/hako_probe/pair`, 50 of 50 samples arrived and
      matched exactly, and a second type (a real vendor command type) behaved the same way.
    - >-
      The reservation is worth keeping, and for the command-direction work it meant the
      bridge would not publish onto the vendor's own topic names. Stated precisely: the
      rule determines where the bridge publishes, it is not access control over
      subscribers, and it was measured for topic bindings only.
    - >-
      CORRECTED, 2026-09-15. This candidate originally concluded that the rewrite was
      undocumented at the point of configuration. That is wrong, and the maintainer said
      so. At the same revision that was measured (8693f4d), README.md already carried it
      in the "Minimal Config" section: "pdu_to_ros: /pdu/<robot>/<pdu>", "ros_to_pdu:
      /<robot>/<pdu>", a two-row owner table, and "If topic is set, it is the ROS-owned
      topic name; the PDU-owned topic is derived by adding /pdu in front." Verified by
      reading README.md out of that revision directly. The runtime observation below is
      unaffected -- what was wrong was the diagnosis of why we hit it, which was that the
      binding was configured without reading that section, not that the contract was
      unstated.
    - >-
      Diagnosability has since improved anyway. At 8693f4d, bridge_node.py created the
      publisher and the subscription with no log line naming either
      (`create_publisher(msg_cls, binding.topic, 10)`). On current main (f180e38) both
      paths log the expanded name -- "publisher QoS for {binding.topic}" and
      "subscription QoS for {binding.topic}" -- so the effective topic is visible at
      startup. hakoniwalab/hakoniwa-pdu-ros#25, which we filed asking for exactly that,
      was closed as already satisfied.

