  notes:
    - Diagnosis and workaround only; no upstream issue filed, no PR exists yet. Recorded
      as candidate material for an upstream issue against hakoniwa-mbody-registry's
      tools/forge.sh (and possibly its sibling scripts, which were not individually
      checked for the same python3-only assumption in this session). The issue should
      frame the ask as bringing forge.sh into conformance with the interpreter-selection
      contract hakoniwa-business-pack's own runtime primer already documents (revision
      50681d5), not as a novel Windows-compatibility request.
    - The `python3` -> `python` PATH shim used in this session's verification (see
      runtime_evidence above) is a workspace-side workaround only, not the fix being
      proposed upstream; it happened to unblock this session but does not select
      Python 3.12 explicitly, does not honor `HAKO_PYTHON`/`PYTHON_CMD`, and does not
      fail fast on a wrong-version or missing-package interpreter, so it does not by
      itself satisfy the primer's contract.
