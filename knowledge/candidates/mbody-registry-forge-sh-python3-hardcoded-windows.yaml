promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-mbody-registry
      kind: doctor
      path: tools/forge.sh
      mode: detect-only
      notes:
        - No existing preflight check in forge.sh detects a non-functional python3
          resolution before the script's own control flow depends on its output. Per
          docs/hakoniwa-runtime-primer.md (revision 50681d5), the expected behavior is
          not a generic "is python3 real" probe but conformance to the primer's own
          interpreter contract -- explicitly select Python 3.12 (e.g. `python3.12`/
          `py -3.12`, not a bare `python3` lookup), honor a `HAKO_PYTHON`/`PYTHON_CMD`
          override if the caller has set one, and fail before the MODE-resolution
          heredocs run (and before any asset/robot forge starts) with an actionable
          message when the selected interpreter is not Python 3.12 or cannot import the
          packages forge.sh's heredocs depend on (e.g. pyyaml). A doctor-style check
          implementing exactly this (version + override + importability, in that order)
          would surface this class of failure at the right point instead of the
          unrelated-looking "unbound variable" error observed in this session.

promotion_rationale:
  - This is a reusable, cross-robot gap (affects every python3 call site in forge.sh, for
    any robot forged on a Windows machine with the WindowsApps python3 stub on PATH), not
    specific to Shadow Hand or this workspace's own configuration.
  - Left as detect-only because no fix has been drafted or applied upstream; a
    doctor-style preflight is a reasonable direction but was not implemented in this
    session.
  - runtime_primer is left false rather than proposed as a new promotion target --
    docs/hakoniwa-runtime-primer.md (revision 50681d5) already states the Python 3.12 /
    `HAKO_PYTHON` / `PYTHON_CMD` / fail-before-launch contract this candidate's gap
    violates. No new primer prose is needed; what is missing is enforcement in
    hakoniwa-mbody-registry's own tools/forge.sh, which is why the promotion target is
    an executable guardrail against that repository rather than a docs change.

resolution:
  status: pending
  fixed_by: []
