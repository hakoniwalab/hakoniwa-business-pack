        External contributor's Windows 11 x86_64 verification environment (native, Git
        Bash, upstream sources unmodified), 2026-07-26: attempt 1 (no shim) failed with
        exit 1 and the single line "forge.sh: line 45: FORGE_MODE: unbound variable";
        attempt 2 (python3->python shim placed on PATH ahead of the WindowsApps stub,
        plus the target venv's Scripts/ directory also on PATH) completed with exit 0 and
        printed the full forge sequence (fetching robot source, forging robot in
        mjcf_passthrough mode, "MJCF assets valid", "Forge complete."), with the shim
        confirmed in use ("shim used: python3 -> exec python \"$@\"").
  expert_input: []

