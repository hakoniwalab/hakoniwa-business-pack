contradictions: []

validation:
  status: partially_verified
  required:
    - Confirm whether hakoniwa-mbody-registry's own CI or documented setup instructions
      already assume/require a Linux or macOS runner (where `python3` is normally a real
      interpreter) and whether Windows is a documented supported platform for forge.sh at
      all -- this candidate does not yet establish whether upstream considers Windows a
      supported environment for this script.
    - As of hakoniwa-business-pack revision 50681d5, docs/hakoniwa-runtime-primer.md
      already states the interpreter-selection contract this gap violates -- a
      component-owned launch wrapper for a Hakoniwa Python workflow should select
      Python 3.12 explicitly, honor a documented interpreter override such as
      `HAKO_PYTHON` or `PYTHON_CMD`, and fail before starting assets when the selected
      interpreter is not Python 3.12 or cannot import the required Hakoniwa packages.
      tools/forge.sh implements none of these three behaviors (no explicit version
      selection, no override variable, no preflight fail -- it fails deep inside
      unrelated control flow instead). Confirm with upstream whether forge.sh is
      expected to conform to this primer-level contract, and if so, whether the fix
      should be an explicit `python3.12`/`py -3.12` selection plus a `HAKO_PYTHON`/
      `PYTHON_CMD` override read at the top of the script, rather than a bare
      python-to-python3 PATH alias (which would satisfy the immediate symptom but not
      the version-pinning or fail-fast parts of the contract).
  notes:
    - Verified via one reproduced failure and one reproduced fix in the same session, on
      one Windows machine's specific PATH configuration (WindowsApps stub present, no
      separately installed python3.exe). Whether this reproduces identically on every
      Windows machine (e.g. one where python3.exe genuinely does not exist anywhere on
      PATH, producing a normal "command not found" instead of the App Execution Alias
      stub's silent redirect) was not tested.

