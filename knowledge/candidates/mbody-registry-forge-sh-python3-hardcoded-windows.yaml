          exit 0?") run before the MODE-resolution heredocs would surface this class of
          failure with an actionable message instead of an unrelated-looking "unbound
          variable" error.

promotion_rationale:
  - This is a reusable, cross-robot gap (affects every python3 call site in forge.sh, for
    any robot forged on a Windows machine with the WindowsApps python3 stub on PATH), not
    specific to Shadow Hand or this workspace's own configuration.
  - Left as detect-only because no fix has been drafted or applied upstream; a
    doctor-style preflight is a reasonable direction but was not implemented in this
    session.

