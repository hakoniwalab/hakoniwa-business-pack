  runtime_evidence:
    - description: >-
        External contributor's Windows 11 Pro x86_64 native environment, 2026-08-03.
        `netsh int ipv4 show dynamicport tcp` = 49152 + 16384. Bind probe: 54001,
        54010, 54011 all WinError 10048; 24001, 24011 free. Four contract tests failed
        at start() on the original ports and all four exited 0 after rebinding to
        24001/24011 with no other change.
  expert_input: []

confidence: high

contradictions:
  - target: hakoniwa-pdu-rpc README
    existing_claim: >-
      "Cross-platform build and contract-test coverage on Linux x64, Linux ARM64,
      macOS, and Windows x64."
    new_evidence: >-
      The build is genuinely fine on Windows x64 and the tests do pass once the port
      is free, but running them as shipped on a normal Windows desktop fails at setup.
      The claim holds for CI and does not hold for a developer machine.

agency_boundary:
  human_decisions:
    - Adding an inbound Windows firewall rule for a port outside the dynamic range is
      a security-settings change and must be performed by a human, not the agent.
    - Reserving the port with `netsh int ipv4 add excludedportrange` is likewise a
      system configuration change requiring a human, and on an already-bound port it
      also needs a reboot.
  blocked_here:
    - >-
      Superseded on the same day. The ROS 2 leg first appeared blocked by this, but
      the deadlock was dissolved without any firewall change by reversing the TCP
      role so the Windows side dials out; see
      pdu-rpc-tcp-role-reversal-works-but-client-pool-cannot-listen. The Recipe then
      ran end to end. Three firewall changes made while diagnosing (an inbound rule,
      a Hyper-V rule, and DefaultInboundAction Allow) were all reverted afterwards,
      and the end-to-end call still returned 42, which proves the working topology
      does not depend on them.
    - >-
      What remains true is the port constraint itself: a fixed port in 49152-65535 is
      unsafe to claim on Windows regardless of direction, and the listening side --
      whichever it is -- must avoid that range.

validation:
  status: verified
  required:
    - Decide the upstream fix. Options are moving the fixtures and the Recipe default
      below 49152, binding port 0 and discovering the assigned port, or documenting a
      Windows prerequisite. Only the first two remove the failure mode.
    - For the Windows + WSL topology specifically, whichever port upstream picks must
      then be paired with a documented one-time human step to open it inbound, because
      the firewall rule cannot be created by the agent that runs the Recipe.
    - Fix the bind diagnostic separately from the port choice. Even with a good port,
      any future bind failure on Windows will print a success message.
    - >-
      Not measured on Linux or macOS, but do not describe this as Windows-specific.
      The adversarial review flagged that framing as over-generalised in the wrong
      direction: the typical Linux ephemeral range 32768-60999 contains all three
      ports, and modern macOS also uses the IANA dynamic range, so the exposure is
      cross-platform. Windows is merely where a busy desktop made it fire. Reproducing
      it on Linux remains open.
  notes:
    - Verified by direct measurement of the port range, of the three ports' state, and
      by a single-variable change (port only) flipping four tests from fail to pass.

