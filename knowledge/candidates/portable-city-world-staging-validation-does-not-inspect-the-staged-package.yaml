promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes:
    - city-world-web-ui
  executable_guardrails: []

promotion_rationale:
  - >-
    The defect sits in the portable packaging flow for the city-world-web-ui
    Recipe. The Receipt contract and the Workspace environment each behave as
    written; the packager combines them without isolating staging.

resolution:
  status: fixed
  fixed_by:
    - repository: hakoniwalab/hakoniwa-business-pack
      issue: 213
      pull_request: 215
      revision: ecdbdf7
  verified: true
  promoted_to: []
  executable_guardrails:
    - tools/tests/test_package_portable_workspace.py
    - tools/tests/test_portable_workspace_runtime.py
  notes:
    - >-
      Re-measured on 2026-10-02 at business-pack c4fac99, which contains
      ecdbdf7. The host and sibling revisions were the same as in the first
      report, with the OS at build 26300. The two reported layers no longer
      reproduce. Outside the Workspace the packager exits 0 where it exited 2.
      Inside the Workspace it exits 0, and its staged doctor now reports
      Foundation Python, hakoniwa-pdu-endpoint and Recipe runtime at the
      staging paths, where before it reported them at the source paths.
      Snapshots taken before and after packaging, in both modes, show the
      source environment.json, config/launcher.json and Foundation Receipt with
      the same SHA-256 (the first 16 hex digits were recorded); before the fix
      the environment.json hash changed.
      environment.json and launcher.json get a new mtime, because the packager
      also runs the source configure (its trace lists city_world_web_ui.py
      configure with the source Python). No hako-portable-*
      directory is left in TEMP.
    - >-
      The ZIP still has no work/recipes/city-world-web-ui/ entries, but that
      is now by design: #215 removes the staging-specific runtime and the
      entrypoint regenerates it at extraction. On the extracted package, the
      packaged start-city-world.bat rewrote the Receipt's install.prefix to
      the extraction path before it failed (see the last note). With the
      entrypoint's configure step replaced by the staging materialize step
      and Ruby on PATH, the extracted doctor reported Foundation SATISFIED and
      Recipe runtime SATISFIED, and the packaged status and stop batch files
      exited 0.
    - >-
      resolution.verified is true for the two layers this candidate describes,
      based on the measurements above and not on the merge. The same run
      found that the packaged start-city-world.bat no longer starts on a host
      without Ruby, because the extraction-time step now runs the full Recipe
      configure. That is a new finding introduced by #215 and is recorded as
      its own candidate,
      portable-city-world-extraction-configure-needs-ruby-and-pip, and
      reported as #224.
