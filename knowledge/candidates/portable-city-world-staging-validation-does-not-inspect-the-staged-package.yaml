id: portable-city-world-staging-validation-does-not-inspect-the-staged-package
title: The City World portable packager's staging validation inspects the source Workspace when run inside it, and rejects the copied Receipt when run outside it

status: candidate

knowledge_type:
  - known_pitfall

summary: >
  tools/package_portable_workspace.py validates the staged City World package
  by running workspace.py prepare, materialize_recipe_runtime and the Recipe
  doctor inside staging. Those subprocesses are started without an environment
  of their own, so they inherit the caller's. The packager already has a
  _staged_environment() helper that points HAKONIWA_WORK_DIR and related
  variables at staging, but only the repository-profile validator uses it.
  Two outcomes follow on Windows, depending on where the command is run.
  Inside the managed Workspace, HAKONIWA_WORK_DIR still names the source work
  directory, so the "staged" doctor's Foundation and Recipe runtime checks
  inspect the source (the file-presence, import and Recipe dependency checks do
  use staging). Packaging passes and a ZIP is written, but three things go
  wrong: those checks do not test the package, the staged materialization
  writes staging paths into the source Workspace's environment.json, and the
  ZIP ships without environment.json, the Launcher config or the activation
  scripts. Outside the Workspace, the doctor does inspect staging, where the
  Receipt copied from the source still records the source install.prefix, so
  hakoniwa-pdu-endpoint is INCOMPATIBLE and packaging exits 2. The ZIP from
  the in-Workspace run was extracted and its start, status and stop
  entrypoints worked, because they call the Launcher directly.

observation:
  context: >
    Following docs/windows-portable-city-world-workspace-ja.md on one native
    Windows 11 x64 host after configuring the city-world-web-ui Recipe
    (business-pack b909f95, hakoniwa-pdu-endpoint 12230c9). The source
    configure ended in "Foundation: SATISFIED" and the source doctor exited 0.
  details:
    - >-
      Code path. _validate_staged_package
      (tools/package_portable_workspace.py:905-942) calls _run_checked without
      an env argument for workspace.py prepare, _materialize_web_ui_recipe and
      city_world_web_ui.py doctor, and _run_checked passes env=None to
      subprocess.run (:712-719). _staged_environment (:946-975) sets
      HAKONIWA_WORK_DIR, HAKONIWA_HOME, VIRTUAL_ENV and related variables to
      staging, and its only caller is the repository-profile validator (:995).
      workspace.py run exports HAKONIWA_WORK_DIR for the source work directory
      (tools/workspace.py:161), and resolve_work_dir prefers that variable
      over the checkout-relative default (tools/workdir.py:31-38).
    - >-
      Inside the Workspace ("python tools/workspace.py run python
      tools/package_portable_workspace.py --output <scratch>/dist/in-workspace.zip",
      unmodified packager), the command exits 0 and writes a ZIP. The third,
      staged doctor run reports SATISFIED for Foundation toolchain, Foundation
      Python, hakoniwa-pdu-endpoint and Recipe runtime at the source paths
      (sanitized: "executable=<checkout>\\hakoniwa-business-pack\\work\\foundation\\install\\python\\Scripts\\python.exe").
      Only the three Recipe dependency lines name the staging tree. The
      packager's own staged file-presence check and staged-Python import check
      also ran and passed.
    - >-
      That run also rewrites the source Workspace. A repeat of the same run with
      snapshots recorded the source work/recipes/city-world-web-ui/environment.json
      before and after: its mtime and SHA-256 changed, RECIPE_REPOSITORY and
      HAKONIWA_ENVSIM_ROOT moved from the source checkout to
      <TEMP>\\hako-portable-<id>\\..., and that staging directory did not
      exist afterwards. The source doctor then exits 1 with
      "[MISSING] Recipe runtime" and "- environment.json is stale; rerun
      configure". In the first run the source start and stop still exited 0.
      Running city_world_web_ui.py configure restores the file to the
      pre-packaging SHA-256 and the doctor exits 0 again.
    - >-
      The ZIPs from both in-Workspace runs contain no
      work/recipes/city-world-web-ui/environment.json, config/launcher.json,
      activate or Activate.ps1 (checked with unzip -l for the repeat run, and
      reported missing by the doctor inside the extracted first ZIP).
    - >-
      Outside the Workspace ("python tools/package_portable_workspace.py" from
      a plain shell), the staged doctor inspects staging and fails with
      "[INCOMPATIBLE] hakoniwa-pdu-endpoint", an install.prefix reason whose
      required value is the staging install and whose installed value is the
      source install, and "ERROR: portable City World Web UI Recipe doctor
      failed with exit=1". The command exits 2. hakoniwa-pdu-endpoint writes an
      absolute install.prefix (tools/hako.py:982), _copy_foundation copies the
      receipts unchanged (tools/package_portable_workspace.py:167-181), and
      evaluate_component compares the field by exact string equality
      (tools/foundation_lib/inspection.py:315-318).
    - >-
      Single-variable control for the outside case. A harness outside the
      checkout imported the packager unchanged and rewrote only the staged
      Receipt's install.prefix to the staging prefix after the copy. The staged
      doctor then reported "Foundation: SATISFIED" and the packager wrote a ZIP.
      The first attempt wrote the tempfile path as returned, which carries the
      8.3 short name of the user directory on this host, and the doctor still
      reported INCOMPATIBLE. The comparison is against the long form, so a
      rewrite has to use the resolved path.
    - >-
      Extracted package. The ZIP from the in-Workspace run was extracted with
      Expand-Archive to a 25-character folder outside any git working tree.
      With PATH set to C:\Windows\system32;C:\Windows, where python, git, ruby
      and cmake all resolve to "not found", start-city-world.bat,
      status-city-world.bat and stop-city-world.bat each exit 0. The three
      service processes run from the packaged python.exe. The Web UI shows
      "Worker接続済み" and the shared cache
      %LOCALAPPDATA%\Hakoniwa\cache\plateau-citygml (the portable branch of
      generation.py:50-55; LOCALAPPDATA was set). With the port check repeated
      as a TCP listener query, port 8008 has one listener after start and none
      after stop, and a process query finds no python.exe under the package.
    - >-
      A Capability inspection from the extracted package first stayed at
      "PLATEAU catalogを確認中" for over 40 s. At that point worker.err was
      empty, the Worker's cumulative CPU time was 0.77 s and it had no child
      processes (a single sample, not a trace). After a page reload it returned
      the same result as the source Workspace for the same bbox. The start
      bat's --open-browser had opened a second Web UI client; its connection
      state was not recorded. The first attempt's cause was not investigated.
    - >-
      The extracted package's own doctor fails (run with host Ruby added to the
      minimal PATH, since recipe.py needs it). Besides the missing runtime
      files above, it reports hakoniwa-pdu-endpoint INCOMPATIBLE on
      install.prefix against the extraction path. The entrypoints do not call
      the doctor, so this did not stop the tested lifecycle. Any Recipe command
      that does check the runtime would see it, for example the doctor itself
      and the generic launch path in tools/recipe.py, which refuses an
      unsatisfied runtime.
    - >-
      Extraction location matters for Recipe commands. recipe_repository_root
      (tools/recipe.py:105-122) walks up looking for .git or a
      .hakoniwa-repository-root file before falling back to the package
      location. In the package, the three sibling repositories carry a
      .hakoniwa-repository-root file but the hakoniwa-business-pack directory,
      which holds the Recipes, carries neither marker. In an earlier run whose
      package (the harness ZIP) was extracted inside an unrelated git working
      tree, the doctor resolved the Recipe dependencies against that outer
      repository instead of the package.

