        Measured 2026-09-28/29. Sibling revisions: hakoniwa-envsim 0b02d6c,
        hakoniwa-pdu-javascript 1d98d4d, hakoniwa-pdu-python f3bb5d6.
    - description: >
        Two host-side steps were needed before configure passed, and they are
        unrelated to this candidate. CMake came from the Visual Studio
        installation by running inside VsDevCmd (getting-started-ja.md lists
        CMake as a prerequisite). core.longpaths=true was set for that one
        invocation through GIT_CONFIG_COUNT/KEY_0/VALUE_0 in the calling shell,
        for the known nlohmann/json fetch
        (endpoint-nlohmann-fetch-exhausts-max-path-on-windows).

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - >-
      Whether the ZIP should keep the staging install.prefix in its Receipt is
      a maintainer call. The 2026-10-02 run found the archived Receipt still
      names <TEMP>\\hako-portable-<id>\\..., because the staged validation
      relocates it to staging before the archive is written. The entrypoint
      relocates it again before use, so the lifecycle is unaffected. A doctor
      run on a fresh extraction before the first start reports
      hakoniwa-pdu-endpoint INCOMPATIBLE on install.prefix.
  notes:
    - >-
      Measured on one Windows host. --keep-staging was run; it passed the source
      doctor but did not reach the staged doctor on this checkout depth,
      because the packager's own MAX_PATH guard stopped it ("staging path would
      be 261 characters").
    - >-
      The extraction budget the packager reports (61 characters here) was not
      probed. With LongPathsEnabled=1, Expand-Archive also extracted into an
      83-character folder, so the limit did not bind with that tool on this
      host. This held again at c4fac99. Tools without long-path support were
      not tried.
    - >-
      The urban-car-rc validator was not examined.
    - >-
      Two open questions from the first report were settled by #215 and are
      kept here for the record. Which mode the maintainer's packaging run used
      no longer matters, since both modes now isolate staging. On where the
      fixes belong, #215 did both: a shared portable_environment() for every
      validator, and Receipt relocation during staging and again at extraction.

