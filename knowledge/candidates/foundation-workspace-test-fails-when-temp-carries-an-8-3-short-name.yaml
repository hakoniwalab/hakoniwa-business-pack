id: foundation-workspace-test-fails-when-temp-carries-an-8-3-short-name
title: A Foundation workspace test fails on any Windows host whose TEMP carries an 8.3 short name

status: candidate

knowledge_type:
  - known_pitfall

summary: >
  tools/test_foundation.py passes 65 of its 66 tests on a native Windows
  workstation. The one failure,
  FoundationWorkspaceTest.test_resolve_workspace_accepts_symlinked_workdir_and_override,
  is a defect in the test rather than in resolve_workspace: its fixture creates
  a symlink whose target directory is never created, and on Windows
  Path.resolve() expands an 8.3 short component for a plain path but leaves it
  in place when resolving a symlink to a target that does not exist. The
  assertion then compares a long-form expected value against a short-form actual
  one. This bites whenever TEMP contains a shortened component, which is the
  default for any account whose user name exceeds eight characters. It cannot be
  seen from CI: the windows-latest job runs this same file, and its TMPDIR is
  D:\a\_temp, which has nothing to shorten.

observation:
  context: >
    Noticed while running the repository's own checks before submitting an
    unrelated documentation change, on Windows 11 x64 build 10.0.26200.9457 with
    Python 3.12.7, against a working tree whose tools/ directory is
    byte-identical to 6c645d0. The account name is eleven characters, so TEMP
    resolves to C:\Users\YUTAKI~1\AppData\Local\Temp.
  details:
    - >-
      The fixture at tools/test_foundation.py:155-166 creates
      base/"linked-work" as a symlink to base/"real-work" and never creates
      real-work itself, then sets HAKONIWA_WORK_DIR to the link and asserts
      paths.work_root == real_work.resolve().
    - >-
      On Windows the two sides of that comparison normalise differently.
      Measured in the same interpreter: real_work.resolve() returns
      C:\Users\YutaKikuchi\...\real-work, while link_work.resolve() returns
      C:\Users\YUTAKI~1\...\real-work as long as the target does not exist.
      Creating the target directory makes both return the long form. The code
      under test resolves through the link, so it produces the short form and
      the assertion fails on the user-name component alone.
    - >-
      This is a property of the fixture, not of resolve_workspace. Nothing in
      the product path depends on which spelling comes back, and the other 65
      tests in the file pass.
    - >-
      The condition is a shortened TEMP, not a symlink permission or a
      developer-mode setting. Re-running only this test with TMP and TEMP
      pointed at a long path, changing nothing else, turns it green.
    - >-
      The windows-latest job in .github/workflows/validate-business-pack.yml
      runs "python -m unittest tools/test_foundation.py -v", so the test is
      executed on every PR. It stays green because the runner's temporary
      directory is D:\a\_temp. A contributor on an ordinary Windows workstation
      sees a red suite that CI says is green, which is the kind of divergence
      that costs an afternoon before it is attributed to the environment.

sources:
  repositories:
    - repository: hakoniwalab/hakoniwa-business-pack
      path: tools/test_foundation.py
      revision: 6c645d0
    - repository: hakoniwalab/hakoniwa-business-pack
      path: .github/workflows/validate-business-pack.yml
      revision: 6c645d0
  runtime_evidence:
    - description: >
        Windows 11 x64 build 10.0.26200.9457 on 2026-09-22, TEMP =
        C:\Users\YUTAKI~1\AppData\Local\Temp: "python -m unittest
        tools/test_foundation.py" reported "Ran 66 tests", "FAILED
        (failures=1)", with
        "AssertionError: WindowsPath('C:/Users/YUTAKI~1/AppData/Local/Temp/tmpy7wfjq70/real-work')
        != WindowsPath('C:/Users/YutaKikuchi/AppData/Local/Temp/tmpy7wfjq70/real-work')"
        at tools/test_foundation.py:165.
    - description: >
        Same command restricted to that test, run twice in the same shell with
        only TMP and TEMP changed: with the inherited
        C:\Users\YUTAKI~1\AppData\Local\Temp it reported "FAILED (failures=1)",
        and with TMP and TEMP set to a path containing no shortened component it
        reported "OK".
    - description: >
        Mechanism probe in one interpreter, reproducing the fixture: tempdir
        C:\Users\YUTAKI~1\AppData\Local\Temp\tmpg2ahqtwy, resolve_workspace
        returned ...\YUTAKI~1\...\real-work, real_work.resolve() returned
        ...\YutaKikuchi\...\real-work, link_work.resolve() returned
        ...\YUTAKI~1\...\real-work while the target did not exist, and after
        creating the target both resolve() calls returned the long form.
    - description: >
        The windows-latest job of the run for pull request 206 (run
        35677268896, job 106586301362) logs "TMPDIR: D:\a\_temp", so the
        shortened component the failure depends on is absent on the runner.

confidence: high

contradictions: []

validation:
  status: verified
  required: []
  notes:
    - >-
      Measured on one Windows 11 x64 host on 2026-09-22. The A/B differed only
      in TMP and TEMP, and the mechanism was reproduced directly rather than
      inferred from the assertion message.
    - >-
      Not applicable on macOS or Linux, which have no 8.3 short names.
    - >-
      Not reproduced on a second Windows host, so "any account whose user name
      exceeds eight characters" is the documented Windows rule for 8.3
      generation rather than something measured across machines. 8.3 creation
      can also be disabled per volume, in which case the failure disappears.

