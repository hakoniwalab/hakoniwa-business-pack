      notes:
        - >-
          Generating a field-less type and importing the result would catch this in one
          assertion. Generation success alone does not, because generation does succeed.

promotion_rationale:
  - >-
    It blocks the documented first step for bringing up any new Action, and the failure
    appears only at import time, after generation has reported success.

