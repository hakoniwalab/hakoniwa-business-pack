validation:
  status: verified
  required: []
  notes:
    - The original failure and local workaround were independently converted into upstream issue #2 and fixed at revision e0c2720842e84a6ca545f438f649a7b161296a69.
    - Native Docker tests compare actual sequence values after ROS message to PDU binary to ROS message round trips; they do not merely check non-emptiness.
    - numpy.ndarray remains outside the documented rclpy primitive-sequence contract and is not required to resolve this finding.

