  runtime_evidence:
    - description: >-
        External contributor's WSL2 Ubuntu 24.04 / ROS 2 Jazzy environment plus a native
        Windows 11 x86_64 peer, 2026-07-30/31. Before the patch, a real rclpy JointState
        arrived with name populated and position/velocity/effort empty. A field-by-field
        probe covered JointState.position, LaserScan.ranges and Float64MultiArray.data.
        After the patch, the same bridge delivered 1222 and 1185 PDUs across two runs with
        all numeric arrays populated and their element counts equal to the joint-name count.
  expert_input: []

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - Decide whether numpy.ndarray should be accepted in the same branch. rclpy can be
      configured to return numpy arrays, and that representation is neither list, tuple nor
      array.array, so it would fail the same way. Not measured here.
    - Confirm whether upstream wants a warning when an unrecognized sequence type reaches
      the final else branch. Silent skipping is what turned a data-loss bug into a
      partial-success illusion.
    - Add at least one test that uses real rclpy message types. The fake-class suite is
      fast but structurally incapable of catching this class of defect.
  notes:
    - Verified on one machine, one RMW implementation, one Jazzy release, with three field
      types probed directly plus an end-to-end cross-OS confirmation after the fix.

tracking:
  implementation_status: none
  issues: []

promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-pdu-ros
      kind: test
      path: test/test_type_mapper.py
      mode: detect-only
      notes:
        - A test built on fake message classes cannot observe the representation real rclpy
          actually uses. One real-rclpy round trip per verified type would have failed
          before this patch and would keep failing if the branch regresses.

promotion_rationale:
  - The defect silently destroys the numeric content of the very message types the README
    advertises as verified, so the correction belongs in the owning repository rather than
    in a Recipe or a catalog note.
  - The guardrail is proposed against the test suite because the one-line source fix is
    trivial while the reason it went unnoticed is structural.

resolution:
  status: pending
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - Diagnosis, patch and end-to-end confirmation only; no upstream issue filed, since
      issue filing for implementation work is owned by the upstream maintainers.
    - The patch lives in the external contributor's workspace as
      0001-type_mapper-accept-array-array.patch and is applied to a clone before install,
      so the vendored checkout stays restorable with git apply.
