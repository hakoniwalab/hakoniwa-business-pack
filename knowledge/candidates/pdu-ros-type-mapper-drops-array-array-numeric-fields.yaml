id: pdu-ros-type-mapper-drops-array-array-numeric-fields
title: hakoniwa-pdu-ros silently drops every numeric array because rclpy stores sequence<double> as array.array, and its own tests cannot catch it
status: candidate

knowledge_type:
  - known_pitfall
  - validation_rule

summary: >
  hakoniwa-pdu-ros's type_mapper copies a ROS message field into a generated PDU type by
  branching on `isinstance(src_value, (list, tuple))`. Real rclpy messages store
  `sequence<double>` and similar primitive sequences as `array.array`, which is neither a
  list nor a tuple, so the value falls through to the struct-field branch, recurses into an
  object that has no fields, and produces nothing. No exception, no log, no warning. A
  `sensor_msgs/JointState` therefore crosses the bridge with `name` intact
  (`sequence<string>` IS a plain list in rclpy) and `position`, `velocity` and `effort`
  empty. The partial survival is what makes it hard to spot. The repository's own
  `test/test_type_mapper.py` injects fake ROS message classes whose fields are plain
  Python lists, so the array.array path is never exercised, which means the README's
  "Verified" list of PointCloud2 / JointState / LaserScan / CameraInfo /
  Float64MultiArray is verified only against those fakes. The fix measured here is one
  line plus an import.

observation:
  context: >
    Building the first Tobas (ROS 2 Jazzy) to Hakoniwa PDU bridge prototype named in
    hakoniwa-business-pack's Tobas catalog entry, on WSL2 Ubuntu 24.04 with
    RMW_IMPLEMENTATION=rmw_cyclonedds_cpp, bridging `sensor_msgs/JointState` from Tobas to
    a Hakoniwa PDU channel and decoding it on a native Windows 11 peer, 2026-07-30/31.
  details:
    - "Symptom. Passing a real rclpy sensor_msgs/JointState through the bridge produced
      `bytes=448 name=['rotor_0_joint', 'rotor_1_joint'] position=[] velocity=[] effort=[]`.
      The payload was the right size and the string array survived; only the numeric arrays
      were empty, and nothing was logged."
    - "Mechanism. hakoniwa_pdu_ros/type_mapper.py (line 77 before the patch) reads
      `elif isinstance(src_value, (list, tuple)): setattr(dst, name, _copy_list(...))`.
      Measured on this machine, `JointState.position` is an `array.array('d', [...])`,
      so the branch is skipped and the trailing `else` treats the value as a struct and
      calls _copy_matching_fields on it. array.array exposes no message fields, so the
      recursion completes having copied nothing."
    - "Why only the numbers vanish. `JointState.name` is `sequence<string>`, which rclpy
      keeps as a plain Python list, so it takes the list branch and arrives correctly. Any
      reader who checks that names came through concludes the bridge works."
    - "Blast radius, measured field by field. array.array representations that were dropped
      before the patch and correct after it: JointState.position ([] -> [0.1, 0.2]),
      LaserScan.ranges ([] -> [1.0, 2.0, 3.0]), Float64MultiArray.data
      ([] -> [1.5, 2.5, 3.5]). JointState.name (a list) was correct both times. So nearly
      every type on the README's Verified list loses its numeric payload in a real ROS
      process."
    - "Why upstream CI is blind to it. test/test_type_mapper.py calls
      _install_fake_ros_modules() and asserts against fake message classes whose sequence
      fields are plain lists. The array.array path never runs, so the suite can pass while
      the component drops all numeric data against real rclpy."
    - "Fix. One line, plus `import array`:
      `elif isinstance(src_value, (list, tuple, array.array)):`. After applying it, every
      row of the table above round-trips as expected."
    - "Not fixable from the ROS side. Reassigning `msg.position = list(...)` before sending
      does not help, because the rclpy setter converts it back to array.array. The change
      has to be inside type_mapper."
    - "Confirmed end to end across an OS boundary after the patch. With the patched bridge
      on WSL and an independent Windows peer decoding the received PDUs, two consecutive
      runs delivered 1222 and 1185 JointState PDUs, every one with a non-empty position
      array, values matching the sender's known sin/cos waveform, and effort holding its
      constant [0.1, 0.2, 0.3, 0.4]."

