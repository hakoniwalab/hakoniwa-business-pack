promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-pdu-ros
      kind: test
      path: test/test_type_mapper.py
      mode: detect-only
      notes:
        - A test built only on fake list-backed fields cannot observe the representation real rclpy uses. Include `array.array` or a real-rclpy round trip and compare element values.

promotion_rationale:
  - The defect silently destroys numeric content in message types advertised as verified, so the correction belongs in the owning repository.
  - The guardrail belongs in the component test suite because the source fix is small while the reason it escaped is structural.

