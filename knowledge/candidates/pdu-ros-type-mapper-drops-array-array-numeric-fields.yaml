id: pdu-ros-type-mapper-drops-array-array-numeric-fields
title: hakoniwa-pdu-ros silently dropped numeric primitive sequences because rclpy stores them as array.array
status: promoted

knowledge_type:
  - known_pitfall
  - validation_rule

summary: >
  Before hakoniwa-pdu-ros issue #2 was fixed, type_mapper recognized only list and tuple
  values as sequences. Real rclpy messages store primitive sequences such as
  JointState.position, JointState.velocity, JointState.effort, LaserScan.ranges, and
  Float64MultiArray.data as array.array, so those fields could be silently lost while
  sequence<string> fields survived. The upstream mapper now accepts array.array and rejects
  unsupported sequence representations explicitly. Docker-based native ROS 2 Jazzy tests
  using CycloneDDS verify value-preserving round trips with real rclpy message classes.

observation:
  context: >
    Building the first Tobas (ROS 2 Jazzy) to Hakoniwa PDU bridge prototype named in
    hakoniwa-business-pack's Tobas catalog entry, on WSL2 Ubuntu 24.04 with
    RMW_IMPLEMENTATION=rmw_cyclonedds_cpp, bridging sensor_msgs/JointState from Tobas to
    a Hakoniwa PDU channel and decoding it on a native Windows 11 peer, 2026-07-30/31.
  details:
    - "Symptom. Passing a real rclpy sensor_msgs/JointState through the bridge produced bytes=448 with name populated and position, velocity, and effort empty."
    - "Mechanism. The original mapper checked isinstance(src_value, (list, tuple)); rclpy primitive sequences are array.array and fell through to struct handling."
    - "JointState.name remained visible because rclpy represents sequence<string> as a normal Python list."
    - "A local array.array patch restored JointState.position, LaserScan.ranges, and Float64MultiArray.data before the upstream fix was applied."
    - "Two contributor end-to-end runs after the local patch delivered 1222 and 1185 JointState PDUs with expected numeric values."
    - "The original fake message tests used list-backed fields and could not observe the real rclpy representation."

