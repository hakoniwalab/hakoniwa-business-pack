      revision: 8693f4d82a61765feb990754459427a287347bb3
    - repository: hakoniwalab/hakoniwa-pdu-ros
      path: test/test_type_mapper.py
      revision: 8693f4d82a61765feb990754459427a287347bb3
  runtime_evidence:
    - description: >-
        External contributor's WSL2 Ubuntu 24.04 / ROS 2 Jazzy environment plus a native
        Windows 11 x86_64 peer, 2026-07-30/31. Before the patch, a real rclpy JointState
        arrived with name populated and position/velocity/effort empty. After the patch,
        two runs delivered 1222 and 1185 PDUs with the expected numeric values.
  expert_input: []

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - Decide whether numpy.ndarray should be accepted in the same branch. It was not measured here.
    - Decide whether an unrecognized sequence-like type should produce a warning or explicit error rather than silent data loss.
    - Add a test that uses `array.array` or real rclpy message types and compares values rather than non-emptiness.
  notes:
    - Verified on one machine, one RMW implementation, and one Jazzy release, with three numeric sequence fields probed plus an end-to-end confirmation.

tracking:
