id: drone-native-runtime-windows-distribution-is-published-but-unclaimed
title: The Windows native Drone distribution is published but unclaimed by the native runtime contract
status: candidate

knowledge_type:
  - interface_contract
  - known_pitfall
  - validation_rule

summary: >
  Drone Core v4.0.0 publishes win.zip in the same release, under the same naming
  convention, and through the same publication flow as lnx.zip and mac.zip, and
  the Catalog already lists Windows as a supported platform. The
  native_runtime profile, however, declares only linux and macos, and the Recipe
  refuses Windows at its entry point. Measuring the published Windows artifacts
  shows the profile is almost mechanically fillable: the archive ships 7 of the
  8 executables its siblings ship, and the PE import tables give a concrete
  Windows dependency set that maps one-to-one onto the existing linux and macos
  fields. Exactly one upstream packaging gap blocks the profile, and it is not
  the PE dependency inspector the Runtime Primer already anticipates.

observation:
  context: >
    Windows validation of Business Pack main at revision b2eff65, comparing the
    three published Drone Core v4.0.0 archives against the Catalog native
    runtime profile and the Recipe's Windows branches.
  details:
    - The Catalog lists Windows first under platforms.supported, while native_runtime.profiles.public-v4.0.0.platforms declares only linux and macos.
    - The shared schema already admits the missing values; schemas/native-runtime.yaml enumerates platforms [linux, macos, windows] and dependency_inspectors [elf, macho, pe].
    - The Runtime Primer already anticipates the inspector itself, describing delegation to "an ELF, Mach-O, or future PE adapter", so the inspector is declared future work rather than an oversight.
    - win.zip is published in the same v4.0.0 release as lnx.zip and mac.zip, and the recorded sha256 of lnx.zip and mac.zip match the values pinned in the Recipe's PUBLIC_DRONE_ARCHIVES exactly, establishing that all three archives come from one publication flow.
    - win.zip ships 7 executables; lnx.zip and mac.zip ship 8 each. Comparing basenames with the OS prefix removed, the only artifact absent on Windows is drone_visual_state_publisher.
    - That single missing artifact is a required binary_role in both existing platform profiles, and the Recipe already names win/win-drone_visual_state_publisher.exe in visual_state_publisher_candidates.
    - The other Windows binary role is present and correctly named; win/win-main_hako_drone_service.exe exists and matches binary_candidates' Windows branch.
    - PE import inspection of win-main_hako_drone_service.exe lists KERNEL32.dll, MSVCP140.dll, OPENGL32.dll, VCRUNTIME140.dll, VCRUNTIME140_1.dll, glfw3.dll, mujoco.dll and eleven api-ms-win-crt-* API sets.
    - On a Windows host with the Visual C++ redistributable already present, glfw3.dll and mujoco.dll are the only imports that resolve from nowhere at all; they are absent from the archive, from System32, and from PATH.
    - Those two are the Windows counterparts of the values the existing profiles already declare, namely required_libraries libglfw.so.3 / libglfw.3.dylib and the mujoco managed runtime.
    - The Recipe gates Windows before any of this is reachable, since SUPPORTED_NATIVE_SYSTEMS is ("Darwin", "Linux") and _mujoco_asset has no Windows branch, so a Windows run fails at prepare-native rather than at dependency inspection.
    - Recipe code below that gate is already Windows-aware, including .exe suffixes, Scripts/python.exe resolution, and selecting PATH rather than LD_LIBRARY_PATH as the native library environment variable a PE inspector would need to honour.

