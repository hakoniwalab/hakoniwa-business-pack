  notes:
    - Diagnosis and workaround only (PATH-ordering workaround, not a script fix); no
      upstream issue filed, no PR exists yet. Recorded as candidate material for an
      upstream issue against hakoniwa-mujoco-robots' prepare-model.bash (and any sibling
      scripts sharing the same venv-resolution pattern, which were not individually
      audited in this session). The issue should frame the ask as bringing
      prepare-model.bash into conformance with the interpreter-selection contract
      hakoniwa-business-pack's own runtime primer already documents (revision 50681d5),
      not solely as a POSIX-vs-Windows venv-layout portability fix.
    - The workspace-side workaround used in this session (placing the venv's Scripts/
      directory on PATH ahead of other Python installations, alongside the companion
      candidate's python3 shim) is not the fix being proposed upstream; it relies on
      PATH ordering rather than the script explicitly selecting Python 3.12, honoring
      `HAKO_PYTHON`/`PYTHON_CMD`, or failing fast on a wrong-version interpreter, so it
      does not by itself satisfy the primer's contract.
