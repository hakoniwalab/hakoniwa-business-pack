id: mujoco-robots-prepare-model-venv-layout-windows
title: hakoniwa-mujoco-robots' prepare-model.bash only recognizes the POSIX venv layout (.venv/bin/python), not Windows' .venv/Scripts/python.exe
status: candidate

knowledge_type:
  - known_pitfall
  - validation_rule

summary: >
  examples/actuators/shadow_hand/prepare-model.bash resolves its Python interpreter by
  checking for a fixed POSIX venv path (.venv/bin/python) and does not check the
  Windows venv layout (.venv/Scripts/python.exe). On a venv created by Windows Python
  (`python -m venv .venv`), .venv/bin/ does not exist at all, so this check silently
  fails to find the venv interpreter it was clearly written to prefer. This did not
  block the 2026-07-26 re-verification outright (the script apparently falls through to
  some other interpreter resolution rather than hard-erroring), but it meant the venv's
  own installed dependencies (e.g. pyyaml) were not reliably picked up unless the venv's
  Scripts/ directory was also placed on PATH ahead of other Python installations as a
  workaround.

observation:
  context: >
    Re-verifying the Shadow Hand forge flow on an external contributor's native Windows 11
    x86_64 workspace (Git Bash, no WSL/Docker), 2026-07-26, at hakoniwa-mujoco-robots
    revision 1abffe415e15635503a46de2d2c50b246ca52545, using the hakoniwa-mbody-registry
    submodule's own venv at thirdparty/hakoniwa-mbody-registry/.venv, which on this
    machine contains python.exe and pythonw.exe directly under
    thirdparty/hakoniwa-mbody-registry/.venv/Scripts/ (the standard Windows venv layout)
    and has no bin/ subdirectory at all.
  details:
    - "examples/actuators/shadow_hand/prepare-model.bash (per this workspace's reading of
      the script, around line 18) checks for an interpreter at a hardcoded
      `.venv/bin/python` relative path before falling back to some other resolution; this
      check is POSIX-layout-specific (Python venvs on Linux/macOS place the interpreter
      under bin/, while Python venvs created by a Windows Python install place it under
      Scripts/ as python.exe, pythonw.exe -- there is no bin/ directory in a Windows venv
      at all)."
    - "Confirmed on this machine: `thirdparty/hakoniwa-mbody-registry/.venv` contains only
      a Scripts/ subdirectory with python.exe and pythonw.exe (no python3, matching the
      companion candidate's finding that no bare python3 executable exists in this venv
      either) -- there is no bin/ directory for the .venv/bin/python check to find under
      any circumstance on this machine, so that branch of prepare-model.bash's
      interpreter resolution can never succeed here."
    - "Practical effect observed this session: prepare-model.bash's own venv-python check
      does not hard-fail the script outright (unlike the sibling forge.sh python3 stub
      issue, which does produce a hard failure) -- the script proceeds to invoke
      tools/forge.sh regardless. However, reaching a fully working forge run in this
      session still required placing thirdparty/hakoniwa-mbody-registry/.venv/Scripts/ on
      PATH explicitly (alongside the separate python3->python shim recorded in the
      companion mbody-registry-forge-sh-python3-hardcoded-windows.yaml candidate), so that
      whichever interpreter ended up being invoked actually had this venv's installed
      packages (e.g. pyyaml, required by forge.sh's own inline python3 heredocs) available
      -- without that, package-import failures inside forge.sh's heredocs would be the
      next likely failure mode on a machine whose system/global Python lacks pyyaml."
    - "This is a Windows-shell-layout gap in hakoniwa-mujoco-robots' own
      prepare-model.bash wrapper script (not in hakoniwa-mbody-registry's forge.sh, which
      is the subject of the separate companion candidate above), and is worth checking for
      in any other *-model.bash / setup script in this repository that resolves a venv
      interpreter by a hardcoded relative path."

