      kind: doctor
      path: examples/actuators/shadow_hand/prepare-model.bash
      mode: detect-only
      notes:
        - No existing check in prepare-model.bash distinguishes a POSIX venv layout from
          a Windows venv layout; a doctor-style check that tries both
          .venv/bin/python and .venv/Scripts/python.exe (or uses a portable resolution
          such as `python -c "import sys; print(sys.executable)"` run through whatever
          activation mechanism is appropriate per OS) would make this gap detectable
          without relying on PATH ordering as a workaround.

promotion_rationale:
  - This is a reusable, general Windows-vs-POSIX venv layout gap that likely applies to
    any other *-model.bash-style setup script in hakoniwa-mujoco-robots that resolves a
    venv interpreter by a hardcoded relative path, not just Shadow Hand's own script.
  - Left as detect-only because no fix has been drafted or applied, and the exact
    fallback behavior when the POSIX check fails was not fully traced in this session
    (see validation.required above).

