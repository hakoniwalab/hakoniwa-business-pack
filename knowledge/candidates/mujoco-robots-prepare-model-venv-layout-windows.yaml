promotion_targets:
  catalog: []
  runtime_primer: false
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-mujoco-robots
      kind: doctor
      path: examples/actuators/shadow_hand/prepare-model.bash
      mode: detect-only
      notes:
        - No existing check in prepare-model.bash distinguishes a POSIX venv layout from
          a Windows venv layout, and per docs/hakoniwa-runtime-primer.md (revision
          50681d5) the intended behavior for a Hakoniwa Python launch wrapper is not
          merely "try both venv layouts" but the fuller interpreter contract -- select
          Python 3.12 explicitly, honor a `HAKO_PYTHON`/`PYTHON_CMD` override, and fail
          before any asset starts if the resolved interpreter is not 3.12 or cannot
          import the required packages. A doctor-style check that resolves the
          interpreter this way (via `HAKO_PYTHON`/`PYTHON_CMD` first, falling back to a
          portable venv-python probe such as `python -c "import sys; print(sys.executable)"`
          run against both .venv/bin/python and .venv/Scripts/python.exe) and then
          verifies the 3.12 version and required imports before returning would close
          both the layout gap and the silent-fallback gap in one guardrail.

promotion_rationale:
  - This is a reusable, general Windows-vs-POSIX venv layout gap that likely applies to
    any other *-model.bash-style setup script in hakoniwa-mujoco-robots that resolves a
    venv interpreter by a hardcoded relative path, not just Shadow Hand's own script.
  - Left as detect-only because no fix has been drafted or applied, and the exact
    fallback behavior when the POSIX check fails was not fully traced in this session
    (see validation.required above).
  - runtime_primer is left false rather than proposed as a new promotion target --
    docs/hakoniwa-runtime-primer.md (revision 50681d5) already documents the Python 3.12
    / `HAKO_PYTHON` / `PYTHON_CMD` / fail-before-launch contract that prepare-model.bash's
    venv probe falls short of. The gap is enforcement inside hakoniwa-mujoco-robots'
    own script, not missing primer content, so the promotion target is an executable
    guardrail against that repository rather than a docs change.

resolution:
  status: pending
  fixed_by: []
