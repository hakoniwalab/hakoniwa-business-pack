      revision: 1abffe415e15635503a46de2d2c50b246ca52545
    - repository: hakoniwalab/hakoniwa-business-pack
      path: docs/hakoniwa-runtime-primer.md
      revision: 50681d5bc5538b34a43c3a37346b92be3938088a
  runtime_evidence:
    - description: >-
        External contributor's Windows 11 x86_64 verification environment (native, Git
        Bash, upstream sources unmodified), 2026-07-26: confirmed
        thirdparty/hakoniwa-mbody-registry/.venv contains python.exe and pythonw.exe under
        Scripts/ only (no bin/ directory, no bare python3). The full prepare-model.bash ->
        forge.sh run only reached exit 0 once both the python3 shim (see companion
        candidate) and this venv's Scripts/ directory were placed on PATH.
  expert_input: []

confidence: medium

contradictions: []

validation:
  status: partially_verified
  required:
    - Directly re-read prepare-model.bash's exact interpreter-resolution logic (this
      candidate's citation of a hardcoded .venv/bin/python check around line 18 is based
      on this workspace's earlier reading of the script during the same 2026-07-26
      session, not independently re-confirmed line-by-line in this exact recording pass)
      to state precisely what the fallback path does when .venv/bin/python is absent,
      rather than inferring it only from the observed practical effect (script did not
      hard-fail, but still needed Scripts/ on PATH to behave correctly).
    - Determine whether adding a Windows-layout check (.venv/Scripts/python.exe) alongside
      the existing .venv/bin/python check in prepare-model.bash would be sufficient, or
      whether the script's downstream calls to forge.sh/fetch.py also need an explicit
      interpreter path passed through rather than relying on PATH order.
    - As of hakoniwa-business-pack revision 50681d5, docs/hakoniwa-runtime-primer.md
      states that a component-owned launch wrapper for a Hakoniwa Python workflow should
      select Python 3.12 explicitly, honor a documented interpreter override such as
      `HAKO_PYTHON`/`PYTHON_CMD`, and fail before starting assets when the selected
      interpreter is not Python 3.12 or cannot import the required packages.
      prepare-model.bash's current venv probe (a single hardcoded `.venv/bin/python`
      path check with a silent fall-through on failure, per this candidate's finding)
      satisfies none of these -- it does not check for Python 3.12 specifically, does not
      read any override variable, and does not fail -- it silently proceeds with
      whatever interpreter PATH order happens to select. Confirm with upstream whether
      the intended fix is adding just a `.venv/Scripts/python.exe` branch (portability
      fix only) or reworking the whole probe to implement the primer's fuller
      select-3.12 / respect-override / fail-fast contract, which would also subsume the
      POSIX-vs-Windows layout gap.
  notes:
    - "Confidence is medium rather than high because the precise mechanics of
      prepare-model.bash's fallback (what interpreter it actually ends up invoking when
      the .venv/bin/python check fails) were not independently re-traced in this pass --
      only the net observable effect (needed Scripts/ on PATH to get a fully working run)
      was confirmed by log evidence."

