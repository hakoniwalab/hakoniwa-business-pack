confidence: high

contradictions:
  - target: "Initial mental model: Python/cffi and Hakoniwa Core are effectively one build option"
    existing_claim: "The Windows actuator samples happened to use a pdu-endpoint DLL built with Hakoniwa Core enabled, making the two requirements appear coupled."
    new_evidence: "The manifest and CMake feature model show they are independent axes: Python/cffi requires a shared native library, while Hakoniwa Core is only required for SHM/Hakoniwa-time capabilities."
  - target: "Raspberry Pi requires a separate manual CMake recipe"
    existing_claim: "The original ARM64 report documented a long Raspberry Pi-specific sequence because the common build path did not yet encode all prerequisites and architecture assumptions."
    new_evidence: "The manifest resolver already models host architecture and independent features; the reusable fix is to harden that common flow and make unsupported prebuilt artifacts/preconditions explicit."
  - target: "ROS 2 + pdu-endpoint Zenoh should be fixed by LD_LIBRARY_PATH ordering"
    existing_claim: "The reporter could avoid the crash by placing pdu-endpoint's zenoh-c library before ROS 2's vendor library in LD_LIBRARY_PATH."
    new_evidence: "The stronger ownership boundary is to avoid a pdu-endpoint runtime dependency on libzenohc.so when using vendored zenoh-c, so loader search order is not part of the normal integration contract."

validation:
  status: verified
  required: []
  notes:
    - The original Windows problem and the manifest-driven PR #40 response are verified by external reproduction plus cross-platform CI.
    - The ARM64/ROS 2/Zenoh failure modes are based on a concrete third-party Raspberry Pi reproduction in issue #36 and source-level dependency analysis.
    - PR #41 adds executable CI coverage for shared pdu-endpoint + Zenoh and asserts that the resulting ELF does not declare libzenohc.so as a dynamic dependency.
    - Post-fix verification on the reporter's Raspberry Pi / ROS 2 Jazzy environment is still required before resolution.verified can become true.

