confidence: high

contradictions:
  - target: "Initial mental model: Python/cffi and Hakoniwa Core are effectively one build option"
    existing_claim: "The Windows actuator samples happened to use a pdu-endpoint DLL built with Hakoniwa Core enabled, making the two requirements appear coupled."
    new_evidence: "The build architecture and CMake feature model show they are independent axes: Python/cffi requires a shared native library, while Hakoniwa Core is only required for SHM/Hakoniwa-time capabilities. TCP/UDP/WebSocket/Storage and Zenoh/MQTT do not inherently require Core."

