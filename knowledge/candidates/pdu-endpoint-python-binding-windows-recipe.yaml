    - The durable upstream implementation is CI-verified on Linux, macOS, and Windows, including the existing Windows Python smoke job and the new three-OS manifest resolver tests.
    - Independent post-merge native-Windows reproduction by an external contributor remains the preferred evidence before setting resolution.verified=true.

