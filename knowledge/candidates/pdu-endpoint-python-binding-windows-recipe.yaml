id: pdu-endpoint-python-binding-windows-recipe
title: hakoniwa-pdu-endpoint Python/cffi build should be manifest-driven and independent from optional native capabilities
status: candidate

knowledge_type:
  - known_pitfall
  - runtime_rule
  - validation_rule
  - architecture_rule

summary: >
  The Windows reproduction originally exposed two hidden requirements around the
  hakoniwa-pdu-endpoint Python cffi binding: Visual Studio/setuptools discovery and
  dependent-DLL search paths. The durable fix generalized this beyond Windows into a
  manifest-driven cross-platform build architecture. Python/cffi is now treated as a
  language-binding axis, independent from Hakoniwa Core, Zenoh, and MQTT. Users declare
  intent in hakoniwa-build.yaml and use tools/hako.py doctor/configure/build/test; the
  configurator resolves shared-library requirements, optional native capabilities,
  toolchain discovery, and runtime library paths per platform. Hakoniwa Core remains
  optional and is needed only for SHM/Hakoniwa-time integration, not for TCP/UDP/
  WebSocket/Storage or Zenoh/MQTT by themselves.

observation:
  context: >
    Building the Python binding needed by the Go1 and Shadow Hand joint-actuator sample
    senders on an external native Windows 11 x86_64 workspace.
  details:
    - "The original native DLL was already buildable on Windows; the failure was not a missing Windows port. The problematic path was clean-environment Python/cffi build and import reproducibility."
    - "The external reproduction first hit missing cffi, then missing setuptools, then Visual Studio detection failure even with Visual Studio 2022 installed. setuptools' MSVC discovery needed vswhere.exe to be discoverable."
    - "After the cffi extension built, importing _c_endpoint_ffi still failed because transitive DLL locations such as Hakoniwa Core install-win/bin and vcpkg installed/x64-windows/bin were not registered with Python's Windows DLL search path."
    - "The immediate workaround used explicit os.add_dll_directory() calls plus a prepared Visual Studio environment. That workaround verified the root causes but was not the desired maintainer-level solution."
    - "The resulting architecture separates user intent from CMake/PowerShell/bash details. bindings.python controls cffi/shared-library behavior; features.hakoniwa_core, features.zenoh, and features.mqtt are independent optional native capability axes."
    - "The default manifest enables Python/cffi while keeping Hakoniwa Core, Zenoh, and MQTT disabled. This makes Python support a normal build result without coupling it to CORE PRO."
    - "tools/hako.py provides the same doctor/configure/build/test entry points on Windows, macOS, and Linux and writes .hako/resolved-build.yaml plus .hako/cmake-args.txt so issue reports can include the actual resolved configuration."
    - "On Windows, the configurator preflights cffi/setuptools, detects vswhere/MSVC, resolves optional vcpkg, derives native/Core/vcpkg runtime DLL directories, and exports HAKO_PDU_ENDPOINT_RUNTIME_DIRS. The Python package registers configured runtime directories before importing the cffi extension."
    - "The legacy build scripts and direct CMake path remain available for compatibility/advanced use; the manifest flow is the recommended user/developer entry point."

