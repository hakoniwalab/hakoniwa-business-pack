id: pdu-endpoint-python-binding-windows-recipe
title: hakoniwa-pdu-endpoint builds should remain manifest-driven across platforms and optional transport dependencies
status: candidate

knowledge_type:
  - known_pitfall
  - runtime_rule
  - validation_rule
  - architecture_rule

summary: >
  The original Windows Python/cffi failure led to a manifest-driven cross-platform build
  architecture in PR #40. A later Raspberry Pi / Ubuntu 24.04 / ROS 2 Jazzy report showed
  that the same architectural rule must extend to CPU architecture and optional transport
  dependencies rather than spawning platform-specific setup recipes. Python/cffi,
  Hakoniwa Core, Zenoh, and MQTT remain independent capability axes. ARM64 uses the same
  manifest flow, unsupported prebuilt artifacts must fail explicitly instead of silently
  assuming x86_64, and optional native dependencies should be resolved so that one
  ecosystem runtime does not accidentally load another runtime's ABI-incompatible shared
  library. Reproducible failure conditions should be promoted into doctor checks, tests,
  or CI rather than preserved only as troubleshooting prose.

observation:
  context: >
    The build architecture was first generalized from a native Windows Python/cffi
    reproduction. Issue #36 then reported real Raspberry Pi aarch64 integration findings
    while using Ubuntu 24.04, Python 3.12, ROS 2 Jazzy, and rmw_zenoh_cpp.
  details:
    - "The original Windows reproduction exposed hidden cffi/setuptools, Visual Studio/vswhere, and dependent-DLL search requirements. PR #40 converted those findings into the common hakoniwa-build.yaml + tools/hako.py doctor/configure/build/test flow."
    - "Python/cffi is a language-binding axis. Hakoniwa Core is independent and is required only for SHM or Hakoniwa time-source integration; TCP/UDP/WebSocket/Storage and Zenoh do not inherently require Core."
    - "Issue #36 showed that install-python.bash still assumed the Linux release artifact was x86_64. On aarch64 that should not degrade into downloading an incompatible bundle; it should select the same source-build manifest path and explain the missing prebuilt artifact."
    - "The manifest resolver already normalizes aarch64/arm64 as arm64, so Raspberry Pi should be treated as another host architecture under the same build model rather than as a separate build system."
    - "Issue #36 also showed that Zenoh source builds require cargo and rustc. When features.zenoh=true, that prerequisite is machine-detectable and belongs in doctor/configure preflight rather than only in a Raspberry Pi README."
    - "With BUILD_SHARED_LIBS=ON for Python/cffi, linking zenohc::lib can select shared zenoh-c. In a ROS 2 Jazzy process, another libzenohc.so from rmw_zenoh_cpp can then satisfy the loader dependency, creating an ABI collision that the reporter observed as stack smashing / segmentation fault."
    - "PR #41 therefore treats vendored zenoh-c as an implementation dependency and prefers zenohc::static. The intended invariant is that libhakoniwa_pdu_endpoint.so does not declare libzenohc.so as a dynamic NEEDED dependency."
    - "The previous hard-coded /usr/lib/x86_64-linux-gnu fallback is another architecture leak; platform-specific library discovery should use the resolved CMake library architecture rather than encode x86_64 in the common component logic."
    - "ROS 2 venv, rclpy, and colcon setup remains a hakoniwa-pdu-ros integration concern. pdu-endpoint owns its native/Python build and transport-runtime boundary and should not absorb higher-level ROS 2 workspace setup."
    - "The maintainer lesson is broader than Raspberry Pi: platform-specific observations should first be tested against the common manifest/capability model, and reusable failure conditions should become executable guardrails at the owning component boundary."

