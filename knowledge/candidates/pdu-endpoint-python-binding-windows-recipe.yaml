promotion_rationale:
  - The Python/Core/Zenoh/MQTT independence and manifest-driven build model are reusable component-level architecture knowledge.
  - CPU architecture belongs below the same resolver; Raspberry Pi should not create a parallel user-facing build architecture.
  - Optional transport prerequisites such as Rust are reproducibly detectable and should be executable guardrails.
  - Runtime dependency ownership is part of the component contract: avoid relying on process-global loader ordering when another ecosystem may ship a library with the same soname.
  - After Raspberry Pi re-verification, the pdu-endpoint Catalog should be refreshed so its operations/platform/dependency claims reflect the manifest flow rather than legacy raw-CMake defaults.

