    call is attempted, so this belongs with the runtime and component guidance rather
    than in a Recipe's own steps.

resolution:
  status: pending
  fixed_by: []
  verified: false
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      Filed upstream as hakoniwalab/hakoniwa-pdu-rpc#62, which covers the CFFI gap
      and mentions the ctest path gap as an adjacent item. Both were worked around
      externally -- an os.add_dll_directory call injected at interpreter start, and
      an explicit PATH for the C++ tests -- without patching either component.
