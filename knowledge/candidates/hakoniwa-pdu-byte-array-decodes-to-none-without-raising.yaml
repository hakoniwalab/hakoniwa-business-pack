  runtime_primer: true
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes: []
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-pdu
      kind: test
      mode: detect-only
      notes:
        - >-
          A unit test asserting that binToArrayValues('byte') either raises
          (matching typeTobin_array's behavior) or is removed from the
          generator's allowlist would close this gap at the source. Not
          authored here since it belongs in the owning repository's own test
          suite and this workspace has not yet executed the failing path
          itself to anchor a regression test on.

promotion_rationale:
  - >-
    Now that byte and char normalize to uint8 from 1.6.9 onward, the primer
    entry is a version note rather than a design rule: on 1.6.9 and later
    byte[] behaves correctly, and on earlier versions uint8[] is the
    substitution that avoids a silent decode failure. Recording the version
    boundary is what saves the next reader from either chasing the old bug or
    avoiding byte[] forever without reason.
  - >-
    No executable guardrail is authored in this candidate itself, since this
    workspace has not executed the failing path to anchor a regression test on
    it; the suggested guardrail is left as a note for the owning repository.

