promotion_rationale:
  - >-
    Anyone designing a new PDU type with a binary-blob-style array field could
    reasonably reach for ROS2's byte[] since it is accepted by the generator;
    steering them to uint8[] instead, with the wire-identical substitution
    explained, belongs in the runtime primer so this is learned before a field
    is designed rather than after a silent decode failure is chased down.
  - >-
    No executable guardrail is authored in this candidate itself, since this
    workspace has not executed the failing path to anchor a regression test on
    it; the suggested guardrail is left as a note for the owning repository.

