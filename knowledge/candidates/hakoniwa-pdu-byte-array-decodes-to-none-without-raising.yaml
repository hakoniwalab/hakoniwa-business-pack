  status: fixed
  fixed_by:
    - repository: hakoniwalab/hakoniwa-pdu-registry
      issue: 27
      pull_request: null
      revision: null
    - repository: hakoniwalab/hakoniwa-pdu-python
      issue: 54
      pull_request: null
      revision: null
  verified: true
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      Fixed upstream by normalizing byte and char to uint8 in all four
      conversion functions; released in pip hakoniwa-pdu 1.6.9.
      resolution.verified is true because this workspace re-ran the round trip
      on 1.6.9 and saw byte[], char[] and their scalar forms behave identically
      to uint8, having first reproduced the 1.6.7 failure in the same probe.
    - >-
      The uint8[] substitution used in case T36's
      MissionLikeItem/NestedBytesItem design is a workaround for the
      pre-1.6.9 behavior, not a permanent rule. Those types keep uint8[]
      because they are already generated and wire-identical, not because
      byte[] must be avoided going forward.
