  runtime_evidence:
    - description: >-
        External contributor's Windows 11 x86_64 verification environment (native
        PowerShell, external/ unmodified), 2026-07-30. Four multi-process configurations
        were torn down through a contract-ordered helper (request-to-close, bounded wait,
        escalate, report which path ended each process). Recorded termination paths:
        producer=forced, consumer=forced, tap=forced; producer=forced, limiter=forced,
        consumer=forced, tap=forced; producer_a=forced, producer_b=forced,
        aggregator=forced; sim=forced, route=already-exited; producer=forced,
        webserver=forced, ws_client=already-exited. No configuration ever produced a
        'graceful' outcome. taskkill exit code was 255 in every refused case. Post-exit
        verification (processes gone, ports released) passed in all five runs, and all
        five configuration verify scripts exited 0.
