validation:
  status: verified
  required:
    - Re-verify on native Windows using hakoniwa-pdu-python main after pull request 47 and
      exercise the new caller-facing sequence with `--background`, `status`, and `terminate`.
      Verify that the managed assets and Recipe-owned ports are gone afterwards.
    - Confirm the caller-facing commands are identical on Windows and POSIX and that no
      taskkill / CTRL_BREAK / PID-kill knowledge is required by the caller.
  notes:
    - The original observation is verified on one Windows machine. The replacement
      Launcher lifecycle implementation has Linux CI coverage and maintainer review, but
      this candidate remains with `resolution.verified` set to false until the contributor
      repeats the lifecycle test on native Windows.

