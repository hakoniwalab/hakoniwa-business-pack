promotion_rationale:
  - The reusable rule belongs in the Runtime Primer because background Launcher lifecycle
    should be expressed as the OS-independent `--background <session-file>` / `status` /
    `terminate` contract. Recipes and agents should not need to encode POSIX-vs-Windows
    signal mechanics.
  - Post-exit verification remains part of the cleanup contract. After `terminate`, verify
    that Launcher-owned assets and Recipe-owned ports are actually gone.
  - No separate executable guardrail is proposed here. The lifecycle interface and its
    tests live in hakoniwa-pdu-python; the Business Pack should consume and document that
    contract rather than duplicate process-control implementation.

