      refactored and hardened in pull request 47. The final caller-facing contract uses an
      explicit session file, a localhost control endpoint, ownership checks, and
      LauncherService.terminate().
    - Native Windows re-verification is still required before marking this resolution
      verified and promoting the contract into the Runtime Primer.
