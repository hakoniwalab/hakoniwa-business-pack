id: launcher-cleanup-contract-lacks-windows-normal-termination-path
title: The Launcher termination and cleanup contract defines a POSIX normal-termination path but leaves Windows undefined, and Windows offers no working request-to-close for console Python assets
status: candidate

knowledge_type:
  - known_pitfall
  - validation_rule

summary: >
  docs/hakoniwa-runtime-primer.md's "Launcher termination and cleanup contract" requires
  callers to invoke the Launcher's supported normal termination path before escalating to
  SIGTERM / process-group kill / SIGKILL, and gives a concrete POSIX recipe
  (`kill -INT <launcher-pid>`, Ctrl+C). It then explicitly forbids generalizing that recipe
  to Windows ("Use the console/Launcher termination mechanism documented for the provider
  and target environment") without documenting what that mechanism is. On native Windows
  there is currently no working request-to-close for the console Python asset processes
  this ecosystem starts: `taskkill /PID <pid> /T` (the documented Windows request-to-close)
  is refused outright, and a true SIGINT/SIGBREAK equivalent requires two things neither
  the contract nor the Python asset examples provide -- the process must be created in its
  own process group (CREATE_NEW_PROCESS_GROUP) and it must install a console control /
  SIGBREAK handler that runs Hakoniwa teardown. The practical consequence is that on
  Windows every conforming caller reaches the escalation branch on the FIRST attempt, so
  "escalated to force" stops being a signal that something went wrong.

observation:
  context: >
    Aligning an external contributor's Windows workspace teardown scripts with the
    Launcher cleanup contract added in hakoniwa-business-pack PR #59 (merge commit
    ed04582), on native Windows 11 x86_64, 2026-07-30. The workspace runs multi-asset
    configurations whose participants are Python processes started by PowerShell
    (Start-Process) plus native executables, torn down by a per-configuration
    stop-all.ps1.
  details:
    - "The contract's cross-platform requirement is stated as: invoke the launcher's
      supported normal termination path, then verify that its owned assets and ports are
      gone. Its worked example, its signal names (SIGINT/SIGTERM/SIGKILL), its
      anti-patterns (`kill <pid>`, `kill -- -<PGID>`, `kill -9`) and its process-group
      caveat are all POSIX. For Windows it states only what NOT to do (do not generalize
      `kill -INT`) and refers to 'the console/Launcher termination mechanism documented
      for the provider and target environment'. No such Windows mechanism is documented in
      the primer, and none was found elsewhere in the Business Pack at revision ed04582."
    - "Measured on Windows: issuing `taskkill.exe /PID <pid> /T` (no /F) against each
      running Python asset of a 3-party configuration returns exit code 255 with the
      message 'この処理は、/F オプションのみで強制終了できます' (this process can only be
      terminated forcefully). It is a definitive refusal, not a slow shutdown -- the
      process is still running immediately afterwards and remains running indefinitely.
      Reproduced for every Python participant across four separate configurations
      (producer/consumer/external tap, producer/limiter/consumer/tap, two producers plus
      aggregator, and a native simulator plus a Python route demo)."
    - "Why a real SIGINT equivalent is not simply available: on Windows the closest
      analogue is GenerateConsoleCtrlEvent(CTRL_BREAK_EVENT), which only reaches a target
      that was created with CREATE_NEW_PROCESS_GROUP. PowerShell's Start-Process does not
      expose that creation flag, and the caller-side workaround (FreeConsole + AttachConsole
      + SetConsoleCtrlHandler + GenerateConsoleCtrlEvent) destroys the console-control
      state of the harness process itself, which is not acceptable inside a verification
      script. Even if the signal were delivered, the asset side must install a handler for
      it: in this workspace only the RPC service/client assets handle KeyboardInterrupt at
      all, and the vendored C example (external/hakoniwa-core-pro/examples/hello_world)
      installs no console control handler."
    - "Net effect on a conforming implementation: a Windows caller that follows the
      contract's ordering will log 'requested close -> refused -> escalating to force' for
      100% of Python assets, on every teardown. The escalation branch, which the contract
      frames as an exception requiring caution, becomes the normal path. Without an
      explicit Windows statement in the contract, a reader cannot distinguish 'this
      Recipe's cleanup is broken' from 'this is simply what Windows does today'."
    - "What still works and is worth keeping: the contract's post-exit verification half is
      fully implementable on Windows. Confirming that each recorded PID is gone
      (Get-Process) and that Recipe-owned ports are released (Get-NetTCPConnection -State
      Listen) was implemented and passed in all four configurations, including the
      WebSocket port 8765 owned by hakoniwa-webserver in one of them."

sources:
  repositories:
    - repository: hakoniwalab/hakoniwa-business-pack
      path: docs/hakoniwa-runtime-primer.md
      revision: ed04582
  runtime_evidence:
    - description: >-
        External contributor's Windows 11 x86_64 verification environment (native
        PowerShell, external/ unmodified), 2026-07-30. Four multi-process configurations
        were torn down through a contract-ordered helper (request-to-close, bounded wait,
        escalate, report which path ended each process). Recorded termination paths:
        producer=forced, consumer=forced, tap=forced; producer=forced, limiter=forced,
        consumer=forced, tap=forced; producer_a=forced, producer_b=forced,
        aggregator=forced; sim=forced, route=already-exited; producer=forced,
        webserver=forced, ws_client=already-exited. No configuration ever produced a
        'graceful' outcome. taskkill exit code was 255 in every refused case. Post-exit
        verification (processes gone, ports released) passed in all five runs, and all
        five configuration verify scripts exited 0.
  expert_input: []

confidence: high

contradictions: []

validation:
  status: verified
  required:
    - Confirm with upstream what the intended Windows normal-termination mechanism is for
      the hakoniwa-pdu Launcher itself (as opposed to ad-hoc caller-started asset
      processes). This candidate measures the caller side only; the Launcher's own Windows
      shutdown path was not exercised, because this workspace composes assets directly
      rather than through the hakoniwa-pdu Launcher.
    - Determine whether upstream wants the Windows path defined at the contract level
      (a documented mechanism plus the corresponding asset-side obligation) or wants
      Windows callers to declare escalation-as-normal in each Recipe's demo.cleanup block.
    - Test whether a Launcher/asset pair that DOES create its children with
      CREATE_NEW_PROCESS_GROUP and installs a SIGBREAK handler can achieve a genuine
      graceful path on Windows. That combination was not built in this session; the claim
      here is only that neither piece exists today in the vendored examples or in
      PowerShell's Start-Process surface.
  notes:
    - Measured on one Windows machine, with Python assets started via PowerShell
      Start-Process and one native C++ simulator. Behavior of taskkill against a Python
      process that DOES install a console control handler was not measured, since no such
      asset exists in this workspace.

