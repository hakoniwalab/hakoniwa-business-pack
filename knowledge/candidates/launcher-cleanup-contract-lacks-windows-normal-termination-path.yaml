promotion_rationale:
  - The gap is in the contract text itself, which is why runtime_primer is the promotion
    target rather than any component repository. The contract already devotes a section to
    normal-vs-escalation ordering; what is missing is a Windows counterpart to the POSIX
    recipe, plus an explicit statement of the asset-side precondition (own process group
    plus console control handler) without which no Windows request-to-close can succeed.
  - Recording escalation-as-normal explicitly matters for the contract's own goal -- the
    primer asks readers to treat SIGTERM/SIGKILL as escalation paths and to be cautious
    about them. On Windows that caution currently fires on every teardown, which trains
    readers to ignore it.
  - No executable guardrail is proposed. A doctor-style check cannot repair a missing
    mechanism, and the workspace-side helper written for this verification (bounded
    request-to-close, immediate escalation on refusal, post-exit process/port
    verification) is a conformance shim, not a fix to propose upstream.

