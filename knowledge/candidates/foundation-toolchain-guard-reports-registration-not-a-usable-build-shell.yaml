  executable_guardrails: []

promotion_rationale:
  - >-
    The value here is evidence, not a defect. The upstream candidate's own
    record carries no transcript and no host identification, so a second host
    reproducing all three behaviours -- including the INCOMPATIBLE case, which
    the upstream record does not mention -- is what makes its verified status
    checkable by someone else.
  - >-
    The only change worth considering is wording. "Foundation toolchain
    SATISFIED" is read as a statement about the build environment by anyone who
    has just been told to register a toolchain, and the measurement above shows
    it is a statement about a registration. Naming the registration in that line
    would cost nothing and would stop the check from being credited with more
    than it does.

resolution:
  status: documented
  fixed_by: []
  verified: true
  promoted_to: []
  executable_guardrails: []
  notes:
    - >-
      Nothing is asked of the maintainers here beyond the optional wording
      change. The check behaves as its own candidate describes.
    - >-
      The host and the installed Foundation used for these runs are retained, so
      any change to this check can be re-measured on the affected configuration
      on request.
