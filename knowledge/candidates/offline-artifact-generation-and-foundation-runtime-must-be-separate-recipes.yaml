promotion_targets:
  catalog:
    - hakoniwa-core-pro
    - hakoniwa-pdu-python
  runtime_primer: true
  base_ecosystem_guide: false
  component_asset_guide: false
  recipes:
    - agilex-tracer-urdf-to-mujoco
    - agilex-tracer-hakoniwa-runtime
  executable_guardrails:
    - repository: hakoniwalab/hakoniwa-business-pack
      kind: validator
      path: recipes/tools/validate_recipes.rb
      mode: detect-and-suggest-remediation
      notes:
        - Detect runtime Foundation signals in an unclassified Recipe.
        - Enforce the managed install prefix and Foundation CPython 3.12 contract for hakopy Recipes.
    - repository: hakoniwalab/hakoniwa-business-pack
      kind: runtime-inspector
      path: tools/foundation.py
      mode: detect-only
      notes:
        - Reject missing Receipt metadata, SOABI mismatch, ambiguous native artifacts, and legacy untagged fallback before Recipe execution.

promotion_rationale:
  - The boundary belongs primarily in Recipe composition and validation rather than a component Catalog.
  - A validator can detect mixed or unclassified runtime requirements before users follow stale system-prefix instructions.

