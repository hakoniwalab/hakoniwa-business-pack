id: offline-artifact-generation-and-foundation-runtime-must-be-separate-recipes
title: Offline artifact generation and Foundation runtime validation must be separate Recipe contracts
status: validating

knowledge_type:
  - architectural_principle
  - usage_pattern
  - known_pitfall
  - validation_rule

summary: >
  A Recipe that combines offline model generation with a Core/SHM runtime demo
  cannot accurately express whether Foundation is required. Separate the
  artifact-generation Recipe from the managed runtime Recipe so each has one
  truthful environment, ownership, SOABI, and validation contract.

observation:
  context: >
    Auditing Foundation-unmanaged Recipes after the cross-platform TurtleBot3
    MBody validation exposed mixed responsibilities in the AgileX Tracer Recipe.
  details:
    - MBody source materialization and MJCF generation do not execute Core, SHM, hako-cmd, or hakopy.
    - The downstream Tracer Twist demo does execute all of those runtime facilities and requires Foundation Python 3.12 with matching SOABI evidence.
    - One Recipe previously described both stages, retained /usr/local/hakoniwa metadata, and could not truthfully be classified as Foundation-required or not-required.
    - Splitting the Recipe removed one legacy Foundation warning without imposing Core installation on the offline conversion workflow.
    - A managed hakopy runtime is identified by the Core Receipt, not by a guessed filename: binding_mode must be soabi, SOABI must match the Foundation interpreter, and exactly the declared tagged artifact may exist; legacy hakopy.so or hakopy.pyd fallback hides ABI incompatibility and is rejected.

sources:
  repositories:
    - repository: hakoniwalab/hakoniwa-business-pack
      path: recipes/examples/agilex-tracer-urdf-to-mujoco.yaml
      revision: working-tree-2026-08-11
    - repository: hakoniwalab/hakoniwa-business-pack
      path: recipes/examples/agilex-tracer-hakoniwa-runtime.yaml
      revision: working-tree-2026-08-11
    - repository: hakoniwalab/hakoniwa-business-pack
      path: tools/foundation.py
      revision: working-tree-2026-08-11
    - repository: hakoniwalab/hakoniwa-mujoco-robots
      path: examples/actuators/agilex_tracer/README.md
      revision: main-2026-08-11
  runtime_evidence:
    - description: Recipe validator warnings fell from four legacy runtime Recipes to three after the conversion/runtime boundary was made explicit.
    - description: The managed macOS lifecycle built and ran the split runtime Recipe with Foundation Python 3.12 and moved the Tracer from base.x 0.000 to 0.301.
    - description: Foundation contract tests reject a mismatched SOABI, a Receipt artifact inconsistent with EXT_SUFFIX, and an additional legacy untagged hakopy artifact.
  expert_input:
    - source: Hakoniwa maintainer
      statement: The MBody conversion is not TB3- or runtime-specific; dependencies and Recipe ownership should follow the repository and responsibility boundary.

confidence: high

contradictions:
  - target: recipes/examples/agilex-tracer-urdf-to-mujoco.yaml
    existing_claim: One Recipe can own both ROS-free model conversion and downstream Hakoniwa PDU runtime validation.
    new_evidence: The two stages require different Python, Foundation, shared-memory, artifact, and validation contracts.

validation:
  status: partially_verified
  required:
    - Verify the managed AgileX runtime Recipe lifecycle on native Linux and Windows.
    - Apply the same responsibility test to the remaining legacy Recipes.
  notes:
    - The schema split, validator classification, and native macOS runtime pass locally.

