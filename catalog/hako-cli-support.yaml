contract_version: "1.1"
description: >-
  Cross-component support matrix for the six standard tools/hako.py operations and
  the common manifest-selection option introduced in contract v1.1. The common
  --config contract standardizes how callers select a configuration source; manifest
  schema and other options remain repository-owned. This matrix is derived from the
  actual command dispatch implemented by each repository.

components:
  athrill-target-v850e2m:
    path: tools/hako.py
    common_options:
      - --config
    commands:
      doctor:
        supported: true
      configure:
        supported: true
        options:
          - --dry-run
      build:
        supported: true
        options:
          - --dry-run
      test:
        supported: true
      install:
        supported: true
      smoke:
        supported: true
    notes:
      - "The manifest selects the Athrill common source checkout, build directory, target features, validation, and Windows vcpkg root."
      - "On native Windows the CLI initializes MSVC and maps UNC workspaces before invoking CMake."

  hakoniwa-conductor-light:
    path: tools/hako.py
    common_options:
      - --config
    commands:
      doctor:
        supported: true
      configure:
        supported: true
        options:
          - --dry-run
      build:
        supported: true
        options:
          - --dry-run
      test:
        supported: true
        options:
          - --dry-run
      smoke:
        supported: true
        modes:
          - auto
          - manual
    notes:
      - "The selected build manifest owns Conductor Light build/component/validation settings."
      - "--dry-run is repository-owned and is intentionally rejected for smoke."
      - "smoke auto verifies dynamic attach and world-time progress; smoke manual also verifies start/stop/reset transitions."

  hakoniwa-pdu-endpoint:
    path: tools/hako.py
    common_options:
      - --config
    commands:
      doctor:
        supported: true
      configure:
        supported: true
        options:
          - --dry-run
      build:
        supported: true
        options:
          - --dry-run
      test:
        supported: true
        options:
          - --dry-run
    notes:
      - "configure/build/test are manifest-driven through hakoniwa-build.yaml or --config."
      - "--dry-run is a repository-owned modifier; its presence does not make dry-run a standard operation."
      - "test behavior follows validation flags in the resolved build manifest, including optional CTest and Python import validation."

  hakoniwa-pdu-bridge-core:
    path: tools/hako.py
    common_options:
      - --config
    commands:
      doctor:
        supported: true
      configure:
        supported: true
        options:
          - --dry-run
      build:
        supported: true
        options:
          - --dry-run
      test:
        supported: true
        options:
          - --dry-run
    notes:
      - "configure/build/test are manifest-driven through hakoniwa-build.yaml or --config."
      - "--dry-run is a repository-owned modifier; its presence does not make dry-run a standard operation."
      - "The validation.integration_tcp manifest flag is reserved; hako.py currently reports it as not implemented rather than claiming smoke coverage."

  hakoniwa-pdu-rpc:
    path: tools/hako.py
    common_options:
      - --config
    commands:
      doctor:
        supported: true
      configure:
        supported: true
        options:
          - --dry-run
      build:
        supported: true
      test:
        supported: true
      install:
        supported: true
    extensions:
      - test-basic
      - test-infinite-wait
      - test-timeout-cancel
      - test-cancel-race
      - package-test
    notes:
      - "The manifest is intentionally thin: build.type, build.dir, build.install_dir, and dependency paths are configurable while operation semantics remain code-owned."
      - "build keeps RPC tests disabled; test/test-* enable the reviewed test targets. Test execution is an operation, not a manifest on/off switch."
      - "Repository-owned overrides such as --build-dir, --install-dir, --build-type, --endpoint-root, and --vcpkg-root remain available."
      - "Specialized test commands and package-test are stable repository-owned extensions, not common contract operations."

  hakoniwa-mujoco-robots:
    path: tools/hako.py
    common_options:
      - --config
    commands:
      doctor:
        supported: true
        options:
          - --dry-run
      build:
        supported: true
        options:
          - --dry-run
    capabilities:
      - native-argument-passthrough
    notes:
      - "Manifest v1 intentionally exposes only build.dir; build.dir=auto preserves the existing platform-native default."
      - "The wrapper delegates to doctor.bash/build.bash on POSIX and build-win.ps1 on Windows."
      - "Arguments after -- are passed through to the platform-native script; viewer/toolchain/dependency options remain native-driver-owned."

  hakoniwa-core-pro:
    path: tools/hako.py
    common_options:
      - --config
    commands:
      doctor:
        supported: true
      build:
        supported: true
    capabilities:
      - native-argument-passthrough
    notes:
      - "The user-facing build manifest is validated by hako.py and adapted into the existing native build-default mechanism."
      - "Default manifest values reproduce the tracked native capacity defaults."
      - "build delegates to build.bash on POSIX and win-build.ps1 on Windows; native arguments remain available after --."
