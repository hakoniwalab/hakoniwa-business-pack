id: hakoniwa-pdu-ros
name: Hakoniwa PDU ROS
repository:
  owner: hakoniwalab
  name: hakoniwa-pdu-ros
  url: https://github.com/hakoniwalab/hakoniwa-pdu-ros
  visibility: public
distribution:
  channel: oss
  notes:
    - Public OSS Hakoniwa component for ROS 2 Topic, Service, and Action integration.
verification:
  verified_at: 2026-08-08
  source_revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80
  source_ref: main
summary: >-
  Configuration-driven ROS 2 integration for bidirectional Topic mapping plus
  Service and Action bridges in both directions. hakoniwa-pdu-ros owns ROS type
  mapping, Goal/Service semantic conversion, and executor integration while
  hakoniwa-pdu-rpc owns protocol lifecycle, correlation, generated runtime
  configuration, packet handling, and transport-facing state.
category:
  primary: communication
  secondary:
    - integration
    - bridge
    - ros2
    - language-binding
status:
  maturity: active
  catalog_confidence: high
  notes:
    - Topic mapping is verified by ROS 2 Jazzy native mapping and QoS tests.
    - Service Server and Service Client bridge directions are implemented and real-TCP tested.
    - Action Server and Action Client bridge directions are implemented and real-TCP tested with Fibonacci.
    - Native integration CI runs on relevant pull requests and pushes to main.
    - Business Pack orchestration recipes still need to be normalized for all four Service/Action directions.
capabilities:
  - name: Configuration-driven ROS 2 Topic Bridge
    description: Maps generated Hakoniwa PDU values and ROS 2 messages bidirectionally without per-message bridge code for supported mappings.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: README.md
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: test/native/test_native_mapping.py
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80

  - name: Runtime Topic type mapping and QoS
    description: Resolves generated PDU types, recursively maps standard ROS messages, supports binding-level QoS, and reports incompatibility.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: hakoniwa_pdu_ros/config_loader.py
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: test/native/test_native_qos.py
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80

  - name: ROS 2 Service Server Bridge
    description: Exposes a ROS 2 Service Server backed by typed Hakoniwa RPC clients, so ROS callers invoke Hakoniwa Service implementations.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: hakoniwa_pdu_ros/service_server_node.py
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: test/native/test_native_service_server_node.py
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80

  - name: ROS 2 Service Client Bridge
    description: Accepts Hakoniwa RPC requests through TypedRpcServer and calls external ROS 2 Service Servers asynchronously.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: hakoniwa_pdu_ros/service_client_node.py
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: test/native/test_native_service_client_node.py
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80

  - name: Direction-neutral Service Binding and generator adapter
    description: >-
      Uses one semantic Service Binding for both runtime directions. The ROS layer
      resolves ROS/PDU types and semantic heap requirements, then delegates channel,
      packet, Endpoint, and transport configuration generation to the installed
      hakoniwa-pdu-rpc generator.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: schema/service-binding.schema.json
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: hakoniwa_pdu_ros/service_config_generator.py
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80

  - name: ROS 2 Action Server Bridge
    description: Exposes a ROS 2 Action Server backed by typed Hakoniwa Action clients and maps Goal, Feedback, Cancel, and terminal Result semantics.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: hakoniwa_pdu_ros/action_server_node.py
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: test/native/test_native_action_server_node.py
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80

  - name: ROS 2 Action Client Bridge
    description: Accepts Hakoniwa Action Goals through TypedActionServer and drives external ROS 2 Action Servers while preserving Goal identity, Feedback, Cancel, and Result semantics.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: hakoniwa_pdu_ros/action_client_node.py
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: test/native/test_native_action_client_node.py
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80

  - name: Direction-neutral Action Binding
    description: Shares one Action Binding and generated Hakoniwa Action configuration between ROS-server and ROS-client bridge directions; the runtime entry point selects the ROS role.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: schema/action-binding.schema.json
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: task-action.md
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80

  - name: ROS 2 Jazzy native integration suite
    description: Docker-native tests exercise Topic/QoS and Service/Action integration over real CFFI/TCP against a pinned green hakoniwa-pdu-rpc revision.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: test/docker/run_native_tests.sh
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: .github/workflows/native-integration.yml
        revision: f17e1cc20b8ba52e36dc76376cf91093d7f8bd80
limitations:
  - Native Bridge execution requires Linux, Python, and ROS 2; current native evidence uses Ubuntu 24.04 and ROS 2 Jazzy.
  - Generated hakoniwa-pdu types and converters own binary layout; this component owns ROS semantic mapping and runtime adaptation.
  - Topic transport depends on hakoniwa-pdu-endpoint; Service and Action protocol lifecycle depends on hakoniwa-pdu-rpc.
  - Service Server concurrency uses a bounded RPC client pool; one RpcClient instance carries one in-flight Service request.
  - Business Pack-compliant doctor/configure/build/test/install/smoke operations are not yet normalized for this component.
  - Upstream E2E verification does not by itself prove every Business Pack host/container orchestration recipe.
interfaces:
  inputs:
    - name: Topic Binding config
      kind: config
      description: Maps PDU keys to ROS topics, directions, and optional QoS.
    - name: Topic Endpoint config
      kind: config
      description: Selects the hakoniwa-pdu-endpoint transport used by Topic mapping.
    - name: Service Binding config
      kind: config
      description: Direction-neutral mapping between ROS Services and Hakoniwa RPC Services.
    - name: Service Transport config
      kind: config
      description: Defines the TCP roles and addresses referenced by the Service Binding.
    - name: Action Binding config
      kind: config
      description: Direction-neutral mapping between ROS Actions and Hakoniwa Actions.
    - name: Action Transport config
      kind: config
      description: Defines the TCP roles and addresses referenced by the Action Binding.
    - name: ROS 2 messages, Service requests, or Action events
      kind: api
      description: ROS-facing inputs for the selected bridge runtime direction.
    - name: Typed Hakoniwa Service or Action events
      kind: api
      description: Typed PDU-RPC inputs for reverse Service and Action directions.
  outputs:
    - name: ROS 2 Topic messages
      kind: api
      description: Messages published from Hakoniwa PDU values.
    - name: ROS 2 Service responses and Action events
      kind: api
      description: ROS responses, Goal decisions, Feedback, Cancel results, and terminal Results produced by reverse bridges.
    - name: Typed Hakoniwa Service and Action operations
      kind: api
      description: Typed RPC/Action calls emitted toward Hakoniwa runtimes by ROS-facing server bridges.
    - name: Generated PDU-RPC runtime configs
      kind: config
      description: Matching runtime configuration generated through the installed PDU-RPC generator boundary.
  protocols:
    - name: ROS 2 topics
      role: pubsub
      notes: Bidirectional or one-way Topic mapping.
    - name: ROS 2 services
      role: server
      notes: Service Server Bridge for ROS client -> Hakoniwa server.
    - name: ROS 2 services
      role: client
      notes: Service Client Bridge for Hakoniwa client -> ROS server.
    - name: ROS 2 actions
      role: server
      notes: Action Server Bridge for ROS Action client -> Hakoniwa Action server.
    - name: ROS 2 actions
      role: client
      notes: Action Client Bridge for Hakoniwa Action client -> ROS Action server.
    - name: Hakoniwa PDU-RPC
      role: client
      notes: Used by ROS-facing Service/Action server bridges.
    - name: Hakoniwa PDU-RPC
      role: server
      notes: Used by reverse Service/Action client bridges through typed server APIs.
  configuration:
    - path: config/sample/sample_binding.json
      description: Topic Binding example.
    - path: schema/service-binding.schema.json
      description: Canonical direction-neutral Service Binding schema.
    - path: config/service/add_two_ints.json
      description: AddTwoInts direction-neutral Service Binding example.
    - path: config/service/add_two_ints-transport.json
      description: AddTwoInts Service transport example referenced by the Binding.
    - path: schema/action-binding.schema.json
      description: Canonical direction-neutral Action Binding schema.
    - path: config/action/fibonacci.json
      description: Fibonacci direction-neutral Action Binding example.
    - path: config/action/fibonacci-transport.json
      description: Fibonacci Action transport example referenced by the Binding.
dependencies:
  required:
    - name: ROS 2
      type: runtime
      notes: Provides rclpy, ROS message/Service/Action types, executors, and CLI tools.
    - name: Python
      type: runtime
      notes: Hosts bridge nodes, generated converters, and PDU-RPC bindings.
    - name: hakoniwa-pdu-endpoint
      type: repository
      notes: Provides lower-level transport used by Topic mapping and PDU-RPC.
    - name: hakoniwa-pdu-python
      type: package
      notes: Provides generated PDU Python types, offsets, and converters.
    - name: hakoniwa-pdu-registry
      type: repository
      notes: Defines generated Service and Action PDU artifacts.
    - name: hakoniwa-pdu-rpc
      type: repository
      notes: Provides Service/Action typed Client/Server APIs, lifecycle, routing, generators, cancellation, and TCP mux support.
  optional:
    - name: Zenoh backend
      type: runtime
      notes: Used by the Topic quick start when Zenoh transport is selected.
platforms:
  supported:
    - Linux
  notes:
    - Native Bridge runtime targets Ubuntu 24.04 / ROS 2 Jazzy.
    - Docker-capable macOS, Windows, and Linux hosts can participate through Business Pack host/container recipes.
connects_to:
  - component_id: hakoniwa-pdu-endpoint
    direction: uses
    interface: endpoint cache / communication backend
    notes: Topic and lower-level RPC transport remain in Endpoint.
  - component_id: hakoniwa-pdu-rpc
    direction: uses
    interface: typed Service/Action Client and Server APIs plus installed config generators
    notes: PDU-RPC owns protocol state, raw packet handling, Goal/request correlation, cancellation, routing, and generated runtime topology.
  - component_id: hakoniwa-pdu-python
    direction: uses
    interface: generated Python PDU types and converters
    notes: Binary layout stays in generated converters.
  - component_id: hakoniwa-pdu-registry
    direction: uses
    interface: generated PDU definitions and conventions
    notes: Service and Action mapping depend on generated Registry artifacts and offsets.
recipe_roles:
  - role: bridge
    description: Bridges ROS Topics, Services, and Actions to typed Hakoniwa PDU/RPC interfaces.
  - role: integration_boundary
    description: Defines configuration-driven ROS/Hakoniwa semantic boundaries without owning application logic.
  - role: communication_infrastructure
    description: Participates in exchange while delegating protocol state and transport to PDU-RPC/Endpoint.
typical_usecases:
  - Connect ROS 2 Topics to Hakoniwa PDU without per-message bridge code.
  - Expose a Hakoniwa Service as a ROS 2 Service Server.
  - Call an external ROS 2 Service Server from a Hakoniwa RPC Client.
  - Expose a Hakoniwa Action as a ROS 2 Action Server with Goal, Feedback, Cancel, and Result mapping.
  - Call an external ROS 2 Action Server from a Hakoniwa Action Client.
anti_usecases:
  - Reimplementing PDU-RPC packet headers, channel IDs, slot state, request correlation, or Action state machines in the ROS adapter.
  - Replacing hakoniwa-pdu-endpoint transport or generated PDU converters.
  - Treating upstream E2E success as proof of an unmaterialized Business Pack deployment topology.
demo_candidates:
  - name: AddTwoInts ROS 2 Service Server Bridge
    description: ROS Service Client calls a Hakoniwa AddTwoInts implementation through the Service Server Bridge.
    required_components: [hakoniwa-pdu-ros, hakoniwa-pdu-rpc, hakoniwa-pdu-endpoint, hakoniwa-pdu-python, hakoniwa-pdu-registry]
  - name: AddTwoInts ROS 2 Service Client Bridge
    description: Hakoniwa RPC Client calls an external ROS 2 AddTwoInts Service Server through the reverse bridge.
    required_components: [hakoniwa-pdu-ros, hakoniwa-pdu-rpc, hakoniwa-pdu-endpoint, hakoniwa-pdu-python, hakoniwa-pdu-registry]
  - name: Fibonacci ROS 2 Action Server Bridge
    description: ROS 2 Action Client drives a Hakoniwa Fibonacci Action Server with Feedback, Cancel, and Result.
    required_components: [hakoniwa-pdu-ros, hakoniwa-pdu-rpc, hakoniwa-pdu-endpoint, hakoniwa-pdu-python, hakoniwa-pdu-registry]
  - name: Fibonacci ROS 2 Action Client Bridge
    description: Hakoniwa Action Client drives an external ROS 2 Fibonacci Action Server through the reverse bridge.
    required_components: [hakoniwa-pdu-ros, hakoniwa-pdu-rpc, hakoniwa-pdu-endpoint, hakoniwa-pdu-python, hakoniwa-pdu-registry]
operations:
  build:
    commands:
      - colcon build
  test:
    commands:
      - pytest -q test --ignore=test/native
      - bash test/docker/run_native_tests.sh
  run:
    commands:
      - ros2 run hakoniwa_pdu_ros bridge --config config/sample/sample_binding.json
      - service-server --config config/service/add_two_ints.json --offset-dir <offset-dir> --rpc-library <shared-rpc-library>
      - service-client --config config/service/add_two_ints.json --offset-dir <offset-dir> --rpc-library <shared-rpc-library>
      - action-server --config config/action/fibonacci.json --output-dir <output-dir> --rpc-library <shared-rpc-library>
      - action-client --config config/action/fibonacci.json --output-dir <output-dir> --rpc-library <shared-rpc-library>
known_gaps:
  - Implement a manifest-driven Business Pack hako.py doctor/configure/build/test/install/smoke contract.
  - Keep the existing AddTwoInts host/Docker recipe as verified evidence and add normalized recipes for reverse Service plus both Action directions.
  - Validate each Business Pack orchestration independently on its declared host/container topology.
