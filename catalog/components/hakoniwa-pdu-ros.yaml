id: hakoniwa-pdu-ros
name: Hakoniwa PDU ROS
repository:
  owner: hakoniwalab
  name: hakoniwa-pdu-ros
  url: https://github.com/hakoniwalab/hakoniwa-pdu-ros
  visibility: public
distribution:
  channel: oss
  notes:
    - Public OSS Hakoniwa component for runtime PDU <-> ROS 2 Topic conversion and ROS 2 Service Server bridging.
verification:
  verified_at: 2026-08-02
  source_revision: 00e96da7797686a80826e2e266f56f16520a68a7
  source_ref: main
summary: Config-driven Python integration for bidirectional Hakoniwa PDU and ROS 2 Topic mapping plus ROS 2 Service Server to Hakoniwa PDU-RPC bridging, without application-specific bridge code for supported generated types.
category:
  primary: communication
  secondary:
    - integration
    - bridge
    - ros2
    - language-binding
status:
  maturity: active
  catalog_confidence: high
  notes:
    - Topic Bridge evidence comes from source contracts and Docker-native ROS 2 Jazzy tests.
    - Service Bridge evidence comes from completed Issue #10, real-TCP tests, and the manual AddTwoInts walkthrough.
    - Business Pack hako.py normalization and cross-platform host/Docker validation remain integration work.
capabilities:
  - name: Configuration-driven ROS 2 Topic Bridge
    description: Maps Hakoniwa PDU data and ROS 2 messages bidirectionally without per-type bridge implementation code.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: README.md
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
  - name: Runtime Topic type mapping and QoS
    description: Resolves generated PDU types, recursively maps standard ROS messages, supports binding-level QoS, and reports incompatibility.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: hakoniwa_pdu_ros/config_loader.py
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: test/native/test_native_mapping.py
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
  - name: ROS 2 Service Server Bridge
    description: Exposes configured ROS Service Servers backed by typed Hakoniwa RPC clients while service logic stays in the Hakoniwa Asset.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: hakoniwa_pdu_ros/service_server_node.py
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: docs/spec-server.md
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
  - name: Independent Service Binding and deterministic config generation
    description: Defines ROS/Hakoniwa Service identity, endpoints, max_clients, timeout, and heap, then generates matching RPC Server and Client configs from one model.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: schema/service-binding.schema.json
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: hakoniwa_pdu_ros/service_config_generator.py
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
  - name: Asynchronous per-service RPC client pool
    description: Uses max_clients TypedRpcClient instances, bridges call_async into rclpy Futures, and rejects overflow as BUSY without queueing.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: hakoniwa_pdu_ros/service_client_pool.py
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: hakoniwa_pdu_ros/service_server_node.py
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
  - name: Service deadline and shutdown lifecycle
    description: Uses PDU-RPC cancellation, rejects late results after the Bridge deadline, and closes active calls after terminal cleanup.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: test/native/test_native_service_server_node.py
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
  - name: Python RpcMuxServer fixture over real TCP
    description: Uses hakoniwa-pdu-rpc RpcMuxServer and tcp_mux so independent Bridge clients share one listener with request correlation.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: test/native/add_two_ints_rpc_fixture.py
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
      - repository: hakoniwalab/hakoniwalab-pdu-ros
        path: test/native/test_native_rpc_add_two_ints.py
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
  - name: Docker native Topic and Service suite
    description: Ubuntu 24.04 / ROS 2 Jazzy tests cover Topic mapping/QoS and AddTwoInts normal, parallel, BUSY, timeout, conversion-error, shutdown, and cleanup paths.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: test/docker/run_native_tests.sh
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: examples/service/README.md
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
limitations:
  - Native execution requires Linux, Python, and ROS 2; verified Service tests use Ubuntu 24.04 and ROS 2 Jazzy.
  - Generated hakoniwa-pdu converters own binary layout; this component owns mapping and wiring.
  - Topic transport depends on hakoniwa-pdu-endpoint; Service lifecycle and tcp_mux depend on hakoniwa-pdu-rpc.
  - Current Service direction is ROS Service Client -> Service Server Bridge -> Hakoniwa RPC Server; reverse direction is not implemented.
  - One RpcClient handles one in-flight request; concurrency comes from max_clients and overflow is rejected without queueing.
  - Variable-length heap E2E and explicit encoded-capacity overflow rejection remain follow-up work.
  - Business Pack-compliant doctor/configure/build/test/install/smoke operations are not implemented yet.
  - Cross-platform macOS, Windows, and Linux host/Docker Recipe evidence is not recorded yet.
interfaces:
  inputs:
    - name: Topic Binding config
      kind: config
      description: Maps PDU keys to ROS topics, directions, and optional QoS.
    - name: Topic Endpoint config
      kind: config
      description: Selects hakoniwa-pdu-endpoint transport.
    - name: ROS 2 Topic messages
      kind: api
      description: Messages received by Topic Bridge subscriptions.
    - name: Service Binding config
      kind: config
      description: Maps ROS Services to Hakoniwa RPC Services and declares endpoints, max_clients, timeout, and heap.
    - name: Service RPC Endpoint config
      kind: config
      description: Defines physical RPC client transport; environment-specific addresses belong to the Recipe.
    - name: ROS 2 Service requests
      kind: api
      description: Requests converted into generated PDU request bodies.
  outputs:
    - name: ROS 2 Topic messages
      kind: api
      description: Messages published from Hakoniwa PDU data.
    - name: Hakoniwa PDU payloads
      kind: pdu
      description: Topic data sent through Endpoint.
    - name: ROS 2 Service responses
      kind: api
      description: Responses converted from terminal Hakoniwa RPC results.
    - name: Generated PDU-RPC service configs
      kind: config
      description: Matching server/client configs generated from one Service Binding.
  protocols:
    - name: ROS 2 topics
      role: pubsub
      notes: Bidirectional or one-way Topic Bridge.
    - name: ROS 2 services
      role: server
      notes: ROS Service Servers backed by Hakoniwa RPC Clients.
    - name: Hakoniwa PDU-RPC
      role: client
      notes: PDU-RPC owns IDs, timeout, cancellation, correlation, and tcp_mux.
  configuration:
    - path: config/sample/sample_binding.json
      description: Topic Binding example.
    - path: schema/service-binding.schema.json
      description: Canonical Service Binding schema.
    - path: config/service/add_two_ints.json
      description: AddTwoInts Service Binding example.
    - path: examples/service/README.md
      description: Manual three-process Service demo.
dependencies:
  required:
    - name: ROS 2
      type: runtime
      notes: Provides messages, Services, rclpy, colcon, and ros2 commands.
    - name: Python
      type: runtime
      notes: Hosts Bridge, converters, and RPC bindings.
    - name: hakoniwa-pdu-endpoint
      type: repository
      notes: Provides Topic and lower-level RPC transport.
    - name: hakoniwa-pdu-python
      type: package
      notes: Provides generated PDU Python types and converters.
    - name: hakoniwa-pdu-registry
      type: repository
      notes: Defines and generates Topic and Service artifacts and offsets.
    - name: hakoniwa-pdu-rpc
      type: repository
      notes: Provides typed async RPC, Python RpcMuxServer, shared native loading, correlation, timeout/cancel, and tcp_mux.
  optional:
    - name: Zenoh backend
      type: runtime
      notes: Used by the Topic quick start.
platforms:
  supported:
    - Linux
  notes:
    - Native Bridge runtime targets Ubuntu 24.04 / ROS 2 Jazzy.
    - Docker-capable macOS, Windows, and Linux hosts are candidates for Business Pack Recipes.
connects_to:
  - component_id: hakoniwa-pdu-endpoint
    direction: uses
    interface: endpoint cache / communication backend
    notes: Topic and lower-level RPC transport remain in Endpoint.
  - component_id: hakoniwa-pdu-rpc
    direction: uses
    interface: typed asynchronous RPC client / timeout and cancellation / tcp_mux
    notes: Service Bridge delegates request lifecycle, correlation, cancellation, and physical RPC transport to PDU-RPC.
  - component_id: hakoniwa-pdu-python
    direction: uses
    interface: generated Python PDU types and converters
    notes: Binary layout stays in generated converters.
  - component_id: hakoniwa-pdu-registry
    direction: uses
    interface: PDU definitions and generated conventions
    notes: Mapping depends on Registry artifacts and offsets.
  - component_id: hakoniwa-core-pro
    direction: related
    interface: Hakoniwa runtime / PDU environment
    notes: Typical Assets participate in Core while the Bridge is an integration component.
data_contracts:
  - name: Topic Binding contract
    description: Maps PDU identity to ROS Topic ownership, direction, and QoS.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: README.md
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
  - name: Service Binding contract
    description: Defines ROS/Hakoniwa Service identity, endpoints, max_clients, timeout, and heap.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: schema/service-binding.schema.json
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
  - name: Deterministic Service config generation
    description: Generates names, channel IDs, maxClients, and matching server/client configs from one model.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: hakoniwa_pdu_ros/service_config_generator.py
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
recipe_roles:
  - role: bridge
    description: Bridges ROS Topics to PDU and ROS Services to RPC.
  - role: integration_boundary
    description: Defines configuration-driven ROS/Hakoniwa boundaries.
  - role: communication_infrastructure
    description: Participates in exchange while delegating transport and RPC state.
typical_usecases:
  - Connect ROS 2 Topics to Hakoniwa PDU without per-message bridge code.
  - Expose a Hakoniwa Asset RPC operation as a ROS 2 Service Server.
  - Provide bounded Service concurrency with a generated max_clients pool.
  - Run ROS 2 in Docker while calling a host Hakoniwa RPC Server over TCP.
anti_usecases:
  - Replacing Endpoint transport, PDU-RPC state management, or generated converters.
  - Calling an external ROS Service from a Hakoniwa Asset using the current Server Bridge.
  - Queueing unbounded Service requests when the pool is full.
  - Claiming cross-platform Business Pack execution without Recipe evidence.
demo_candidates:
  - name: Bidirectional PDU and ROS 2 bridge over Zenoh
    description: Run the documented Ubuntu Topic quick start.
    required_components:
      - hakoniwa-pdu-ros
      - hakoniwa-pdu-endpoint
      - hakoniwa-pdu-python
      - hakoniwa-pdu-registry
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: README.md
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
  - name: AddTwoInts ROS 2 Service Server Bridge
    description: Start RpcMuxServer and Service Bridge, call /add_two_ints, and verify the sum response.
    required_components:
      - hakoniwa-pdu-ros
      - hakoniwa-pdu-rpc
      - hakoniwa-pdu-endpoint
      - hakoniwa-pdu-python
      - hakoniwa-pdu-registry
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-ros
        path: examples/service/README.md
        revision: 00e96da7797686a80826e2e266f56f16520a68a7
operations:
  build:
    commands:
      - colcon build
    notes:
      - A Business Pack-compliant hako.py build manifest is not implemented yet.
  test:
    commands:
      - pytest -q test --ignore=test/native
      - bash test/docker/run_native_tests.sh
    notes:
      - The pytest command is the ROS-independent suite used for the recorded 56-test result.
      - The Docker command runs the recorded 16 native tests on Ubuntu 24.04 / ROS 2 Jazzy.
  run:
    commands:
      - ros2 run hakoniwa_pdu_ros bridge --config config/sample/sample_binding.json
      - python3 -m hakoniwa_pdu_ros.generate_service_config --config config/service/add_two_ints.json --output-dir <output-dir>
      - service-server --config config/service/add_two_ints.json --offset-dir <offset-dir> --rpc-library <shared-rpc-library>
    notes:
      - Topic and Service Bridges use separate Binding contracts.
      - Config generation is repository-specific and is not yet a Business Pack hako.py extension.
known_gaps:
  - Implement a manifest-driven Business Pack hako.py doctor/configure/build/test/install/smoke contract.
  - Keep hako.py --config for build manifests and expose Service Binding through distinct --binding semantics.
  - Validate an AddTwoInts host/Docker Recipe on macOS, Windows, and Linux with separate host and container artifact domains.
  - Add the follow-on host MuJoCo Asset / Docker ROS 2 Service Recipe.
  - Add variable-length Service heap-capacity E2E and explicit overflow rejection.
