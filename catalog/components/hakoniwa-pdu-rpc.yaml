        revision: 3085b01b7458538f7228ed875aa12944b0583213

operations:
  build:
    commands:
      - git submodule update --init --recursive
      - python tools/hako.py doctor
      - python tools/hako.py configure --dry-run
      - python tools/hako.py build
    notes:
      - tools/hako.py is the recommended cross-platform build entry point.
  test:
    commands:
      - python tools/hako.py test
      - python tools/hako.py package-test
    notes:
      - Reviewed Service and Action contract targets are included in hako.py test.
  run:
    commands:
      - python tools/generate_action_config.py --config config/sample/action.json --output .hako/action
      - build/examples/hakoniwa_pdu_action_fibonacci_server
      - build/examples/hakoniwa_pdu_action_fibonacci_client 10
    notes:
      - Build examples with HAKO_PDU_RPC_BUILD_EXAMPLES=ON before running the Fibonacci pair.

runtime_checks:
  - id: build-readiness
    kind: doctor
    platforms: [macos, linux, windows]
    command: [python, tools/hako.py, doctor]
    working_directory: repository
    output: text
  - id: service-action-contract-tests
    kind: test
    platforms: [macos, linux, windows]
    command: [python, tools/hako.py, test]
    working_directory: repository
    output: text
  - id: package-consumer-contract
    kind: test
    platforms: [macos, linux, windows]
    command: [python, tools/hako.py, package-test]
    working_directory: repository
    output: text

known_gaps:
  - Action deliberately has no built-in Future/callback scheduler; application or adapter layers own execution scheduling.
  - ROS 2 Action mapping remains a hakoniwa-pdu-ros responsibility.
  - Broad cross-language client support and general peer-failure or high-availability policy remain out of scope.

