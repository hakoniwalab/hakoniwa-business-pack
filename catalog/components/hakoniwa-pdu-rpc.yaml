    required_components:
      - hakoniwa-pdu-rpc
      - hakoniwa-pdu-endpoint
      - hakoniwa-pdu-registry
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: examples/rpc_server.cpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: Fibonacci Action round trip
    description: Run the native Fibonacci Action pair to observe Goal acceptance, progressive Feedback, and terminal Result over TCP.
    required_components:
      - hakoniwa-pdu-rpc
      - hakoniwa-pdu-endpoint
      - hakoniwa-pdu-registry
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: examples/action_fibonacci_server.cpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
