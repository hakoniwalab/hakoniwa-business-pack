        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: Action TCP contract path
    description: Exercise Goal, Feedback, Cancel, Result, and state correlation through native point-to-point or Mux contract tests.
    required_components:
      - hakoniwa-pdu-rpc
      - hakoniwa-pdu-endpoint
      - hakoniwa-pdu-registry
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
