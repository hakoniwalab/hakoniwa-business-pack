id: hakoniwa-pdu-rpc
name: Hakoniwa PDU RPC
repository:
  owner: hakoniwalab
  name: hakoniwa-pdu-rpc
  url: https://github.com/hakoniwalab/hakoniwa-pdu-rpc
  visibility: public
distribution:
  channel: oss
  notes:
    - Public OSS Hakoniwa component.
verification:
  verified_at: 2026-08-02
  source_revision: 10eb9c8e7664691816796427b2cff68b61c13433
  source_ref: main
summary: Hakoniwa-native request-response layer built on Endpoint topology and generated PDU service definitions, with C++ APIs, Python CFFI typed clients, asynchronous futures, and native-backed Python TCP mux servers.
category:
  primary: communication
  secondary:
    - rpc
    - control-plane
    - integration
    - language-binding
status:
  maturity: active
  catalog_confidence: high
  notes:
    - Catalog includes the merged native TCP mux server and Python RpcMuxServer APIs.
    - Runtime capabilities and Foundation installation evidence are intentionally distinguished.
    - Scope is narrower than a general RPC framework.
capabilities:
  - name: PDU-native request-response
    description: Provides RPC semantics aligned with Hakoniwa PDU channels, Endpoint configuration, generated service types, explicit timeout notification, and protocol-level cancellation.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: README.md
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Config-driven service topology
    description: Defines services, clients, endpoints, request/response channels, and timeout behavior in JSON.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: config/schema/service-schema.json
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Python CFFI client binding
    description: Exposes the native RPC client lifecycle to Python while returning ordinary Python bytes instead of leaking native PDU buffer ownership.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/hakoniwa_pdu_rpc/cffi_api.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/test_cffi_basic.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Registry-generated typed service auto-wiring
    description: Resolves generated request and response packet classes and converters by service naming convention, preferring the installed hakoniwa-pdu package layout and falling back to the Registry source-tree layout.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/hakoniwa_pdu_rpc/auto_wire.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/test_cffi_registry_auto_wire.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: ROS-independent asynchronous Python API
    description: RpcClient.call_async returns RpcFuture and drives timeout, cancellation, and response/cancel race handling in a background worker without depending on rclpy or asyncio.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/hakoniwa_pdu_rpc/client.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/hakoniwa_pdu_rpc/future.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Native TCP mux RPC server
    description: Accepts multiple independent Endpoint sessions on one listener, creates one RPC server adapter per accepted connection, and routes replies to the originating connection.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: include/hakoniwa/pdu/rpc/rpc_services_mux_server.hpp
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: test/rpc_mux_server_contract_test.cpp
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Python RpcMuxServer
    description: Provides a thin Python wrapper over the native mux server for start, stop, poll, reply, cancel reply, connection counts, expected counts, and readiness without reimplementing mux lifecycle in Python.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/hakoniwa_pdu_rpc/mux_server.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/test_cffi_mux_server.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/tcp-mux-server.md
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Installed CMake package contract
    description: Exports a consumable CMake package with preferred target hakoniwa_pdu_rpc::rpc and compatibility target hakoniwa_pdu_rpc::hakoniwa_pdu_rpc.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: CMakeLists.txt
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: cmake/hakoniwa_pdu_rpcConfig.cmake.in
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Core-free Endpoint package dependency
    description: Standalone PDU-RPC consumes the installed hakoniwa-pdu-endpoint CMake package rather than directly requiring Hakoniwa Core.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: CMakeLists.txt
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Cross-platform build and validation
    description: tools/hako.py and CI cover native doctor, build, lifecycle tests, CFFI integration tests, installation, and package-consumer verification across supported platforms.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: tools/hako.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Reviewed RPC lifecycle contracts
    description: Focused tests cover basic round trip and reuse, timeout=0 infinite wait, timeout followed by explicit cancel, and the normal-response/cancel race.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/test-contract.md
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
limitations:
  - Not a general-purpose RPC framework like gRPC.
  - Not a dynamic service mesh with discovery, authentication, tracing, and streaming semantics.
  - Native C++ integration is explicitly polled; the Python high-level asynchronous adapter uses a background worker.
  - One Python RpcClient instance permits one in-flight request. Independent concurrent requests require separate client instances.
  - Requires Endpoint and Registry alignment; mismatched endpoint IDs, node names, PDU sizes, generated package layouts, or channels fail at import, config, or runtime boundaries.
  - Timeout does not make the Endpoint immediately reusable. A caller must cancel or otherwise resolve the request.
  - The RPC state machine does not infer permanent peer failure from timeout alone.
  - A ROS 2 Service Bridge is owned by hakoniwa-pdu-ros, not this repository.
  - The current tools/hako.py install and Component Receipt cover native and CMake artifacts. They do not install or attest the hakoniwa_pdu_rpc Python package.
  - Current Receipt capabilities are rpc_client, rpc_server, and cmake_package; Python mux, typed async client, shared native library, and Python package capabilities are not yet attested.
interfaces:
  inputs:
    - name: Service configuration
      kind: config
      description: JSON service topology including clients, Endpoint IDs, request/response channels, and timeouts.
    - name: Endpoint container configuration
      kind: config
      description: Endpoint mappings reused from hakoniwa-pdu-endpoint.
    - name: Generated service PDU types
      kind: api
      description: Request and response packet types and converters generated from service definitions.
    - name: Python request packet or bytes
      kind: api
      description: Python callers may use raw PDU bytes or Registry-generated typed request packets through TypedRpcClient.
    - name: Explicit cancel request
      kind: api
      description: Caller-controlled cancellation request for an in-flight RPC.
  outputs:
    - name: RPC response PDUs
      kind: pdu
      description: Normal or cancellation response payloads sent over Endpoint transports.
    - name: Client events
      kind: api
      description: Native poll events distinguish normal response, timeout, cancel completion, and no-event states.
    - name: RpcFuture
      kind: api
      description: ROS-independent Python completion handle supporting result, exception, done callback, and protocol-level cancel operations.
    - name: RpcMuxRequest
      kind: api
      description: Server-side request paired with its accepted connection identity for exact response routing.
  protocols:
    - name: Endpoint transports
      role: client
      notes: RPC clients reuse hakoniwa-pdu-endpoint transports.
    - name: TCP mux Endpoint transport
      role: server
      notes: RpcMuxServer accepts multiple independent clients through one listener and delegates physical sessions to Endpoint.
  configuration:
    - path: config/schema/service-schema.json
      description: Service config schema.
    - path: config/sample/simple-service.json
      description: Basic service configuration.
    - path: config/sample/endpoints.json
      description: Endpoint mapping for examples.
    - path: docs/tcp-mux-server.md
      description: Native and Python mux server lifecycle contract.
dependencies:
  required:
    - name: C++20 compiler
      type: tool
      notes: Required for native library and examples.
    - name: CMake 3.16 or later
      type: tool
      notes: Required build system.
    - name: hakoniwa-pdu-endpoint
      type: repository
      notes: Required installed CMake package for Endpoint topology and transport I/O.
    - name: hakoniwa-pdu-registry
      type: repository
      notes: Provides generated request/response service packet definitions and source-tree converters used by integration tests.
  optional:
    - name: Python 3.12 or later
      type: runtime
      notes: Required for Python CFFI clients, typed APIs, RpcMuxServer, tools/hako.py, and config validation.
    - name: hakoniwa-pdu
      type: package
      notes: Installed generated PDU package layout preferred by typed service auto-discovery.
    - name: GoogleTest
      type: library
      notes: Used for native contract tests.
platforms:
  supported:
    - macOS
    - Linux
    - Windows
  notes:
    - Native and Python CFFI workflows are exercised in CI on Ubuntu x64, Ubuntu ARM64, macOS, and Windows x64.
    - A host-native artifact cannot be reused as a Linux container runtime artifact.
connects_to:
  - component_id: hakoniwa-pdu-endpoint
    direction: uses
    interface: Installed CMake package / Endpoint API / endpoint config
    notes: All RPC transport and accepted TCP mux sessions are delegated through Endpoint.
  - component_id: hakoniwa-pdu-registry
    direction: uses
    interface: generated request/response PDU types and Python converters
    notes: Registry provides service packet types, size definitions, and source-tree conversion modules.
  - component_id: hakoniwa-pdu-python
    direction: related
    interface: installed hakoniwa_pdu.pdu_msgs package layout
    notes: Typed auto-wiring prefers the installed generated PDU package layout used by Python applications.
  - component_id: hakoniwa-pdu-ros
    direction: used_by
    interface: TypedRpcClient, RpcFuture, and RpcMuxServer boundary
    notes: PDU-ROS owns ROS mapping and executor integration while PDU-RPC owns request lifecycle and mux routing.
  - component_id: hakoniwa-conductor-light
    direction: used_by
    interface: RPC client/server transport
    notes: Conductor Light uses PDU-RPC for server/client coordination.
  - component_id: hakoniwa-conductor-pro
    direction: related
    interface: control-plane RPC concept
    notes: Both address control-plane coordination with different scopes.
data_contracts:
  - name: RPC service config
    description: Explicit config contract for service names, clients, endpoints, channels, request IDs, and timeouts.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: config/schema/service-schema.json
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Generated service auto-wire convention
    description: Service type names resolve RequestPacket and ResponsePacket classes and converters from the installed hakoniwa_pdu package or Registry source-tree fallback.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/hakoniwa_pdu_rpc/auto_wire.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Python asynchronous request lifecycle
    description: call_async returns immediately, one worker drives the terminal state machine, and RpcFuture reports completion without a ROS or asyncio dependency.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/hakoniwa_pdu_rpc/client.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: TCP mux server routing
    description: Every polled server request carries accepted connection identity and every reply is routed through that identity to its originating client.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/tcp-mux-server.md
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Timeout and cancel lifecycle
    description: Timeout leaves the request running until explicit cancel or another terminal response resolves it.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/test-contract.md
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
recipe_roles:
  - role: control_plane
    description: Adds deterministic RPC calls for simulation control or service requests.
  - role: communication_infrastructure
    description: Reuses Endpoint transport while imposing request-response semantics.
  - role: integration_boundary
    description: Bridges native or Python service-style control code to PDU-native Hakoniwa topology.
typical_usecases:
  - Hakoniwa-native C++ control-plane services.
  - Python request-response clients using raw PDU bytes or Registry-generated service packets.
  - Python RpcMuxServer applications accepting multiple independent clients on one TCP listener.
  - ROS 2 or GUI adapters needing a non-blocking RPC completion handle.
  - Reusable installed CMake package consumption from other Hakoniwa components.
anti_usecases:
  - Public web APIs across many languages.
  - Streaming RPC workloads.
  - Dynamic service discovery, authentication, tracing, or full service mesh requirements.
  - Multiple concurrent calls through one Python RpcClient instance.
  - Treating runtime Python capability as Foundation-installed without package and Receipt evidence.
demo_candidates:
  - name: AddTwoInts RPC pair
    description: Build examples, run server and client, then send two integers and receive their sum.
    required_components:
      - hakoniwa-pdu-rpc
      - hakoniwa-pdu-endpoint
      - hakoniwa-pdu-registry
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: examples/rpc_server.cpp
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Python typed async client
    description: Load a Registry-generated service wire, issue a non-blocking Python call, and bridge RpcFuture completion into an application callback or executor.
    required_components:
      - hakoniwa-pdu-rpc
      - hakoniwa-pdu-endpoint
      - hakoniwa-pdu-registry
      - hakoniwa-pdu-python
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/test_cffi_async_api.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
  - name: Python TCP mux server
    description: Accept two independent RPC clients on one listener and route each response to the originating connection.
    required_components:
      - hakoniwa-pdu-rpc
      - hakoniwa-pdu-endpoint
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/test_cffi_mux_server.py
        revision: 10eb9c8e7664691816796427b2cff68b61c13433
operations:
  build:
    commands:
      - git submodule update --init --recursive
      - python tools/hako.py doctor
      - python tools/hako.py configure --dry-run
      - python tools/hako.py build
      - python tools/hako.py install
    notes:
      - tools/hako.py is the recommended cross-platform native build entry point.
      - Current install does not install the Python package into the selected Foundation Python environment.
  test:
    commands:
      - python tools/hako.py test
      - python tools/hako.py package-test
    notes:
      - Native tests cover reviewed lifecycle and mux server contracts.
      - Python CFFI, typed auto-wire, async API, and mux tests run in Python integration workflows.
  run:
    commands:
      - PYTHONPATH=python:$PYTHONPATH python -m hakoniwa_pdu_rpc.validate_configs config/sample/simple-service.json --skip-endpoint-validation
      - build/examples/hakoniwa_pdu_rpc_server
      - build/examples/hakoniwa_pdu_rpc_client 1000000
    notes:
      - Python callers must set HAKO_PDU_RPC_LIBRARY or pass the native library path explicitly.
runtime_checks:
  - id: build-readiness
    kind: doctor
    platforms: [macos, linux, windows]
    command: [python, tools/hako.py, doctor]
    working_directory: repository
    output: text
  - id: rpc-contract-tests
    kind: test
    platforms: [macos, linux, windows]
    command: [python, tools/hako.py, test]
    working_directory: repository
    output: text
  - id: package-consumer-contract
    kind: test
    platforms: [macos, linux, windows]
    command: [python, tools/hako.py, package-test]
    working_directory: repository
    output: text
known_gaps:
  - Extend tools/hako.py install to install hakoniwa_pdu_rpc into the selected Foundation Python environment.
  - Extend the Component Receipt with python_rpc_mux_server, typed_async_client, shared_native_library, and python_package capabilities.
  - Record the installed Python package path and shared native library as Receipt artifacts.
  - Verify that Foundation doctor imports hakoniwa_pdu_rpc from the declared Foundation interpreter and loads the library from the same install prefix.
  - Broad cross-language client support and general peer-failure or high-availability policy remain out of scope.
