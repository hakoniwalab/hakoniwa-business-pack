  - name: AddTwoInts RPC pair
    description: Build examples, run server and client, then send two integers and receive their sum.
    required_components:
      - hakoniwa-pdu-rpc
      - hakoniwa-pdu-endpoint
      - hakoniwa-pdu-registry
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: examples/rpc_server.cpp
        revision: 2e8d385c831799c8968e4c1a58586879b82f60d0
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: examples/rpc_client.cpp
        revision: 2e8d385c831799c8968e4c1a58586879b82f60d0
  - name: Python typed async client
    description: Load a Registry-generated service wire, issue a non-blocking Python call, and bridge RpcFuture completion into an application callback or executor.
    required_components:
      - hakoniwa-pdu-rpc
      - hakoniwa-pdu-endpoint
      - hakoniwa-pdu-registry
      - hakoniwa-pdu-python
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/test_cffi_registry_auto_wire.py
        revision: 2e8d385c831799c8968e4c1a58586879b82f60d0
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/test_cffi_async_api.py
        revision: 2e8d385c831799c8968e4c1a58586879b82f60d0
  - name: RPC contract suite
    description: Run the reviewed focused contract tests for basic calls, infinite wait, timeout/cancel, and cancel/normal-response race behavior.
    required_components:
      - hakoniwa-pdu-rpc
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/test-contract.md
        revision: 2e8d385c831799c8968e4c1a58586879b82f60d0
operations:
  build:
    commands:
      - git submodule update --init --recursive
      - python tools/hako.py doctor
      - python tools/hako.py configure --dry-run
      - python tools/hako.py build
      - python tools/hako.py install
    notes:
      - tools/hako.py is the recommended cross-platform build entry point.
      - Standalone PDU-RPC resolves an installed hakoniwa-pdu-endpoint package; HAKO_PDU_ENDPOINT_ROOT or HAKO_PDU_ENDPOINT_PREFIX can override discovery.
  test:
    commands:
      - python tools/hako.py test
      - python tools/hako.py package-test
    notes:
      - test runs the four reviewed native RPC contract targets.
      - Python CFFI, Registry auto-wire, and async API tests run in the Python integration workflow.
      - package-test builds, installs, then configures a downstream consumer with find_package(hakoniwa_pdu_rpc REQUIRED).
  run:
    commands:
      - PYTHONPATH=python:$PYTHONPATH python -m hakoniwa_pdu_rpc.validate_configs config/sample/simple-service.json --skip-endpoint-validation
      - build/examples/hakoniwa_pdu_rpc_server
      - build/examples/hakoniwa_pdu_rpc_client 1000000
    notes:
      - Server should start before client for the bundled interactive example.
      - Python callers must set HAKO_PDU_RPC_LIBRARY or pass the native library path explicitly.
runtime_checks:
  - id: build-readiness
    kind: doctor
    platforms:
      - macos
      - linux
      - windows
    command:
      - python
      - tools/hako.py
      - doctor
    working_directory: repository
    output: text
    notes:
      - Checks CMake/Git, Registry submodule content, installed Endpoint package resolution, and Windows vcpkg when applicable.
  - id: rpc-contract-tests
    kind: test
    platforms:
      - macos
      - linux
      - windows
    command:
      - python
      - tools/hako.py
      - test
    working_directory: repository
    output: text
    notes:
      - Runs the reviewed basic, infinite-wait, timeout/cancel, and cancel-race contract tests.
  - id: package-consumer-contract
    kind: test
    platforms:
      - macos
      - linux
      - windows
    command:
      - python
      - tools/hako.py
      - package-test
    working_directory: repository
    output: text
    notes:
      - Verifies install/export/find_package consumption through the downstream package consumer.
known_gaps:
  - Catalog does not list every schema field and validation rule.
  - Python server-side typed and asynchronous convenience APIs should not be assumed from the current client-focused implementation.
  - A completed hakoniwa-pdu-ros service bridge has not yet been verified; only the reusable RPC-side async and typed boundaries are present.
  - Broad cross-language client support beyond the reviewed C++ and Python surfaces should not be assumed.
  - PDU-RPC deliberately does not define a general peer-failure/HA policy; higher layers decide what a permanently unavailable server means for their simulation.
