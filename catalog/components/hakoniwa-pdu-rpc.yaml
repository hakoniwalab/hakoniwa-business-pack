id: hakoniwa-pdu-rpc
name: Hakoniwa PDU RPC
repository:
  owner: hakoniwalab
  name: hakoniwa-pdu-rpc
  url: https://github.com/hakoniwalab/hakoniwa-pdu-rpc
  visibility: public
distribution:
  channel: oss
  notes:
    - Public OSS Hakoniwa component.
verification:
  verified_at: 2026-07-27
  source_revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
  source_ref: main
summary: C++ request-response layer for Hakoniwa control-plane RPC built on endpoint topology and PDU definitions.
category:
  primary: communication
  secondary:
    - rpc
    - control-plane
    - integration
status:
  maturity: active
  catalog_confidence: high
  notes:
    - Catalog refreshed after standalone CMake package modernization, four-platform CI, reviewed RPC contract tests, legacy-test retirement, and README convergence.
    - Scope is intentionally narrower than a general RPC framework.
capabilities:
  - name: PDU-native request-response
    description: Provides RPC semantics aligned with Hakoniwa PDU channels, endpoint configuration, and generated service types.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: README.md
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
  - name: Config-driven service topology
    description: Defines services, clients, endpoints, request/response channels, and timeout behavior in JSON.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: README.md
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
  - name: Installed CMake package contract
    description: Exports a consumable CMake package with preferred target hakoniwa_pdu_rpc::rpc and compatibility target hakoniwa_pdu_rpc::hakoniwa_pdu_rpc.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: CMakeLists.txt
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: cmake/hakoniwa_pdu_rpcConfig.cmake.in
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
  - name: Core-free Endpoint package dependency
    description: Standalone PDU-RPC consumes the installed hakoniwa-pdu-endpoint CMake package rather than directly requiring Hakoniwa Core.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: CMakeLists.txt
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
  - name: Cross-platform build driver
    description: tools/hako.py provides a single entry point for doctor, build, test, install, and package-consumer verification across supported platforms.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: tools/hako.py
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
  - name: Reviewed RPC lifecycle contracts
    description: Focused tests cover basic round trip and reuse, timeout=0 infinite wait, timeout followed by explicit cancel, and the normal-response/cancel race.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/test-contract.md
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: test/rpc_basic_contract_test.cpp
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: test/rpc_infinite_wait_contract_test.cpp
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: test/rpc_timeout_cancel_contract_test.cpp
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: test/rpc_cancel_race_contract_test.cpp
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
limitations:
  - Not a general-purpose RPC framework like gRPC.
  - Not a dynamic service mesh with discovery, auth, tracing, and streaming semantics.
  - Primarily targeted at C++ Hakoniwa-native control-plane integration.
  - Requires endpoint and registry alignment; mismatched endpoint IDs, node names, PDU sizes, or channels fail at config/runtime boundaries.
  - Timeout does not mean the endpoint is immediately reusable. A caller that observes timeout must explicitly cancel or otherwise resolve the in-flight request before starting a new RPC.
  - The RPC state machine does not infer peer death from timeout alone; a higher layer owns policy for a permanently unavailable server.
interfaces:
  inputs:
    - name: Service configuration
      kind: config
      description: JSON service topology including clients, endpoint IDs, request/response channels, and timeouts.
    - name: Endpoint container configuration
      kind: config
      description: Endpoint mappings reused from hakoniwa-pdu-endpoint.
    - name: Generated service PDU types
      kind: api
      description: Request and response packet types generated from service definitions.
    - name: Explicit cancel request
      kind: api
      description: Caller-controlled cancellation request for an in-flight RPC after timeout or another cancellation decision.
  outputs:
    - name: RPC response PDUs
      kind: pdu
      description: Normal or cancellation response payloads sent over endpoint transports.
    - name: Client events
      kind: api
      description: Poll events distinguish normal response, timeout, cancel completion, and no-event states without collapsing timeout into implicit cancellation.
  protocols:
    - name: Endpoint transports
      role: client | server
      notes: RPC reuses hakoniwa-pdu-endpoint transports without changing RPC user code.
  configuration:
    - path: config/schema/service-schema.json
      description: Service config schema.
    - path: config/sample/simple-service.json
      description: Basic service configuration.
    - path: config/sample/endpoints.json
      description: Endpoint mapping for examples.
    - path: config/sample/minimal
      description: Compact minimal config set.
dependencies:
  required:
    - name: C++20 compiler
      type: tool
      notes: Required for native library and examples.
    - name: CMake 3.16 or later
      type: tool
      notes: Required build system.
    - name: hakoniwa-pdu-endpoint
      type: repository
      notes: Required installed CMake package for endpoint topology and transport I/O.
    - name: hakoniwa-pdu-registry
      type: repository
      notes: Source submodule provides generated public request/response PDU headers that are installed with the package.
  optional:
    - name: Python 3
      type: runtime
      notes: Used by tools/hako.py and config validation.
    - name: GoogleTest
      type: library
      notes: Used for contract tests; CMake can fetch GoogleTest when no package target is already available.
platforms:
  supported:
    - macOS
    - Linux
    - Windows
  notes:
    - Standalone package/build/test workflows are exercised in CI on Ubuntu x64, Ubuntu ARM64, macOS, and Windows x64.
    - tools/hako.py normalizes the build and package-consumer workflow across platforms.
connects_to:
  - component_id: hakoniwa-pdu-endpoint
    direction: uses
    interface: Installed CMake package / Endpoint API / endpoint config
    notes: All RPC transport is delegated through endpoints.
  - component_id: hakoniwa-pdu-registry
    direction: uses
    interface: generated request/response PDU types
    notes: Registry provides service packet types and size definitions.
  - component_id: hakoniwa-conductor-light
    direction: used_by
    interface: RPC client/server transport
    notes: Conductor Light uses PDU-RPC for server/client coordination and preserves the same explicit timeout/cancel lifecycle.
  - component_id: hakoniwa-conductor-pro
    direction: related
    interface: control-plane RPC concept
    notes: Both address control-plane coordination, with conductor-pro using broader distributed execution control.
data_contracts:
  - name: RPC service config
    description: Explicit config contract for service names, clients, endpoints, channels, request IDs, and timeouts.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: config/schema/service-schema.json
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
  - name: Timeout/cancel lifecycle
    description: Timeout leaves the client request running. The caller explicitly cancels, moving the client into cancelling; either a matching normal response or cancel response may resolve the request. A late cancel reaching an already-idle server is harmless.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/test-contract.md
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: test/rpc_timeout_cancel_contract_test.cpp
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: test/rpc_cancel_race_contract_test.cpp
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
  - name: Infinite-wait lifecycle
    description: timeout=0 means there is no RPC timeout deadline; the request remains in flight until a response or explicit higher-level decision resolves it.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: test/rpc_infinite_wait_contract_test.cpp
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
recipe_roles:
  - role: control_plane
    description: Adds deterministic RPC calls for simulation control or service requests.
  - role: communication_infrastructure
    description: Reuses endpoint transport while imposing request-response semantics.
  - role: integration_boundary
    description: Bridges service-style control code to PDU-native Hakoniwa topology.
typical_usecases:
  - Hakoniwa-native C++ control-plane services.
  - Request/response operations that must follow endpoint topology and PDU binary contracts.
  - Deterministic or tick-driven integration loops where hidden scheduler behavior is undesirable.
  - Reusable installed CMake package consumption from other Hakoniwa components.
  - Control-plane clients that must distinguish timeout observation from explicit cancellation and preserve race-safe endpoint reuse.
anti_usecases:
  - Public web APIs across many languages.
  - Streaming RPC workloads.
  - Dynamic service discovery, auth, tracing, or full service mesh requirements.
  - Callers that assume timeout automatically aborts an RPC and immediately resets the client to idle.
demo_candidates:
  - name: AddTwoInts RPC pair
    description: Build examples, run server and client, then send two integers and receive their sum.
    required_components:
      - hakoniwa-pdu-rpc
      - hakoniwa-pdu-endpoint
      - hakoniwa-pdu-registry
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: examples/rpc_server.cpp
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: examples/rpc_client.cpp
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
  - name: RPC contract suite
    description: Run the reviewed focused contract tests for basic calls, infinite wait, timeout/cancel, and cancel/normal-response race behavior.
    required_components:
      - hakoniwa-pdu-rpc
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/test-contract.md
        revision: f2f739462e0e26cf45b55b694a49f5e002a05a41
operations:
  build:
    commands:
      - git submodule update --init --recursive
      - python tools/hako.py doctor
      - python tools/hako.py configure --dry-run
      - python tools/hako.py build
      - python tools/hako.py install
    notes:
      - tools/hako.py is the recommended cross-platform build entry point.
      - Standalone PDU-RPC resolves an installed hakoniwa-pdu-endpoint package; HAKO_PDU_ENDPOINT_ROOT or HAKO_PDU_ENDPOINT_PREFIX can override discovery.
  test:
    commands:
      - python tools/hako.py test
      - python tools/hako.py package-test
    notes:
      - test runs the four reviewed RPC contract targets.
      - package-test builds, installs, then configures a downstream consumer with find_package(hakoniwa_pdu_rpc REQUIRED).
  run:
    commands:
      - PYTHONPATH=python:$PYTHONPATH python -m hakoniwa_pdu_rpc.validate_configs config/sample/simple-service.json --skip-endpoint-validation
      - build/examples/hakoniwa_pdu_rpc_server
      - build/examples/hakoniwa_pdu_rpc_client 1000000
    notes:
      - Server should start before client for the bundled interactive example.
runtime_checks:
  - id: build-readiness
    kind: doctor
    platforms:
      - macos
      - linux
      - windows
    command:
      - python
      - tools/hako.py
      - doctor
    working_directory: repository
    output: text
    notes:
      - Checks CMake/Git, Registry submodule content, installed Endpoint package resolution, and Windows vcpkg when applicable.
  - id: rpc-contract-tests
    kind: test
    platforms:
      - macos
      - linux
      - windows
    command:
      - python
      - tools/hako.py
      - test
    working_directory: repository
    output: text
    notes:
      - Runs the reviewed basic, infinite-wait, timeout/cancel, and cancel-race contract tests.
  - id: package-consumer-contract
    kind: test
    platforms:
      - macos
      - linux
      - windows
    command:
      - python
      - tools/hako.py
      - package-test
    working_directory: repository
    output: text
    notes:
      - Verifies install/export/find_package consumption through the downstream package consumer.
known_gaps:
  - Catalog does not list every schema field and validation rule.
  - Cross-language RPC support beyond C++ should not be assumed.
  - PDU-RPC deliberately does not define a general peer-failure/HA policy; higher layers decide what a permanently unavailable server means for their simulation.
