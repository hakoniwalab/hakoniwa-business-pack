id: hakoniwa-pdu-rpc
name: Hakoniwa PDU RPC
repository:
  owner: hakoniwalab
  name: hakoniwa-pdu-rpc
  url: https://github.com/hakoniwalab/hakoniwa-pdu-rpc
  visibility: public
distribution:
  channel: oss
  notes:
    - Public OSS Hakoniwa component.
verification:
  verified_at: 2026-08-07
  source_revision: 3085b01b7458538f7228ed875aa12944b0583213
  source_ref: main
summary: Hakoniwa-native request-response layer built on Endpoint topology and generated PDU service definitions, with C++ APIs, Python CFFI typed clients, asynchronous futures, and native-backed Python TCP mux servers.
category:
  primary: communication
  secondary:
    - rpc
    - control-plane
    - integration
    - language-binding
status:
  maturity: active
  catalog_confidence: high
  notes:
    - Service RPC and long-running Action lifecycles are both implemented on main.
    - Action supports point-to-point Client/Server and TCP Mux Server paths.
    - Native C++, C API, and Python CFFI Action surfaces are implemented and contract-tested.
    - Action Goal Response, Feedback, Cancel, Result, and Cancel/Result race behavior are defined by implemented design contracts.
    - Scope remains narrower than a general-purpose RPC framework.
capabilities:
  - name: PDU-native request-response
    description: Provides Service RPC semantics aligned with Hakoniwa PDU channels, Endpoint configuration, generated service types, explicit timeout notification, and protocol-level cancellation.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: README.md
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/test-contract.md
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: Long-running Action lifecycle
    description: Provides Goal Request/Response, zero or more Feedback messages, optional Cancel Request/Response, and terminal Result delivery with explicit Goal identity and state transitions.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/design/action/README.md
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: include/hakoniwa/pdu/action/action_types.hpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: Action semantic state management
    description: Separates packet/slot ownership in Action Endpoints from accepted Goal semantic state in Services, using explicit EXECUTING, CANCELING, and FINISHING states and pure state reducers.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: include/hakoniwa/pdu/action/action_server_state_machine.hpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: src/action_server_state_machine.cpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: test/action_server_state_machine_contract_test.cpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: Point-to-point Action Client and Server
    description: Exposes explicitly polled ActionServicesClient and ActionServicesServer APIs over configured Endpoint transports, with caller-supplied non-zero 128-bit Goal IDs.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: include/hakoniwa/pdu/action/action_services_client.hpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: include/hakoniwa/pdu/action/action_services_server.hpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: test/action_tcp_e2e_contract_test.cpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: Native TCP Mux Action server
    description: Accepts multiple independent TCP Endpoint sessions while keeping physical connection identity internal and exposing Goals to the Application by action name and ServerGoalHandle.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: include/hakoniwa/pdu/action/action_services_mux_server.hpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: test/action_mux_server_contract_test.cpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: C Action API
    description: Exposes Action Client, Server, and Mux Server lifecycle operations through a C ABI suitable for language bindings and adapter layers.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: include/hakoniwa/pdu/action/c_action.h
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: test/c_action_tcp_e2e_contract_test.cpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: Python CFFI Action API
    description: Provides Python wrappers for Action Client, Server, and Mux Server while delegating lifecycle and routing semantics to the native runtime.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/hakoniwa_pdu_rpc/action_cffi.py
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/test_cffi_action.py
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/test_cffi_action_mux_server.py
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: Config-driven Service and Action topology
    description: Defines Service and Action endpoints and channels in JSON, with a user-facing Action manifest that can generate resolved Action and Endpoint runtime configuration.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: config/schema/service-schema.json
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: config/schema/action-schema.json
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: tools/generate_action_config.py
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: Registry-generated typed service auto-wiring
    description: Resolves generated request and response packet classes and converters by service naming convention, preferring the installed hakoniwa-pdu package layout and falling back to the Registry source-tree layout.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/hakoniwa_pdu_rpc/auto_wire.py
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: ROS-independent asynchronous Python Service API
    description: RpcClient.call_async returns RpcFuture and drives timeout, cancellation, and response/cancel race handling in a background worker without depending on rclpy or asyncio.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/hakoniwa_pdu_rpc/client.py
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: python/hakoniwa_pdu_rpc/future.py
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: Native TCP mux RPC server
    description: Accepts multiple independent Endpoint sessions on one listener, creates one RPC server adapter per accepted connection, and routes replies to the originating connection.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: include/hakoniwa/pdu/rpc/rpc_services_mux_server.hpp
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: Installed CMake package contract
    description: Exports a consumable CMake package and consumes hakoniwa-pdu-endpoint through its installed public CMake target.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: CMakeLists.txt
        revision: 3085b01b7458538f7228ed875aa12944b0583213

  - name: Cross-platform contract validation
    description: CI exercises reviewed Service and Action contracts on Ubuntu x64, Ubuntu ARM64, macOS, and Windows x64, with package and Python integration checks in companion workflows.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: .github/workflows/action-contract-tests.yml
        revision: 3085b01b7458538f7228ed875aa12944b0583213
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: tools/hako.py
        revision: 3085b01b7458538f7228ed875aa12944b0583213

limitations:
  - Not a general-purpose RPC framework like gRPC.
  - Not a dynamic service mesh with discovery, authentication, tracing, and streaming semantics.
  - Native C++ Service and Action integration is explicitly polled.
  - Action does not provide a built-in Future or callback scheduler; adapters own executor integration.
  - Action Goal IDs are supplied by the caller; the runtime rejects invalid or already-active identities rather than generating IDs.
  - One Python RpcClient instance permits one in-flight Service request. Independent concurrent Service requests require separate client instances.
  - Requires Endpoint and Registry alignment; mismatched endpoint IDs, node names, PDU sizes, generated package layouts, or channels fail at config, build, or runtime boundaries.
  - A ROS 2 Service or Action Bridge is owned by hakoniwa-pdu-ros, not this repository.

interfaces:
  inputs:
    - name: Service configuration
      kind: config
      description: JSON service topology including clients, Endpoint IDs, request/response channels, and timeout behavior.
    - name: Action manifest or resolved Action configuration
      kind: config
      description: Action names, generated PDU Action type, slotCount, buffer sizes, Client/Server node IDs, and transport topology.
    - name: Endpoint configuration
      kind: config
      description: Endpoint mappings and transport details consumed through hakoniwa-pdu-endpoint.
    - name: Generated Service and Action PDU types
      kind: api
      description: Generated request, response, and feedback packet types and converters.
    - name: Goal and Cancel operations
      kind: api
      description: Caller-supplied Goal identity and Application decisions for Goal acceptance, cancellation, Feedback, and terminal completion.
  outputs:
    - name: RPC response PDUs
      kind: pdu
      description: Normal or cancellation Service response payloads sent over Endpoint transports.
    - name: Action lifecycle events
      kind: api
      description: Explicitly polled Goal Response, Feedback, Cancel Response, Result, timeout, and error events correlated by Goal handle.
    - name: Action PDUs
      kind: pdu
      description: Goal Request/Response, Feedback, Cancel, and Result packets transported by Endpoint channels.
    - name: RpcFuture
      kind: api
      description: ROS-independent Python completion handle for asynchronous Service calls.
  protocols:
    - name: Endpoint transports
      role: client
      notes: Service and Action clients reuse configured hakoniwa-pdu-endpoint transports.
    - name: Endpoint transports
      role: server
      notes: Service and Action servers reuse configured hakoniwa-pdu-endpoint transports.
    - name: TCP mux Endpoint transport
      role: server
      notes: Service and Action Mux Servers accept multiple independent clients through one listener.
  configuration:
    - path: config/schema/service-schema.json
      description: Service configuration schema.
    - path: config/schema/action-schema.json
      description: User-facing Action manifest schema.
    - path: config/sample/action.json
      description: Sample Fibonacci Action manifest.
    - path: tools/generate_action_config.py
      description: Generates resolved Action and Endpoint TCP configuration files.
    - path: docs/design/action/README.md
      description: Index of implemented Action protocol and state contracts.

dependencies:
  required:
    - name: C++20 compiler
      type: tool
      notes: Required for native library and examples.
    - name: CMake 3.16 or later
      type: tool
      notes: Required build system.
    - name: hakoniwa-pdu-endpoint
      type: repository
      notes: Required installed CMake package for Endpoint topology and transport I/O.
    - name: hakoniwa-pdu-registry
      type: repository
      notes: Provides generated Service and Action packet definitions, sizes, and converters.
  optional:
    - name: Python 3.12 or later
      type: runtime
      notes: Required for Python CFFI APIs, tools/hako.py, and Action config generation.
    - name: hakoniwa-pdu
      type: package
      notes: Installed generated PDU package layout preferred by typed Service auto-discovery.
    - name: GoogleTest
      type: library
      notes: Used for native contract tests.

platforms:
  supported:
    - macOS
    - Linux
    - Windows
  notes:
    - Reviewed Action contracts are exercised in CI on Ubuntu x64, Ubuntu ARM64, macOS, and Windows x64.
    - Native and Python package workflows provide additional cross-platform evidence.

connects_to:
  - component_id: hakoniwa-pdu-endpoint
    direction: uses
    interface: Installed CMake package / Endpoint API / endpoint config
    notes: Service RPC and Action packet transport, slot channels, and accepted TCP mux sessions are delegated through Endpoint.
  - component_id: hakoniwa-pdu-registry
    direction: uses
    interface: generated Service and Action PDU types and converters
    notes: Registry supplies generated request/response/feedback packet definitions and size information.
  - component_id: hakoniwa-pdu-python
    direction: related
    interface: installed hakoniwa_pdu.pdu_msgs package layout
    notes: Typed Service auto-wiring prefers the installed generated PDU package layout used by Python applications.
  - component_id: hakoniwa-pdu-ros
    direction: used_by
    interface: Service RPC and Action lifecycle boundary
    notes: PDU-ROS owns ROS 2 mapping and executor integration while PDU-RPC owns Service/Action transport lifecycle and routing.
  - component_id: hakoniwa-conductor-light
    direction: used_by
    interface: RPC client/server transport
    notes: Conductor Light uses PDU-RPC for server/client coordination.
  - component_id: hakoniwa-conductor
    direction: related
    interface: control-plane RPC concept
    notes: Both address control-plane coordination with different scopes.

data_contracts:
  - name: RPC Service lifecycle
    description: Service requests have explicit response, timeout notification, cancellation, and response/cancel race semantics.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/test-contract.md
        revision: 3085b01b7458538f7228ed875aa12944b0583213
  - name: Action Goal identity
    description: A caller-supplied non-zero 128-bit Goal ID identifies one Action lifecycle and correlates Goal, Cancel, Feedback, and Result operations.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/design/action/03-data-model.md
        revision: 3085b01b7458538f7228ed875aa12944b0583213
  - name: Action server state model
    description: Accepted Goals use EXECUTING, CANCELING, and FINISHING semantic states with explicit Cancel decision and terminal Result rules.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/design/action/04-state-model.md
        revision: 3085b01b7458538f7228ed875aa12944b0583213
  - name: Action Cancel and Result race
    description: Cancel and terminal Result decisions follow an explicit first-committed-decision contract instead of inferring terminal state from transport failure.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/design/action/11-cancel-result-race.md
        revision: 3085b01b7458538f7228ed875aa12944b0583213
  - name: Action Endpoint transaction contract
    description: Endpoint receive queues are independent from semantic state locking, while state-bound synchronous sends are serialized with their validation and commit.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-rpc
        path: docs/design/action/12-endpoint-transaction-state.md
        revision: 3085b01b7458538f7228ed875aa12944b0583213

recipe_roles:
  - role: control_plane
    description: Adds deterministic Service RPC or long-running Action lifecycles for simulation control and integration requests.
  - role: communication_infrastructure
    description: Reuses Endpoint transport while imposing Service request-response and Action Goal lifecycle semantics.
  - role: integration_boundary
    description: Bridges native, C, or Python control code to PDU-native Hakoniwa communication without requiring ROS inside the runtime.

typical_usecases:
  - Hakoniwa-native C++ control-plane Service RPC.
  - Long-running Goal execution with progressive Feedback and terminal Result.
  - Client-requested or Runtime-requested Action cancellation.
  - Native or Python TCP Mux Action servers accepting multiple independent clients.
  - C API or Python CFFI adapters that need ROS-independent Action semantics.
  - ROS 2 adapters that delegate Service and Action lifecycle handling to PDU-RPC.
  - Reusable installed CMake package consumption from other Hakoniwa components.

anti_usecases:
  - Public web APIs across many languages.
  - Generic streaming RPC workloads unrelated to Action Goal lifecycles.
  - Dynamic service discovery, authentication, tracing, or full service mesh requirements.
  - Treating Action transport failure as an implicit terminal Goal status.
  - Expecting the Action runtime to generate Goal IDs or provide an application scheduler.

