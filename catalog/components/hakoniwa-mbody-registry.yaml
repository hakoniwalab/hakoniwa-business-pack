id: hakoniwa-mbody-registry
name: Hakoniwa MBody Registry
repository:
  owner: hakoniwalab
  name: hakoniwa-mbody-registry
  url: https://github.com/hakoniwalab/hakoniwa-mbody-registry
  visibility: public

distribution:
  channel: oss
  notes:
    - Public OSS Hakoniwa component.
    - Upstream robot descriptions and meshes retain their upstream licenses when materialized locally.

verification:
  verified_at: 2026-07-25
  source_revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
  source_ref: main

summary: >-
  ROS-independent robot-body preparation and registry layer that materializes upstream
  robot descriptions, normalizes them into stable body artifacts, and can generate
  target-specific artifacts for MuJoCo, PDU, and Godot consumers without taking
  ownership of downstream runtime behavior.

category:
  primary: data-model
  secondary:
    - registry
    - robot-body
    - asset-generation
    - visualization-assets

status:
  maturity: active
  catalog_confidence: high
  notes:
    - Current responsibility boundary was re-reviewed after TurtleBot3, AgileX Tracer, and Shadow Hand cross-repository validation.
    - Artifact preparation/export belongs here; runtime lifecycle, control, transport, and synchronization behavior belong downstream.

capabilities:
  - name: Reproducible robot source materialization
    description: >
      Uses declarative sources/*.yaml entries, optionally pinned to an upstream revision,
      to materialize the robot-description inputs needed for conversion or direct use.
    evidence:
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: docs/local-source-materialization.md
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/fetch.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3

  - name: ROS-free Xacro and URDF normalization
    description: >
      Converts Xacro or Xacro-enabled URDF to plain URDF without a ROS runtime and can
      resolve ROS-style $(find PACKAGE) expressions from explicit --package NAME=PATH mappings.
    evidence:
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/xacro2urdf.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: docs/xacro-package-mapping.md
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3

  - name: Structural MJCF generation
    description: Converts normalized URDF into canonical MuJoCo XML for downstream preparation and runtime consumption.
    evidence:
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/urdf2mjcf.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3

  - name: Direct authoritative MJCF materialization
    description: >
      Supports forge.mode mjcf_passthrough for upstream projects that already provide
      authoritative MJCF, preserving the source tree and validating include/mesh closure
      instead of forcing a URDF conversion path.
    evidence:
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: docs/mjcf-passthrough.md
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/validate_mjcf_assets.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: sources/shadow_hand.yaml
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3

  - name: Mesh preprocessing for MuJoCo conversion
    description: >
      Can preprocess URDF-referenced COLLADA DAE meshes into OBJ and rewrite the URDF
      before MuJoCo compilation when the installed MuJoCo decoder cannot consume the source meshes.
    evidence:
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/urdf_dae2obj.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: sources/agilex_tracer.yaml
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3

  - name: MuJoCo target artifact preparation
    description: >
      Can add actuator definitions, collision primitives, contact excludes, and compose a
      minimal MuJoCo world from declarative robot-specific inputs while leaving runtime
      controller semantics and simulation lifecycle downstream.
    evidence:
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/mjcf_add_actuators.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/mjcf_apply_collision_primitives.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/mjcf_add_contact_excludes.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/mjcf_compose_world.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3

  - name: GLB and runtime-neutral view-model generation
    description: >
      Produces single or split GLB visual assets and a view-only model derived from
      structural body information for downstream visual runtimes.
    evidence:
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/mjcf2glb.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: docs/view-model.md
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3

  - name: Declarative PDU artifact generation
    description: Converts pdu-manifest.yaml into canonical pdutypes.json and compact pdu_def.json for downstream wiring.
    evidence:
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/pdu_manifest2types.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/pdu_manifest2def.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3

  - name: Godot target artifact generation
    description: >
      Generates robot-specific Godot scenes, endpoint config, and robot_sync.profile.json
      while hakoniwa-godot remains responsible for addon, endpoint, scene, and sync runtime behavior.
    evidence:
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/hako_godot_scene_gen.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/godot_sync2endpoint.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: tools/godot_sync2profile.py
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3

limitations:
  - Not a runtime simulator and does not own simulation stepping or runtime lifecycle.
  - Runtime actuator/control semantics belong to downstream MuJoCo-side runners such as hakoniwa-mujoco-robots.
  - PDU transport and endpoint runtime behavior are downstream responsibilities.
  - Godot addon, scene execution, endpoint integration, and synchronization behavior belong to hakoniwa-godot.
  - Successful artifact generation is not proof that a downstream runtime composition is behaviorally verified.
  - Third-party source material under bodies/{name}/source may need local materialization and is intentionally not committed.
  - tools/mjcf2pdu.py is a legacy body-list helper; new definitions should use pdu-manifest.yaml conversion tools.

interfaces:
  inputs:
    - name: Source definition
      kind: config
      description: sources/*.yaml declares upstream repository, revision, selected paths, and optional forge behavior.
    - name: Xacro or URDF source
      kind: file
      description: ROS-origin robot description used by the normal conversion flow.
    - name: Authoritative MJCF source
      kind: file
      description: Upstream MJCF tree used by forge.mode mjcf_passthrough.
    - name: Robot preparation configs
      kind: config
      description: Optional actuator, collision, contact, world, PDU, viewer, and Godot export inputs.
  outputs:
    - name: Normalized URDF
      kind: file
      description: Plain URDF produced by the ROS-free normalization path.
    - name: Structural or prepared MJCF
      kind: file
      description: Canonical MJCF and optional target-prepared variants such as actuated/collision/world artifacts.
    - name: Visual assets
      kind: file
      description: Single or split GLB artifacts and runtime-neutral view-model files.
    - name: PDU definitions
      kind: config
      description: Generated pdutypes.json and pdu_def.json from a declarative PDU manifest.
    - name: Godot export artifacts
      kind: file
      description: Generated .tscn scenes, endpoint config, and robot_sync.profile.json.
  protocols: []
  configuration:
    - path: sources/*.yaml
      description: Reproducible upstream source/materialization definitions.
    - path: bodies/<name>/config
      description: Robot-specific preparation and target-exporter inputs.

dependencies:
  required:
    - name: Python 3
      type: runtime
      notes: Used by the conversion, normalization, exporter, and validation tools.
    - name: requirements.txt packages
      type: package
      notes: Install into a repository-local virtual environment for the normal toolchain.
  optional:
    - name: Git
      type: tool
      notes: Required when fetch.py materializes upstream repositories.
    - name: MuJoCo
      type: runtime
      notes: Required for URDF-to-MJCF compilation and for validating generated MuJoCo artifacts.
    - name: Godot
      type: runtime
      notes: Required only for downstream consumption/validation of generated Godot artifacts.

connects_to:
  - component_id: hakoniwa-mujoco-robots
    direction: used_by
    interface: generated MJCF / prepared MuJoCo artifacts
    notes: MBody prepares artifacts; hakoniwa-mujoco-robots owns downstream simulation/control behavior.
  - component_id: hakoniwa-godot
    direction: used_by
    interface: GLB / view-model / scene / endpoint / sync-profile artifacts
    notes: MBody generates robot-specific artifacts; hakoniwa-godot owns runtime visualization and sync behavior.
  - component_id: hakoniwa-pdu-registry
    direction: related
    interface: registry pattern / PDU type conventions
    notes: MBody mirrors the reproducible-registry philosophy and can generate body-related PDU configuration artifacts.
  - component_id: hakoniwa-pdu-endpoint
    direction: related
    interface: generated endpoint and PDU definition artifacts
    notes: Endpoint runtime transport remains outside MBody.

recipe_roles:
  - role: registry
    description: Supplies reproducibly materialized robot-body sources and generated artifacts.
  - role: data_model
    description: Defines the physical robot-body side of a simulation composition.
  - role: asset_generator
    description: Normalizes and exports robot-specific artifacts for downstream consumers.
  - role: visualization_asset_source
    description: Provides GLB, view-model, and Godot-ready artifacts without owning the visual runtime.

typical_usecases:
  - Materialize a pinned upstream robot description and keep the preparation path reproducible.
  - Convert ROS-origin Xacro/URDF into structural MJCF and GLB without requiring a ROS runtime.
  - Consume an upstream authoritative MJCF model directly when URDF conversion is inappropriate.
  - Prepare MuJoCo-specific actuator/collision/world artifacts before handing them to a runtime runner.
  - Generate robot-specific PDU or Godot artifacts while keeping runtime behavior in downstream components.

anti_usecases:
  - Owning simulator lifecycle, stepping, or controller behavior.
  - Owning PDU transport, Endpoint runtime behavior, or time synchronization.
  - Treating successful conversion as proof of a verified runtime composition.
  - Using the legacy mjcf2pdu.py helper for new canonical PDU definitions when pdu-manifest.yaml is available.

demo_candidates:
  - name: TurtleBot3 forge and visual export
    description: Materialize TurtleBot3, generate structural MJCF and GLB/view-model artifacts, then hand target artifacts to downstream visual/runtime components.
    required_components:
      - hakoniwa-mbody-registry
    source_examples:
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: sources/turtlebot3_burger.yaml
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
  - name: AgileX Tracer prepared MuJoCo handoff
    description: Use the pinned Tracer source with source adaptation and DAE-to-OBJ preprocessing, generate structural/target-prepared MJCF, and hand it to hakoniwa-mujoco-robots for runtime validation.
    required_components:
      - hakoniwa-mbody-registry
      - hakoniwa-mujoco-robots
    source_examples:
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: sources/agilex_tracer.yaml
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
  - name: Shadow Hand direct MJCF materialization
    description: Materialize the pinned MuJoCo Menagerie Shadow Hand tree, validate include/mesh closure, and consume it downstream without committing third-party mesh assets.
    required_components:
      - hakoniwa-mbody-registry
    source_examples:
      - repository: hakoniwalab/hakoniwa-mbody-registry
        path: sources/shadow_hand.yaml
        revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3

