recipe_roles:
  - role: control_plane
    description: Owns virtual-show planning, start readiness, status, progression, and show-specific lifecycle behavior.
  - role: integration_boundary
    description: Composes fleet runtime, City World, browser viewer, wind scenario, and show-plan contracts without duplicating owner implementations.
  - role: visualizer
    description: Adds show-specific audience and AR presentation on top of generic Hakoniwa rendering components.
  - role: commercial_pack
    description: Provides the private commercial show-planning and execution layer required for Hakoniwa virtual drone shows.

typical_usecases:
  - Create a formation-based virtual drone show from a file-driven show definition.
  - Resolve formation point sets and assignments for a selected drone count.
  - Rehearse a show in a PLATEAU-derived City World before using the city as a visual or operational venue reference.
  - Compare the same show plan under deterministic wind scenarios.
  - Preview audience viewpoints and LED presentation in the browser.
  - Preview the virtual show through a mobile camera-overlay AR view.
  - Run large-fleet show demonstrations such as the recorded 128-drone, 6-process City baseline.

anti_usecases:
  - Real-world flight authorization or proof of regulatory compliance.
  - Treating simulation contacts as certified collision-risk probabilities or accident counts.
  - Treating Open-Meteo live values as aviation-grade weather input.
  - Replacing the underlying Drone PRO physics/control runtime, PLATEAU City generator, or generic viewer implementations.

