id: hakoniwa-mujoco-robots
name: Hakoniwa MuJoCo Robots
repository:
  owner: hakoniwalab
  name: hakoniwa-mujoco-robots
  url: https://github.com/hakoniwalab/hakoniwa-mujoco-robots
  visibility: public
distribution:
  channel: oss
  notes:
    - Public OSS Hakoniwa component.
verification:
  verified_at: 2026-08-30
  source_revision: f5946fa53e08a531a7e421a94280a9ddaa3233c6
  source_ref: main
summary: MuJoCo-based robot simulation assets for Hakoniwa, including TurtleBot3, sensor and actuator examples, Python controllers, and PDU integration.
category:
  primary: physics-environment
  secondary:
    - simulator
    - physics-runtime
    - robot-body
    - visualization
status:
  maturity: active
  catalog_confidence: high
  notes:
    - Cataloged from the public source tree, PDU adapters, sensor tests, build manifest, and component-owned build entry point.
    - Current main adds event-driven Twist and JointTrajectory readers, IMU body-frame regression coverage, and manifest-driven cross-platform build selection.
    - Current main also provides one manifest-driven Ackermann C++ asset for Golf Cart and Hunter V2, with PS5 operation and layered doctor/smoke/validate checks.
capabilities:
  - name: MuJoCo robot simulation
    description: Runs ROS/URDF-derived robot models such as TurtleBot3 Burger in MuJoCo.
    evidence:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: README.md
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Hakoniwa PDU integration
    description: Connects C++ MuJoCo simulators with Python controllers and visualizers through Hakoniwa PDU contracts.
    evidence:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: README.md
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Event-driven Twist command reader
    description: Provides a Twist event reader that resolves and registers a receive-event PDU channel, converts received payloads to typed Twist data, and exposes the latest pending command through take().
    evidence:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: include/hakoniwa/pdu/adapter/geometry_msgs/twist.hpp
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Event-driven JointTrajectory command reader
    description: Provides a JointTrajectory event reader that subscribes to endpoint receive events, converts PDU payloads into JointTrajectoryTarget values, and transfers the pending target to the robot runtime through take().
    evidence:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: include/hakoniwa/pdu/adapter/trajectory_msgs/joint_trajectory.hpp
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Sensor simulation
    description: Provides LiDAR, ultrasonic, color-camera, and IMU-oriented examples and tests, including configurable LiDAR noise profiles and IMU body-frame regression coverage.
    evidence:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: README.md
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: tests/sensors/imu/unit/imu_body_frame_velocity_test.cpp
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: models/sensors/imu/rotated-inertial-frame-test.xml
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Actuator examples
    description: Provides joint position and velocity actuator examples and reusable actuator components.
    evidence:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: README.md
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: MuJoCo-only robot actuator validation
    description: Supports validating generated robot MJCF, actuator JSON bindings, and finite MuJoCo execution before adding Hakoniwa Endpoint/PDU integration.
    evidence:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: examples/actuators/joint/README.md
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Rover Twist PDU runtime prototype
    description: Supports a staged mobile-base runtime pattern where a viewer-capable plant asset registers with Hakoniwa, a Python controller sends geometry_msgs/Twist, shared rover kinematics convert commands to wheel targets, and hako-cmd start begins synchronized simulation after registration.
    evidence:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: include/robots/rover/differential_drive_kinematics.hpp
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: examples/actuators/agilex_tracer/rover-twist-hakoniwa-asset.cpp
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: examples/actuators/agilex_tracer/send_rover_twist.py
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Manifest-driven cross-platform build entry point
    description: Uses hakoniwa-build.yaml and tools/hako.py to select an auto or repository-relative build directory and delegate doctor/build operations to the platform-native scripts.
    evidence:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: hakoniwa-build.yaml
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: tools/hako.py
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: tools/test_hako.py
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Manifest-driven Ackermann vehicle runtime
    description: >
      Runs different four-wheel Ackermann MJCF vehicles through one compiled
      Hakoniwa asset by resolving vehicle geometry, semantic joint/actuator
      bindings, control limits, and smoke criteria from schema-validated package files.
    evidence:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: docs/ackermann-asset-package.md
        revision: f5946fa53e08a531a7e421a94280a9ddaa3233c6
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: examples/actuators/generic_ackermann/generic-ackermann-hakoniwa-asset.cpp
        revision: f5946fa53e08a531a7e421a94280a9ddaa3233c6
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: tools/validate_ackermann_asset_package.py
        revision: f5946fa53e08a531a7e421a94280a9ddaa3233c6
  - name: Hunter V2 and Golf Cart PS5 recipes
    description: >
      Supplies shared game-controller PDU wiring and Launcher-managed runtime
      recipes for manual Ackermann operation, while retaining separate static
      doctor, fast dynamic smoke, and detailed MBody validation responsibilities.
    evidence:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: recipes/hunter/hunter-ackermann-ps5.yaml
        revision: f5946fa53e08a531a7e421a94280a9ddaa3233c6
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: tools/recipe/hunter.py
        revision: f5946fa53e08a531a7e421a94280a9ddaa3233c6
  - name: Forklift context and RD-light demos
    description: Includes forklift samples with context save/restore and advanced RD-light handoff.
    evidence:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: README.md
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
limitations:
  - Requires installed hakoniwa-core-pro and hakoniwa-pdu-endpoint for core Hakoniwa-integrated samples.
  - RD-light forklift handoff is advanced/experimental and not RD-full.
  - This repository provides robot simulation assets, not the canonical robot body conversion registry.
  - Event readers implement command-reception adapters; they do not by themselves define trajectory planning, collision avoidance, or controller safety policy.
  - IMU regression tests validate repository sensor/frame behavior under their test models; they are not a general sensor-accuracy or sim-to-real guarantee.
interfaces:
  inputs:
    - name: MuJoCo model XML
      kind: file
      description: Robot and environment models under models/.
    - name: PDU JSON config
      kind: config
      description: Channel/type/size contract for C++ simulator and Python tools.
    - name: Sensor config
      kind: config
      description: LiDAR and sensor specifications such as scan frequency, range, resolution, and noise model.
    - name: Controller commands
      kind: pdu
      description: Python controller output consumed by simulator.
    - name: Ackermann game-controller command
      kind: pdu
      description: PS5 axes carried through the shared GameControllerOperation PDU and converted to speed and Ackermann steering targets.
    - name: Rover Twist command
      kind: pdu
      description: geometry_msgs/Twist command input for mobile-base linear.x/angular.z control.
    - name: JointTrajectory command
      kind: pdu
      description: trajectory_msgs/JointTrajectory command consumed through the event-reader adapter and converted into a JointTrajectoryTarget.
    - name: Build manifest
      kind: config
      description: hakoniwa-build.yaml version 1 selects the build directory policy used by tools/hako.py.
  outputs:
    - name: Robot state PDU
      kind: pdu
      description: Simulation state, sensor, and actuator-related PDU outputs.
    - name: LaserScan-compatible PDU
      kind: pdu
      description: 2D LiDAR output for visualization and controller use.
    - name: Logs and temporary state
      kind: file
      description: Generated logs and context/state files.
  protocols:
    - name: Hakoniwa PDU
      role: local
      notes: Shared runtime contract between MuJoCo C++ simulator and Python tools, including event-driven command reception where configured.
  configuration:
    - path: config
      description: PDU, sensor, actuator, and sample configs.
    - path: config/sensors
      description: LiDAR and sensor spec JSON files.
    - path: examples
      description: Standalone sensor and actuator examples.
    - path: hakoniwa-build.yaml
      description: Component-owned build-directory manifest consumed by tools/hako.py.
dependencies:
  required:
    - name: hakoniwa-core-pro
      type: repository
      notes: Required runtime for synchronization and hako-cmd.
    - name: hakoniwa-pdu-endpoint
      type: repository
      notes: Required installed C++ endpoint package.
    - name: MuJoCo
      type: runtime
      notes: Physics engine for robot simulation.
    - name: C++ toolchain
      type: tool
      notes: Required for simulator build.
    - name: Python
      type: runtime
      notes: Required for controllers, visualizers, and the component-owned build entry point.
  optional:
    - name: Gamepad
      type: runtime
      notes: Used by TurtleBot3 gamepad control sample.
    - name: Docker
      type: runtime
      notes: Docker scripts are provided.
platforms:
  supported:
    - macOS
    - Linux
    - Windows
  notes:
    - Component-owned build CI exercises the common hako.py build entry point on Ubuntu, macOS, and Windows.
    - Platform-specific native scripts remain implementation details behind tools/hako.py.
connects_to:
  - component_id: hakoniwa-core-pro
    direction: uses
    interface: runtime sync / hako-cmd / PDU runtime
    notes: Required for simulator start and synchronization.
  - component_id: hakoniwa-pdu-endpoint
    direction: uses
    interface: installed endpoint package and receive-event callbacks
    notes: Required for PDU endpoint linkage and event-driven Twist/JointTrajectory reception.
  - component_id: hakoniwa-pdu-registry
    direction: uses
    interface: PDU types and converters
    notes: PDU JSON contracts and converters must match registry-defined types.
  - component_id: hakoniwa-mbody-registry
    direction: related
    interface: generated MJCF / GLB / PDU configs
    notes: MBody registry can supply robot body artifacts consumed by MuJoCo recipes.
  - component_id: hakoniwa-godot
    direction: related
    interface: PDU robot visualization path
    notes: Godot can visualize robot state produced by MuJoCo through endpoint/PDU sync.
data_contracts:
  - name: PDU JSON contract
    description: C++ simulator and Python controller/visualizer share channel/type/size contracts through PDU JSON.
    source:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: README.md
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Event-driven command contract
    description: Twist and JointTrajectory event readers resolve a PDU channel, register it as a receive event, subscribe a callback, convert received payloads into typed command values, and expose pending values through take() for consumption by the simulation runtime.
    source:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: include/hakoniwa/pdu/adapter/geometry_msgs/twist.hpp
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: include/hakoniwa/pdu/adapter/trajectory_msgs/joint_trajectory.hpp
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Sensor config contract
    description: Sensor behavior such as LiDAR scan frequency, angular range, resolution, and noise model is loaded from JSON.
    source:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: docs/spec/sensor-actuator-config-schema.md
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Build manifest contract
    description: hakoniwa-build.yaml version 1 contains a build.dir value that is either auto or a repository-relative path; tools/hako.py validates the manifest and delegates doctor/build to the native platform script.
    source:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: hakoniwa-build.yaml
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: tools/hako.py
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
recipe_roles:
  - role: physics_runtime
    description: Simulates robot physics and sensors.
  - role: simulation_core
    description: Participates as a Hakoniwa asset in synchronized simulation.
  - role: visualizer
    description: Provides Python visualizers for LiDAR and other inspection paths.
typical_usecases:
  - Run TurtleBot3 with gamepad control and 2D LiDAR.
  - Compare LiDAR noise profiles for Sim2Real validation.
  - Test standalone MuJoCo sensor or actuator behavior.
  - Receive event-driven Twist or JointTrajectory commands in a Hakoniwa-integrated MuJoCo robot asset.
  - Validate a newly converted robot body with MuJoCo-only actuator smoke before Hakoniwa PDU wiring.
  - Validate a rover/mobile-base Twist command path after plant and controller assets register, then start with hako-cmd.
  - Generate and validate Golf Cart or Hunter V2, then operate the selected Ackermann package with a PS5 controller.
  - Demonstrate forklift context save/restore and RD-light handoff.
anti_usecases:
  - Pure robot body conversion without running MuJoCo.
  - Browser-only visualization.
  - Environment field modeling such as wind or radio strength.
  - Treating command adapters as a complete motion planner or robot safety system.
demo_candidates:
  - name: TurtleBot3 gamepad and LiDAR
    description: Run tb3_sim, Python gamepad controller, LiDAR visualizer, then start with hako-cmd.
    required_components:
      - hakoniwa-mujoco-robots
      - hakoniwa-core-pro
      - hakoniwa-pdu-endpoint
    source_examples:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: README.md
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Forklift unit sample
    description: Run forklift_unit_sim with Python forklift_simple_auto controller and hako-cmd start.
    required_components:
      - hakoniwa-mujoco-robots
      - hakoniwa-core-pro
    source_examples:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: README.md
        revision: fa2dd37eb58597a47b1b4788f931da19ef09aab6
  - name: Hunter V2 PS5 Ackermann operation
    description: Forge the pinned Hunter body in MBody, validate its package and dynamics, then run the shared Ackermann asset through Launcher with a PS5 controller.
    required_components:
      - hakoniwa-mujoco-robots
      - hakoniwa-mbody-registry
      - hakoniwa-core-pro
      - hakoniwa-pdu-endpoint
    source_examples:
      - repository: hakoniwalab/hakoniwa-mujoco-robots
        path: recipes/hunter/README.md
        revision: f5946fa53e08a531a7e421a94280a9ddaa3233c6
runtime_checks:
  - id: build-readiness
    kind: doctor
    platforms:
      - macos
      - linux
      - windows
    command:
      - python
      - tools/hako.py
      - doctor
    working_directory: repository
    output: text
    notes:
      - Cross-platform component-owned entry point. On macOS/Linux it delegates to doctor.bash; on Windows it delegates to build-win.ps1 -DoctorOnly.
      - Exit status 0 means the environment passed the declared preflight; this is not behavioral verification of a complete Recipe.
operations:
  build:
    commands:
      - python tools/hako.py doctor
      - python tools/hako.py build
    notes:
      - tools/hako.py validates hakoniwa-build.yaml and is the preferred OS-independent entry point; native build scripts remain available for low-level debugging.
  test:
    commands:
      - python3.12 tools/recipe/hunter.py doctor
      - python3.12 tools/recipe/hunter.py smoke
      - python3.12 tools/recipe/hunter.py validate
    notes: doctor checks static package/schema/binding readiness, smoke performs a fast shared-C++ idle/straight/turn run, and validate delegates detailed scoring to MBody.
  run:
    commands:
      - ./src/cmake-build/main_for_sample/tb3/tb3_sim
      - python python/tb3_gamepad.py
      - python python/lidar_visualizer.py
      - hako-cmd start
    notes:
      - TurtleBot3 quick start uses multiple processes/terminals.
known_gaps:
  - Need to map individual examples/sensors and examples/actuators into recipe fragments.
  - Event-driven JointTrajectory reception is an adapter capability; end-to-end arm command execution remains a Recipe-level integration concern.
