id: hakoniwa-pdu-python
name: Hakoniwa PDU Python
repository:
  owner: hakoniwalab
  name: hakoniwa-pdu-python
  url: https://github.com/hakoniwalab/hakoniwa-pdu-python
  visibility: public
distribution:
  channel: oss
  package: hakoniwa-pdu
  version: 1.6.6
  notes:
    - Public OSS Hakoniwa component distributed as hakoniwa-pdu on PyPI.
verification:
  verified_at: 2026-08-08
  source_revision: 4e62403481afe3b5e0272eb822c47cbff9c38933
  source_ref: main
summary: Python PDU package providing generated type and offset-based binary conversion independently of Hakoniwa Core, with optional WebSocket, shared-memory, RPC, and Launcher runtime capabilities.
category:
  primary: language-binding
  secondary:
    - integration
    - rpc
    - browser
status:
  maturity: active
  catalog_confidence: high
  notes:
    - Core-free packet conversion and Core-dependent runtime integration are separate capability profiles.
    - The package does not install hakopy, hako-cmd, or Hakoniwa Core by itself.
capabilities:
  - name: Python PDU communication
    description: Provides Python APIs for Hakoniwa PDU topic and RPC communication.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: README.md
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
  - name: Core-free generated PDU types and binary conversion
    description: Generated Python packet classes, offset metadata, and binary/JSON/Python conversion can be used without importing hakopy or running Hakoniwa Core.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: README.md
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: pyproject.toml
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
  - name: Generated Action PDU types
    description: Version 1.6.6 and later include hako_action_msgs headers and sample_action_msgs/Fibonacci Goal, Feedback, Result, and Action packet converters used by the typed Action APIs.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: src/hakoniwa_pdu/pdu_msgs/hako_action_msgs
        revision: 4e62403481afe3b5e0272eb822c47cbff9c38933
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: src/hakoniwa_pdu/pdu_msgs/sample_action_msgs
        revision: 4e62403481afe3b5e0272eb822c47cbff9c38933
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: pyproject.toml
        revision: 4e62403481afe3b5e0272eb822c47cbff9c38933
  - name: WebSocket topic and RPC support
    description: Runs Pub/Sub topics and RPC over WebSocket with ready-to-run Twist and AddTwoInts examples.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: README.md
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
  - name: SHM backend
    description: Supports high-speed shared-memory communication paths and async shared SHM RPC runtime when a compatible Hakoniwa runtime is available.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: README.md
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
  - name: Event-driven and polling APIs
    description: Supports registering PDU handlers or polling internal buffers.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: README.md
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
  - name: Hakoniwa Launcher application
    description: Provides the installed hako_launcher entry point for orchestrating multiple Hakoniwa assets from JSON.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: src/hakoniwa_pdu/apps/launcher
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
  - name: Launcher background lifecycle control
    description: Starts a Launcher with an explicit session file and provides OS-independent status and graceful termination through the Launcher control endpoint.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: docs/launcher-background-lifecycle.md
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
limitations:
  - Offset files are required for binary conversion and are resolved through HAKO_BINARY_PATH or an installed offset path.
  - WebSocket URI scope must be explicitly configured.
  - This is a Python-facing package, not the C++ Endpoint abstraction.
  - hakopy, hako-cmd, local shared memory, and simulation lifecycle require a compatible Hakoniwa Core installation; they are not prerequisites for generated packet conversion alone.
  - Current Business Pack Foundation metadata does not yet expose separate core-free-conversion and core-integrated-runtime install profiles or Receipts.
interfaces:
  inputs:
    - name: PDU config
      kind: config
      description: Compact or legacy PDU config defining robot, PDU name, channel ID, size, and type mapping.
    - name: Service config
      kind: config
      description: RPC service configuration.
    - name: Offset files
      kind: file
      description: .offset files used for binary conversion.
    - name: WebSocket URI
      kind: protocol
      description: ws:// URI used for remote topic or RPC communication.
  outputs:
    - name: Python typed PDU objects
      kind: api
      description: Python objects converted from binary or JSON PDU payloads.
    - name: PDU payloads
      kind: pdu
      description: Binary payloads sent over WebSocket or SHM backends.
    - name: Typed Action packet objects
      kind: api
      description: Generated Goal, Feedback, Result, ActionRequest, ActionResponse, and ActionFeedback Python objects; sample_action_msgs/Fibonacci requires hakoniwa-pdu 1.6.6 or later.
  protocols:
    - name: WebSocket
      role: client
      notes: Used for remote topics and RPC examples.
    - name: Shared Memory
      role: local
      notes: Optional Core-integrated local backend.
  configuration:
    - path: examples/pdu_config.json
      description: Example PDU config.
    - path: examples/service.json
      description: Example service config.
    - path: docs/rpc/async_shared_runtime.md
      description: Shared SHM RPC runtime design notes.
    - path: src/hakoniwa_pdu/apps/launcher/schemas/launcher.schema.json
      description: Launcher JSON schema.
dependencies:
  required:
    - name: Python
      type: runtime
      notes: Python 3.12 is the expected runtime unless a Recipe verifies another version.
    - name: hakoniwa-pdu package
      type: package
      notes: Install with pip install hakoniwa-pdu.
    - name: hakoniwa-pdu-registry offsets
      type: repository
      notes: Offset definitions and generated types are required for conversion.
  optional:
    - name: hakoniwa-core-pro
      type: repository
      notes: Required only for hakopy, hako-cmd, local SHM runtime, and Core-integrated Launcher workflows.
    - name: WebSocket bridge/server
      type: runtime
      notes: Required for WebSocket examples.
    - name: Hakoniwa SHM runtime
      type: runtime
      notes: Required for SHM backend.
platforms:
  supported:
    - macOS
    - Linux
    - Windows
  notes:
    - Python 3.12 is the expected runtime for Hakoniwa Recipes using this package unless another version is explicitly verified.
    - Python package artifacts remain platform-independent only where they contain no host-native extension; native dependencies are validated separately.
connects_to:
  - component_id: hakoniwa-pdu-registry
    direction: uses
    interface: offset files / generated Python types
    notes: Registry artifacts enable binary conversion.
  - component_id: hakoniwa-pdu-bridge-core
    direction: related
    interface: WebSocket bridge
    notes: Python clients can communicate through WebSocket bridge paths.
  - component_id: hakoniwa-pdu-endpoint
    direction: related
    interface: PDU semantics / optional native transport integration
    notes: Separate Python-oriented stack that shares generated PDU contracts with Endpoint.
  - component_id: hakoniwa-core-pro
    direction: related
    interface: optional hako-cmd / hakopy / SHM runtime
    notes: Core is optional for packet conversion and required for Core-integrated runtime capabilities.
  - component_id: hakoniwa-mujoco-robots
    direction: used_by
    interface: Python controllers and visualizers
    notes: MuJoCo robot samples use Python controllers and visualizers over Hakoniwa PDU.
data_contracts:
  - name: Compact PDU config
    description: paths plus robots[].pdutypes_id format is the recommended PDU config style.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: README.md
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
  - name: Offset-based binary conversion
    description: HAKO_BINARY_PATH or an installed offset path supplies definitions used to convert binary PDU payloads without requiring Core runtime state.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: README.md
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
  - name: Launcher JSON contract
    description: The Launcher uses assets, activation timing, dependencies, environment operations, log paths, and lifecycle monitoring.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: src/hakoniwa_pdu/apps/launcher
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
recipe_roles:
  - role: language_binding
    description: Provides Python access to generated Hakoniwa PDU types and communication APIs.
  - role: communication_infrastructure
    description: Supplies optional WebSocket and SHM communication managers.
  - role: control_plane
    description: Supports Python RPC and Launcher-managed demo lifecycle.
typical_usecases:
  - Convert generated service or topic PDU packets without installing Hakoniwa Core.
  - Build Python controllers, visualizers, or tools for Hakoniwa simulations.
  - Run WebSocket topic or RPC demos.
  - Use shared SHM RPC when a Core runtime is intentionally present.
  - Launch multi-process Hakoniwa demos from Python.
anti_usecases:
  - C++ Endpoint integration.
  - Browser or Node.js clients.
  - PDU type generation.
  - Treating packet conversion as requiring hakopy or Core.
  - Assuming the package installs Hakoniwa Core by itself.
demo_candidates:
  - name: Core-free AddTwoInts packet conversion
    description: Import generated AddTwoInts packet classes, encode and decode request/response bodies from offsets, and verify no hakopy import or Core process is required.
    required_components:
      - hakoniwa-pdu-python
      - hakoniwa-pdu-registry
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: README.md
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
  - name: WebSocket AddTwoInts RPC
    description: Run remote RPC server and client and verify the response.
    required_components:
      - hakoniwa-pdu-python
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: examples/rpc/websocket
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
  - name: Hakoniwa Launcher smoke run
    description: Run hako_launcher with a known-good Recipe and verify ordering, hako-cmd start, logs, and cleanup.
    required_components:
      - hakoniwa-pdu-python
      - hakoniwa-core-pro
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-python
        path: src/hakoniwa_pdu/apps/launcher
        revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
operations:
  build:
    commands:
      - pip install hakoniwa-pdu
    notes:
      - Set HAKO_BINARY_PATH when using custom offset files.
      - hakopy is not required for the core-free conversion profile.
  test:
    commands: []
    notes: Exact local core-free and Core-integrated test commands should be cataloged separately.
  run:
    commands:
      - python -c "import hakoniwa_pdu"
      - python -m hakoniwa_pdu.apps.launcher.hako_launcher path/to/launch.json
    notes:
      - Launcher runs require hako-cmd and referenced asset commands.
known_gaps:
  - Define Business Pack install profiles and Receipt capabilities for core_free_runtime, generated_service_types, offset_binary_conversion, and optional core_integrated_runtime.
  - Add an exact local core-free AddTwoInts conversion test command.
  - Map app-specific Python modules such as drone subpackages.
source_refs:
  - repository: hakoniwalab/hakoniwa-pdu-python
    path: README.md
    revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
    description: Features, installation, quick starts, event handling, conversion, and project structure.
  - repository: hakoniwalab/hakoniwa-pdu-python
    path: pyproject.toml
    revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
    description: Python package metadata and package data.
  - repository: hakoniwalab/hakoniwa-pdu-python
    path: docs/rpc/async_shared_runtime.md
    revision: f7dc60ca0d8b37cf4b7343d81d17464a86fa2802
    description: Optional shared-memory RPC runtime.
tags:
  - hakoniwa
  - python
  - pdu
  - core-free
  - websocket
  - shm
  - rpc
  - conversion
  - launcher
