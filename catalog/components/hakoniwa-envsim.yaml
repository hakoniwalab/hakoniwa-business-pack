id: hakoniwa-envsim
name: Hakoniwa Envsim
repository:
  owner: hakoniwalab
  name: hakoniwa-envsim
  url: https://github.com/hakoniwalab/hakoniwa-envsim
  visibility: public

distribution:
  channel: oss
  notes:
    - Public OSS Hakoniwa component.

verification:
  verified_at: 2026-08-29
  source_revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90
  source_ref: main

summary: >
  Environment modeling and PLATEAU City World generation toolkit. It models runtime
  environmental fields and converts PLATEAU CityGML into aligned GLB visual assets and
  MuJoCo physics assets for terrain, roads, buildings, available road markings, and
  optional bridges.

category:
  primary: physics-environment
  secondary:
    - environment-model
    - visualization
    - integration

status:
  maturity: active
  catalog_confidence: high
  notes:
    - Catalog claims are based on source, schemas, documentation, conversion tests, and recorded PLATEAU pipeline behavior.
    - No claim is made here that every PLATEAU dataset provides every optional feature or LOD.

capabilities:
  - name: Creator environment model
    description: Defines environmental conditions such as wind, temperature, pressure, GPS strength, local zones, turbulence, and priorities in human-authored JSON.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: README.md
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90

  - name: Runtime environment lookup
    description: Resolves environment values by simulated position and can publish per-drone Disturbance PDU data through the HakoEnv runtime asset.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/hakoniwa_envsim/envasset.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/hakoniwa_envsim/asset/drone_io.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90

  - name: PLATEAU City World generation
    description: Generates a query-centered City World from PLATEAU building, transportation, DEM, optional CityFurniture, and optional bridge data, producing aligned visual and physics assets under one world-frame contract.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/city_world_composer.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90
      - repository: hakoniwalab/hakoniwa-envsim
        path: docs/hakoniwa-build-reference.md
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90

  - name: PLATEAU GLB visual generation
    description: Produces self-contained GLB visual assets using the highest available supported building LOD, embedded textures when available, terrain, semantic roads, available source-derived road markings, and optional bridge visuals.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/citygml2glb.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/bridge2glb.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90

  - name: Selectable building physics levels
    description: Classifies each building into P0 through P3 collision strategies and lets users cap the applied physics level independently from visual LOD.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: docs/building-physics-classification.md
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/building_physics_classifier.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90

  - name: Semantic building collision generation
    description: Uses lightweight LOD1 OBB or wall-and-roof collision for P0 and progressively incorporates LOD2 RoofSurface, WallSurface, OuterCeilingSurface, and OuterFloorSurface where higher physics classes require them.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: docs/building-physics-classification.md
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/building_lod2_colliders.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90

  - name: Building collider reduction
    description: Reduces P1-P3 collider counts using selectable safe, coplanar-union, convex-decompose, or tolerant-planar strategies while keeping visual geometry unchanged; tolerant-planar is the only mode that intentionally permits bounded wall-surface approximation.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: docs/hakoniwa-build-reference.md
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/building_tolerant_planar.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90

  - name: Bridge visual and physics assets
    description: Optionally converts PLATEAU bridge data to GLB and MuJoCo assets, including usable bridge-surface collision where the source geometry satisfies the configured slope and geometry constraints.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/bridge2glb.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/bridge2mjcf.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90

  - name: Scalable City World generation controls
    description: Supports arbitrary selection extents, configurable parallel workers for source and component generation, dedicated bounded DEM extraction workers, streaming DEM TIN scanning, and configurable terrain spacing.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: docs/hakoniwa-build-reference.md
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/dem2hfield.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90

  - name: Optional DEM uncovered-area fill
    description: Supports an explicit constant-fill policy for uncovered DEM areas when configured; missing terrain is not silently invented by default.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/dem2hfield.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90

  - name: PLATEAU dataset capability validation
    description: Reports available components, selected LODs and fallbacks, omitted optional features, and the resulting visualization and collision capabilities as machine-readable evidence.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/city_dataset_validator.py
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90

limitations:
  - Not a robot or drone dynamics simulator by itself.
  - PLATEAU City World fidelity depends on the source dataset, available feature types, LODs, semantic surfaces, textures, and DEM coverage.
  - P0-P3 is a Hakoniwa Envsim collision-strategy classification, not an official PLATEAU or CityGML classification and not a geometric proof of physical equivalence.
  - Higher building physics levels preserve more source semantic structure but can increase MuJoCo geom and contact-processing cost.
  - Collider reduction is designed to bound or avoid geometric changes according to the selected strategy; it does not establish CAD-level collision accuracy.
  - Bridge collision is generated only from source surfaces considered usable by the implemented rules; it does not prove trafficability or structural safety.
  - Constant DEM fill is an explicit approximation policy and must not be presented as measured terrain.
  - PLATEAU Distribution Service is external; local conversion tests do not guarantee service availability.
  - HakoEnv currently writes a complete Disturbance message and may conflict with another producer that owns fields in the same message.

interfaces:
  inputs:
    - name: Creator environment model
      kind: config
      description: JSON environment model containing base conditions and local zones.
    - name: PLATEAU build manifest
      kind: config
      description: hakoniwa-build.yaml selecting source feature types, geographic extent, geometry policy, building physics level, collider reduction, GLB policy, City World generation settings, and output paths.
    - name: PLATEAU geographic selection
      kind: config
      description: Latitude, longitude, and independent north/south and east/west metric half extents.
    - name: Drone position
      kind: pdu
      description: Per-drone position PDU consumed by HakoEnv.
  outputs:
    - name: PLATEAU City World MJCF
      kind: file
      description: MuJoCo physics world containing configured terrain, building collision, roads where applicable, and optional bridge collision assets.
    - name: PLATEAU City World GLB
      kind: file
      description: Aligned visual world containing terrain, roads, available road markings, buildings, and optional bridges.
    - name: Dataset capability report
      kind: file
      description: Machine-readable report describing available data, LOD choices and fallbacks, omitted features, and generated capabilities.
    - name: Physics receipts
      kind: file
      description: Records classification, collision-generation decisions, reduction behavior, and generation evidence for PLATEAU physics assets.
    - name: Drone disturbance
      kind: pdu
      description: Environment-derived disturbance message written per configured drone.
  protocols:
    - name: PLATEAU Distribution Service REST API
      role: client
      notes: Used during explicit build operations to search and download configured CityGML source data.
    - name: Hakoniwa PDU
      role: pubsub
      notes: Used by HakoEnv to read position and publish disturbance data.
  configuration:
    - path: hakoniwa-build.yaml
      description: Main PLATEAU acquisition and asset-generation manifest.
    - path: schemas/hakoniwa-build.schema.json
      description: Machine-readable build-manifest schema.
    - path: docs/hakoniwa-build-reference.md
      description: Human-readable reference for all PLATEAU build settings.
    - path: docs/building-physics-classification.md
      description: P0-P3 building collision classification and fidelity contract.

dependencies:
  required:
    - name: Python
      type: runtime
      notes: Used by environment modeling and PLATEAU conversion tools.
    - name: NumPy
      type: runtime
      notes: Used by geometry and terrain processing.
    - name: Shapely
      type: runtime
      notes: Used by footprint and polygon geometry processing.
  optional:
    - name: MuJoCo
      type: runtime
      notes: Required to execute generated MJCF physics assets, but not to author the source PLATEAU dataset.

platforms:
  supported:
    - macOS
    - Linux
    - Windows
  notes:
    - The Python PLATEAU conversion entrypoint is not shell-specific.
    - Actual runtime support for HakoEnv and generated MuJoCo worlds also depends on the corresponding Hakoniwa and MuJoCo runtime environment.

connects_to:
  - component_id: hakoniwa-core-pro
    direction: related
    interface: simulation integration target
    notes: Generated environment and runtime assets can participate in Hakoniwa simulations.
  - component_id: hakoniwa-pdu-registry
    direction: uses
    interface: position and Disturbance PDU contracts
    notes: HakoEnv reads position and writes disturbance data.
  - component_id: hakoniwa-drone-core
    direction: bidirectional
    interface: per-drone position and disturbance PDU
    notes: Environment fields can be supplied to the Hakoniwa Drone Core/PRO codebase through Disturbance; commercial use follows the Drone PRO license path represented by the dual-license component Catalog.
  - component_id: hakoniwa-mujoco-robots
    direction: used_by
    interface: generated MuJoCo world assets
    notes: PLATEAU City World physics can be composed with MuJoCo robot and drone simulation assets.

recipe_roles:
  - role: environment_model
    description: Supplies environmental fields such as wind, temperature, pressure, GPS strength, and local zones.
  - role: asset_generator
    description: Converts PLATEAU data into aligned visual and physics City World assets.
  - role: visualizer
    description: Supplies GLB city assets for external viewers.
  - role: integration_boundary
    description: Maps simulated positions to runtime environment values and disturbance PDU data.

typical_usecases:
  - Generate a PLATEAU-derived city environment for drone or robot simulation.
  - Use detailed visual geometry and independently selectable collision fidelity in the same city world.
  - Preserve roofs, walls, overhang undersides, and external floors when the source LOD2 semantics require them.
  - Reduce collider counts when full semantic collision would be too expensive for the intended simulation scale.
  - Generate terrain and roads for construction-machine or ground-robot simulation.
  - Include bridge visuals and usable bridge-surface collision when bridge data is available.
  - Define position-dependent wind, GPS, temperature, pressure, and turbulence scenarios.

anti_usecases:
  - Safety certification based solely on generated collision geometry.
  - Treating PLATEAU visual LOD as automatically equivalent to simulation physics fidelity.
  - Assuming missing terrain, road markings, bridge surfaces, or semantic building features exist when the source dataset does not provide them.
  - Robot-body modeling or dynamics simulation by itself.

demo_candidates:
  - name: PLATEAU City World visual and physics generation
    description: Build the configured geographic selection into aligned GLB visual and MuJoCo physics assets, inspect the dataset capability report, and compare building physics levels without changing visual LOD.
    required_components:
      - hakoniwa-envsim
    source_examples:
      - repository: hakoniwalab/hakoniwa-envsim
        path: hakoniwa-build.yaml
        revision: b4bb4429708677b7c3e61310c6b9c07efbd4df90

operations:
  build:
    commands:
      - python tools/hako.py build
    notes: Downloads configured PLATEAU source data when needed and materializes City World assets and receipts.
  test:
    commands:
      - python tools/hako.py test
      - python tools/hako.py smoke
    notes: Catalog does not infer CI status from these commands; they are the component-owned test and smoke entrypoints.
  run:
    commands:
      - python tools/hako.py doctor
      - python tools/hako.py configure
      - python tools/hako.py install
    notes: Doctor and configure validate local readiness and configuration; build performs acquisition and generation; install publishes generated assets under the configured prefix.

known_gaps:
  - Measure end-to-end City World generation cost across representative city sizes and hardware instead of assuming worker-count scaling.
  - Continue validating P0-P3 classification and collider-reduction tradeoffs against representative PLATEAU datasets.
  - Define multi-producer ownership or preservation rules for shared Disturbance fields.

