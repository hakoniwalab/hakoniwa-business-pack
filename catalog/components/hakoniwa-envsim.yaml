id: hakoniwa-envsim
name: Hakoniwa Envsim
repository:
  owner: hakoniwalab
  name: hakoniwa-envsim
  url: https://github.com/hakoniwalab/hakoniwa-envsim
  visibility: public
distribution:
  channel: oss
  notes:
    - Public OSS Hakoniwa component.
verification:
  verified_at: 2026-08-23
  source_revision: 97801f11bbe3678b6ba248ba2d78901efd9adf61
  source_ref: main
summary: Environment modeling toolkit for creating, visualizing, refining, and querying environmental factors such as wind, temperature, pressure, GPS strength, and boundaries.
category:
  primary: physics-environment
  secondary:
    - environment-model
    - visualization
    - integration

status:
  maturity: active
  catalog_confidence: high
  notes:
    - Cataloged from source, schemas, component-owned hako.py, offline smoke, and an official PLATEAU API E2E run.

capabilities:
  - name: Creator environment model
    description: Lets users define intuitive JSON environment models with base conditions and local zones.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: README.md
        revision: e9a808756f2fbba05b9fa35e9df84fd977f2a22e
  - name: Environment visualization
    description: Supports visualizing environmental data with colors, arrows, and simple Python tooling.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: README.md
        revision: e9a808756f2fbba05b9fa35e9df84fd977f2a22e
  - name: Runtime model refinement
    description: Converts human-authored creator models into execution-oriented split models for simulation use.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: README.md
        revision: e9a808756f2fbba05b9fa35e9df84fd977f2a22e
  - name: Fast position lookup
    description: Provides a fast-search approach for mapping positions to environment values in large area models.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: README.md
        revision: e9a808756f2fbba05b9fa35e9df84fd977f2a22e
  - name: Kobe port sample scenario
    description: Includes an example environment model with base wind, temperature, GPS strength, local zones, turbulence, and priorities.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: README.md
        revision: e9a808756f2fbba05b9fa35e9df84fd977f2a22e
  - name: PLATEAU range-to-MuJoCo wall conversion
    description: Resolves building CityGML from latitude, longitude, and metric half extents through the official PLATEAU API, then generates a query-centered MuJoCo wall MJCF.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: tools/hako.py
        revision: 97801f11bbe3678b6ba248ba2d78901efd9adf61
      - repository: hakoniwalab/hakoniwa-envsim
        path: docs/plateau-citygml-to-mujoco.md
        revision: 97801f11bbe3678b6ba248ba2d78901efd9adf61
  - name: Hakoniwa environment runtime asset
    description: Registers HakoEnv, reads each drone pos PDU, resolves environment values by position, and writes the drone disturb PDU.
    evidence:
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/hakoniwa_envsim/envasset.py
        revision: e9a808756f2fbba05b9fa35e9df84fd977f2a22e
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/hakoniwa_envsim/asset/drone_io.py
        revision: e9a808756f2fbba05b9fa35e9df84fd977f2a22e

limitations:
  - Not a robot physics simulator.
  - The PLATEAU converter currently consumes building LOD1 geometry from EPSG:6697; other feature types and CRS contracts are outside the verified path.
  - PLATEAU Distribution Service is an external trial API; offline tests validate local conversion, not API availability.
  - HakoEnv currently writes a complete Disturbance message and may overwrite custom slots owned by another producer; shared-writer arbitration remains a known gap.
  - Creator schema and implementation inconsistencies outside the PLATEAU path remain to be resolved.

interfaces:
  inputs:
    - name: Creator environment model
      kind: config
      description: JSON model with version, meta, grid, base, and zones.
    - name: Runtime area/property/link models
      kind: config
      description: Split execution model JSON for simulation-efficient lookup.
    - name: PLATEAU geographic selection
      kind: config
      description: Latitude, longitude, north/south and east/west half extents, dataset-year policy, and wall conversion parameters in hakoniwa-build.yaml.
    - name: Drone position
      kind: pdu
      description: Per-drone pos PDU read by the HakoEnv runtime asset.
  outputs:
    - name: Visualized environment
      kind: file
      description: Human-readable visual representations of environmental fields.
    - name: Position-to-environment query results
      kind: api
      description: Environment values such as wind or GPS strength for a given position.
    - name: PLATEAU MuJoCo wall model
      kind: file
      description: Query-centered MJCF with building OBB or exterior-wall box geoms.
    - name: Drone disturbance
      kind: pdu
      description: Per-drone disturb PDU written by HakoEnv.
  protocols:
    - name: PLATEAU Distribution Service REST API
      role: client
      notes: Used only by an explicit hako.py build to search and download bldg CityGML.
    - name: Hakoniwa PDU
      role: pubsub
      notes: HakoEnv reads pos and writes disturb for each configured drone.
  configuration:
    - path: src/hakoniwa_envsim/schemas/environment_model.schema.json
      description: Creator model schema.
    - path: src/hakoniwa_envsim/schemas/space_area.schema.json
      description: Runtime space area schema.
    - path: src/hakoniwa_envsim/schemas/area_properties.schema.json
      description: Runtime property schema.
    - path: src/hakoniwa_envsim/schemas/link.schema.json
      description: Runtime area/property link schema.
    - path: examples/datasets/kobe/environment_model.json
      description: Kobe port sample model.
    - path: hakoniwa-build.yaml
      description: PLATEAU range selection and MuJoCo wall conversion manifest.
    - path: schemas/hakoniwa-build.schema.json
      description: Machine-readable schema for the PLATEAU acquisition and conversion manifest.

dependencies:
  required:
    - name: Python
      type: runtime
      notes: Used by model, fast search, visualization, and pipeline tools.
    - name: NumPy
      type: runtime
      notes: Used by LOD1 footprint and OBB/wall conversion.
    - name: Shapely
      type: runtime
      notes: Owns deterministic footprint hull ordering, which is part of the generated building geom-ID contract.
  optional: []

platforms:
  supported:
    - macOS
    - Linux
    - Windows
  notes:
    - PLATEAU hako.py uses Python and no shell-specific conversion entrypoint.
    - Runtime HakoEnv platform support still depends on its Hakoniwa Python/PDU environment.

connects_to:
  - component_id: hakoniwa-core-pro
    direction: related
    interface: simulation integration target
    notes: Runtime integration is a target use case, but exact wiring should be recipe-verified.
  - component_id: hakoniwa-pdu-registry
    direction: uses
    interface: Twist position and hako_msgs/Disturbance PDU contracts
    notes: HakoEnv reads pos and writes disturb; custom-slot writer ownership must be coordinated with other producers.
  - component_id: hakoniwa-drone-pro
    direction: bidirectional
    interface: per-drone pos/disturb PDU
    notes: Environment wind, temperature, pressure, and GPS strength are supplied to the Drone PRO runtime through Disturbance.
  - component_id: hakoniwa-mujoco-robots
    direction: used_by
    interface: MuJoCo MJCF include asset
    notes: The PLATEAU path generates query-centered building collision geoms that can be composed into a MuJoCo world.

data_contracts:
  - name: Creator model
    description: Human-edited JSON model with CRS/units, grid, base environment, and zones.
    source:
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/hakoniwa_envsim/schemas/environment_model.schema.json
        revision: e9a808756f2fbba05b9fa35e9df84fd977f2a22e
  - name: Execution model split
    description: Runtime model separates space_area, area_properties, link, and optional boundary definitions.
    source:
      - repository: hakoniwalab/hakoniwa-envsim
        path: README.md
        revision: e9a808756f2fbba05b9fa35e9df84fd977f2a22e
  - name: PLATEAU download provenance
    description: Records search bbox, city, year, specification, source URL, catalog size, actual size, SHA-256, and reuse mode for each CityGML object.
    source:
      - repository: hakoniwalab/hakoniwa-envsim
        path: tools/plateau_citygml.py
        revision: 97801f11bbe3678b6ba248ba2d78901efd9adf61
  - name: Local city coordinate frame
    description: Converts EPSG:6697 latitude/longitude to query-centered local ENU meters, then maps ENU to MuJoCo X=North, Y=-East, Z=Up.
    source:
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/gml_lod1_extract.py
        revision: 97801f11bbe3678b6ba248ba2d78901efd9adf61
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/city_pipeline/obb2mjcf.py
        revision: 97801f11bbe3678b6ba248ba2d78901efd9adf61
  - name: Disturbance custom-slot ownership
    description: Envsim currently owns GPS strength in d_user_custom slot 0, while other producers such as rotor-fault control may own later slots; full-message writes require arbitration or preservation.
    source:
      - repository: hakoniwalab/hakoniwa-envsim
        path: src/hakoniwa_envsim/asset/drone_io.py
        revision: e9a808756f2fbba05b9fa35e9df84fd977f2a22e

recipe_roles:
  - role: environment_model
    description: Supplies environmental fields such as wind, temperature, pressure, and GPS strength.
  - role: data_model
    description: Defines creator and runtime schemas for environment data.
  - role: visualizer
    description: Provides pre-simulation environment inspection views.
  - role: asset_generator
    description: Materializes PLATEAU building data as MuJoCo wall MJCF for a geographic selection.
  - role: integration_boundary
    description: Resolves environment values at drone positions and publishes Disturbance PDU data.

typical_usecases:
  - Define wind, GPS, temperature, and turbulence zones for robot/drone scenarios.
  - Visualize environment conditions before running a simulation.
  - Query environmental values by position at runtime.
  - Build realistic Sim2Real validation scenarios.
  - Generate a MuJoCo building collision world for a latitude/longitude-centered area.

anti_usecases:
  - Robot body conversion.
  - PDU communication transport.
  - MuJoCo physics stepping by itself.

demo_candidates:
  - name: Kobe port environment model
    description: Load and visualize examples/datasets/kobe/environment_model.json.
    required_components:
      - hakoniwa-envsim
    source_examples:
      - repository: hakoniwalab/hakoniwa-envsim
        path: examples/datasets/kobe/environment_model.json
        revision: e9a808756f2fbba05b9fa35e9df84fd977f2a22e

operations:
  build:
    commands:
      - python tools/hako.py build
    notes: Explicitly queries the PLATEAU API, downloads matching CityGML, and records actual SHA-256 provenance before conversion.
  test:
    commands:
      - python tools/hako.py test
      - python tools/hako.py smoke
    notes: Unit tests and smoke are offline so external API availability cannot mask a local regression.
  run:
    commands:
      - python tools/hako.py doctor
      - python tools/hako.py configure
      - python tools/hako.py install
    notes: Configure is local-only; build performs acquisition; install publishes the MJCF and provenance under the configured prefix.

runtime_checks:
  - id: plateau-build-readiness
    kind: doctor
    platforms:
      - macos
      - linux
      - windows
    command:
      - python
      - tools/hako.py
      - doctor
    working_directory: repository
    output: text
    notes:
      - Validates the manifest, dependencies, and local conversion tools without accessing the network.
  - id: plateau-offline-smoke
    kind: smoke-test
    platforms:
      - macos
      - linux
      - windows
    command:
      - python
      - tools/hako.py
      - smoke
    working_directory: repository
    output: text
    notes:
      - Converts a checked-in minimal EPSG:6697 CityGML fixture through MJCF without the external API.

hako_cli:
  contract_version: "1.1"
  path: tools/hako.py
  common_options:
    - --config
  commands:
    - doctor
    - configure
    - build
    - test
    - install
    - smoke

known_gaps:
  - Disturbance shared-writer ownership must be implemented so environment updates preserve rotor-fault and other custom slots.
  - Creator grid schema and implementation use different extent representations and need a separate compatibility fix.
  - Runtime HakoEnv lifecycle and an end-to-end drone recipe still need component-owned integration coverage.

