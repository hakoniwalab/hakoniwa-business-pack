  - repository: hakoniwalab/hakoniwa-fpv-drone
    path: recipes/business-pack/fpv-drone-design-angle-flight.yaml
    revision: main
    description: Component-owned Business Pack system Recipe referencing the FPV Vehicle Recipe.

