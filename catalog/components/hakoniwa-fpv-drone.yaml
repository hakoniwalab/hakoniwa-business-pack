id: hakoniwa-fpv-drone
name: Hakoniwa FPV Drone
repository:
  owner: hakoniwalab
  name: hakoniwa-fpv-drone
  url: https://github.com/hakoniwalab/hakoniwa-fpv-drone
  visibility: private

distribution:
  channel: oss
  notes:
    - The Hakoniwa FPV Drone source, Catalog, Recipe, and documentation are provided under the MIT License.
    - Repository visibility and software licensing are separate facts; this Catalog records the currently private repository visibility independently from the MIT terms.
    - Hakoniwa Drone Core or PRO, PID auto-tuning, third-party component data, models, and libraries retain their own license terms.

verification:
  verified_at: 2026-08-29
  source_revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
  source_ref: main

summary: >-
  Catalog-driven FPV drone design pack that resolves selected frame, motor, propeller,
  battery, camera, and controller parts into a traceable MuJoCo/Hakoniwa vehicle package,
  composes reusable physical FPV courses, and optionally materializes a Three.js FPV viewer
  while keeping MuJoCo as the source of truth for vehicle physics and collision.

category:
  primary: tool
  secondary:
    - asset-generation
    - code-generation
    - simulator
    - integration

status:
  maturity: experimental
  catalog_confidence: high
  notes:
    - The generic 5-inch quad-X End-to-End path is implemented and unit-tested.
    - Hover and Angle auto-tuning for the reviewed sample completed with all reported hard gates passing, followed by PS5 Angle-mode flight confirmation on macOS.
    - A verified sample configuration is frozen under verified-configs/example-5inch-angle with model, runtime configuration, controller parameters, and receipt.
    - FPV World generation and optional Three.js viewer integration are implemented; their presence does not imply real-aircraft or training-simulator validation.
    - Catalog values are generic examples and are not presented as measured specifications of real products.

capabilities:
  - name: FPV component catalog and Vehicle Recipe
    description: Separates reusable FPV part definitions from a user-selected aircraft configuration that references those parts by stable IDs.
    evidence:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: docs/catalog-spec.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: recipes/examples/5inch-fpv.yaml
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7

  - name: Physical vehicle model compilation
    description: Resolves mass, center of mass, inertia, motor placement, rotor direction, thrust parameters, and thrust-to-weight estimates without silently inventing unavailable values.
    evidence:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: src/fpv_drone_generator/resolver.py
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: tests/test_resolver.py
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7

  - name: MuJoCo and Hakoniwa Generated Vehicle Package
    description: Generates a portable package containing MuJoCo XML, Drone Core configuration, control parameters, BOM, resolved inputs, physical report, provenance hashes, and optional World/Three.js course artifacts.
    evidence:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: docs/generated-package.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: tests/test_generate.py
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7

  - name: Reusable FPV World and physical course
    description: Defines the flight location independently from the vehicle Recipe using World YAML with lighting, ground, contact parameters, and collision-enabled gate, pylon, and box obstacles.
    evidence:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: docs/fpv-world.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: recipes/environments/fpv-training-course.yaml
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7

  - name: Native MuJoCo FPV camera and PiP
    description: Runs Drone PRO with the generated fixed FPV camera as the main view and an operable external camera as picture-in-picture, with keyboard switching and PiP visibility control.
    evidence:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: README.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: docs/fpv-world.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7

  - name: Optional Three.js FPV viewer
    description: Adds Visual State Publisher, WebBridge, and HTTP viewer only when requested; it uses the runtime MuJoCo FPV camera as the camera source of truth, scales the existing drone GLB to generated wheelbase, animates propellers from PWM, and renders the generated FPV course.
    evidence:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: README.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: src/fpv_drone_generator/generators/threejs_course.py
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: tests/test_fpv_tool.py
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7

  - name: PS5 Angle-mode simulation
    description: Materializes and runs the generated vehicle with the existing Hakoniwa Drone Radio Controller and PS4 mapping used for a PS5 DualSense controller.
    evidence:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: README.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: verified-configs/example-5inch-angle/README.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7

  - name: Licensed vehicle-specific PID tuning connection
    description: Connects a frozen generated vehicle profile to Hakoniwa Drone PRO Hover and Angle PID auto-tuning, quantitative gates, waveform review, and PS5 validation without exposing PRO tuning internals in this repository.
    evidence:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: docs/pid-tuning-knowhow.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: verified-configs/example-5inch-angle/README.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7

limitations:
  - The current generator supports quad-X aircraft with four motors only.
  - Included parts are generic examples rather than evidence-backed real-product catalog records.
  - Frame geometry is a box proxy and non-frame inertia uses a documented point-mass approximation.
  - Rate configuration can be generated, but the currently verified interactive runtime path is Angle mode.
  - Generated controller values and auto-tuned simulation values are not recommendations for direct use on a physical aircraft.
  - FPV World obstacles are configurable simulation proxies; their collision behavior does not establish real-world course or aircraft safety.
  - The Three.js aircraft appearance reuses an existing GLB scaled by wheelbase and is not a product-CAD representation; physical collision remains owned by MuJoCo.
  - Betaflight backend and real-flight log identification are not implemented.

interfaces:
  inputs:
    - name: Component catalogs
      kind: config
      description: YAML catalogs for frames, motors, propellers, batteries, cameras, and controller profiles.
    - name: FPV Vehicle Recipe
      kind: config
      description: User-owned YAML that selects catalog component IDs, control mode, and component placements for one aircraft.
    - name: FPV World YAML
      kind: config
      description: Independent course/environment definition for visual settings, ground/contact behavior, lights, gates, pylons, and box obstacles.
  outputs:
    - name: Generated Vehicle Package
      kind: file
      description: BOM, resolved inputs, report, MuJoCo XML, Drone Core configuration, controller parameter files, and optional World/viewer artifacts.
    - name: FPV course adapter
      kind: file
      description: fpv-course.json generated from the same validated World YAML for optional Three.js visualization while MuJoCo remains the physics source of truth.
    - name: FPV generator CLI
      kind: command
      description: Validates recipes, displays BOMs, generates packages, and operates the current Angle-mode runtime adapter.
    - name: PID tuning adapter
      kind: command
      description: Creates immutable tuning inputs and invokes licensed Drone PRO tuning phases without modifying Catalog or Recipe sources.
  protocols:
    - name: Generated artifact contract
      role: file
      notes: Connects the component compiler to MuJoCo and the existing Drone Core configuration formats.
    - name: Hakoniwa PDU
      role: local
      notes: Existing Drone Core PDU definitions carry controller input and vehicle state; no incompatible FPV-only PDU format is introduced.
    - name: HTTP and WebSocket
      role: server
      notes: Optional Three.js runtime exposes the generated FPV viewer through the existing browser/WebBridge path when --threejs is selected.
  configuration:
    - path: catalogs/*.yaml
      description: Reusable generic or evidence-backed FPV component definitions.
    - path: recipes/examples/5inch-fpv.yaml
      description: Verified generic quad-X Vehicle Recipe.
    - path: recipes/environments/fpv-training-course.yaml
      description: Default reusable FPV World with physical course obstacles.
    - path: recipes/business-pack/fpv-drone-design-angle-flight.yaml
      description: Component-owned Hakoniwa Business Pack system Recipe that references the Vehicle Recipe rather than duplicating it.

dependencies:
  required:
    - name: hakoniwa-drone-core
      type: repository
      notes: Provides the MuJoCo vehicle physics, rotor and mixer implementation, Radio Controller, Angle control, and commercial Drone PRO runtime path.
    - name: hakoniwa-core-pro
      type: repository
      notes: Provides Hakoniwa lifecycle, shared memory, and simulation-time coordination.
    - name: hakoniwa-pdu-python
      type: repository
      notes: Provides the Foundation Python environment and background Launcher lifecycle.
    - name: Python 3.12
      type: runtime
      notes: Runs package generation, runtime materialization, and PID tuning adapters.
    - name: MuJoCo
      type: runtime
      notes: Executes the generated physical vehicle and course model.
  optional:
    - name: hakoniwa-threejs-drone
      type: repository
      notes: Provides the existing browser drone GLB/runtime reused by the optional Three.js FPV viewer.
    - name: hakoniwa-pdu-bridge-core
      type: repository
      notes: Provides the browser/WebBridge state path used by the optional Three.js runtime.
    - name: Hakoniwa Drone PRO PID auto-tuning entitlement
      type: runtime
      notes: Enables vehicle-specific automated Hover and Angle tuning; it is not implied by access to this component repository alone.

platforms:
  supported:
    - macOS
  notes:
    - Catalog and Recipe generation are portable Python workflows, but the current executable Angle-mode Recipe and reviewed PS5 flight path are recorded on macOS arm64.
    - Optional Three.js support is implemented and unit-tested; browser/host coverage beyond the documented path should be verified for the intended deployment.

connects_to:
  - component_id: hakoniwa-drone-core
    direction: uses
    interface: generated drone.xml, drone_config.json, and control-param.txt
    notes: Renders the resolved FPV vehicle and World into existing Drone Core and MuJoCo runtime contracts.
  - component_id: hakoniwa-core-pro
    direction: uses
    interface: lifecycle, shared-memory PDU, and simulation time
    notes: Runs the generated vehicle as a synchronized Hakoniwa simulation asset.
  - component_id: hakoniwa-pdu-python
    direction: uses
    interface: Python Launcher and background session control
    notes: Owns normal start, status, and terminate operations for the generated runtime.
  - component_id: hakoniwa-threejs-drone
    direction: uses
    interface: optional FPV browser visualization
    notes: Reuses the existing visual drone model and browser runtime without making it the physics source of truth.
  - component_id: hakoniwa-pdu-bridge-core
    direction: uses
    interface: optional browser state transport
    notes: Carries visual state to the optional Three.js viewer when requested.

data_contracts:
  - name: Catalog to Vehicle Recipe reference
    description: A Vehicle Recipe selects component records by stable ID; catalog attributes may grow without changing the reference form.
    source:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: docs/recipe-spec.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
  - name: Resolved Vehicle Model
    description: Typed intermediate model separates component facts and user choices from backend-specific generated artifacts.
    source:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: docs/architecture.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
  - name: FPV World YAML
    description: Keeps course/environment definition independent from the Vehicle Recipe while generating the MuJoCo physical world and optional Three.js course adapter from one source.
    source:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: docs/fpv-world.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
  - name: Generated Vehicle Package
    description: Generated files preserve input copies, resolved components, calculated and approximated properties, runtime files, World artifacts, and provenance hashes.
    source:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: docs/generated-package.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7

recipe_roles:
  - role: asset_generator
    description: Compiles a selected FPV component set and World into physical vehicle/environment models.
  - role: code_generator
    description: Renders the resolved model into MuJoCo, Hakoniwa, and optional Three.js adapter files.
  - role: integration_boundary
    description: Adapts generated vehicles to existing Drone Core, Launcher, Radio Controller, viewer, and PID tuning contracts.
  - role: visualizer
    description: Optionally materializes an FPV-oriented Three.js view while retaining MuJoCo as the physical source of truth.

typical_usecases:
  - Compare candidate FPV part combinations before purchasing and assembling physical hardware.
  - Generate a traceable virtual quad-X model from a reusable component catalog and a user-owned Vehicle Recipe.
  - Reuse the same FPV course across different generated aircraft and swap the course independently from the vehicle definition.
  - Evaluate Angle-mode handling with a PS5 controller in a collision-enabled FPV course.
  - Preview the generated aircraft and course through the optional Three.js FPV viewer.
  - Use licensed PID auto-tuning to reduce manual trial-and-error for each generated virtual aircraft.

anti_usecases:
  - Treating generic example component values as official specifications of a real product.
  - Applying generated or tuned simulation PID values directly to a physical aircraft without expert review and controlled real-world validation.
  - Using the current toolchain as a Betaflight replacement or a certified FPV training system.
  - Assuming the FPV toolchain's MIT License grants rights to every Hakoniwa Drone PRO option, PID tuning capability, third-party model, or component dataset.

demo_candidates:
  - name: Generic 5-inch FPV generation and PS5 Angle flight
    description: Resolve the sample 5-inch Vehicle Recipe, compose the default physical FPV course, materialize the verified Angle configuration, and verify controller response with a PS5 DualSense controller in the native MuJoCo FPV/PiP view.
    required_components:
      - hakoniwa-fpv-drone
      - hakoniwa-drone-core
      - hakoniwa-core-pro
      - hakoniwa-pdu-python
    source_examples:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: recipes/business-pack/fpv-drone-design-angle-flight.yaml
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: verified-configs/example-5inch-angle/README.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
  - name: Optional Three.js FPV course preview
    description: Configure the same generated vehicle and World with --threejs, open the browser viewer, and verify the FPV camera, PiP convention, scaled aircraft GLB, propeller animation, and World-derived course visualization.
    required_components:
      - hakoniwa-fpv-drone
      - hakoniwa-drone-core
      - hakoniwa-core-pro
      - hakoniwa-pdu-python
      - hakoniwa-threejs-drone
      - hakoniwa-pdu-bridge-core
    source_examples:
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: README.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7
      - repository: hakoniwalab/hakoniwa-fpv-drone
        path: docs/fpv-world.md
        revision: 4b8cd8f7de488f1e51cf7f553b6b9793d5c795f7

operations:
  build:
    commands:
      - python3.12 tools/fpv.py configure
      - python3.12 tools/fpv.py configure --threejs
    notes:
      - The default command materializes the verified native MuJoCo/Drone PRO runtime; --threejs adds only the optional browser visualization path.
  test:
    commands:
      - PYTHONPATH=src python3.12 -m unittest discover -v
    notes:
      - MuJoCo load verification is skipped only when the selected Python environment lacks the optional MuJoCo binding.
  run:
    commands:
      - python3.12 tools/fpv.py start
      - python3.12 tools/fpv.py status
      - python3.12 tools/fpv.py open-viewer
      - python3.12 tools/fpv.py stop
    notes:
      - open-viewer requires a runtime configured with --threejs; normal cleanup remains the Launcher terminate path.

known_gaps:
  - Add evidence-backed real FPV product catalog records with clear data provenance and redistribution terms.
  - Add the Drone Core Radio Controller Rate/Acro execution profile.
  - Add real-flight log ingestion and model-identification support.
  - Extend runtime verification beyond macOS arm64 and broaden browser/device verification for the optional Three.js path.

