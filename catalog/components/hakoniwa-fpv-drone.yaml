    description: Product concept, generator workflow, Angle runtime, PID tuning boundary, and verified operator commands.
  - repository: hakoniwalab/hakoniwa-fpv-drone
    path: docs/architecture.md
    revision: f482a713b286df965e2ea663033a0fef3a727f2d
    description: Catalog, Vehicle Recipe, Resolved Vehicle Model, Generated Package, and backend adapter boundaries.
  - repository: hakoniwalab/hakoniwa-fpv-drone
    path: docs/pid-tuning-knowhow.md
    revision: f482a713b286df965e2ea663033a0fef3a727f2d
