operations:
  build:
    commands:
      - cmake -S . -B build
      - cmake --build build -j
      - python tools/urban_mobility.py configure --composition recipes/compositions/plain-hexa-rc.yaml
    notes:
      - The CMake build produces the Urban Car application; configure runs the route's managed Recipe and materializes the Recipe workspace.
  test:
    commands:
      - ../hakoniwa-business-pack/work/foundation/install/python/bin/python3 -m unittest discover -s tests -p 'test_*.py'
      - ctest --test-dir build --output-on-failure
      - python tools/city_world_job.py check <job folder | receipt>
    notes:
      - Catalog does not infer CI status from these commands.
  run:
    commands:
      - python ../hakoniwa-urban-mobility/tools/urban_studio.py start --open-browser
      - python ../hakoniwa-urban-mobility/tools/urban_studio.py stop
      - python tools/urban_mobility.py plan --composition recipes/compositions/plain-hexa-rc.yaml
      - python tools/urban_mobility.py start --composition recipes/compositions/plain-hexa-rc.yaml
    notes:
      - Run from the Business Pack Workspace shell so simulations inherit the Workspace environment; stop Urban Studio before leaving the Workspace.

