id: hakoniwa-pdu-bridge-core
name: Hakoniwa PDU Bridge Core
repository:
  owner: hakoniwalab
  name: hakoniwa-pdu-bridge-core
  url: https://github.com/hakoniwalab/hakoniwa-pdu-bridge-core
  visibility: public
distribution:
  channel: oss
  notes:
    - Public OSS Hakoniwa component.
verification:
  verified_at: 2026-08-30
  source_revision: e5c567948b42512abc36a8cea2b4d8a151f6c145
  source_ref: main
summary: Logical PDU transfer layer that controls when data flows between endpoints while delegating transport I/O to hakoniwa-pdu-endpoint.
category:
  primary: communication
  secondary:
    - integration
    - bridge
    - monitoring

status:
  maturity: active
  catalog_confidence: high
  notes:
    - Cataloged from README, build architecture, manifest flow, package-contract CI, and tutorial entry points.
    - The component is a timing and routing layer, not a transport implementation.
    - Core-free Bridge library, standalone daemon, and monitor builds are separated from the optional Hakoniwa-integrated application path.
    - Installed-package composability is validated with external CMake consumers rather than inferred from in-repository builds.
    - Current main restores the standalone build/install contract and validates manifest parsing and command resolution through component-owned tests.

capabilities:
  - name: Logical PDU flow declaration
    description: Defines which source PDU channels transfer to which destination endpoints.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: README.md
        revision: e2454b15c22466336df565af09db9f43d2066da7
  - name: Transfer policy control
    description: Supports immediate, throttle, and ticker policies for deciding when transfers occur.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: README.md
        revision: e2454b15c22466336df565af09db9f43d2066da7
  - name: Endpoint-backed transport reuse
    description: Uses EndpointContainer from hakoniwa-pdu-endpoint so bridge logic stays independent from TCP, UDP, SHM, WebSocket, and other transports.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: README.md
        revision: e2454b15c22466336df565af09db9f43d2066da7
  - name: Runtime introspection
    description: Provides monitor commands for health, connections, PDU listing, and tailing runtime PDU flow.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: README.md
        revision: e2454b15c22466336df565af09db9f43d2066da7
  - name: Manifest-driven cross-platform build
    description: Separates user-facing component intent from OS-specific dependency and CMake resolution, with doctor, configure, build, and test commands for Core-free manifest builds on Ubuntu, macOS, and Windows.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: hakoniwa-build.yaml
        revision: e5c567948b42512abc36a8cea2b4d8a151f6c145
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: tools/hako.py
        revision: e5c567948b42512abc36a8cea2b4d8a151f6c145
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: tools/test_hako.py
        revision: e5c567948b42512abc36a8cea2b4d8a151f6c145
  - name: Installed CMake package contract
    description: Exports hakoniwa_pdu_bridge::bridge for new consumers while preserving hakoniwa_pdu_bridge::hakoniwa_pdu_bridge_lib as a compatibility target; external consumers are built in CI.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: cmake/hakoniwa_pdu_bridgeConfig.cmake.in
        revision: e2454b15c22466336df565af09db9f43d2066da7
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: test/package_consumer
        revision: e2454b15c22466336df565af09db9f43d2066da7
  - name: Callback-isolated Hakoniwa integration
    description: The Hakoniwa-integrated Web bridge uses an internal callback Bridge composition backed by hakoniwa_pdu_endpoint::core_callback rather than pulling polling/shakoc into the public Bridge package contract.
    evidence:
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: CMakeLists.txt
        revision: e2454b15c22466336df565af09db9f43d2066da7
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: docs/build-architecture.md
        revision: e2454b15c22466336df565af09db9f43d2066da7

limitations:
  - Not a transport implementation.
  - Does not provide delivery guarantees, retries, or persistent queues.
  - Does not load endpoint JSON directly; endpoint loading belongs to hakoniwa-pdu-endpoint.
  - Reference daemon uses a real-time loop, but integrators may need to inject their own time source and execution loop.
  - Hakoniwa-integrated application builds require Hakoniwa Core; the Bridge library, standalone daemon, and monitor can be built without Core.

interfaces:
  inputs:
    - name: Bridge configuration
      kind: config
      description: JSON describing nodes, source endpoints, destination endpoints, PDU mappings, and transfer policies.
    - name: Endpoint container configuration
      kind: config
      description: Endpoint loader configuration consumed by hakoniwa-pdu-endpoint.
    - name: Time source
      kind: api
      description: ITimeSource supplied by the caller or reference daemon.
  outputs:
    - name: Transferred PDU data
      kind: pdu
      description: PDU bytes moved from source endpoint to destination endpoint when policy permits.
    - name: Monitor responses
      kind: command
      description: Health, connection, list_pdus, and tail information from the monitor CLI.
  protocols:
    - name: Endpoint API
      role: local
      notes: Bridge delegates actual communication to endpoints.
  configuration:
    - path: hakoniwa-build.yaml
      description: User-facing build intent for library, standalone app, Hakoniwa app, monitor, tests, and integration validation.
    - path: config/tutorials/bridge-immediate.json
      description: Immediate policy tutorial config.
    - path: config/web_bridge/bridge/bridge.json
      description: Managed web bridge config.
    - path: test/config/tcp/bridge.json
      description: Two-node TCP integration bridge config.

dependencies:
  required:
    - name: C++20 compiler
      type: tool
      notes: Required for native build.
    - name: CMake 3.16 or later
      type: tool
      notes: Required build system.
    - name: hakoniwa-pdu-endpoint
      type: repository
      notes: Required for endpoint API, endpoint container, transport I/O, and the installed Endpoint package contract.
  optional:
    - name: Hakoniwa Core Pro
      type: repository
      notes: Required only for Hakoniwa-integrated application paths such as the callback asset Web bridge; not required for Core-free Bridge library, standalone, or monitor builds.

platforms:
  supported:
    - macOS
    - Linux
    - Windows
  notes:
    - Manifest CI validates Core-free Bridge builds on Ubuntu, macOS, and native Windows.
    - Package-contract CI validates external Bridge consumers and Hakoniwa callback integration on Ubuntu x64, native Linux ARM64, macOS, and Windows x64.
    - Windows uses the Endpoint package and vcpkg-based Boost dependency path; Hakoniwa Core keeps its static-first Windows design.

connects_to:
  - component_id: hakoniwa-pdu-endpoint
    direction: uses
    interface: EndpointContainer / Endpoint API
    notes: Core-free Bridge components consume the base Endpoint package target; Hakoniwa-integrated Web bridge uses the Endpoint core_callback variant.
  - component_id: hakoniwa-core-pro
    direction: uses
    interface: Hakoniwa core callback asset runtime
    notes: Optional for the Bridge library itself; required by the Hakoniwa-integrated Web bridge application through the callback path.
  - component_id: hakoniwa-pdu-javascript
    direction: used_by
    interface: WebSocket bridge
    notes: Browser and Node.js clients can consume PDU data exposed through web bridge configurations.
  - component_id: hakoniwa-pdu-rpc
    direction: related
    interface: Endpoint-style config and deterministic integration patterns
    notes: Both layers reuse endpoint topology, but bridge is data-flow transfer while rpc is request-response.

data_contracts:
  - name: Bridge transfer policy
    description: Explicit policy model deciding when a PDU or atomic PDU group transfers.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: README.md
        revision: e2454b15c22466336df565af09db9f43d2066da7
  - name: Node-selected endpoint container
    description: A shared endpoint container config can contain multiple nodes; each daemon selects its node by node_name.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: README.md
        revision: e2454b15c22466336df565af09db9f43d2066da7
  - name: Installed Bridge CMake targets
    description: New consumers link hakoniwa_pdu_bridge::bridge; existing consumers may continue using hakoniwa_pdu_bridge::hakoniwa_pdu_bridge_lib.
    source:
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: cmake/hakoniwa_pdu_bridgeConfig.cmake.in
        revision: e2454b15c22466336df565af09db9f43d2066da7

recipe_roles:
  - role: bridge
    description: Moves PDU data between components according to explicit transfer timing.
  - role: communication_infrastructure
    description: Centralizes logical routing without owning low-level transport behavior.
  - role: monitor
    description: Provides runtime checks for bridge health and PDU flow.

typical_usecases:
  - Connect two Hakoniwa nodes or tools while controlling when PDU data is forwarded.
  - Replace hard-coded transport wiring with bridge JSON and endpoint container JSON.
  - Expose simulation PDU streams to browser tools through the Web bridge daemon.
  - Build Core-free standalone or monitoring tools on Linux, macOS, or Windows while enabling Hakoniwa Core only for integrated asset applications.
  - Consume Bridge from another CMake project through its installed package target.
  - Add runtime monitoring to PDU transfer paths.

anti_usecases:
  - Need a raw TCP, UDP, WebSocket, Zenoh, or SHM transport implementation.
  - Need durable queueing or retry guarantees independent of endpoint comm backends.
  - Need RPC request-response semantics rather than data-flow transfer.

demo_candidates:
  - name: Single-node immediate bridge
    description: Run the reference daemon with bridge-immediate and endpoint_container tutorial configs.
    required_components:
      - hakoniwa-pdu-bridge-core
      - hakoniwa-pdu-endpoint
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: config/tutorials/bridge-immediate.json
        revision: e2454b15c22466336df565af09db9f43d2066da7
  - name: Two-node TCP bridge
    description: Run node1 and node2 daemons using shared TCP test configs and node selection.
    required_components:
      - hakoniwa-pdu-bridge-core
      - hakoniwa-pdu-endpoint
    source_examples:
      - repository: hakoniwalab/hakoniwa-pdu-bridge-core
        path: test/config/tcp
        revision: e2454b15c22466336df565af09db9f43d2066da7

operations:
  build:
    commands:
      - python3 tools/hako.py doctor
      - python3 tools/hako.py configure --dry-run
      - python3 tools/hako.py build
      - python3 tools/hako.py test
    notes:
      - hakoniwa-build.yaml is the recommended user-facing build intent.
      - Direct CMake remains available for compatibility and advanced usage.
      - Core-free builds do not require Hakoniwa Core.
      - Installed CMake consumers should use find_package(hakoniwa_pdu_bridge CONFIG REQUIRED) and link hakoniwa_pdu_bridge::bridge.
  test:
    commands:
      - python3 tools/hako.py test
    notes: Manifest CI exercises normal build/test paths across Ubuntu, macOS, and Windows; package-contract CI separately validates installed consumers and Core callback integration.
  run:
    commands:
      - ./build/hakoniwa-pdu-bridge config/tutorials/bridge-immediate.json 1000 config/tutorials/endpoint_container.json node1
      - ./build/hakoniwa-pdu-web-bridge --config-root config/web_bridge
    notes:
      - delta_time_step_usec controls the reference daemon sleep interval.

known_gaps:
  - Catalog does not yet enumerate every bridge JSON schema field.
  - Monitor command details should be expanded from docs/tutorials/monitor.md.
  - Full hakoniwa-conductor runtime regression is separate from Bridge package-consumer compatibility validation.

