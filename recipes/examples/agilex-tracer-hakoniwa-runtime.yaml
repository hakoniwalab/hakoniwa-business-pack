    path: catalog/components/hakoniwa-mujoco-robots.yaml
  - component_id: hakoniwa-core-pro
    path: catalog/components/hakoniwa-core-pro.yaml
  - component_id: hakoniwa-pdu-endpoint
    path: catalog/components/hakoniwa-pdu-endpoint.yaml
  - component_id: hakoniwa-pdu-python
    path: catalog/components/hakoniwa-pdu-python.yaml

