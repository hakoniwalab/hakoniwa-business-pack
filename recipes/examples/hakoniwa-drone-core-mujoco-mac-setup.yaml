id: hakoniwa-drone-core-mujoco-mac-setup
title: Hakoniwa Drone Core MuJoCo Runtime Setup on macOS
recipe_version: 0.1

goal:
  user_request: macOSでhakoniwa-drone-coreの配布バイナリをMuJoCoと正しくlinkし、複数のDroneデモから再利用できる状態にしたい
  description: >
    Prepare the macOS arm64 hakoniwa-drone-core distribution by fetching its
    release binaries, installing MuJoCo under the repository-local vendor
    directory, patching the binaries with the current MuJoCo library path, and
    verifying the resulting Mach-O dependency and RPATH contract.

feasibility:
  status: feasible
  confidence: high
  rationale:
    - hakoniwa-drone-core provides the binary fetch, MuJoCo install, and Mach-O link tools.
    - MuJoCo is placed under the repository-local vendor directory rather than a system directory.
    - install_name_tool and otool are standard macOS developer tools and make the post-distribution link contract inspectable.
    - The fetch, install, and link flow was exercised locally on macOS arm64.

validation:
  status: verified
  verified_at: 2026-09-25
  summary: >
    For the v4.1.1 release, mac.zip extracts to hakoniwa-drone-core/mac, not
    ./lib. On macOS arm64 the release archive was extracted into a fresh v4.1.1
    checkout, MuJoCo 3.13.0 was installed under vendor/mujoco, and the
    binaries were relinked; otool confirmed @rpath/libmujoco.3.13.0.dylib and
    the checkout's vendor/mujoco/lib in LC_RPATH. The linked drone service and
    visual-state publisher then ran a PS5 flight with the Three.js viewer
    through hakoniwa-fpv-drone. The 2026-07-29 run used the earlier ./lib
    layout with MuJoCo 3.9.0.
  steps:
    - id: mac_release_binaries
      status: verified
      evidence:
        - repository: toppers/hakoniwa-drone-core
          path: https://github.com/toppers/hakoniwa-drone-core/releases/tag/v4.1.1
          revision: 109d3a944908b185f79d554cfe08a8e2f0def205
      notes:
        - The v4.1.1 mac.zip (SHA-256 9f604b4ce8f5d083ce0eacad72b04dd433a6fb4664e3883e808eec30ffc43530) extracts to ./mac.
        - tools/fetch_libs.sh still copies release binaries into ./lib, which does not match the mac/ binary roles in the Catalog native_runtime profile.
        - Required macOS executables are mac/mac-main_hako_drone_service and mac/mac-drone_visual_state_publisher.
    - id: repository_local_mujoco
      status: verified
      evidence:
        - repository: toppers/hakoniwa-drone-core
          path: tools/install-mujoco-mac.bash
          revision: local-research-2026-07-20
      notes:
        - The MuJoCo version comes from MUJOCO_VERSION.txt; v4.1.1 installs MuJoCo 3.13.0 under ./vendor/mujoco.
        - No /usr/local or other system installation prefix is required for MuJoCo.
    - id: mac_binary_mujoco_link
      status: verified
      evidence:
        - repository: toppers/hakoniwa-drone-core
          path: tools/link-mujoco-mac.bash
          revision: local-research-2026-07-20
      notes:
        - The current checkout's absolute vendor/mujoco/lib path is passed to avoid retaining a build-machine-only RPATH as the active path.
        - The operation is safe to repeat for the same resolved path.
    - id: macho_link_verification
      status: verified
      evidence:
        - repository: toppers/hakoniwa-drone-core
          path: tools/link-mujoco-mac.bash
          revision: 109d3a944908b185f79d554cfe08a8e2f0def205
        - source: local macOS arm64 otool inspection
          date: 2026-09-25
      notes:
        - The shipped binaries also carry build-machine LC_RPATH entries; the added checkout path is what resolves MuJoCo.
        - otool -L must show the expected @rpath/libmujoco dependency.
        - otool -l must contain the current checkout's resolved vendor/mujoco/lib directory.

constraints:
  - macos-only
  - arm64-verified
  - native
  - repository-local-mujoco
  - post-distribution-link-required
  - no-system-mujoco-install

target_environment:
  required_for: executable-demo
  status: specified
  os: macOS
  os_version: unknown
  architecture: arm64
  execution_mode: native
  runtimes:
    - name: MuJoCo
      required: true
      version: "3.13.0"
      path: vendor/mujoco
  hakoniwa:
    install_prefix: not-applicable
    components_built: []
  notes:
    - This setup Recipe is intentionally macOS-specific.
    - Create a separate Recipe for Linux, Windows, or Docker distribution contracts.

execution_environment:
  required_for: executable-demo
  status: specified
  os: macOS
  os_version: unknown
  architecture: arm64
  execution_mode: native
  gui:
    required: false
    status: not_required
  shared_memory:
    required: false
    access: not_required
  devices: []
  python:
    environment: unknown
    hakopy_available: not_required
  hakoniwa:
    install_prefix: not-applicable
    hako_cmd_access: not_required
  notes:
    - Network access is needed only when release binaries or MuJoCo are not already present.
    - otool and install_name_tool must be available.

foundation_contract:
  mode: not_required
  reason: This setup Recipe only installs MuJoCo and patches distributed Mach-O binaries; it does not execute Core, SHM, hako-cmd, or hakopy.

components:
  - id: hakoniwa-drone-core
    roles:
      - physics_runtime
      - simulation_core
    purpose: Own the macOS Drone binaries, repository-local MuJoCo runtime, and post-distribution link tools.

connections: []

data_flow:
  summary: >
    This is an installation-time Artifact flow rather than a runtime PDU flow.
    Release binaries and MuJoCo are placed in the local repository, then the
    Mach-O binaries are patched and inspected.
  steps:
    - from: hakoniwa-drone-core release archive
      to: hakoniwa-drone-core/mac
      data:
        - macOS arm64 executables
      description: Extract the distributed Drone executables into the repository-local mac directory.
    - from: MuJoCo distribution
      to: hakoniwa-drone-core/vendor/mujoco
      data:
        - libmujoco.3.13.0.dylib
      description: Install MuJoCo without using a system installation prefix.
    - from: hakoniwa-drone-core/vendor/mujoco/lib
      to: hakoniwa-drone-core/mac
      data:
        - Mach-O RPATH contract
      description: Link the distributed executables to the current checkout's MuJoCo library directory.

time_model:
  mode: wall-clock
  components:
    - hakoniwa-drone-core
  notes:
    - This Recipe performs setup only and does not start Hakoniwa simulation time.

artifact_sets:
  physics_artifacts:
    description: macOS Drone service and repository-local MuJoCo runtime.
    status: verified
    artifacts:
      - mac/mac-main_hako_drone_service
      - vendor/mujoco/lib/libmujoco.3.13.0.dylib
    notes:
      - The binary must resolve MuJoCo through the post-distribution link contract.
  visualization_artifacts:
    description: macOS DroneVisualStatePublisher distributed with Drone Core.
    status: verified
    artifacts:
      - mac/mac-drone_visual_state_publisher
    notes:
      - This Recipe prepares the binary but does not configure a viewer.
  pdu_artifacts:
    description: No PDU configuration is generated by this setup Recipe.
    status: verified
    artifacts: []
    notes:
      - PDU definitions remain the responsibility of the consuming Demo Recipe.
  runtime_artifacts:
    description: Component-owned setup and verification tools.
    status: verified
    artifacts:
      - tools/install-mujoco-mac.bash
      - tools/link-mujoco-mac.bash
      - otool verification output
    notes:
      - Link verification is required before a consuming Demo Recipe starts the binaries.

artifacts:
  - name: mac-drone-service-binary
    kind: command
    producer: hakoniwa-drone-core
    consumer:
      - hakoniwa-drone-core
    path: mac/mac-main_hako_drone_service
  - name: mac-visual-state-publisher-binary
    kind: command
    producer: hakoniwa-drone-core
    consumer:
      - hakoniwa-drone-core
    path: mac/mac-drone_visual_state_publisher
  - name: repository-local-mujoco
    kind: source
    producer: hakoniwa-drone-core
    consumer:
      - hakoniwa-drone-core
    path: vendor/mujoco/lib/libmujoco.3.13.0.dylib

missing_pieces:
  - Align tools/fetch_libs.sh in hakoniwa-drone-core with the mac/ release layout, or stop referencing it.
  - Consolidate the automated equivalents (tools/recipe/drone_fleet_single_host.py prepare-native in this repository and tools/fpv-drone-core.py prepare in hakoniwa-fpv-drone) behind one shared Business Pack entrypoint.

demo:
  objective: >
    Prepare and verify the macOS Drone Core binary distribution without
    starting a Drone simulation.
  steps:
    - order: 1
      component: hakoniwa-drone-core
      action: Download the v4.1.1 macOS release archive and extract it into ./mac.
      command: curl -L -o /tmp/hakoniwa-drone-core-mac.zip https://github.com/toppers/hakoniwa-drone-core/releases/download/v4.1.1/mac.zip && unzip -o /tmp/hakoniwa-drone-core-mac.zip -d .
      evidence:
        - repository: toppers/hakoniwa-drone-core
          path: https://github.com/toppers/hakoniwa-drone-core/releases/tag/v4.1.1
          revision: 109d3a944908b185f79d554cfe08a8e2f0def205
      notes:
        - Re-extracting replaces the binaries, so run the link step again afterwards.
    - order: 2
      component: hakoniwa-drone-core
      action: Install MuJoCo under the repository-local vendor directory.
      command: bash tools/install-mujoco-mac.bash .
      evidence:
        - repository: toppers/hakoniwa-drone-core
          path: tools/install-mujoco-mac.bash
          revision: local-research-2026-07-20
    - order: 3
      component: hakoniwa-drone-core
      action: Patch the distributed binaries using the current checkout's absolute MuJoCo library path.
      command: bash tools/link-mujoco-mac.bash ./mac --lib-dir "$PWD/vendor/mujoco/lib"
      evidence:
        - repository: toppers/hakoniwa-drone-core
          path: tools/link-mujoco-mac.bash
          revision: local-research-2026-07-20
    - order: 4
      component: hakoniwa-drone-core
      action: Verify the Drone service dependency and active MuJoCo RPATH.
      command: otool -L ./mac/mac-main_hako_drone_service && otool -l ./mac/mac-main_hako_drone_service
      notes:
        - The dependency must use @rpath/libmujoco.3.13.0.dylib.
        - LC_RPATH must contain the current checkout's resolved vendor/mujoco/lib path.
    - order: 5
      component: hakoniwa-drone-core
      action: Verify the visual-state publisher link contract.
      command: otool -L ./mac/mac-drone_visual_state_publisher && otool -l ./mac/mac-drone_visual_state_publisher
      notes:
        - Core libraries may be supplied later by the consuming Foundation-aware Recipe.
        - No Drone process is started by this setup Recipe.
  observability:
    success_signals:
      - Both required macOS executables exist and are executable.
      - vendor/mujoco/lib/libmujoco.3.13.0.dylib exists.
      - Drone service uses @rpath/libmujoco.3.13.0.dylib.
      - Drone service LC_RPATH contains the current checkout's vendor/mujoco/lib directory.
    failure_signals:
      - A required release executable is absent.
      - MuJoCo dylib is absent.
      - install_name_tool or otool is unavailable.
      - Only a stale build-machine MuJoCo RPATH is present.
    fixtures:
      - macOS arm64 host.
      - hakoniwa-drone-core checkout.
    automation:
      - The setup tools are idempotent for an already prepared checkout.
      - A future wrapper may convert the explicit checks into a single doctor command.
  verification_checks:
    lifecycle:
      - Setup completes without starting a long-running process.
    behavior:
      - The Mach-O dependency and RPATH match the current checkout.
    logs:
      - link-mujoco-mac.bash prints an OK result for each MuJoCo-dependent executable.

expected_result: >
  The macOS arm64 Drone service and visual-state publisher are present under
  hakoniwa-drone-core/mac, MuJoCo 3.13.0 is present under vendor/mujoco, and the
  Drone service's Mach-O link contract resolves that repository-local runtime.

