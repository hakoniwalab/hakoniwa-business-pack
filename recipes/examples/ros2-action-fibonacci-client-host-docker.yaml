id: ros2-action-fibonacci-client-host-docker
title: Host Hakoniwa Fibonacci Action Client to Docker ROS 2 Action Server
recipe_version: 0.1

goal:
  user_request: Hostの箱庭Action ClientからDocker内のROS 2 Fibonacci Action Serverを呼びたい
  description: Action Client Bridgeの逆方向を同じdirection-neutral Action Bindingで実行・検証する。

feasibility:
  status: feasible
  confidence: high
  rationale: [PDU-ROS native Action Client E2EとPDU-RPC Typed Action Clientが実装済み。]

validation:
  status: partially_verified
  verified_at: 2026-08-09
  summary: macOS arm64 hostの箱庭Action ClientからDocker Linux arm64のROS 2 Fibonacci ServerへGoalを送り、Feedback、Result、Cancel Reject後の継続、同一TCP sessionでの次Goal、正常停止を確認した。
  steps:
    - {id: configure, status: verified, evidence: [{path: tools/recipe/ros2_bridge_examples.py}]}
    - {id: end_to_end, status: verified, evidence: [{source: local-macos-arm64-e2e, date: 2026-08-08}]}
    - {id: cancel_reject, status: verified, evidence: [{source: local-macos-docker-cancel-reject-10-iterations, date: 2026-08-09}, {path: work/recipes/ros2-action-fibonacci-client-host-docker/validation/cancel-reject-evidence.json}]}

constraints: [host-hakoniwa-action-client, docker-ros2-action-server, tcp-only, loopback-published-listener, hakoniwa-pdu-1.6.6-or-later]

host_python_requirements:
  interpreter: work/foundation/install/python
  packages:
    - component_id: hakoniwa-pdu-python
      distribution: hakoniwa-pdu
      minimum_version: 1.6.6
      import: hakoniwa_pdu.pdu_msgs.sample_action_msgs
      required_capabilities: [generated_action_types, Fibonacci]

target_environment:
  os: macOS | Linux | Windows
  architecture: host-native
  execution_mode: host-plus-docker
  runtimes:
    - {name: Python, version: "3.12", path: work/foundation/install/python}
    - {name: Docker, version: current, path: system}
    - {name: ROS 2, version: jazzy, path: container}

execution_environment:
  workspace:
    mode: managed
  host: {role: Hakoniwa Typed Action Client, install_root: work/foundation/install}
  container: {role: ROS 2 Fibonacci Action Server and Action Client Bridge, platform: linux}
  boundary: {protocol: PDU-RPC TCP, listener: container, published_address: 127.0.0.1, port: 54014}

components:
  - {id: hakoniwa-pdu-ros, roles: [bridge, integration_boundary]}
  - {id: hakoniwa-pdu-rpc, roles: [communication_infrastructure, control_plane]}
  - {id: hakoniwa-pdu-endpoint, roles: [communication_infrastructure]}
  - {id: hakoniwa-pdu-python, roles: [language_binding]}
  - {id: hakoniwa-pdu-registry, roles: [data_model, registry]}

foundation_contract:
  mode: required
  reason: This Recipe uses components installed and validated through the managed Business Pack Foundation.

foundation_requirements:
  hakoniwa-pdu-rpc:
    capabilities:
      typed_action_client: true
      action_config_generator: true
      shared_native_library: true
      python_package: true
  hakoniwa-pdu-endpoint:
    capabilities: {tcp: true}

connections:
  - {from: hakoniwa-pdu-rpc, to: hakoniwa-pdu-ros, interface: typed-action-server, contract: {status: verified, requires: [direction-neutral Action Binding]}}
  - {from: hakoniwa-pdu-rpc, to: hakoniwa-pdu-endpoint, interface: tcp, contract: {status: verified, requires: [container listener published to host loopback]}}
  - {from: hakoniwa-pdu-ros, to: hakoniwa-pdu-python, interface: typed-action-mapping, contract: {status: verified, requires: [hakoniwa-pdu >= 1.6.6]}}
  - {from: hakoniwa-pdu-python, to: hakoniwa-pdu-registry, interface: packaged-generated-action, contract: {status: verified, requires: [sample_action_msgs/Fibonacci]}}

data_flow:
  - {source: Host TypedActionClient, path: [PDU-RPC TCP, Docker Action Client Bridge, ROS Action Client], destination: Docker ROS Fibonacci Action Server}
  - {source: Docker ROS Fibonacci Action Server, path: [Feedback and Result, Action Client Bridge, PDU-RPC TCP], destination: Host TypedActionClient}

time_model:
  owner: hakoniwa-pdu-rpc
  policy: real-time-action-events
  requirements: [Host Goal wait is bounded and uses generated slot routing]

artifact_sets:
  foundation: {status: verified, artifacts: [work/foundation/install]}
  recipe_runtime: {status: verified, artifacts: [config/action, runtime, logs]}

artifacts:
  generated:
    - {path: work/recipes/ros2-action-fibonacci-client-host-docker/config/action/action-binding.json, owner: hakoniwa-business-pack}
    - {path: work/recipes/ros2-action-fibonacci-client-host-docker/config/action/resolved-action.json, owner: hakoniwa-pdu-rpc}
  reused:
    - {path: hakoniwa-pdu-python/src/hakoniwa_pdu/pdu_msgs/sample_action_msgs, owner: hakoniwa-pdu-python}

missing_pieces:
  - Windows/WSL2上のIssue #20構成ではCancel Reject時のTCP切断が報告されており、platform境界の切り分けが残る。
  - TCPの正常closeと異常切断を区別できるEndpoint observabilityが必要。

demo:
  operator: python tools/recipe/ros2_bridge_examples.py action-client
  steps:
    - {id: configure, command: python tools/recipe/ros2_bridge_examples.py action-client configure}
    - {id: build, command: python tools/recipe/ros2_bridge_examples.py action-client build}
    - {id: doctor, command: python tools/recipe/ros2_bridge_examples.py action-client doctor}
    - {id: start, command: python tools/recipe/ros2_bridge_examples.py action-client start}
    - {id: smoke, command: python tools/recipe/ros2_bridge_examples.py action-client smoke}
    - {id: cancel_smoke, command: python tools/recipe/ros2_bridge_examples.py action-client cancel-smoke --iterations 10 --order 8 --next-order 2}
    - {id: status, command: python tools/recipe/ros2_bridge_examples.py action-client status}
    - {id: stop, command: python tools/recipe/ros2_bridge_examples.py action-client stop}
  readiness:
    lifecycle_state: {source: runtime/session.json, required: RUNNING, sufficient: false}
    checks:
      - {id: bridge, kind: log, target: Docker Action Client Bridge, expected: "action client ready"}
    operator_handoff: {background: true, explain_command_return: true, next_actions: [smoke, status, stop]}
  cleanup:
    expected_behavior: [Docker container stops, session becomes TERMINATED]
    verification_checks: [container stopped, session state is TERMINATED]
    cautions: [Stop only the Recipe-owned container]

expected_result:
  observable: Host CLI prints Fibonacci Results and reports every Cancel Reject iteration with a successful next Goal.
  success_conditions: [Goal accepted, Result sequence correct, Cancel rejected, Feedback and Result continue, next Goal succeeds in the same TCP session, cleanup terminates]

implementation_plan: [Generate config, start container listener, call from host TypedActionClient, exercise Cancel Reject and slot reuse, stop cleanly.]
acceptance_criteria: [One Action Binding serves both directions, host receives the correct Fibonacci Result, Cancel Reject is followed by normal completion and a successful next Goal, published port is loopback-only.]

source_catalogs:
  - {component_id: hakoniwa-pdu-ros, path: catalog/components/hakoniwa-pdu-ros.yaml}
  - {component_id: hakoniwa-pdu-rpc, path: catalog/components/hakoniwa-pdu-rpc.yaml}
  - {component_id: hakoniwa-pdu-endpoint, path: catalog/components/hakoniwa-pdu-endpoint.yaml}
  - {component_id: hakoniwa-pdu-python, path: catalog/components/hakoniwa-pdu-python.yaml}
  - {component_id: hakoniwa-pdu-registry, path: catalog/components/hakoniwa-pdu-registry.yaml}
source_artifacts:
  - {repository: hakoniwalab/hakoniwa-pdu-ros, path: config/action/fibonacci.json}
  - {repository: hakoniwalab/hakoniwa-business-pack, path: tools/recipe/ros2_bridge_examples.py}
