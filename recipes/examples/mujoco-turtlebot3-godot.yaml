id: mujoco-turtlebot3-godot
title: TurtleBot3 MuJoCo + Godot Gamepad Demo
recipe_version: 0.3

goal:
  user_request: Drive a TurtleBot3 in MuJoCo with a gamepad and show the same motion in Godot without ROS.
  description: >
    Use a PS5 controller to drive a TurtleBot3 simulated in MuJoCo. Hakoniwa PDU
    transports the robot base pose and wheel joint state to Godot, so the same
    motion can be observed in both MuJoCo and Godot. ROS is not required.

feasibility:
  status: feasible
  confidence: high
  rationale:
    - hakoniwa-mbody-registry provides the TurtleBot3 Burger physics model, Godot scene, GLB parts, and synchronization profile.
    - hakoniwa-mujoco-robots provides the TurtleBot3 simulator and the GameControllerOperation command contract.
    - hakoniwa-pdu-endpoint provides the Core callback profile used by MuJoCo and the Core polling profile used by Godot.
    - hakoniwa-godot consumes TB3/base_link_pos and TB3/joint_states and applies them to the generated TurtleBot3 scene.
    - The gamepad, MuJoCo, Hakoniwa shared-memory PDU, and Godot visualization path was manually exercised on macOS arm64 on 2026-08-04.

validation:
  status: partially_verified
  summary: >
    The primary TurtleBot3 Burger exhibition path was manually verified on macOS
    arm64 on 2026-08-04: a PS5 controller moved the MuJoCo robot and Godot showed
    the synchronized robot motion. The scripted route fallback is also available.
    A clean Foundation bootstrap and other operating systems remain to be verified.
  steps:
    - id: mbody_burger_artifacts
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-mbody-registry
          path: bodies/turtlebot3_burger/generated
          revision: local-validation-2026-07-19
      notes:
        - Burger physics, visualization, and PDU artifacts were generated successfully.

    - id: mujoco_burger_route_demo
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-mujoco-robots
          path: python/tb3_route_demo.py
          revision: local-validation-2026-07-19
      notes:
        - The scripted figure-eight route moved the TurtleBot3 without a physical controller.

    - id: turtlebot3_godot_gamepad_e2e
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: tools/recipe/turtlebot3_godot_exhibition.py
          revision: local-validation-2026-08-04
        - repository: hakoniwalab/hakoniwa-godot
          path: examples/mujoco
          revision: local-validation-2026-08-04
        - repository: hakoniwalab/hakoniwa-mujoco-robots
          path: src/main_for_sample/tb3
          revision: local-validation-2026-08-04
      notes:
        - A PS5 controller sent GameControllerOperation commands to TB3/hako_cmd_game.
        - MuJoCo displayed TurtleBot3 motion and published TB3/base_link_pos and TB3/joint_states.
        - Godot loaded the generated TurtleBot3 scene and displayed synchronized motion.
        - The controller sent a neutral command during shutdown.

    - id: clean_foundation_bootstrap
      status: not_tested
      evidence: []
      notes:
        - Re-run the complete guide from an empty work directory before claiming clean-machine reproducibility.

constraints:
  - no-ros-runtime
  - single-pc
  - shared-memory-pdu
  - visualization-polling
  - simulation-only

target_environment:
  required_for: executable-demo
  status: recorded
  os: macOS
  os_version: unknown
  architecture: arm64
  execution_mode: native
  runtimes:
    - name: Godot
      required: true
      version: unknown
      path: auto-discovered or supplied with --godot-bin
    - name: MuJoCo
      required: true
      version: repository-managed
      path: hakoniwa-mujoco-robots
    - name: Python
      required: true
      version: "3.12"
      path: work/foundation/install/python
  hakoniwa:
    install_prefix: work/foundation/install
    components_built:
      - hakoniwa-core-pro
      - hakoniwa-pdu-python
      - hakoniwa-pdu-endpoint
  notes:
    - Run all commands inside the Workspace shell created by python tools/workspace.py enter.
    - The gamepad profile requires a PS5-compatible controller visible to pygame.
    - The route profile is the controller-free fallback.

execution_environment:
  required_for: executable-demo
  status: verified
  os: macOS
  os_version: unknown
  architecture: arm64
  execution_mode: native
  gui:
    required: true
    status: available
  shared_memory:
    required: true
    access: workspace-native
  devices:
    - name: PS5-compatible gamepad
      required: true
      available: verified-on-2026-08-04
    - name: gamepad for route profile
      required: false
      available: not-required
  python:
    environment: venv
    hakopy_available: true
  hakoniwa:
    install_prefix: work/foundation/install
    hako_cmd_access: available-in-workspace
  notes:
    - MuJoCo and Godot open GUI windows.
    - Launcher-managed processes continue running after the start command returns.
    - Execute the Recipe stop command before leaving the Workspace shell.

agency_boundary:
  agent_actions:
    - id: prepare_recipe_workspace
      description: Generate Recipe-owned configuration, the Godot project, launcher files, and the operator guide.
      autonomous: true
      preconditions:
        - user_requested_execution

    - id: build_simulation_assets
      description: Build the MuJoCo target and Godot native addon inside the approved local workspace.
      autonomous: true
      preconditions:
        - user_requested_execution
        - foundation_satisfied

    - id: run_simulation_demo
      description: Start and inspect the simulation-only MuJoCo and Godot composition.
      autonomous: true
      preconditions:
        - user_requested_execution
        - recipe_doctor_passed

  human_decisions:
    - id: confirm_visual_synchronization
      description: Confirm that the TurtleBot3 motion shown by Godot matches the motion shown by MuJoCo.
      status: required
      required_before:
        - claim_behavior_verified

  human_actions:
    - id: connect_gamepad
      description: Connect or pair the PS5-compatible controller before starting the gamepad profile.
      status: required
      confirmation_required: true
      required_before:
        - start_gamepad_profile

  required_permissions:
    - id: local_gui_and_shared_memory
      description: Permit local GUI windows and Hakoniwa shared-memory access.
      status: required
      required_before:
        - start_demo

  notes:
    - This Recipe controls only a simulated TurtleBot3 and does not actuate real hardware.

components:
  - id: hakoniwa-mbody-registry
    roles:
      - asset_generator
      - visualization_asset_source
    purpose: Provide TurtleBot3 Burger physics, GLB parts, the generated Godot scene, and robot synchronization artifacts.

  - id: hakoniwa-mujoco-robots
    roles:
      - physics_runtime
      - simulation_core
    purpose: Simulate TurtleBot3 physics, consume GameControllerOperation commands, and publish robot state PDUs.

  - id: hakoniwa-pdu-endpoint
    roles:
      - communication_infrastructure
      - integration_boundary
    purpose: Provide Core callback and polling endpoint profiles for MuJoCo and Godot.

  - id: hakoniwa-pdu-registry
    roles:
      - data_model
      - registry
    purpose: Provide canonical GameControllerOperation, pose, and JointState PDU contracts.

  - id: hakoniwa-godot
    roles:
      - visualizer
      - integration_boundary
    purpose: Display the generated TurtleBot3 scene and update it from Hakoniwa PDU state.

  - id: hakoniwa-core-pro
    roles:
      - simulation_core
      - time_sync
    purpose: Provide the Hakoniwa lifecycle, shared memory, and simulation time base.

foundation_requirements:
  hakoniwa-core-pro:
    capabilities:
      shared_memory: true
      hako_cmd: true
      python_binding: true
  hakoniwa-pdu-python:
    version:
      min: 1.6.5
    capabilities:
      hako_launcher: true
      launcher_background_lifecycle: true
      shm_backend: true
  hakoniwa-pdu-endpoint:
    capabilities:
      python_binding: true
      hakoniwa_core: true
      core_callback: true
      core_polling: true

recipe_local_requirements:
  hakoniwa-mujoco-robots:
    build_entrypoint: tools/hako.py
    required_artifacts:
      - tb3_sim_burger
      - tb3_route_demo.py
      - python/rc_utils/rc_utils.py
      - python/rc_config/ps4-control.json
  hakoniwa-godot:
    build_entrypoint: CMake
    required_codec_packages:
      - geometry_msgs
      - sensor_msgs
    required_artifacts:
      - addons/hakoniwa
      - addons/hakoniwa_msgs
      - addons/hakoniwa_robot_sync
  hakoniwa-mbody-registry:
    role: generated-physics-and-visualization-artifact-source
    required_artifacts:
      - TurtleBot3.generated.tscn
      - GLB parts
      - robot_sync.profile.json
      - TurtleBot3 Burger minimal MuJoCo world
  hakoniwa-pdu-registry:
    role: generated-PDU-and-Godot-codec-provenance
    required_artifacts:
      - geometry_msgs/Twist
      - sensor_msgs/JointState
      - hako_msgs/GameControllerOperation

connections:
  - from: hakoniwa-mbody-registry
    to: hakoniwa-mujoco-robots
    interface: generated-artifact
    data:
      - turtlebot3_burger.minimal_world.xml
      - PDU definition
    contract:
      status: verified
      requires:
        - TurtleBot3 Burger generated artifacts
        - MuJoCo-compatible asset manifest
      validation_notes:
        - The Burger model loaded and moved in the MuJoCo runtime.
    notes: The generated Burger model and PDU metadata are staged into the Recipe workspace.

  - from: hakoniwa-mbody-registry
    to: hakoniwa-godot
    interface: generated-artifact
    data:
      - TurtleBot3.generated.tscn
      - GLB parts
      - robot_sync.profile.json
    contract:
      status: verified
      requires:
        - generated Godot scene
        - robot synchronization profile
      validation_notes:
        - Godot loaded the generated TurtleBot3 scene during the 2026-08-04 exhibition run.
    notes: Visualization artifacts map the PDU state to Godot scene nodes.

  - from: hakoniwa-mujoco-robots
    to: hakoniwa-pdu-endpoint
    interface: pdu
    data:
      - TB3/hako_cmd_game
      - TB3/base_link_pos
      - TB3/joint_states
    contract:
      status: verified
      requires:
        - Core callback endpoint profile
        - Hakoniwa shared-memory access
      validation_notes:
        - MuJoCo consumed gamepad commands and published pose and wheel joint state.
    notes: MuJoCo is the command consumer and authoritative physics-state producer.

  - from: hakoniwa-pdu-endpoint
    to: hakoniwa-godot
    interface: pdu
    data:
      - TB3/base_link_pos
      - TB3/joint_states
    contract:
      status: verified
      requires:
        - Core polling endpoint profile
        - endpoint_shm_poll_with_pdu.json
        - robot_sync.profile.json
      validation_notes:
        - Godot displayed synchronized TurtleBot3 movement during the 2026-08-04 exhibition run.
    notes: Godot polls the latest pose and wheel state and applies them to the visual model.

  - from: hakoniwa-core-pro
    to: hakoniwa-mujoco-robots
    interface: command
    data:
      - lifecycle start
      - lifecycle stop
      - simulation time
    contract:
      status: verified
      requires:
        - Foundation Core configuration
        - Launcher-managed lifecycle
      validation_notes:
        - The Launcher started the simulation and returned an externally controllable background session.
    notes: The exhibition tool owns the Launcher session and exposes start, status, and stop commands.

data_flow:
  summary: >
    A PS5 controller or scripted route writes GameControllerOperation commands to
    TB3/hako_cmd_game. MuJoCo applies those commands to TurtleBot3 and publishes
    TB3/base_link_pos and TB3/joint_states. Godot polls those PDUs and updates the
    generated TurtleBot3 visual model.
  steps:
    - from: PS5 controller or route script
      to: hakoniwa-mujoco-robots
      data:
        - TB3/hako_cmd_game
      description: The controller provides forward and turning inputs through GameControllerOperation.
    - from: hakoniwa-mujoco-robots
      to: hakoniwa-godot
      data:
        - TB3/base_link_pos
        - TB3/joint_states
      description: The authoritative MuJoCo pose and wheel state are mirrored into the Godot visualization.

time_model:
  mode: visualization-polling
  components:
    - hakoniwa-core-pro
    - hakoniwa-mujoco-robots
    - hakoniwa-godot
  notes:
    - MuJoCo advances as a Hakoniwa simulation asset.
    - Godot participates in the lifecycle and polls the latest robot state for visualization.
    - Godot is a synchronized visual consumer, not a second authoritative physics engine in this Demo.

artifact_sets:
  physics_artifacts:
    description: TurtleBot3 Burger inputs consumed by the MuJoCo runtime.
    status: verified
    artifacts:
      - turtlebot3_burger.minimal_world.xml
      - tb3-burger-asset.json
      - tb3_sim_burger
