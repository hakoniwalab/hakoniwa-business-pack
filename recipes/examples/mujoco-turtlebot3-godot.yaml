  pdu_artifacts:
    description: Command, pose, wheel-state, endpoint, and synchronization definitions.
    status: verified
    artifacts:
      - tb3-pdudef-compact.json
      - endpoint_shm_poll_with_pdu.json
      - robot_sync.profile.json
      - hako_msgs/GameControllerOperation
      - geometry_msgs/Twist
      - sensor_msgs/JointState
    notes:
      - MuJoCo uses the callback profile and Godot uses the polling profile.

  runtime_artifacts:
    description: Generated launchers and operator commands for the exhibition Demo.
    status: partially_verified
    artifacts:
      - launcher-gamepad.json
      - launcher-route.json
      - launcher-session.json
      - tools/recipe/turtlebot3_godot_exhibition.py
    notes:
      - The gamepad profile was manually verified on macOS arm64.
      - A clean-workspace rebuild remains to be verified.

artifacts:
  - name: turtlebot3_burger.minimal_world.xml
    kind: mjcf
    producer: hakoniwa-mbody-registry
    consumer:
      - hakoniwa-mujoco-robots
    path: bodies/turtlebot3_burger/generated/turtlebot3_burger.minimal_world.xml

  - name: TurtleBot3.generated.tscn
    kind: godot-scene
    producer: hakoniwa-mbody-registry
    consumer:
      - hakoniwa-godot
    path: bodies/turtlebot3/godot_tb3_reference/TurtleBot3.generated.tscn

  - name: robot_sync.profile.json
    kind: profile
    producer: hakoniwa-godot
    consumer:
      - hakoniwa-godot
    path: examples/mujoco/config/robot_sync.profile.json

  - name: endpoint_shm_poll_with_pdu.json
    kind: endpoint-config
    producer: hakoniwa-godot
    consumer:
      - hakoniwa-pdu-endpoint
      - hakoniwa-godot
    path: examples/mujoco/config/endpoint_shm_poll_with_pdu.json

  - name: tb3-pdudef-compact.json
    kind: pdu-definition
    producer: hakoniwa-mujoco-robots
    consumer:
      - hakoniwa-mujoco-robots
      - hakoniwa-godot
    path: config/tb3-pdudef-compact.json

  - name: turtlebot3_godot_exhibition.py
    kind: command
    producer: hakoniwa-business-pack
    consumer:
      - operator
    path: tools/recipe/turtlebot3_godot_exhibition.py

missing_pieces:
  - Re-run configure, build, doctor, start, status, and stop from an empty work directory to verify clean-machine reproducibility.
  - Validate the exhibition workflow on Linux and Windows.
  - Decide whether TurtleBot3 Waffle should become a selectable exhibition profile.
  - Consolidate the Recipe-specific portal writer with tools/recipe.py so the YAML remains the only user-facing description source after configure.

demo:
  objective: >
    Drive a TurtleBot3 Burger in MuJoCo with a PS5 controller and display the same
    base pose and wheel motion in Godot through Hakoniwa PDU. Provide a scripted
    route profile when no controller is available.

  profiles:
    - id: gamepad
      description: Default exhibition profile using a connected PS5-compatible controller.
      launcher: work/recipes/mujoco-turtlebot3-godot/config/launcher-gamepad.json
    - id: route
      description: Controller-free fallback that runs a scripted figure-eight route.
      launcher: work/recipes/mujoco-turtlebot3-godot/config/launcher-route.json

  steps:
    - id: configure_recipe
      order: 1
      component: hakoniwa-business-pack
      action: Generate Recipe-owned MuJoCo configuration, Godot project files, launcher profiles, and the local operator portal.
      command: python tools/recipe/turtlebot3_godot_exhibition.py configure
      expected:
        - work/recipes/mujoco-turtlebot3-godot contains config, project, runtime, logs, and index.html.

    - id: build_recipe
      order: 2
      component: hakoniwa-business-pack
      action: Build the TurtleBot3 MuJoCo target and Godot native addon in the Recipe workspace.
      command: python tools/recipe/turtlebot3_godot_exhibition.py build
      expected:
        - tb3_sim_burger exists in the Recipe build directory.
        - The Godot native addon and geometry_msgs and sensor_msgs codecs exist in the generated project.

    - id: doctor_recipe
      order: 3
      component: hakoniwa-business-pack
      action: Verify Foundation imports, endpoint libraries, generated files, Godot, the simulator, and the connected controller.
      command: python tools/recipe/turtlebot3_godot_exhibition.py doctor
      expected:
        - All required checks report OK before the gamepad profile is started.

    - id: start_gamepad_profile
      order: 4
      component: hakoniwa-business-pack
      action: Start MuJoCo, Godot, and the PS5 gamepad controller as a background Launcher session.
      command: python tools/recipe/turtlebot3_godot_exhibition.py start
      expected:
        - The command returns after the Demo readiness markers are observed.
        - MuJoCo and Godot remain running in the background.

    - id: start_route_profile
      order: 5
      component: hakoniwa-business-pack
      action: Start the scripted route fallback instead of the gamepad profile.
      command: python tools/recipe/turtlebot3_godot_exhibition.py start --profile route
      expected:
        - TurtleBot3 follows a figure-eight route without a physical controller.
      notes: Run this only when no other profile is active.

    - id: check_status
      order: 6
      component: hakoniwa-business-pack
      action: Inspect the active Launcher session.
      command: python tools/recipe/turtlebot3_godot_exhibition.py status
      expected:
        - The Launcher session reports RUNNING while the Demo is active.

    - id: stop_demo
      order: 7
      component: hakoniwa-business-pack
      action: Send a neutral controller command and terminate all Recipe-owned processes through the Launcher control path.
      command: python tools/recipe/turtlebot3_godot_exhibition.py stop
      expected:
        - The gamepad worker reports that a neutral command was sent.
        - MuJoCo, Godot, and controller processes exit through the managed lifecycle.

  readiness:
    lifecycle_state:
      source: Launcher session file
      required: RUNNING
      sufficient: false
    checks:
      - id: mujoco_endpoint_ready
        kind: log-marker
        target: tb3-mujoco.out
        expected: TB3 endpoint started successfully
      - id: godot_sync_ready
        kind: log-marker
        target: tb3-godot.out
        expected: TB3_GODOT_SYNC_READY
      - id: controller_ready
        kind: log-marker
        target: tb3-gamepad.out or tb3-route.out
        expected: TB3_GAMEPAD_READY or TB3 route demo start
      - id: synchronized_motion
        kind: human-observation
        target: MuJoCo and Godot windows
        expected: TurtleBot3 position and turning direction change consistently in both views
    operator_handoff:
      background: true
      explain_command_return: true
      next_actions:
        - Move the controller sticks and compare MuJoCo with Godot.
        - Run python tools/recipe/turtlebot3_godot_exhibition.py status.
        - Run python tools/recipe/turtlebot3_godot_exhibition.py stop before exit.

  observability:
    success_signals:
      - The PS5 controller moves TurtleBot3 forward, backward, left, and right in MuJoCo.
      - Godot shows the same base movement and wheel rotation as MuJoCo.
      - Releasing the sticks stops the robot.
      - The route profile moves the robot without a controller.
      - The stop command sends a neutral controller state and terminates the Launcher session.
    failure_signals:
      - The Launcher is RUNNING but TB3_GODOT_SYNC_READY is absent.
      - MuJoCo moves while the Godot robot remains stationary or moves in the wrong direction.
      - Godot reports missing codec, endpoint, or robot synchronization resources.
      - The gamepad worker exits because no controller is detected.
      - A second start collides with an existing Launcher session.
    fixtures:
      - A desktop environment capable of showing both MuJoCo and Godot windows.
      - A connected PS5-compatible controller for the default profile.
    automation:
      - The exhibition tool generates the project, launchers, and local portal.
      - The Launcher owns MuJoCo, Godot, and the selected controller process.
      - The route profile provides a controller-free figure-eight fallback.

  cleanup:
    owner: hakoniwa-business-pack
    provider: hakoniwa-pdu launcher control
    mode: managed-session
    target: work/recipes/mujoco-turtlebot3-godot/runtime/launcher-session.json
    trigger: operator stop command or failed readiness verification
    expected_behavior:
      - Send a neutral GameControllerOperation command before the controller exits.
      - Terminate only the processes recorded in the Recipe Launcher session.
      - Return the Hakoniwa lifecycle to a stopped state.
    verification_checks:
      - The Launcher status command no longer reports RUNNING.
      - MuJoCo and Godot windows close.
      - No Recipe-owned controller process remains active.
    cautions:
      - Run the Recipe stop command before using exit to leave the Workspace shell.
      - Do not use broad kill commands or kill unrelated Python processes.
      - Do not start the route and gamepad profiles at the same time.

expected_result: >
  A user can follow the generated Recipe guide to prepare the local Foundation,
  build the Demo, drive TurtleBot3 in MuJoCo with a PS5 controller, and observe
  the same motion in Godot. The Demo can be inspected and stopped through explicit
  status and stop commands, and ROS is not required.

