artifacts:
  - name: experiment-input
    kind: config
    producer: hakoniwa-business-pack
    consumer:
      - hakoniwa-business-pack
    path: recipes/experiments/drone-fleet-single-host-mvp.yaml
  - name: resolved-experiment
    kind: config
    producer: hakoniwa-business-pack
    consumer:
      - hakoniwa-core-pro
      - hakoniwa-drone-core
    path: work/recipes/drone-fleet-single-host/config/resolved-experiment.yaml
