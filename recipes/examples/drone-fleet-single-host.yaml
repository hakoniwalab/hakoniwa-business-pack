experiment_contract:
  source: recipes/experiments/drone-fleet-single-host-mvp.yaml
  user_inputs:
    - scale.drone_count
    - scale.drones_per_process
    - scale.process_count
    - runtime.visualization
    - runtime.show_runner_real_time_sync
    - scenario.altitude_m
    - scenario.word
    - scenario.letter_width_m
    - scenario.letter_height_m
    - scenario.letter_gap_m
    - scenario.duration_sec
    - scenario.hold_sec
    - scenario.speed_m_s
    - scenario.timeout_sec
    - scenario.land
  resolution:
    - The current MVP default is process_count=4 and drones_per_process=50, producing 200 total drones.
    - Changing only process_count to 2 or 3 produces 52 or 78 total drones while preserving 26 drones per process.
    - drone_count=auto resolves to process_count*drones_per_process.
    - process_count=auto resolves to ceil(drone_count/drones_per_process).
    - An explicit process_count must be between 1 and drone_count and uses balanced fleet splitting.
    - Foundation build limits are derived from the resolved drone and process counts.
    - runtime.visualization=true generates and launches VSP, WebBridge, and the Three.js HTTP server.
    - runtime.visualization=false omits their configuration, processes, ports, and Bridge Foundation requirement.
    - runtime.visualization=false does not pass --real-sleep-msec to any Drone service; the native default is 0, so simulator-loop real sleep is disabled.
    - The current MVP also leaves --real-sleep-msec unspecified when runtime.visualization=true. Visualization selection and simulator pacing are not silently coupled.
    - The first Drone Simulator process owns the built-in Conductor; process 2..N receive --disable-conductor.
    - External Conductor Server/Client belongs to the future multi-host Recipe and must not be co-located in this single-host topology.
    - runtime.show_runner_real_time_sync=true enables cumulative wall-clock pacing after each successful hakopy.usleep().
    - The pacer sleeps only while Hakoniwa simulation time is ahead of aligned wall time; it does not add a fixed sleep when computation is already slower than real time.
    - Empty RPC poll backoff is fixed to 0 in this Recipe and is independent of real-time synchronization.
    - open-viewer is valid only when runtime.visualization=true; smoke remains the behavioral completion check in both modes.
    - The public/default native Drone binary profile is a general-user contract capped at 200 drones; configure rejects 201 or more before generating runnable artifacts.
    - A 201-512 drone research run requires Hakoniwa Drone PRO license/source access and a separately built and verified 512-drone Core/Drone/VSP/Foundation profile. Increasing only Foundation limits does not satisfy the binary contract.
    - For fair scalability comparisons, every measurement point in one experiment series, including points at or below 200 drones, must use the same 512-drone binary profile when the series includes a point above 200.
    - HAKONIWA has 26 stroke segments, so the scenario requires at least 26 drones.
    - Counts from 26 through 51 use one or more drones per stroke and emit a readability warning; 52 or more are recommended.
    - After the per-stroke minimum is reserved, remaining drones are allocated in proportion to stroke length.
    - The resolved experiment is written under the Recipe workspace before execution.
    - Run configure again after every experiment YAML change; generated partitions, requirements, and this Portal are refreshed, and any stale Launcher is invalidated.
    - doctor or start validates the installed Foundation and Drone binaries, then regenerates config/launcher.json from the resolved experiment.
    - scenario.duration_sec is the configured formation-move duration, not total wall-clock execution time.
    - smoke waits up to 300 wall-clock seconds by default and reports paired wall/Core phase durations, total elapsed time, authoritative Core simulation time, and Real Time Factor from execution-summary.json.
  future_extensions:
    - experiment matrix expansion
    - repetitions and warmup
    - per-run result preservation and aggregate statistics
    - host and process CPU/memory observations
    - temporal deviation and scheduled-event deviation
    - raw and summarized results

process_topology:
  required_for: multi-process-demo
  conductor_owner: drone-service-1-built-in-conductor
  viewer_owner: threejs-viewer-webserver-when-visualization-enabled
  simulator_processes:
    - id: drone-service-1..N
      asset_name: drone-1..N
      conductor: enabled-only-for-drone-service-1; disabled-for-drone-service-2..N
      viewer: disabled
      real_robots:
        - robot_name: balanced-subset-of-Drone-1..M
          model: Hakoniwa Drone 6DoF
          publishes:
            - standard Drone PDU set
      mirrored_robots: []
  controller_processes:
    - id: show-runner
      target_robot: all-generated-drones
      target_pdu: generated RPC service configuration
  visualization_processes:
    - id: visual-state-publisher
      purpose: Aggregate all drone poses into fleet visualization packets.
    - id: web-bridge-fleets
      purpose: Publish fleet visualization packets over localhost WebSocket.
    - id: threejs-viewer-webserver
      purpose: Serve the browser viewer on localhost port 8000.
  visualization_condition: runtime.visualization=true
  notes:
    - All processes run on one native host and use one Foundation Core mmap domain.
    - drone-service-1 owns built-in Conductor startup.
    - Only drone-service-2..N receive --disable-conductor.

components:
  - id: hakoniwa-drone-core
    roles:
      - physics_runtime
      - simulation_core
    purpose: Generate and simulate the configurable fleet and provide the RPC workload runner.
  - id: hakoniwa-core-pro
    roles:
      - simulation_core
      - time_sync
    purpose: Provide the single-host shared-memory runtime, lifecycle, and common simulation time.
  - id: hakoniwa-pdu-python
    roles:
      - language_binding
      - control_plane
    purpose: Provide Python 3.12 PDU access, Launcher, and session-file lifecycle control.
  - id: hakoniwa-pdu-endpoint
    roles:
      - communication_infrastructure
      - integration_boundary
    purpose: Provide the callback endpoint used by VSP/WebBridge when visualization is enabled.
  - id: hakoniwa-pdu-bridge-core
    roles:
      - bridge
    purpose: Optionally forward fleet visual state from shared memory to WebSocket.
  - id: hakoniwa-threejs-drone
    roles:
      - visualizer
    purpose: Optionally render all generated drones and the HAKONIWA formation in a browser.

connections:
  - from: hakoniwa-drone-core
    to: hakoniwa-core-pro
    interface: pdu
    data:
      - generated per-drone PDU channels
      - generated per-drone RPC services
    contract:
      status: partially_verified
      requires:
        - Foundation build limits satisfy the resolved experiment.
        - All simulator processes use the same local Foundation Core configuration and mmap domain.
        - drone-service-1 owns built-in Conductor startup.
        - Only drone-service-2..N receive --disable-conductor.
      validation_notes:
        - Native macOS E2E completed with 26 drones in one and two processes and with 200 drones in four processes.
        - Linux and Windows native E2E remain unverified.
  - from: hakoniwa-pdu-python
    to: hakoniwa-drone-core
    interface: api
    data:
      - synchronized takeoff and HAKONIWA formation RPC commands
      - completion summary
    contract:
      status: partially_verified
      requires:
        - The show runner and Launcher use the Foundation Python 3.12 environment.
        - Service names and IDs are generated globally before fleet splitting.
      validation_notes:
        - The underlying Drone Core show runner is reused without copying its implementation.

data_flow:
  summary: Experiment YAML is resolved into runtime artifacts; the show runner controls all fleet partitions over the shared PDU/RPC runtime.
  steps:
    - from: experiment YAML
      to: Business Pack Recipe operator
      data:
        - drone_count
        - drones_per_process or process_count
        - generated scenario parameters
      description: Resolve one concrete native single-host experiment.
    - from: Business Pack Recipe operator
      to: hakoniwa-drone-core
      data:
        - full fleet and service configuration
        - balanced per-process fleet configuration
        - PDU definition
        - Launcher topology
      description: Generate all mutable artifacts under work/recipes/drone-fleet-single-host.
    - from: show-runner
      to: drone-service-1..N
      data:
        - SetReady
        - TakeOff
        - GoTo
        - HAKONIWA formation and hold
      description: Exercise every generated drone as one coordinated simulation workload.
    - from: drone-service-1..N
      to: visual-state-publisher
      data:
        - all generated drone poses
      description: When visualization is enabled, aggregate native simulator state into fleet visualization packets.
    - from: visual-state-publisher
      to: hakoniwa-threejs-drone
      data:
        - DroneVisualStateArray over WebBridge WebSocket
      description: When visualization is enabled, make synchronized fleet behavior observable in the browser.

time_model:
  mode: shared-simulation-time
  components:
    - hakoniwa-core-pro
    - hakoniwa-drone-core
    - hakoniwa-pdu-python
  notes:
    - One local Core PRO instance provides the common simulation time.
    - Simulator processes are workload partitions, not independent simulation runs.
    - Every generated Drone service omits --real-sleep-msec, selecting the native value 0 and disabling simulator-loop real sleep.
    - runtime.visualization controls VSP/WebBridge/Three.js only; it does not currently enable real sleep in visualization mode.
    - drone-service-1 advances the single-host simulation through its built-in Conductor; follower Drone processes do not start another Conductor.
    - runtime.show_runner_real_time_sync controls whether ShowRunner paces wall time to the authoritative Core simulation clock after each 20msec hakopy.usleep step.
    - Multi-host bounded time coordination belongs to the separate future drone-fleet-multi-host Recipe.

