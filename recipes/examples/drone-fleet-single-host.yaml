id: drone-fleet-single-host
title: Native Single-host Multi-process Hakoniwa Drone Fleet
recipe_version: 0.1

goal:
  user_request: 任意数の箱庭ドローンを1台のホスト上で複数のシミュレータプロセスへ分割し、macOS・Linux・Windowsで同じ実験設定から実行したい
  description: >
    Run one temporally coordinated Hakoniwa Drone simulation on a single native
    host. An experiment YAML declares the drone count and either an explicit
    process count or a drones-per-process target. Business Pack generates the
    fleet, service, PDU, scenario, Foundation-capacity, and Launcher artifacts
    under the Recipe workspace without modifying Drone Core. The MVP executes a
    synchronized takeoff followed by a generated HAKONIWA formation and records
    a completion summary. runtime.visualization selects either browser observation
    through VSP/WebBridge/Three.js or a headless runtime without those processes.
    Per-run wall/Core phase timing and Real Time Factor are recorded in the
    completion summary. Automated experiment matrices and result aggregation
    are later extensions.

feasibility:
  status: feasible
  confidence: high
  rationale:
    - Drone Core provides arbitrary fleet generation, balanced fleet splitting, native macOS/Linux/Windows binaries, and the shared RPC show runner.
    - Drone Core supports one built-in Conductor owner with additional local simulator processes joining the same Core domain.
    - Core PRO supports multiple local assets sharing one simulation time and exposes build limits through Foundation Receipts.
    - PDU Python provides the cross-platform Launcher and session-file background lifecycle.
    - Business Pack can derive process count and Foundation capacity from one experiment YAML before runtime startup.

validation:
  status: partially_verified
  summary: >
    Native macOS validation covers 26 drones in one and two simulator
    processes, visualization and headless modes, cumulative real-time pacing,
    and a 200-drone/four-process headless run. Linux and Windows remain to be
    verified.
  steps:
    - id: experiment_resolution
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: tools/recipe/test_drone_fleet_single_host.py
          revision: main
      notes:
        - Unit tests cover automatic process count, capacity calculation, one built-in Conductor owner, follower-process ordering, and generated Launcher ownership.
    - id: native_macos_mvp
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: work/recipes/drone-fleet-single-host/validation/execution-summary.json
          revision: local-runtime-evidence
      notes:
        - Verified 26 drones in one simulator process with its built-in Conductor and VSP/WebBridge enabled.
        - execution-summary recorded status=done, drone_count=26, proc_count=1, and the complete HAKONIWA workload.
        - Verified 26 drones split across two simulator processes with exactly one built-in Conductor owner.
        - With real-time pacing disabled, RTF improved from 3.510 for one process to 6.964 for two processes, approximately 1.984x speedup and 99.2 percent parallel efficiency.
        - With real-time pacing enabled for 26 drones/two processes, simulation elapsed 18.04 sec and aligned wall elapsed 18.044 sec, producing RTF 0.99978.
        - A 200-drone/four-process headless run completed with simulation elapsed 21.52 sec, aligned wall elapsed 23.40 sec, and RTF approximately 0.92 on the tested Mac.
    - id: native_linux_mvp
      status: not_tested
      evidence: []
    - id: native_windows_mvp
      status: not_tested
      evidence: []

constraints:
  - single-host
  - native-execution-only
  - multi-process
  - general-user-distribution-max-200-drones
  - one-shared-simulation-time
  - one-built-in-conductor-owner
  - no-docker
  - no-strong-cross-process-physical-coupling
  - simulation-only
  - automated-experiment-matrix-deferred
  - generated-artifacts-stay-under-business-pack-work

target_environment:
  required_for: executable-demo
  status: specified
  os: macOS | Linux
  os_version: current-supported-host
  architecture: host-native
  execution_mode: native
  runtimes:
    - name: Python
      required: true
      version: "3.12"
      path: work/foundation/install/python
    - name: Hakoniwa Drone native distribution
      required: true
      version: "4.x-compatible"
      path: hakoniwa-drone-core/lib | hakoniwa-drone-core/mac | hakoniwa-drone-core/lnx | hakoniwa-drone-core/win
  hakoniwa:
    install_prefix: work/foundation/install
    components_built:
      - hakoniwa-core-pro
      - hakoniwa-pdu-python
      - hakoniwa-pdu-endpoint
      - hakoniwa-pdu-bridge-core
  notes:
    - The same experiment YAML and Python operator are used on all three operating systems.
    - Platform differences are limited to native executable names and dynamic-library search paths.
    - The single-host Recipe does not install or launch the distributed Hakoniwa Conductor Server/Client package.

execution_environment:
  workspace:
    mode: managed
  required_for: executable-demo
  status: specified
  os: host-native
  os_version: current-supported-host
  architecture: host-native
  execution_mode: native
  gui:
    required: conditional
    status: browser-viewer-when-runtime.visualization-is-true
  shared_memory:
    required: true
    access: local-host
  python:
    environment: foundation-venv
    path: work/foundation/install/python
    version: "3.12"
    hakopy_available: required
    hakoniwa_pdu_available: required
  hakoniwa:
    install_prefix: work/foundation/install
    hako_cmd_access: required
  notes:
    - runtime.visualization=true uses Three.js to make fleet takeoff and the HAKONIWA formation observable.
    - runtime.visualization=false omits VSP, WebBridge, the HTTP server, and browser prerequisites for a headless experiment.
    - Behavioral completion is independently validated through the generated execution summary.
    - Foundation build limits are generated from the selected experiment before startup.

agency_boundary:
  agent_actions:
    - id: generate_experiment_runtime
      description: Resolve the experiment YAML and generate all Recipe-local configuration.
      autonomous: true
      preconditions:
        - user_requested_execution
    - id: run_native_simulation
      description: Start, inspect, smoke-test, and stop the simulation-only native runtime.
      autonomous: true
      preconditions:
        - user_requested_execution
        - foundation_satisfied
  human_decisions:
    - id: approve_experiment_design
      description: Decide whether the selected fleet sizes, process counts, repetitions, metrics, and host specifications support the paper claim.
      status: required
      required_before:
        - paper_evaluation
  human_actions: []
  required_permissions:
    - id: drone_core_license
      description: Confirm that the intended use complies with the public non-commercial terms or an applicable Hakoniwa Drone PRO agreement.
      status: required
      required_before:
        - simulation_execution
    - id: drone_pro_512_profile
      description: A run above 200 drones requires a Hakoniwa Drone PRO license, access to the private PRO source, and an approved 512-drone binary profile.
      status: required
      required_before:
        - configure_above_200_drones
        - build_512_profile
        - simulation_execution_above_200_drones

