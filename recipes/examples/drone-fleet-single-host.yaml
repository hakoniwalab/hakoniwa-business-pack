missing_pieces:
  - Execute the same resolved experiment on native Linux.
  - Verify the native single-host runtime on Windows before restoring the Windows runtime claim.
  - Add experiment matrix expansion, repeated trials, per-run result preservation, and results aggregation.
  - Create the separate multi-host Recipe and host-placement contract for the 1024-drone experiment.
  - Define a machine-verifiable Receipt for the 512-drone Core/Drone/VSP/Foundation binary profile before enabling 201-512 drone experiments.
  - Resolve why the Drone PRO 512-drone documents select service_client_max=1024 while the current sizing calculator derives 512; the two-node 512+512 allocation is a hypothesis, not yet a fixed contract.

implementation_plan:
  - Define a strict dependency-free MVP experiment YAML contract.
  - Resolve automatic process count and Foundation build limits.
  - Generate fleet, PDU, service, HAKONIWA formation, and native Launcher artifacts under the Recipe workspace; generate VSP artifacts only when visualization is enabled.
  - Run synchronized takeoff, wait for every drone, form HAKONIWA, and hold through a background Launcher session.
  - Verify completion through execution-summary.json and cleanly terminate the owned session.
  - Preserve and aggregate per-run measurements after the native Linux and Windows paths are validated.
  - Extend the same contract with experiment matrices and results in a later revision.

acceptance_criteria:
  - A user can scale total drones by changing process_count while keeping drones_per_process fixed in one YAML file.
  - The default profile runs 200 drones in four simulator processes.
  - Generated fleet partitions are balanced and cover every drone exactly once.
  - Exactly one built-in Conductor in drone-service-1 owns time advancement; only drone-service-2..N disable theirs.
  - All generated mutable artifacts stay under work/recipes/drone-fleet-single-host.
  - HAKONIWA requires at least 26 drones; 26-51 is accepted with a readability warning and 52 or more is recommended.
  - The general-user Recipe rejects a resolved count above 200 and explains that a separately verified 512-drone profile is required.
  - A scalability series that includes more than 200 drones does not mix the public/default profile and the 512-drone profile across measurement points.
  - Foundation incompatibility is reported before native startup with the required build limits.
  - runtime.visualization=false starts no VSP, WebBridge, or HTTP server and does not require their binaries, ports, or Bridge Foundation component.
  - runtime.visualization=false passes no --real-sleep-msec option to Drone services, so the native default remains 0.
  - Launcher contract tests prevent headless mode from accidentally enabling simulator-loop real sleep.
  - ShowRunner receives --real-time-sync only when runtime.show_runner_real_time_sync=true; RPC empty-poll sleep remains disabled.
  - start returns after a managed background Launcher session becomes available.
  - open-viewer opens the localhost Three.js fleet viewer backed by VSP and WebBridge only when runtime.visualization=true.
  - open-viewer reports a clear contract error when runtime.visualization=false.
  - open-viewer derives maxDynamicDrones from the resolved experiment instead of fixing the browser count.
  - smoke reports success only when all generated drones complete the configured workload.
  - execution-summary.json records aligned wall_elapsed_sec and hakopy.simulation_time() endpoints, and derives real_time_factor as simulation_elapsed_sec / wall_elapsed_sec.
  - When real-time synchronization is enabled, execution-summary.json records the actual pacing sleep count and accumulated wall-clock sleep duration.
  - execution-summary.json records takeoff and each goto duration in both phase_times_sec (wall clock) and phase_simulation_times_sec (Hakoniwa Core clock).
  - stop uses the Launcher session-file control path and leaves a terminal session state.
  - The single-host experiment does not require the distributed Conductor package or a private Conductor PRO prefix.

demo:
  foundation_workflow: declared
  objective: Run 200 drones in four native simulator processes, wait for synchronized takeoff, and visibly form HAKONIWA in the browser.
  readiness:
    lifecycle_state:
      source: launcher-session
      required: RUNNING
      sufficient: false
    checks:
      - id: all-assets-registered
        kind: log
        target: work/recipes/drone-fleet-single-host/logs
        expected: One drone-service asset and ShowRunnerAsset register without early process exit.
      - id: workload-complete
        kind: file
        target: work/recipes/drone-fleet-single-host/validation/execution-summary.json
        expected: status is done, drone_count/process_count match the resolved experiment, and simulation_time.elapsed_sec plus real_time_factor are present.
    operator_handoff:
      background: true
      explain_command_return: true
      next_actions:
        - smoke
        - status
        - stop
        - open-viewer when runtime.visualization=true
  steps:
    - order: 1
      id: prepare_native
      component: hakoniwa-drone-core
      action: Explicitly clone the official public Drone Core source when missing and download the pinned v4.0.0 native distribution for this operating system.
      description: Verify the official release SHA-256, extract the native Drone service and visual-state publisher under the sibling hakoniwa-drone-core checkout, and rerun this command safely when the binaries already exist.
      command: python tools/recipe/drone_fleet_single_host.py prepare-native
      agency: agent_action
    - order: 2
      id: prepare_viewer
      component: hakoniwa-threejs-drone
      action: Clone the Three.js viewer recursively when missing, or initialize and update its pinned PDU JavaScript submodule in an existing checkout.
      description: Ensure the browser's required generated PDU JavaScript modules exist before doctor and startup; this step is required when visualization is enabled.
      command: python tools/recipe/drone_fleet_single_host.py prepare-viewer
      agency: agent_action
    - order: 3
      id: configure
      component: hakoniwa-pdu-python
      action: Resolve the experiment and generate Recipe-local configuration.
      command: python tools/recipe/drone_fleet_single_host.py configure
      agency: agent_action
    - order: 4
      id: prepare_foundation
      component: hakoniwa-core-pro
      action: Inspect and, when necessary, rebuild Foundation from the generated capacity requirements.
      command: python tools/foundation.py doctor --recipe work/recipes/drone-fleet-single-host/config/foundation-requirements.yaml
      agency: agent_action
    - order: 5
      id: plan_foundation
      component: hakoniwa-core-pro
      action: If Foundation is not satisfied, inspect the rebuild plan generated from the resolved fleet size.
      command: python tools/foundation.py plan --recipe work/recipes/drone-fleet-single-host/config/foundation-requirements.yaml
      agency: agent_action
    - order: 6
      id: build_foundation
      component: hakoniwa-core-pro
      action: Build and install the generated Foundation plan only when doctor reports an unsatisfied requirement.
      command: python tools/foundation.py build --recipe work/recipes/drone-fleet-single-host/config/foundation-requirements.yaml
      agency: agent_action
    - order: 7
      id: doctor
      component: hakoniwa-pdu-python
      action: Validate the native Drone binary, Foundation, Python imports, and generated artifacts; validate VSP/WebBridge/Viewer only when visualization is enabled.
      command: python tools/recipe/drone_fleet_single_host.py doctor
      agency: agent_action
    - order: 8
      id: start
      component: hakoniwa-pdu-python
      action: Start the native multi-process runtime in one managed background Launcher session.
      description: Start all native processes and automatically begin SetReady, synchronized takeoff, HAKONIWA placement, and hold.
      command: python tools/recipe/drone_fleet_single_host.py start
      agency: agent_action
    - order: 9
      id: open_viewer
      component: hakoniwa-threejs-drone
      action: When runtime.visualization=true, print the viewer URL for the operator to open in a browser and observe takeoff followed by the HAKONIWA formation; headless mode skips this step.
      command: python tools/recipe/drone_fleet_single_host.py open-viewer
      agency: agent_action
    - order: 10
      id: smoke
      component: hakoniwa-drone-core
      action: Verify the workload already started by start; do not start another flight.
      description: Wait up to 300 wall-clock seconds for execution-summary.json, require status=done, and print observed prepare, takeoff, HAKONIWA, and total execution times.
      command: python tools/recipe/drone_fleet_single_host.py smoke
      agency: agent_action
    - order: 11
      id: stop
      component: hakoniwa-pdu-python
      action: Terminate the Launcher session through its normal control path.
      command: python tools/recipe/drone_fleet_single_host.py stop
      agency: agent_action
  observability:
    success_signals:
      - execution-summary.json records status done with the resolved drone and process counts.
      - Show runner logs contain asset_show_done.
      - When visualization is enabled, the browser receives fleet state over WebSocket.
    failure_signals:
      - Foundation reports MISSING, INCOMPATIBLE, or UNKNOWN.
      - A native Drone service exits before the Launcher reaches RUNNING.
      - execution-summary.json records failed or is not produced before the smoke timeout.
    fixtures:
      - Generated packed-ring fleet and HAKONIWA word formation.
    automation:
      - Experiment resolution, balanced split, scenario generation, Launcher generation, and smoke verification are automated.
  verification_checks:
    lifecycle:
      - Launcher session reaches RUNNING and later TERMINATED.
    behavior:
      - Every configured drone completes SetReady, TakeOff, and GoTo before the HAKONIWA hold completes.
      - When runtime.visualization=true, the browser receives fleet state over ws://127.0.0.1:8765.
    logs:
      - Inspect per-asset logs and execution-summary.json.
  cleanup:
    owner: hakoniwa-launcher
    provider: hakoniwa-pdu-python
    mode: background
    target: work/recipes/drone-fleet-single-host/runtime/launcher-session.json
    trigger: python tools/recipe/drone_fleet_single_host.py stop
    expected_behavior:
      - hako_launcher_ctl terminate invokes LauncherService.terminate.
      - The session file remains and records a terminal state.
      - Only Launcher-owned assets are terminated.
    verification_checks:
      - Confirm Launcher status is no longer RUNNING.
      - Confirm no generated drone-service asset remains.
      - Inspect the Launcher session log for incomplete cleanup.
    cautions:
      - Do not kill recorded PIDs directly or broadly kill all Drone/Python processes.
      - Do not treat hako-cmd stop as process termination.
      - Always run stop before leaving the Workspace shell.

expected_result: >
  The default experiment runs 200 drones in four native simulator processes
  on one host. The first Drone Simulator process owns built-in Conductor time advancement,
  subsequent Drone processes disable their embedded Conductor, and all application assets share one Core
  simulation time, and the generated ShowRunnerAsset drives every drone through
  SetReady, synchronized TakeOff, one generated HAKONIWA formation, and its hold. A completion summary is
  written under the Recipe workspace. Visualization mode additionally launches
  VSP/WebBridge/Three.js; headless mode leaves those processes out while retaining
  the same built-in Conductor ownership and workload. Each run records paired wall/Core phase
  durations and Real Time Factor. The same YAML and operator form the native macOS/Linux contract;
  automated matrices, retained result sets, and aggregate statistics remain a later step.

