id: athrill-v850e2m-windows-build
title: Athrill V850E2M Native Windows Build
recipe_version: 0.1
goal:
  user_request: Rebuild and reproducibly validate the Athrill V850E2M native Windows build environment under Business Pack.
  description: >
    Build, smoke-test, and install athrill2 with native MSVC and the explicitly
    selected vcpkg tree, preserving a Component Receipt for later inspection.
feasibility:
  status: feasible
  confidence: high
  rationale:
    - The component-owned CLI initializes Visual Studio and handles WSL UNC workspaces.
    - A native Windows x64 build and usage smoke passed with C:\project\vcpkg.
validation:
  status: verified
  summary: Native Windows x64 configure, build, CTest usage smoke, install, and Foundation Receipt evaluation passed on 2026-08-20.
  steps:
    - id: windows_cli_build
      status: verified
      evidence:
        - repository: toppers/athrill-target-v850e2m
          path: tools/hako.py
          revision: local-working-tree
    - id: foundation_receipt
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: tools/foundation.py
          revision: local-working-tree
constraints:
  - native-windows-x64
  - visual-studio-2022
  - ninja-generator
  - explicit-vcpkg-root
  - exdev-mros-vdev-disabled
target_environment:
  required_for: build-and-smoke
  status: specified
  os: Windows
  os_version: current-supported-host
  architecture: x64
  execution_mode: native
  runtimes:
    - name: Python
      required: true
      version: "3"
      path: host
  hakoniwa:
    install_prefix: work/foundation/install
    components_built:
      - athrill-target-v850e2m
execution_environment:
  workspace:
    mode: managed
  required_for: build-and-smoke
  status: specified
  os: Windows
  os_version: current-supported-host
  architecture: x64
  execution_mode: native
  gui:
    required: false
    status: disabled
  shared_memory:
    required: false
    access: not-used
  hakoniwa:
    install_prefix: work/foundation/install
    hako_cmd_access: not-required
foundation_contract:
  mode: required
  reason: Foundation owns the resolved manifest, install prefix, Component Receipt, and compatibility inspection.
foundation_requirements:
  athrill-target-v850e2m:
    version:
      min: 1.0.2
    capabilities:
      target_v850e2m: true
      usage_smoke: true
      exdev: false
      mros: false
      vdev: false
components:
  - id: athrill-target-v850e2m
    roles:
      - simulation_core
connections: []
data_flow:
  - Foundation requirement -> component build manifest -> CMake/MSVC build -> athrill2.exe and Component Receipt
time_model:
  mode: instruction-emulation
  notes:
    - The build smoke does not run a target ELF and therefore does not validate simulated timing.
artifact_sets: {}
artifacts:
  - id: athrill2_windows
    kind: executable
    path: work/foundation/install/bin/athrill2.exe
missing_pieces:
  - A reviewed V850E2M ELF/config fixture is still needed for behavioral emulation smoke coverage.
demo:
  prerequisites:
    - id: select_vcpkg
      command: python tools/foundation.py toolchain --recipe-id athrill-v850e2m-windows-build --vcpkg-root C:\project\vcpkg
      expected: Persist the explicit vcpkg root under the managed Foundation configuration.
  steps:
    - id: inspect_plan
      command: python tools/foundation.py plan --recipe recipes/examples/athrill-v850e2m-windows-build.yaml
      expected: Show athrill-target-v850e2m as the required Foundation component.
    - id: build_foundation
      command: python tools/foundation.py build --recipe recipes/examples/athrill-v850e2m-windows-build.yaml
      expected: Build, install, smoke-test, and verify the athrill-target-v850e2m Receipt.
    - id: inspect_install
      command: python tools/foundation.py doctor --recipe recipes/examples/athrill-v850e2m-windows-build.yaml
      expected: Report athrill-target-v850e2m as SATISFIED.
  cleanup:
    expected_behavior:
      - No background process is left by the build or usage smoke test.
    verification_checks:
      - Confirm no athrill2 process remains after CTest.
      - Preserve work/foundation/install and its Receipt for inspection.
    cautions:
      - Removing work/foundation discards the managed install and build evidence.
expected_result: >
  work/foundation/install/bin/athrill2.exe exists, the usage smoke passes, and
  Foundation reports the installed athrill-target-v850e2m Receipt as SATISFIED.
source_catalogs:
  - component_id: athrill-target-v850e2m
source_artifacts: []
