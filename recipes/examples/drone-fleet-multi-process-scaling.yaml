id: drone-fleet-multi-process-scaling
title: Native Drone Fleet Boundary-focused Multi-process Performance Measurement
recipe_version: 0.1
goal:
  user_request: 箱庭ドローンの実時間性能境界付近で、同一ホストのプロセス分割による回復可能領域を測定したい
  description: >
    Measure native single-host performance on an explicit sparse matrix of 32,
    64, and 128 UAV workloads and simulator process counts. This boundary-focused
    Experiment B profile identifies where process partitioning restores real-time
    performance and intentionally keeps the embedded Conductor used by single-node execution.
feasibility:
  status: feasible
  confidence: high
  rationale:
    - The native Drone Fleet operator supports near-even static partitioning.
    - The Core asset limit allows one Fleet Asset plus up to 15 simulator processes.
validation:
  status: partially_verified
  summary: The former fixed-128-UAV performance preflight and the 2-vs-15-process Temporal Validation are verified on native macOS; the boundary-focused sparse matrix remains to be rerun on WSL2/Ubuntu.
  steps:
    - id: macos_performance_preflight
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: tools/recipe/test_drone_fleet_performance_b.py
          revision: local-working-tree
    - id: macos_temporal_preflight
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: tools/recipe/test_drone_fleet_temporal_b.py
          revision: local-working-tree
    - id: linux_preflight
      status: not_tested
      evidence: []
constraints:
  - single-host
  - native-execution-only
  - explicit-sparse-workload-matrix
  - embedded-conductor
  - headless-performance-mode
  - no-real-time-pacing
  - generated-results-stay-under-business-pack-work
target_environment:
  required_for: performance-measurement
  status: specified
  os: macOS | Linux
  os_version: current-supported-host
  architecture: host-native
  execution_mode: native
  runtimes:
    - name: Python
      required: true
      version: "3.12"
      path: work/foundation/install/python
  hakoniwa:
    install_prefix: work/foundation/install
    components_built:
      - hakoniwa-core-pro
      - hakoniwa-pdu-python
      - hakoniwa-pdu-endpoint
execution_environment:
  workspace:
    mode: managed
  required_for: performance-measurement
  status: specified
  os: host-native
  os_version: current-supported-host
  architecture: host-native
  execution_mode: native
  gui:
    required: false
    status: disabled
  shared_memory:
    required: true
    access: local-host
  python:
    environment: foundation-venv
    path: work/foundation/install/python
    version: "3.12"
    hakopy_available: required
  hakoniwa:
    install_prefix: work/foundation/install
    hako_cmd_access: required
foundation_contract:
  mode: required
  reason: The runner requires hakopy and the Core PRO measurement library from the managed Foundation.
foundation_requirements:
  hakoniwa-core-pro:
    capabilities:
      shared_memory: true
      hako_cmd: true
      python_binding: true
      measurement_library: true
  hakoniwa-pdu-python:
    version:
      min: 1.6.5
    capabilities:
      hako_launcher: true
      launcher_background_lifecycle: true
      shm_backend: true
      external_rpc: true
  hakoniwa-pdu-endpoint:
    capabilities:
      hakoniwa_core: true
      core_callback: true
components:
  - id: hakoniwa-core-pro
    roles: []
  - id: hakoniwa-pdu-python
    roles: []
  - id: hakoniwa-pdu-endpoint
    roles: []
connections: []
data_flow:
  - sparse UAV/process workload matrix -> near-even fleet partitions -> repeated performance results
time_model:
  mode: virtual-time-performance
  notes:
    - Single-node Experiment B uses the embedded Conductor.
    - External Conductor PRO and its 10 ms publish interval begin with Experiment C.
artifact_sets: {}
artifacts: []
missing_pieces:
  - WSL2/Ubuntu execution of the boundary-focused Experiment B matrix remains to be verified.
experiment_contract:
  source: recipes/experiments/drone-fleet-performance/multi-process-scaling.yaml
  user_inputs:
    - matrix.workloads
    - matrix.attempts
    - measurement.protocol_status
    - measurement.invalid_conditions
    - recipes/experiments/drone-fleet-performance/single-host-temporal-validation.yaml
  resolution:
    - Experiment B explicitly measures 32, 64, and 128 UAV workloads with a sparse process grid and never expands them as a Cartesian product.
    - The 16-UAV single-process boundary anchor remains Experiment A evidence and is not duplicated in Experiment B.
    - Temporal Validation is a separate 2-vs-15-process series and its timing results never enter the performance summary.
demo:
  prerequisites:
    - id: prepare_native
      command: python tools/recipe/drone_fleet_single_host.py prepare-native
      expected: Clone the pinned public Drone Core source when missing and install the official host-native macOS or Linux distribution.
  steps:
    - id: inspect_performance_matrix
      command: python tools/recipe/drone_fleet_performance_b.py plan
      expected: Show only the 16 explicitly declared UAV/process conditions and their recorded or pending attempts.
    - id: run_performance_matrix
      command: python tools/recipe/drone_fleet_performance_b.py run
      expected: Execute the initial three attempts for every declared UAV/process condition.
    - id: resume_performance_matrix
      command: python tools/recipe/drone_fleet_performance_b.py run --resume
      expected: Preserve recorded attempts and continue pending performance measurements.
    - id: rerun_invalid_attempts
      command: python tools/recipe/drone_fleet_performance_b.py run --resume --rerun-invalid
      expected: Recoverably archive invalid attempts and measure only those attempts again.
    - id: extend_variable_conditions
      command: python tools/recipe/drone_fleet_performance_b.py extend
      expected: Add attempts four and five only for conditions whose three-run spread exceeds the fixed threshold or contains failures.
    - id: summarize_performance
      command: python tools/recipe/drone_fleet_performance_b.py summarize
      expected: Generate raw and aggregate Experiment B summaries grouped by UAV count, including real-time recovery and process-count selection evidence.
    - id: plot_performance
      command: python tools/recipe/drone_fleet_performance_plot.py work/recipes/drone-fleet-multi-process-scaling/results/multi-process-scaling/summary/experiment-b.json --x-field process_count --drone-count 64
      expected: Generate a dependency-free SVG for one selected UAV workload; repeat with 32 or 128 to compare the other workload boundaries.
    - id: inspect_temporal_matrix
      command: python tools/recipe/drone_fleet_temporal_b.py plan
      expected: Show the separate 128-UAV temporal conditions at 2 and 15 processes.
    - id: run_temporal_validation
      command: python tools/recipe/drone_fleet_temporal_b.py run
      expected: Record raw stable temporal samples and validated lag statistics without modifying performance results.
    - id: resume_temporal_validation
      command: python tools/recipe/drone_fleet_temporal_b.py run --resume
      expected: Preserve a completed temporal endpoint and continue only the pending endpoint.
    - id: summarize_temporal_validation
      command: python tools/recipe/drone_fleet_temporal_b.py summarize
      expected: Generate the separate temporal summary JSON and CSV.
    - id: inspect_active_session
      command: python tools/recipe/drone_fleet_performance_b.py status
      expected: Inspect the Launcher session owned by the currently materialized Experiment B or Temporal condition.
    - id: emergency_stop
      command: python tools/recipe/drone_fleet_performance_b.py stop
      expected: Terminate the currently materialized Launcher session after an interrupted run.
  cleanup:
    expected_behavior:
      - The current Launcher session reaches a terminal state and Recipe-owned native Drone services exit.
    verification_checks:
      - Confirm status no longer reports a RUNNING Launcher session.
      - Confirm the next attempt passes the orphan-process guard.
    cautions:
      - A Ctrl+C interruption may leave the current Launcher condition active; inspect and stop it before another attempt.
expected_result: >
  Sixteen sparse UAV/process conditions report validated RTF, step time, CPU,
  memory, and the minimum process count that recovers real-time performance for
  each workload when one exists.
source_catalogs:
  - component_id: hakoniwa-core-pro
  - component_id: hakoniwa-pdu-python
  - component_id: hakoniwa-pdu-endpoint
source_artifacts: []
