missing_pieces:
  - Decide whether to keep using run_single_mission.bash or create a smaller named one-drone demo script for this Recipe.
  - Decide whether MuJoCo native viewer should also be enabled, or whether Three.js is the only intended visual output.

demo:
  objective: >
    Show one Hakoniwa Drone taking off, moving through a short scripted path,
    and landing while its pose updates in the Three.js browser viewer.
  steps:
    - order: 1
      component: hakoniwa-core-pro
      action: Inspect the reusable local Foundation without changing it.
      command: python3.12 tools/foundation.py doctor --recipe recipes/examples/drone-single-mujoco-threejs-mac.yaml
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: tools/foundation.py
          revision: issue-56-foundation-mvp
    - order: 2
      component: hakoniwa-core-pro
      action: Show the dependency-ordered Foundation build plan.
      command: python3.12 tools/foundation.py plan --recipe recipes/examples/drone-single-mujoco-threejs-mac.yaml
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: catalog/foundation-components.json
          revision: issue-56-foundation-mvp
    - order: 3
      component: hakoniwa-core-pro
      action: Build only missing or incompatible Foundation components into the Business Pack workspace.
      command: python3.12 tools/foundation.py build --recipe recipes/examples/drone-single-mujoco-threejs-mac.yaml
      notes:
        - If the Foundation is already SATISFIED, no component build or install command is executed.
        - UNKNOWN is not overwritten automatically.
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: foundation/README.md
          revision: issue-56-foundation-mvp
    - order: 4
      component: hakoniwa-drone-core
      action: Confirm the macOS Drone Core setup prerequisite is complete.
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: recipes/examples/hakoniwa-drone-core-mujoco-mac-setup.yaml
          revision: issue-56-foundation-mvp
      notes:
        - Do not duplicate binary fetch, MuJoCo install, or Mach-O link commands in this Demo Recipe.
        - Continue only after the prerequisite Recipe's Artifact and otool checks pass.
    - order: 5
      component: hakoniwa-business-pack
      action: Generate Recipe-specific PDU, Fleet, Bridge, Viewer, Launcher, and Mission configuration.
      command: python3.12 tools/recipe/drone_threejs.py configure
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: tools/recipe/drone_threejs.py
          revision: issue-56-foundation-mvp
      notes:
        - This step does not modify hakoniwa-drone-core.
        - Generated files are placed under work/recipes/drone-single-mujoco-threejs-mac.
    - order: 6
      component: hakoniwa-business-pack
      action: Run Recipe runtime preflight without rebuilding Foundation.
      command: python3.12 tools/recipe/drone_threejs.py doctor
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: tools/recipe/drone_threejs.py
          revision: issue-56-foundation-mvp
    - order: 7
      component: hakoniwa-drone-core
      action: Launch one-drone runtime, visual-state publisher, local Foundation WebBridge, and Three.js webserver.
      command: work/recipes/drone-single-mujoco-threejs-mac/launch.bash
      notes:
        - This launcher is a long-running lifecycle manager. Do not treat foreground blocking after hako-cmd start as failure.
        - Keep the launcher process alive while running the browser and external_rpc mission steps.
        - The launcher is ready for the next step when its output reaches hako-cmd start exited with 0.
        - HAKO_CONFIG_PATH points to the Foundation Core config, and all native/Python paths point to work/foundation/install.
        - To finish the Demo, press Ctrl+C in this launcher terminal. The launcher terminates all child assets; do not use hako-cmd stop as the launcher shutdown operation.
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: tools/recipe/drone_threejs.py
          revision: issue-56-foundation-mvp
    - order: 8
      component: hakoniwa-threejs-drone
      action: Open the fleets viewer and ask the user to press Connect.
      command: >
        open 'http://127.0.0.1:8000/index.html?viewerConfigPath=/config/viewer-config-fleets.json&wsUri=ws://127.0.0.1:8765&wireVersion=v2'
      notes:
        - Opening the browser is not enough; wait for the user to press Connect in the Three.js viewer.
        - If the webserver log is empty, do not assume failure. Check the HTTP endpoint or browser connection instead.
        - Do not run the external_rpc mission until the user confirms browser Connect.
      evidence:
        - repository: hakoniwalab/hakoniwa-threejs-drone
          path: README.md
          revision: local-research-2026-07-20
    - order: 9
      component: hakoniwa-pdu-python
      action: Run a Python external_rpc command sequence for one drone.
      command: work/recipes/drone-single-mujoco-threejs-mac/missions/run-single-mission.bash
      notes:
        - Run this only after the launcher is still alive and the user has confirmed Three.js Connect.
        - The mission response validates Python/API control; this Recipe also records user-visible browser motion as validation evidence.
      evidence:
        - repository: toppers/hakoniwa-drone-core
          path: docs/fleets/external-rpc-tutorial.md
          revision: local-research-2026-07-20
  observability:
    success_signals:
      - The Three.js viewer connects to ws://127.0.0.1:8765.
      - One drone appears in the browser.
      - The drone takes off, moves, and lands.
      - Python logs show successful set_ready, takeoff, goto, get_state, and land responses.
      - Drone service or publisher logs show simulation steps and visual-state publication.
    failure_signals:
      - mac-main_hako_drone_service fails to load libmujoco.
      - Python 3.12 cannot import hakopy or hakoniwa_pdu.
      - WebBridge starts but the browser has no DroneVisualStateArray channels.
      - The drone appears but pose does not change after Python commands.
      - Port 8000 or 8765 is already in use.
      - The launcher exits before hako-cmd start completes.
      - The external_rpc mission is run before the browser viewer has connected, leaving no browser-side visual evidence.
      - hako-cmd stop blocks while the foreground launcher remains responsible for child-process lifecycle; use Ctrl+C in the launcher terminal.
    fixtures:
      - One generated fleet drone with a matching service config and PDU definition.
      - Browser with WebGL support.
      - WebSocket bridge configured for fleets visual state.
    automation:
      - Use a scripted Python external_rpc controller instead of manual keyboard or joystick input.
      - Prefer hakoniwa-pdu hako_launcher for multi-process lifecycle once the final launch config is confirmed.
      - On macOS, open the Three.js viewer URL automatically after the HTTP server starts, then prompt the user to press Connect.
      - Treat the browser Connect step as a human-in-the-loop gate before running the flight mission.
  verification_checks:
    lifecycle:
      - hako_launcher starts drone-service before hako-cmd start.
      - visual-state-publisher and WebBridge start before or with simulation lifecycle.
      - hako-cmd start succeeds.
      - Launcher-managed processes are stopped through the Launcher cleanup path; hako-cmd stop is not OS-process cleanup.
    behavior:
      - Drone position z increases after takeoff.
      - Drone position x or y changes after goto.
      - Drone altitude returns near ground after land.
      - Three.js pose updates track the same movement.
    logs:
      - Python external_rpc prints ok responses for set_ready, takeoff, goto, and land.
      - WebBridge logs show ws=ws://127.0.0.1:8765 or equivalent startup.
      - Browser console reports fleets visual-state channels.
  cleanup:
    owner: hakoniwa-launcher
    provider: hakoniwa-pdu-python
    mode: immediate
    target: launcher-main-process
    normal:
      interactive: Ctrl+C
      signal: SIGINT
    expected_behavior:
      - Launcher invokes its normal terminate path and reports state -> TERMINATED.
      - Launcher terminates only the assets it manages, including the Drone service, visual-state publisher, WebBridge, and Three.js HTTP server.
    verification_checks:
      - Confirm no Launcher-managed asset process remains.
      - Confirm no process is listening on TCP port 8000.
      - Confirm no process is listening on TCP port 8765.
    cautions:
      - Do not substitute kill <PID>, whose default POSIX signal is SIGTERM, for Ctrl+C/SIGINT.
      - Do not use hako-cmd stop as the Launcher shutdown operation; it controls simulation lifecycle, not OS-process ownership.
      - Do not broadly terminate an unrelated process group, Python processes, or browser processes.
      - Use POSIX kill -INT <launcher-pid> only when the Launcher main PID is known and the interactive terminal is unavailable.

expected_result: >
  On macOS arm64, one Hakoniwa Drone is controlled by a Python 3.12 script and
  is visible in the Three.js browser viewer as it takes off, moves through a
  short path, and lands.

