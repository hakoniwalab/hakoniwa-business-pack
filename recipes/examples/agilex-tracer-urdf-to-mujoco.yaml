    description: Current MBody artifact-preparation versus runtime-ownership boundary.
  - repository: hakoniwalab/hakoniwa-mbody-registry
    path: docs/xacro-package-mapping.md
    revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
    description: Explicit ROS-free package mapping for $(find PACKAGE).
  - repository: hakoniwalab/hakoniwa-mbody-registry
    path: sources/agilex_tracer.yaml
    revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
    description: Pinned AgileX Tracer source definition and DAE-to-OBJ forge option.
  - repository: hakoniwalab/hakoniwa-mbody-registry
    path: tools/adapt_agilex_tracer_source.py
    revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
    description: Current Tracer-specific source normalization helper.
  - repository: agilexrobotics/tracer_ros
    path: tracer_description/urdf/tracer_v1.xacro
