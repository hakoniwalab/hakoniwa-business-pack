id: agilex-tracer-urdf-to-mujoco
title: AgileX Tracer source to MuJoCo with MBody Registry
recipe_version: 0.2

goal:
  user_request: AgileX Tracer の公開 Xacro/URDF を再現可能に取り込み、MuJoCo で利用できるロボット身体モデルと実行準備用 artifact を作りたい。
  description: >
    Materialize the pinned AgileX Tracer source, normalize the ROS-origin description,
    preprocess unsupported mesh formats when necessary, generate structural and
    target-prepared MuJoCo artifacts with hakoniwa-mbody-registry, then hand those
    artifacts to hakoniwa-mujoco-robots for runtime control and PDU validation.

feasibility:
  status: feasible
  confidence: high
  rationale:
    - hakoniwa-mbody-registry owns reproducible robot-body source materialization and artifact preparation.
    - The current MBody toolchain supports ROS-free Xacro processing, explicit $(find PACKAGE) mappings, DAE-to-OBJ preprocessing, structural MJCF generation, actuator/collision/contact overlays, and minimal-world composition.
    - The Tracer source definition is pinned to agilexrobotics/tracer_ros revision 151b53c548fe2f5d6dd67a9c1478ea340ad43f21.
    - The Tracer preparation path and downstream MuJoCo/Hakoniwa runtime smoke were previously validated.

validation:
  status: partially_verified
  verified_at: 2026-07-25
  summary: >
    The Tracer preparation and downstream runtime path has verified evidence from
    2026-07-22. The MBody architecture has since been refined: explicit Xacro package
    mapping is now supported generically, while the Tracer-specific adapter remains
    relevant for source normalization that is not merely package lookup, including
    excluding the Gazebo-only include and rewriting package mesh URIs for the current
    conversion path. MBody artifact preparation and downstream runtime behavior are
    intentionally validated as separate stages.
  steps:
    - id: pinned_source_materialization
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-mbody-registry
          path: sources/agilex_tracer.yaml
          revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      notes:
        - The source definition pins agilexrobotics/tracer_ros at 151b53c548fe2f5d6dd67a9c1478ea340ad43f21.
        - The selected source closure is tracer_description/.

    - id: ros_free_xacro_capability
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-mbody-registry
          path: tools/xacro2urdf.py
          revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
        - repository: hakoniwalab/hakoniwa-mbody-registry
          path: docs/xacro-package-mapping.md
          revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      notes:
        - ROS-style $(find PACKAGE) is not globally unsupported anymore; it can be resolved from explicit --package NAME=PATH mappings.
        - No ROS workspace discovery is performed, keeping package resolution explicit and deterministic.

    - id: tracer_source_normalization
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-mbody-registry
          path: tools/adapt_agilex_tracer_source.py
          revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      notes:
        - The current Tracer adapter still performs work beyond package lookup.
        - It removes the Gazebo-only include from the MuJoCo conversion path and rewrites package mesh URIs/current include assumptions for the fetched local tree.
        - A future cleanup may reduce adapter responsibilities by using generic --package mappings where equivalent, but that has not been re-verified as the canonical Tracer flow yet.

    - id: tracer_structural_conversion
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-mbody-registry
          path: tools/forge.sh
          revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
        - repository: hakoniwalab/hakoniwa-mbody-registry
          path: sources/agilex_tracer.yaml
          revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      notes:
        - The validated flow used DAE-to-OBJ preprocessing before MuJoCo compilation.
        - The structural tracer_v1.xml loaded successfully in MuJoCo with the expected wheel/caster joints.

    - id: tracer_target_preparation
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-mbody-registry
          path: tools/mjcf_add_actuators.py
          revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
        - repository: hakoniwalab/hakoniwa-mbody-registry
          path: tools/mjcf_apply_collision_primitives.py
          revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
        - repository: hakoniwalab/hakoniwa-mbody-registry
          path: tools/mjcf_add_contact_excludes.py
          revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
        - repository: hakoniwalab/hakoniwa-mbody-registry
          path: tools/mjcf_compose_world.py
          revision: 07cb0e0d4086970c7e5de959cdd98570731a4ff3
      notes:
        - Two wheel velocity actuators were layered on the structural model.
        - Primitive collision geometry and contact excludes were needed because the original mesh-contact behavior did not produce a useful rover-driving setup.
        - The tuned minimal world loaded in MuJoCo and exposed the expected actuators.
        - These are MBody target-preparation artifacts, not ownership of downstream controller/runtime semantics.

    - id: tracer_mujoco_runtime_smoke
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-mujoco-robots
          path: examples/actuators/agilex_tracer/agilex-tracer-rover-example.cpp
          revision: local-validation-2026-07-22
      notes:
        - A MuJoCo-only actuator smoke advanced simulation and produced positive forward displacement for a positive linear command.

    - id: tracer_hakoniwa_pdu_runtime_smoke
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-mujoco-robots
          path: examples/actuators/agilex_tracer/rover-twist-hakoniwa-asset.cpp
          revision: local-validation-2026-07-22
        - repository: hakoniwalab/hakoniwa-mujoco-robots
          path: examples/actuators/agilex_tracer/send_rover_twist.py
          revision: local-validation-2026-07-22
      notes:
        - The verified runtime order was asset process, sender process, then hako-cmd start.
        - geometry_msgs/Twist command input advanced the Tracer base through the downstream Hakoniwa runtime.
        - Shared-memory runtime execution is downstream validation and is not implied by successful MBody forge output.

constraints:
  - no-ros-runtime-required-for-mbody-conversion
  - single-pc-for-current-runtime-smoke
  - source-normalization-may-be-required
  - dae-mesh-preconversion-required-for-current-tracer-flow
  - conversion-and-runtime-are-separate-stages
  - prefer-declarative-preparation-inputs-over-hand-maintained-mjcf-forks

target_environment:
  required_for: executable-demo
  status: partially_known
  os: macOS | Linux
  architecture: arm64 | x86_64
  execution_mode: native
  runtimes:
    - name: Python
      required: true
      version: "3"
      path: unknown
    - name: MuJoCo
      required: true
      version: unknown
      path: unknown
  hakoniwa:
    install_prefix: /usr/local/hakoniwa
    components_built:
      - hakoniwa-mbody-registry
      - hakoniwa-mujoco-robots
  notes:
    - Use a repository-local Python virtual environment for the MBody toolchain.
    - MBody preparation itself does not require Hakoniwa shared memory.

execution_environment:
  required_for: executable-demo
  status: partially_known
  gui:
    required: true
    status: unknown
  shared_memory:
    required: true
    access: required-for-downstream-hakoniwa-runtime
  python:
    environment: venv
    hakopy_available: not-required-for-mbody-conversion
  hakoniwa:
    install_prefix: /usr/local/hakoniwa
    hako_cmd_access: required-for-runtime-demo
  notes:
    - The MuJoCo/Hakoniwa runtime stage requires downstream build/runtime prerequisites that are separate from MBody conversion prerequisites.

components:
  - id: hakoniwa-mbody-registry
    roles:
      - registry
      - asset_generator
      - data_model
    purpose: Materialize, normalize, and prepare reproducible Tracer robot-body artifacts.

  - id: hakoniwa-mujoco-robots
    roles:
      - physics_runtime
    purpose: Consume the prepared Tracer MuJoCo artifacts and own runtime actuation/control behavior.

connections:
  - from: hakoniwa-mbody-registry
    to: hakoniwa-mujoco-robots
    interface: generated-artifact
    data:
      - structural Tracer MJCF
      - optional actuated/collision/contact-prepared MJCF
      - optional minimal MuJoCo world
    contract:
      status: partially_verified
      requires:
        - Successful MBody source materialization and preparation.
        - A downstream runner that references the generated/prepared artifacts.
        - Runtime-specific actuator/control/PDU configuration where motion is required.
      validation_notes:
        - Structural and prepared MuJoCo artifacts were previously loaded successfully.
        - Downstream actuator and PDU runtime smoke checks were separately verified.
        - Conversion success alone must not be presented as runtime verification.
    notes: MBody owns preparation; hakoniwa-mujoco-robots owns runtime behavior.

data_flow:
  summary: >
    A pinned external Tracer source tree is materialized, normalized for the ROS-free
    preparation path, converted to structural MJCF, optionally layered with MuJoCo
    target-preparation artifacts, and then consumed by the downstream MuJoCo/Hakoniwa runtime.
  steps:
    - from: external-tracer-source
      to: hakoniwa-mbody-registry
      data:
        - tracer_description source tree
        - Xacro/URDF files
        - mesh assets
      description: Materialize the pinned tracer_ros source and normalize source assumptions needed by the current conversion path.
    - from: hakoniwa-mbody-registry
      to: hakoniwa-mujoco-robots
      data:
        - structural or prepared MJCF
        - minimal world when used
      description: Hand prepared robot-body artifacts across the runtime ownership boundary.

time_model:
  conversion:
    uses_simulation_time: false
    notes: MBody preparation is an offline/build-time artifact flow.
  runtime:
    owner: hakoniwa-mujoco-robots
    notes: Simulation stepping and Hakoniwa time behavior belong to the downstream runtime stage.

artifact_sets:
  physics_artifacts:
    status: verified
    artifacts:
      - normalized Tracer URDF
      - structural tracer_v1.xml
      - prepared actuator/collision/contact MJCF variants
      - optional minimal-world MJCF
    notes: Structural and prepared MuJoCo artifacts were validated during the 2026-07-22 Tracer work.

  visualization_artifacts:
    status: partially_verified
    artifacts:
      - generated GLB artifacts
    notes: GLB generation was part of the forge flow; the primary behavioral validation target was MuJoCo rover motion.

  pdu_artifacts:
    status: partially_verified
    artifacts:
      - downstream geometry_msgs/Twist command contract
    notes: Runtime PDU behavior is validated downstream rather than owned by MBody.

  runtime_artifacts:
    status: partially_verified
    artifacts:
      - hakoniwa-mujoco-robots Tracer rover example
      - Hakoniwa Twist-driven Tracer asset
    notes: These artifacts live downstream and are included here only as connection evidence.

artifacts:
  - name: Tracer source definition
    owner: hakoniwa-mbody-registry
    path: sources/agilex_tracer.yaml
    purpose: Pin the upstream source and configure the current forge preprocessing path.
  - name: Tracer source adapter
    owner: hakoniwa-mbody-registry
    path: tools/adapt_agilex_tracer_source.py
    purpose: Normalize Tracer-specific source assumptions not yet eliminated by generic package mapping.
  - name: Structural Tracer MJCF
    owner: hakoniwa-mbody-registry
    path: bodies/agilex_tracer/generated/tracer_v1.xml
    purpose: Canonical physical body artifact handed downstream.
  - name: Tracer MuJoCo runtime example
    owner: hakoniwa-mujoco-robots
    path: examples/actuators/agilex_tracer/agilex-tracer-rover-example.cpp
    purpose: Downstream runtime validation of prepared artifacts.

missing_pieces:
  - Re-run the current Tracer flow against the latest MBody main to determine whether explicit --package mappings can reduce the Tracer-specific adapter without changing behavior.
  - Re-promote any newly verified simplification into the source definition, docs, and this Recipe instead of preserving an obsolete workaround.
  - Keep runtime-specific control/PDU validation in hakoniwa-mujoco-robots rather than moving it into MBody.

demo:
  status: available-from-previous-validation
  preparation:
    - Materialize the pinned Tracer source.
    - Apply the current Tracer source normalization path.
    - Run the MBody forge path with DAE-to-OBJ enabled.
    - Confirm structural/prepared MuJoCo artifacts load successfully.
  runtime:
    - Build/run the downstream Tracer rover example or Hakoniwa asset.
    - Start the sender used by the selected runtime example.
    - Run hako-cmd start after assets are registered for the Hakoniwa PDU path.
  success_signals:
    - MBody forge completes without unresolved source/mesh references.
    - MuJoCo loads the prepared model/world.
    - Downstream actuator smoke reports finite execution and positive forward displacement.
    - Hakoniwa PDU runtime receives positive linear command and advances the Tracer base.
  failure_signals:
    - unresolved Xacro/package or mesh references
    - MuJoCo model load failure
    - actuator binding failure
    - no base displacement during the downstream motion smoke

expected_result: >
  The user obtains a reproducible Tracer preparation path whose output can be handed
  to a downstream MuJoCo/Hakoniwa runtime. The Recipe clearly separates verified
  MBody artifact preparation from downstream runtime/control verification and does not
  treat historical source workarounds as permanent architectural constraints.

source_catalogs:
  - component_id: hakoniwa-mbody-registry
    path: catalog/components/hakoniwa-mbody-registry.yaml
  - component_id: hakoniwa-mujoco-robots
    path: catalog/components/hakoniwa-mujoco-robots.yaml

