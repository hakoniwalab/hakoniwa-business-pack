  configure, doctor, start, smoke, status, and stop vocabulary. Business Pack
  installs host-native RPC artifacts and Linux-container Bridge artifacts in
  separate domains, resolves a common host.docker.internal path, requires
  approval before non-loopback exposure, verifies 20 + 22 = 42 through ROS 2
  and Hakoniwa RPC, records evidence, and cleans up all owned resources.

