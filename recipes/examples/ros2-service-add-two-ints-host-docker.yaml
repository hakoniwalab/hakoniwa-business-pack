constraints:
  - host-rpc-server
  - ros2-jazzy-in-docker
  - pdu-rpc-tcp-only-across-boundary
  - tcp-mux-server
  - one-logical-service-model
  - separate-host-and-container-artifacts
  - no-cross-boundary-ros-dds
  - no-cross-boundary-shared-memory
  # tcp-mux-server and one-logical-service-model above describe the default
  # host_listens direction. host_dials replaces the mux server with a plain
  # RpcServer and forces max_clients to 1; see user_inputs.transport.direction.
  - tcp-mux-server-requires-host-listens
  - host-dials-requires-single-client
  - core-free-pdu-conversion
  - no-gui-requirement
  - business-pack-owned-runtime-artifacts
  - same-user-operations-on-macos-windows-linux
  - bounded-readiness-and-cleanup
  - explicit-non-loopback-listen-approval

target_environment:
  required_for: executable-demo
  status: specified
  os: macOS | Linux | Windows
  os_version: current-supported-host
  architecture: host-native
  execution_mode: host-plus-docker
  runtimes:
    - name: Docker
      required: true
      version: current
      path: system
    - name: Python
      required: true
      version: "3.12"
      path: work/foundation/install/python
    - name: ROS 2
      required: true
      version: jazzy
      path: docker-image
  network:
    container_host_alias: host.docker.internal
    compose_extra_hosts:
      - host.docker.internal:host-gateway
    default_port: 54010
    default_scope: docker-to-host
    default_direction: host_listens
  notes:
    - The container always uses host.docker.internal; the generated Compose or run spec declares the same host-gateway alias on every host OS.
    - The Recipe validates the alias from inside the container before starting the Service Bridge.
    - A non-loopback or wildcard host bind is never silently approved.
    - >-
      Which side opens the listening socket is a deployment property, not a protocol
      one: hakoniwa-pdu-endpoint decides bind versus connect purely from the comm
      config's role field, and RpcServer does not pin a TCP role. See
      user_inputs.transport.direction. The default host_listens is what Docker on
      macOS and Linux needs; host_dials exists for hosts where inbound connections
      into the host are blocked, which is the default on Windows with WSL2.

execution_environment:
  required_for: executable-demo
  status: specified
  domains:
    host:
      platform: host-native
      processes:
        - add-two-ints-rpc-mux-server
      shared_memory_required: false
      gui_required: false
      install_root: work/foundation/install
      python: work/foundation/install/python
    container:
      platform: linux
      base: Ubuntu 24.04 / ROS 2 Jazzy
      processes:
        - HakoniwaRosServiceServerNode
        - ros2-service-client
      install_root: image-local
      host_artifact_reuse: forbidden
  boundary:
    allowed:
      - PDU-RPC TCP
    forbidden_requirements:
      - ROS DDS discovery across host and container
      - Hakoniwa shared memory across host and container
      - host-native library mounted as a Linux runtime library
      - host GUI forwarding

contract_decisions:
  - id: execution_domain_split
    decision: Host Foundation and ROS container use independent dependency and Receipt domains.
    implications:
      - foundation_requirements describes host-native components only.
      - container_requirements describes Linux image components only.
      - A host Receipt cannot satisfy a container requirement even when the component ID is the same.
  - id: pdu_rpc_install_definition
    decision: PDU-RPC is installed for Python use only when its native library and Python package are both installed into the same Foundation prefix and Python environment.
    required_receipt_capabilities:
      - rpc_client
      - rpc_server
      - python_rpc_mux_server
      - typed_async_client
      - shared_native_library
      - python_package
  - id: core_free_pdu_python
    decision: Generated packet types, offsets, and binary conversion form a Core-free profile; hakopy, hako-cmd, SHM, and Core are separate optional capabilities.
    forbidden_for_this_recipe:
      - hakopy
      - hako-cmd
      - shared-memory-backend
      - hakoniwa-core-pro
  - id: network_exposure
    decision: The Recipe owns address resolution, but the user owns approval of any non-loopback or wildcard host bind.
    implications:
      - auto may select a Docker-reachable address but cannot bypass approval.
      - start refuses a non-loopback or wildcard bind unless approval is recorded.
      - actual bind address, container alias resolution, and exposure warning are validation evidence.

components:
  - id: hakoniwa-pdu-ros
    roles: [bridge, integration_boundary]
    purpose: Run inside the Linux container and expose a ROS Service Server backed by typed Hakoniwa RPC clients.
  - id: hakoniwa-pdu-rpc
    roles: [control_plane, communication_infrastructure]
    purpose: Provide host-native RpcMuxServer plus Linux-container typed async clients, correlation, timeout, cancel, and tcp_mux.
  - id: hakoniwa-pdu-endpoint
    roles: [communication_infrastructure]
    purpose: Provide platform-specific TCP transport below PDU-RPC in both execution domains.
  - id: hakoniwa-pdu-python
    roles: [language_binding]
    purpose: Provide Core-free generated AddTwoInts packet types, offsets, and converters in both Python environments.
  - id: hakoniwa-pdu-registry
    roles: [data_model]
    purpose: Own generated Service definitions and offsets.

foundation_requirements:
  hakoniwa-pdu-rpc:
    capabilities:
      rpc_server: true
      tcp_mux: true
      python_rpc_mux_server: true
      shared_native_library: true
      python_package: true
  hakoniwa-pdu-endpoint:
    capabilities:
      tcp: true
      hakoniwa_core: false

host_python_requirements:
  interpreter: work/foundation/install/python
  packages:
    - component_id: hakoniwa-pdu-rpc
      distribution: hakoniwa-pdu-rpc
      import: hakoniwa_pdu_rpc
      installed_by: hakoniwa-pdu-rpc-install
      receipt_capabilities:
        - python_rpc_mux_server
        - python_package
    - component_id: hakoniwa-pdu-python
      distribution: hakoniwa-pdu
      import: hakoniwa_pdu
      profile: core-free-conversion
      required_capabilities:
        - generated_service_types
        - offset_binary_conversion
        - core_free_runtime
  forbidden_import_requirements:
    - hakopy

container_requirements:
  platform: linux
  ros2:
    distribution: jazzy
  components:
    hakoniwa-pdu-ros:
      capabilities:
        ros_service_server_bridge: true
        service_config_generator: true
        rpc_client_pool: true
    hakoniwa-pdu-rpc:
      capabilities:
        typed_async_client: true
        shared_native_library: true
        python_package: true
    hakoniwa-pdu-endpoint:
      capabilities:
        tcp_client: true
        core_free_runtime: true
    hakoniwa-pdu-python:
      capabilities:
        generated_service_types: true
        offset_binary_conversion: true
        core_free_runtime: true
  forbidden_host_reuse:
    - host-native shared libraries
    - host-native CMake packages
    - host Component Receipts

install_contract:
  hakoniwa-pdu-rpc-host:
    prefix: work/foundation/install
    python: work/foundation/install/python
    required_artifacts:
      - shared native library loadable by HAKO_PDU_RPC_LIBRARY
      - importable hakoniwa_pdu_rpc Python package
      - Component Receipt listing both native and Python artifacts
  hakoniwa-pdu-python-host:
    python: work/foundation/install/python
    required_artifacts:
      - importable hakoniwa_pdu package
      - generated hako_srv_msgs/AddTwoInts packet classes and converters
      - AddTwoInts offset metadata
    excluded_artifacts:
      - hakopy
      - hako-cmd
      - Hakoniwa Core runtime
  container:
    ownership: docker-image
    requirement: Build or install Linux variants independently from host Foundation.

user_inputs:
  service_profile:
    source: recipe-fixed
    values:
      ros_name: /add_two_ints
      ros_type: example_interfaces/srv/AddTwoInts
      hakoniwa_service: Service/Add
      pdu_service_type: hako_srv_msgs/AddTwoInts
      max_clients: 4
      timeout_msec: 3000
      max_clients_constraint: >-
        Valid only while transport.direction is host_listens. With host_dials this
        must be 1, because the ROS 2 side then owns the listening socket and
        hakoniwa-pdu-ros gives every client in the pool its own endpoint, so clients
        2..N fail to bind the same port and the bridge dies at startup. Multiplexing
        exists only on the server side (RpcMuxServer), so there is no way to share one
        listener across a client pool today.
  transport:
    network_scope:
      type: enum
      values: [docker-to-host, lan]
      default: docker-to-host
    direction:
      type: enum
      values: [host_listens, host_dials]
      default: host_listens
      description: >-
        Which side opens the listening socket. host_listens is the Docker topology:
        the host runs RpcMuxServer and the container connects in via
        host.docker.internal. host_dials reverses only the TCP roles, keeping the RPC
        roles unchanged -- the host-side RPC server connects out to a listener owned by
        the ROS 2 side -- for hosts where inbound connections are blocked.
      constraints:
        - >-
          host_dials requires service_profile.max_clients == 1. This is a hard
          constraint, not a tuning preference; any higher value fails at startup with
          EADDRINUSE.
        - >-
          host_dials therefore serialises concurrent ROS 2 service calls. The BUSY
          semantics that max_clients > 1 provides are unavailable in this direction.
        - >-
          host_dials cannot use RpcMuxServer, which always listens. The host process
          must use RpcServer with an endpoints list whose comm has role client.
      verified_on:
        - >-
          host_dials measured on Windows 11 Pro x86_64 with WSL2 + ROS 2 Jazzy standing
          in for the container, 2026-08-03: /add_two_ints returned 20+22=42, 1+2=3 and
          100+(-58)=42, then a stop request left TERMINATED exit 0 with no sockets
          remaining. The reversal itself was checked first by running upstream's own
          hakoniwa_pdu_rpc_basic_test against a role-reversed config, which passed 2/2
          unchanged.
    bind_address:
      default: auto
      user_decision: optional-override
    approve_non_loopback_bind:
      type: boolean
      default: false
      user_decision: required-when-resolved-bind-is-non-loopback-or-wildcard
    port:
      default: 54010
      user_decision: may-accept-default-if-available
  runtime:
    ros_distro: jazzy
    startup_timeout_sec: 30
    workspace: work/recipes/ros2-service-add-two-ints-host-docker

automatically_resolved:
  - host OS and Docker invocation strategy
  - common host.docker.internal alias and host-gateway mapping
  - Docker-reachable candidate bind address
  - RPC client names and channel IDs
  - maxClients expansion
  - rpc-server-services.json and rpc-client-services.json
  - host-rpc-endpoints.json and container-rpc-endpoints.json
  - Linux container build/install paths
  - startup order, readiness probes, stop order, and residual checks

forbidden_user_inputs:
  - individual RPC client names
  - request or response channel IDs
  - mux connection IDs or RPC request IDs
  - generated service config bodies
  - OS-specific Docker host-gateway flags
  - reusing a host native library inside the Linux container

connections:
  - from: hakoniwa-pdu-ros
    to: hakoniwa-pdu-rpc
    interface: typed-python-rpc-over-host-container-tcp
    data: [AddTwoInts request, AddTwoInts response, timeout, cancellation]
    contract:
      status: partially_verified
      requires:
        - Linux TypedRpcClient.call_async
        - host Python RpcMuxServer
        - matching generated client names and channels
        - separate host and container Endpoint configs
      validation_notes:
        - Component contracts are verified upstream; cross-domain Business Pack materialization is not tested.
  - from: hakoniwa-pdu-rpc
    to: hakoniwa-pdu-endpoint
    interface: tcp-mux-transport
    data: [accepted sessions, request frames, response frames]
    contract:
      status: partially_verified
      requires: [host tcp_mux server, Linux TCP clients, Core-free Endpoint runtime]
      validation_notes:
        - Native mux is verified upstream; platform-specific Recipe installs and physical configs are not tested.
  - from: hakoniwa-pdu-ros
    to: hakoniwa-pdu-python
    interface: generated-service-types
    data: [AddTwoInts request packet, AddTwoInts response packet]
    contract:
      status: verified
      requires: [generated AddTwoInts packet types and converters]
  - from: hakoniwa-pdu-python
    to: hakoniwa-pdu-registry
    interface: generated-service-contract
    data: [Service definition, offsets]
    contract:
      status: verified
      requires: [installed generated Service artifacts]

data_flow:
  - source: ROS 2 client inside Docker
    path: [/add_two_ints, Service Bridge, Linux TypedRpcClient pool, PDU-RPC TCP, host RpcMuxServer]
    destination: host AddTwoInts handler
  - source: host AddTwoInts handler
    path: [correlated RPC response, Linux TypedRpcClient completion, rclpy Future, ROS Service response]
    destination: ROS 2 client inside Docker

time_model:
  owner: hakoniwa-pdu-rpc
  policy: real-time-rpc-deadline
  requirements:
    - Service Binding timeout_msec is the Bridge-owned deadline.
    - Business Pack does not duplicate request IDs, timeout, cancel, or terminal cleanup.
    - Readiness and smoke checks use bounded wall-clock timeouts.

network_contract:
  container_alias: host.docker.internal
  generated_extra_hosts:
    - host.docker.internal:host-gateway
  bind_resolution:
    preferred: Docker-reachable least-exposed address
    wildcard_addresses: [0.0.0.0, "::"]
    approval_required:
      - resolved address is non-loopback
      - resolved address is wildcard
      - network_scope is lan
  enforcement:
    - configure records the candidate address and exposure class.
    - doctor checks container-to-host alias resolution and port availability.
    - start refuses when approval is required but absent.
    - evidence records actual bind address, alias resolution, port, and warning state.

configuration_contract:
  build_manifest:
    owner: hakoniwa-pdu-ros
    cli: hako.py --config
  service_binding:
    owner: hakoniwa-pdu-ros
    cli: generate-service-config --binding
  physical_transport:
    owner: hakoniwa-business-pack
  invariants:
    - hako.py --config never means Service Binding.
    - Service Binding is shared logically across domains; physical Endpoint configs are domain-specific.
    - Host and container builds have distinct platform receipts and cannot satisfy each other.
    - Generated runtime files live under work/recipes, not Foundation.

artifact_sets:
  foundation:
    status: verified
    owner: work/foundation
    artifacts:
      - work/foundation/install/python
      - work/foundation/install/lib
      - work/foundation/install/share/hakoniwa/offset
      - work/foundation/install/share/hakoniwa/receipts
    notes:
      - Host-only. Native and Python PDU-RPC artifacts are recorded by one Component Receipt.
  container_image:
    status: verified
    owner: recipe-docker-image
    artifacts:
      - Linux hakoniwa-pdu-ros package
      - Linux hakoniwa-pdu-rpc native library and Python package
      - Linux hakoniwa-pdu-endpoint native library and Python binding
      - hakoniwa-pdu generated types and offsets
      - ROS 2 Jazzy runtime
  recipe_runtime:
    status: verified
    owner: work/recipes/ros2-service-add-two-ints-host-docker
    artifacts:
      - config/service/service-binding.json
      - config/service/rpc-server-services.json
      - config/service/rpc-client-services.json
      - config/service/host-rpc-endpoints.json
      - config/service/container-rpc-endpoints.json
      - docker
      - runtime
      - logs
      - validation/evidence.json

artifacts:
  generated:
    - path: work/recipes/ros2-service-add-two-ints-host-docker/config/service/rpc-server-services.json
      owner: hakoniwa-business-pack
      purpose: Host RPC Server service config generated from the resolved Service Binding.
    - path: work/recipes/ros2-service-add-two-ints-host-docker/config/service/rpc-client-services.json
      owner: hakoniwa-business-pack
      purpose: Container Service Bridge client config generated from the same logical model.
    - path: work/recipes/ros2-service-add-two-ints-host-docker/config/service/host-rpc-endpoints.json
      owner: hakoniwa-business-pack
      purpose: Host-native tcp_mux listener config with an approved bind address.
    - path: work/recipes/ros2-service-add-two-ints-host-docker/config/service/container-rpc-endpoints.json
      owner: hakoniwa-business-pack
      purpose: Linux-container TCP client config using host.docker.internal.
    - path: work/recipes/ros2-service-add-two-ints-host-docker/validation/evidence.json
      owner: hakoniwa-business-pack
      purpose: Domain revisions, Receipts, environment, hashes, network decision, call result, and cleanup evidence.
  reused:
    - path: hakoniwa-pdu-ros/config/service/add_two_ints.json
      owner: hakoniwa-pdu-ros
      purpose: Upstream logical Service Binding reference.

implementation_plan:
  owner: codex-with-operator
  rules:
    - Treat this Recipe and Catalog as the source of truth.
    - Classify differences as contract inconsistency, implementation gap, validation gap, or implementation choice.
    - Do not move generated values into user inputs for implementation convenience.
    - Keep RPC lifecycle in hakoniwa-pdu-rpc, Service mapping in hakoniwa-pdu-ros, and OS/Docker differences in Business Pack.
    - Do not use a host Receipt as evidence for a Linux container artifact.
    - Do not introduce Core to satisfy packet conversion.
    - Record a contract inconsistency before proposing a semantic change.
  steps:
    - Implement PDU-RPC host install so native and Python artifacts share one Foundation prefix and Receipt.
    - Define the Core-free hakoniwa-pdu conversion profile and install evidence.
    - Implement the Linux container dependency build/install independently from host Foundation.
    - Implement Recipe materialization and the common host.docker.internal network contract.
    - Generate host and container configs from one Service Binding.
    - Run a=20, b=22 and verify sum=42.
    - Verify bounded readiness, approval enforcement, and clean shutdown.
    - Update feasibility, validation, evidence, revisions, and remaining gaps from measured results.

acceptance_criteria:
  - foundation planning contains no hakoniwa-pdu-ros host component.
  - Host Foundation and Linux container dependencies are reported independently.
  - PDU-RPC host Receipt reports native library, Python package, python_rpc_mux_server, shared_native_library, and python_package capabilities.
  - work/foundation/install/python imports hakoniwa_pdu_rpc and hakoniwa_pdu.
  - AddTwoInts conversion works without hakopy, hako-cmd, SHM, or hakoniwa-core-pro.
  - The Linux container uses independently built or installed Linux Endpoint, RPC, PDU-ROS, and hakoniwa-pdu artifacts.
  - The same Business Pack operation vocabulary is used on macOS, Windows, and Linux.
  - hako.py --config selects a build manifest and --binding selects the Service Binding.
  - One Service Binding generates matching server/client service configs and separate host/container Endpoint configs.
  - The container always addresses the host as host.docker.internal and the generated run spec declares host-gateway mapping.
  - start refuses an unapproved non-loopback or wildcard bind.
  - Only PDU-RPC TCP crosses the boundary.
  - ros2 service list and type report /add_two_ints and example_interfaces/srv/AddTwoInts.
  - Calling a=20, b=22 returns sum=42 and records correlated evidence.
  - stop leaves no Recipe-owned process, container, or listener and retains TERMINATED session records for inspection.
  - Validation records exact host and container revisions, platform Receipts, Docker, ROS distro, config hashes, bind decision, request, response, and cleanup.

missing_pieces:
  - Native Windows host runtime evidence.
  - Native Linux host runtime evidence.
  - CI execution of the host-plus-Docker E2E on supported host platforms.

demo:
  profiles:
    - id: add-two-ints-host-docker
      description: Call a host RpcMuxServer from a ROS 2 Jazzy Service Client in Docker.
  prerequisites:
    - command: python tools/foundation.py doctor --recipe recipes/examples/ros2-service-add-two-ints-host-docker.yaml
      expected: Host-native requirements are SATISFIED or a precise host-only gap plan is emitted.
  readiness:
    lifecycle_state:
      source: work/recipes/ros2-service-add-two-ints-host-docker/runtime/session.json
      required: RUNNING
      sufficient: false
    checks:
      - id: host_rpc_listener
        kind: tcp
        target: approved-bind-address:configured-port
        expected: TCP connection succeeds.
        applies_when: transport.direction == host_listens
        inverted_form: >-
          With host_dials the listener belongs to the ROS 2 side instead, so the
          equivalent check is that the container-side port accepts a connection and
          that the host session reports an established outbound connection to it.
          Checking for a host listener would fail by design in that direction.
      - id: container_host_alias
        kind: command
        target: container resolves host.docker.internal
        expected: Alias resolves to a host-reachable address.
      - id: ros_service_visible
        kind: command
        target: ros2 service list
        expected: /add_two_ints is present.
    operator_handoff:
      background: true
      explain_command_return: true
      next_actions: [smoke, status, stop]
  steps:
    - id: configure
      command: python tools/ros2_service_add_two_ints.py configure
      status: verified
      expected:
        - Recipe workspace and generated configs exist.
        - Candidate bind address and approval requirement are printed and recorded.
    - id: build
      command: python tools/ros2_service_add_two_ints.py build
      status: verified
      expected:
        - Host Foundation requirements are reused or installed locally.
        - A Linux ROS 2 image is built without reusing host-native libraries.
    - id: doctor
      command: python tools/ros2_service_add_two_ints.py doctor
      status: verified
      expected:
        - Host Receipt, Python imports, container image dependencies, alias, port, and config consistency are checked separately.
    - id: start
      command: python tools/ros2_service_add_two_ints.py start --approve-non-loopback-bind
      status: verified
      expected:
        - Start refuses when non-loopback approval is required but absent.
        - Host listener is ready before the ROS container starts.
    - id: smoke
      command: python tools/ros2_service_add_two_ints.py smoke --a 20 --b 22
      status: verified
      expected: [ROS Service returns sum=42 within the timeout.]
    - id: status
      command: python tools/ros2_service_add_two_ints.py status
      status: verified
      expected: [Host, container, listener, alias, and Service readiness are reported.]
    - id: stop
      command: python tools/ros2_service_add_two_ints.py stop
      status: verified
      expected: [No Recipe-owned process, container, or listener remains; TERMINATED session records remain for inspection.]
  cleanup:
    owner: hakoniwa-business-pack
    mode: explicit-owned-sessions
    expected_behavior:
      - Stop the container Bridge before the host RpcMuxServer.
      - Terminate only resources owned by this Recipe workspace.
    verification_checks:
      - Container is absent or stopped.
      - Host RPC process is absent.
      - Configured TCP port is not listening.
      - Session records show normal termination.
    cautions:
      - Do not use broad kill, taskkill, pkill, or unrelated container cleanup.
      - Do not treat a stopped ROS Service as proof that the host listener stopped.
      - Do not silently broaden host network exposure during restart.

expected_result: >
