id: ros2-service-add-two-ints-host-docker
title: Cross-platform ROS 2 Service to host Hakoniwa RPC AddTwoInts Demo
recipe_version: 0.6

goal:
  user_request: macOS、Windows、Linuxで同じ操作体系を使い、Docker内のROS 2からhost上のAddTwoInts RPC Serverを呼びたい
  description: >
    Define the smallest Business Pack integration contract for the completed
    hakoniwa-pdu-ros Service Server Bridge. A host Python RpcMuxServer accepts
    PDU-RPC TCP sessions while a ROS 2 Jazzy container runs the Service Bridge
    and ros2 service call. Host-native and Linux-container artifacts are built,
    installed, received, and validated independently. This Recipe is the source
    of truth for user inputs, generated values, lifecycle, evidence, and gaps
    Codex must implement.

feasibility:
  status: feasible
  confidence: high
  rationale:
    - hakoniwa-pdu-ros already verifies AddTwoInts over real TCP, including concurrency, BUSY, timeout/cancel, conversion errors, and shutdown.
    - hakoniwa-pdu-rpc already provides typed async clients and Python RpcMuxServer.
    - Host and container need the same logical Service model but different platform artifacts and installation evidence.
    - Remaining work is install-contract completion and Business Pack orchestration, not a new protocol.

validation:
  status: partially_verified
  verified_at: 2026-08-02
  summary: >
    macOS arm64 host plus Linux arm64 ROS 2 Jazzy container was verified end to
    end. The host Foundation was reused without Core, the container built its
    own Linux artifacts, ROS 2 reported /add_two_ints, 20 + 22 returned 42, and
    normal stop left TERMINATED session records with no owned listener or
    process. Native Windows and Linux host runs remain unverified.
  steps:
    - id: upstream_components
      status: verified
      evidence:
        - source: hakoniwalab/hakoniwa-pdu-ros#10
          date: 2026-08-02
        - source: hakoniwalab/hakoniwa-pdu-rpc#42
          date: 2026-08-02
      notes:
        - Service Bridge, typed async client, and RpcMuxServer are implemented upstream.
    - id: host_foundation_install
      status: verified
      evidence:
        - path: work/foundation/install/share/hakoniwa/receipts/hakoniwa-pdu-rpc.yaml
          date: 2026-08-02
        - path: work/foundation/install/share/hakoniwa/receipts/hakoniwa-pdu-endpoint.yaml
          date: 2026-08-02
      notes:
        - PDU-RPC Receipt contains native, CMake, Python package, packaged schema, and mux capabilities.
    - id: container_image_contract
      status: verified
      evidence:
        - path: work/recipes/ros2-service-add-two-ints-host-docker/validation/evidence.json
          date: 2026-08-02
      notes:
        - Linux Endpoint and RPC are built in-image; PDU Python and PDU ROS are installed into the image-local Foundation Python.
    - id: core_free_python_conversion
      status: verified
      evidence:
        - path: work/recipes/ros2-service-add-two-ints-host-docker/validation/evidence.json
          date: 2026-08-02
      notes:
        - Foundation planning resolved only Endpoint and RPC; AddTwoInts completed without Core or hakopy.
    - id: recipe_materialization
      status: verified
      evidence:
        - path: tools/ros2_service_add_two_ints.py
          date: 2026-08-02
    - id: macos_end_to_end
      status: verified
      evidence:
        - path: work/recipes/ros2-service-add-two-ints-host-docker/validation/evidence.json
          date: 2026-08-02
    - id: windows_end_to_end
      status: not_tested
      evidence: []
    - id: linux_end_to_end
      status: not_tested
