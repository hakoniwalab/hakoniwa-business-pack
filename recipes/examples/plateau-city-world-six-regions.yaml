id: plateau-city-world-six-regions
title: PLATEAU Six-region MJCF and GLB City World Smoke
recipe_version: 0.2

goal:
  user_request: 同一の軽量な変換条件で国内6地域のPLATEAUデータからMJCFとGLBを生成し、都市ごとのデータ差とフォールバックを確認したい
  description: >
    Apply one hakoniwa-envsim City World conversion contract to six fixed
    200-meter selections. Generate MJCF and GLB assets, preserve source and
    artifact receipts, and summarize effective LOD, fallback, unavailable
    features, building-physics decisions, and known limitations. This Recipe
    does not run a full physics simulation.

feasibility:
  status: feasible
  confidence: high
  rationale:
    - hakoniwa-envsim generates aligned MJCF and GLB City World artifacts from bldg, tran, dem, optional frn, and optional brid data.
    - Current Envsim supports selectable P0-P3 building physics levels, semantic LOD2 colliders, and configurable collider reduction independently from visual LOD.
    - Current Envsim also exposes bounded City World and DEM worker controls for larger selections; this Recipe keeps conservative defaults explicit.
    - Every region changes only the configured center or explicitly declared optional feature types; extent and conversion policy are shared.
    - Missing CityFurniture or usable bridge surfaces are explicit non-blocking Dataset Validator results rather than inferred geometry.
    - Region outputs and receipts are isolated, so a partial matrix can be resumed safely.

validation:
  status: partially_verified
  summary: >
    On 2026-08-23, the common 200-meter pipeline generated isolated MJCF and
    GLB City World artifacts for all six fixed regions on macOS. Dataset
    Validator results exposed the actual regional differences: Numazu included
    LOD3 road markings, Shibuya used LOD3/LOD2 road surfaces without markings,
    and Sapporo, Kanazawa, Hiroshima, and Naha used the explicit LOD1 road
    fallback without inferred markings. The Hiroshima profile uses an actual
    PLATEAU LOD3 bridge dataset. Its visual GLB and independent bridge-surface
    MJCF were generated, and the composed world loaded with MuJoCo 3.9.0.
    Those recorded six-region results predate the current Envsim revision
    b4bb442. Current P1-P3 semantic collider application, collider-reduction,
    parallel-worker, and DEM worker capabilities are represented as the current
    generation contract but are not claimed as re-verified across all six
    regions by this Recipe yet. Full physics simulation remains outside this
    validation scope.
  steps:
    - id: numazu_reference
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-envsim
          path: tools/hako.py
          revision: d7a257606ca88b65a5109d88bd6045a5c9a9b8da
      notes:
        - Numazu produced terrain, road, road-marking, building, MJCF, GLB, provenance, and Dataset Validator artifacts.
    - id: six_region_catalog_preflight
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: recipes/examples/plateau-city-world-six-regions.yaml
          revision: local-working-tree
      notes:
        - The fixed centers resolved to current PLATEAU catalog entries on 2026-08-23.
        - Catalog metadata is not equivalent to successful asset conversion.
    - id: six_region_asset_generation
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: tools/recipe/plateau_city_world_six_regions.py
          revision: main
      notes:
        - The original six profiles produced city-world.xml, city-world.glb, provenance receipts, Dataset Validator output, and result.json.
        - Five unchanged regional centers retain that evidence; the Hiroshima center was subsequently moved to an actual LOD3 bridge dataset.
        - Full physics execution was not evaluated for the original six-region pass.
        - This evidence predates the current Envsim b4bb442 generation contract and must not be used to claim six-region validation of newer collider-reduction or worker controls.
    - id: hiroshima_lod3_bridge_assets
      status: verified
      evidence:
        - repository: hakoniwalab/hakoniwa-business-pack
          path: work/recipes/plateau-city-world-six-regions/cities/hiroshima-lod3-bridge/validation/result.json
          revision: local-working-tree
      notes:
        - The 200-meter profile produced one source-altitude-preserving LOD3 bridge GLB and integrated it into city-world.glb.
        - The same source produced 939 independent thin convex triangular-prism collision meshes from walkable OuterFloorSurface triangles.
        - The composed terrain, building, and bridge MJCF loaded successfully with MuJoCo 3.9.0 (1164 geoms, 939 meshes).
        - A native MuJoCo acceptance fixture confirmed bridge-top contact and zero under-bridge contact at the same XY location.
        - 346515 polygons and 352267 triangles were generated; 77 non-triangulatable source polygons were omitted and recorded.

constraints:
  - exactly-six-fixed-regions
  - shared-200-meter-selection
  - flat-glb-material-mode
  - mjcf-and-glb-generation-only
  - full-physics-simulation-not-evaluated
  - building-physics-level-is-independent-from-visual-lod
  - collider-reduction-safe-is-the-recipe-default
  - bridge-physics-uses-lod3-outer-floor-surfaces-only
  - bridge-collision-prisms-not-yet-optimized-in-recorded-evidence
  - missing-lod3-road-markings-are-omitted-not-inferred
  - generated-data-remains-under-work
  - source-url-size-and-sha256-provenance-required

target_environment:
  required_for: asset-generation
  status: specified
  os: macOS | Linux | Windows
  os_version: current-supported-host
  architecture: host-native
  execution_mode: native
  runtimes:
    - name: Python
      required: true
      version: "3.10+"
      path: recipe-managed-venv

execution_environment:
  required_for: asset-generation
  status: specified
  os: host-native
  os_version: current-supported-host
  architecture: host-native
  execution_mode: native
  gui:
    required: false
    status: disabled
  shared_memory:
    required: false
    access: not-used

foundation_contract:
  mode: not_required
  reason: This Recipe generates files with component-owned Python tools and does not start Hakoniwa Core or a persistent MuJoCo simulation.

recipe_local_requirements_schema_version: 1
recipe_local_requirements:
  hakoniwa-envsim:
    root:
      default_path: ../hakoniwa-envsim
      override_env: HAKONIWA_ENVSIM_ROOT
      relative_to: recipe_repository
    source:
      type: git
      url: https://github.com/hakoniwalab/hakoniwa-envsim.git
      revision: main
    required_artifacts:
      - path: tools/hako.py
        kind: file
      - path: src/city_pipeline/city_dataset_validator.py
        kind: file
      - path: src/city_pipeline/city_world_composer.py
        kind: file
      - path: src/city_pipeline/bridge2glb.py
        kind: file
      - path: src/city_pipeline/bridge2mjcf.py
        kind: file
      - path: src/city_pipeline/building_physics_classifier.py
        kind: file
      - path: src/city_pipeline/building_lod2_colliders.py
        kind: file
      - path: src/city_pipeline/dem2hfield.py
        kind: file

components:
  - id: hakoniwa-envsim
    roles: [asset_generator, environment_model]
    purpose: Acquire PLATEAU source data and generate one independently validated MJCF/GLB City World per region.

connections: []

data_flow:
  - Six fixed region profiles -> six generated hakoniwa-envsim manifests
  - PLATEAU catalog and source files -> bldg, tran, dem, optional frn, and optional brid component conversion
  - Building LOD and semantic surfaces -> P0-P3 classification -> capped semantic collider application -> reduction strategy -> building Physics receipt
  - Component outputs -> aligned terrain, building, optional bridge physics, and city-world.xml/city-world.glb per region
  - Component receipts -> per-region Dataset Validator report
  - Six per-region results -> JSON, CSV, and Markdown Capability Matrix

time_model:
  mode: none
  notes:
    - This is deterministic asset generation and does not execute simulation time.

artifact_sets:
  physics_artifacts:
    status: verified
    artifacts:
      - work/recipes/plateau-city-world-six-regions/cities/*/artifacts/world/city-world.xml
    notes:
      - MJCF generation is evaluated; full MuJoCo physics behavior is explicitly outside this Recipe.
      - Recorded six-region evidence predates the current b4bb442 collider-generation contract.
  visualization_artifacts:
    status: partially_verified
    artifacts:
      - work/recipes/plateau-city-world-six-regions/cities/*/artifacts/world/city-world.glb
  provenance_artifacts:
    status: verified
    artifacts:
      - work/recipes/plateau-city-world-six-regions/cities/*/artifacts/download-manifest.json
      - work/recipes/plateau-city-world-six-regions/cities/*/artifacts/build-receipt.json
      - work/recipes/plateau-city-world-six-regions/cities/*/artifacts/components/buildings/building-physics-classification.json
      - work/recipes/plateau-city-world-six-regions/cities/*/artifacts/components/buildings/building-physics-application.json
  validation_artifacts:
    status: verified
    artifacts:
      - work/recipes/plateau-city-world-six-regions/cities/*/validation/result.json
      - work/recipes/plateau-city-world-six-regions/summary/capability-matrix.json
      - work/recipes/plateau-city-world-six-regions/summary/capability-matrix.csv
      - work/recipes/plateau-city-world-six-regions/summary/capability-matrix.md

artifacts:
  - id: six_region_capability_matrix_json
    kind: file
    path: work/recipes/plateau-city-world-six-regions/summary/capability-matrix.json
  - id: six_region_capability_matrix_csv
    kind: file
    path: work/recipes/plateau-city-world-six-regions/summary/capability-matrix.csv
  - id: six_region_capability_matrix_markdown
    kind: file
    path: work/recipes/plateau-city-world-six-regions/summary/capability-matrix.md

missing_pieces:
  - Re-run the complete six-region matrix against Envsim b4bb442 before promoting current semantic collider and collider-reduction behavior to six-region verified evidence.
  - Re-run the moved Hiroshima LOD3 bridge profile against the current Envsim revision.
  - Compare safe, coplanar-union, convex-decompose, and tolerant-planar reduction modes on representative regions before making performance or fidelity claims.
  - Measure worker-count effects rather than assuming that parallel_workers or dem_parallel_workers improve elapsed time.
  - Full physics simulation and drone or construction-machine motion belong to separate downstream Recipes.

plateau_city_world_matrix:
  schema_version: 1
  source:
    api_base_url: https://api.plateauview.mlit.go.jp
    feature_types:
      bldg: true
      tran: true
      dem: true
      frn: true
      brid: false
    year: latest
  selection:
    half_extent_m:
      north_south: 100
      east_west: 100
  geometry:
    base_epsilon_m: 0.2
    waste_threshold: 0.1
    wall_thickness_m: 0.1
    roof_collision_thickness_m: 0.02
  mjcf:
    collision: all
    floor: false
    building_physics_level: 3
    building_collider_reduction: safe
  glb:
    enabled: true
    lod_policy: highest_available
    texture_mode: flat
  city_world:
    enabled: true
    parallel_workers: 4
    dem_parallel_workers: 2
    terrain_spacing_m: 2
    marking_vertical_offset_m: 0.055
    bridge_collision_thickness_m: 0.02
    bridge_max_surface_slope_deg: 60
  regions:
    - id: tokyo-shibuya
      name: 東京・渋谷
      center:
        latitude: 35.6595
        longitude: 139.7005
      focus: high-density-urban-reference
      known_limitations: []
    - id: shizuoka-numazu
      name: 静岡・沼津
      center:
        latitude: 35.0988
        longitude: 138.8587
      focus: verified-road-and-marking-reference
      known_limitations: []
    - id: hokkaido-sapporo
      name: 北海道・札幌
      center:
        latitude: 43.0618
        longitude: 141.3545
      focus: northern-city-and-lod-fallback
      known_limitations: []
    - id: ishikawa-kanazawa
      name: 石川・金沢
      center:
        latitude: 36.5613
        longitude: 136.6562
      focus: mid-sized-city-and-building-footprints
      known_limitations: []
    - id: hiroshima-lod3-bridge
      name: 広島・LOD3橋梁周辺
      center:
        latitude: 34.39870318724743
        longitude: 132.47669631395575
      feature_types:
        brid: true
      focus: lod3-bridge-visual-and-physics-reference
      known_limitations:
        - Recorded bridge collision evidence uses unoptimized independent triangular-prism meshes and predates the current Envsim revision.
        - Bridge inspection geometry and inferred rail collision are outside scope.
    - id: okinawa-naha
      name: 沖縄・那覇
      center:
        latitude: 26.2154
        longitude: 127.687
      focus: southern-city-and-lod-fallback
      known_limitations: []

demo:
  prerequisites:
    - id: materialize_envsim
      command: python tools/recipe.py configure --recipe recipes/examples/plateau-city-world-six-regions.yaml
      expected: Clone or reuse hakoniwa-envsim and verify its component-owned City World tools.
  steps:
    - id: inspect_matrix
      command: python tools/recipe/plateau_city_world_six_regions.py plan
      expected: List all six fixed regions, their centers, scope, status, and known limitations without network access.
    - id: configure_matrix
      command: python tools/recipe/plateau_city_world_six_regions.py configure
      expected: Create the managed Recipe Python environment and one Envsim manifest per region with explicit Physics and worker defaults.
    - id: inspect_dependencies
      command: python tools/recipe/plateau_city_world_six_regions.py doctor
      expected: Validate every generated manifest and all component-owned conversion prerequisites.
    - id: build_one
      command: python tools/recipe/plateau_city_world_six_regions.py build --region shizuoka-numazu
      expected: Generate and validate one region's MJCF and GLB without executing a full physics simulation.
    - id: build_all
      command: python tools/recipe/plateau_city_world_six_regions.py build-all
      expected: Generate every pending region sequentially, reuse matching completed results, and write the Capability Matrix.
    - id: resume_offline
      command: python tools/recipe/plateau_city_world_six_regions.py build-all --offline
      expected: Resume from cached catalog responses and previously downloaded CityGML without network access.
    - id: summarize
      command: python tools/recipe/plateau_city_world_six_regions.py summarize
      expected: Regenerate JSON, CSV, and Markdown summaries from existing per-region results.
  cleanup:
    expected_behavior:
      - No background process is started.
      - Downloads and generated assets remain isolated under each region directory.
    verification_checks:
      - Confirm each completed region has city-world.xml, city-world.glb, receipts, Dataset Validator output, and result.json.
      - Confirm the summary explicitly states that full physics simulation was not evaluated.
      - Confirm Hiroshima reports both bridge visualization and bridge collision capabilities when the source dataset provides usable bridge surfaces.
      - Confirm the build receipt records the selected building physics level and collider-reduction mode.
    cautions:
      - A 200-meter selection limits output geometry, but PLATEAU source downloads use dataset mesh granularity and can be substantially larger.
      - latest data can change; resolved years, URLs, sizes, and SHA-256 values are preserved in each download manifest.
      - Worker-count settings are controls, not performance guarantees.

expected_result: >
  Six fixed 200-meter PLATEAU selections produce isolated MJCF and GLB City
  World assets wherever the declared source contract is available. The matrix
  reports effective LOD, fallback, missing road markings, building-physics
  decisions, artifact sizes, and known limitations without claiming full
  physics behavior. Current Envsim supports semantic P0-P3 collision generation
  and collider reduction, but those newer behaviors remain pending six-region
  re-verification in this Recipe.

