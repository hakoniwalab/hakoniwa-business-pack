missing_pieces:
  - Optional future simplification: replace the current bridge-core/TCP process boundary with a direct multi-threaded SHM-to-CDR-to-Foxglove process if the additional runtime complexity is justified.
  - Optional future capability: publish Hakoniwa simulation time through Foxglove Time support instead of wall-clock log timestamps.
  - Generalize the verified JointState/URDF pattern to additional robots and message types.
  - Validate the complete Shadow Hand recipe on Linux in addition to the current macOS arm64 validation.

demo:
  objective: >
    Show the same simulated Shadow Hand motion in MuJoCo and Foxglove 3D on a
    Mac, using Hakoniwa JointState as the live contract and without requiring a
    ROS 2 runtime.
  profiles:
    - id: foundation-browser
      launcher: work/recipes/shadow-hand-hakoniwa-to-foxglove/config/launcher.json
      purpose: Interactive MuJoCo and Foxglove 3D validation using the shared Foundation and a Business Pack-owned background session.
      notes:
        - The bounded hand-motion sender is configured for 120 seconds.
  prerequisites:
    - command: python tools/foundation.py doctor --recipe recipes/examples/shadow-hand-hakoniwa-to-foxglove.yaml
      expected: Foundation SATISFIED
    - command: python tools/shadow_hand_foxglove.py configure
      expected: Recipe workspace, copied runtime inputs, portal, and Launcher generated.
    - command: python tools/shadow_hand_foxglove.py doctor
      expected: Foundation, local Hand/CDR artifacts, schema, URDF, ports, and generated files are ready.
  steps:
    - id: configure
      command: python tools/shadow_hand_foxglove.py configure
      status: verified
      expected:
        - Inputs are copied from component-owned work areas into the Recipe workspace.
        - The schema path is rewritten to the Recipe-owned staged bundle.
        - index.html and config/launcher.json are generated.
    - id: doctor
      command: python tools/shadow_hand_foxglove.py doctor
      status: verified
      expected:
        - Foundation is SATISFIED and its Python imports hakopy, hakoniwa_pdu, and hakoniwa_pdu_endpoint.
        - Ports 8766 and 8767 are available.
        - The local MuJoCo Hand and CDR publisher artifacts exist.
    - id: start
      command: python tools/shadow_hand_foxglove.py start
      status: verified
      expected:
        - The background Launcher session becomes RUNNING.
        - MuJoCo opens and all five managed assets remain stable.
        - The command returns while the Demo continues running.
    - id: open_foxglove
      command: python tools/shadow_hand_foxglove.py open-viewer
      status: verified
      evidence:
        - source: user-runtime-confirmation
          date: "2026-08-04"
      expected:
        - Foxglove App opens.
        - Human connects ws://127.0.0.1:8766.
        - Human loads http://127.0.0.1:8767/shadow_hand_right.urdf, selects Joint states mode and /hakoniwa/ShadowHandAsset/joint_states, and enables Ignore COLLADA <up_axis>.
    - id: status
      command: python tools/shadow_hand_foxglove.py status
      status: verified
      expected:
        - Launcher control reports the owned session state.
    - id: stop
      command: python tools/shadow_hand_foxglove.py stop
      status: verified
      expected:
        - LauncherService.terminate completes and the persisted session reports TERMINATED.
  observability:
    success_signals:
      - Shadow Hand moves in MuJoCo.
      - Bridge and converter logs show repeated JointState CDR publication.
      - Foxglove Raw Messages decodes 24 joint names and state arrays.
      - Foxglove 3D hand geometry is connected correctly after enabling Ignore COLLADA <up_axis>.
      - Finger motion in Foxglove follows the MuJoCo simulation.
      - No /tf topic is required for the URDF Joint states control path.
    diagnostic_notes:
      - Endpoint `No subscribers found` messages can continue because the converter polls with recv_by_name() without registering a receive callback.
      - Treat those messages as callback-dispatch diagnostics, not as evidence that the Foxglove WebSocket is disconnected.
    failure_signals:
      - JointState.bundle.msg is missing from the Recipe workspace assets directory.
      - Native Hakoniwa PDU bytes are sent directly as if they were CDR.
      - Foxglove cannot resolve the bundled JointState schema.
      - DAE mesh segments appear disconnected because Ignore COLLADA <up_axis> is disabled.
      - Whole-hand orientation differs because rh_world_joint preparation is missing.
      - URDF loads but does not move because Joint states mode/topic is not configured.
  cleanup:
    owner: hakoniwa-launcher
    provider: hakoniwa-pdu-python
    mode: background
    target: work/recipes/shadow-hand-hakoniwa-to-foxglove/runtime/launcher-session.json
    trigger: python tools/shadow_hand_foxglove.py stop
    expected_behavior:
      - hako_launcher_ctl terminate invokes the Launcher normal termination path.
      - The launcher terminates only the assets it manages.
      - The Foxglove publisher listener on port 8766 closes.
      - The local URDF server listener on port 8767 closes.
    verification_checks:
      - Confirm the launcher reports state -> TERMINATED.
      - Confirm no process is listening on TCP ports 8766 or 8767.
    cautions:
      - Do not replace the session-file terminate command with kill, taskkill, or process-group cleanup.
      - Do not treat hako-cmd stop as Launcher process termination.
      - Do not broadly terminate unrelated Python or browser processes.

expected_result: >
  On macOS arm64, the MuJoCo Menagerie Shadow Hand runs as a Hakoniwa asset and
  publishes sensor_msgs/JointState-compatible state. The verified bridge and
  conversion path publishes complete CDR through a local Foxglove WebSocket
  server. Foxglove decodes the JointState topic with the locally staged ros2msg
  schema and animates the upstream Shadow Robot URDF in 3D from the same joint
  positions, without running ROS 2 and without requiring /tf. Business Pack
  owns the generated workspace, portal, Launcher, logs, and background session,
  while reusable Core, Python, Endpoint, and Bridge artifacts come from the
  shared local Foundation.

