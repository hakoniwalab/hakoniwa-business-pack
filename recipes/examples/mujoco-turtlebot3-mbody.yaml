missing_pieces:
  - Replace local-validation revisions with concrete commit SHAs after the related repository changes are pushed.
  - Decide whether this recipe should become the canonical minimal TB3 MuJoCo demo recipe.
  - Add CI or scripted smoke validation if shared-memory and GUI constraints can be handled.
  - Record native Windows evidence for Waffle and Waffle Pi when those additional profiles are required; Burger and the common runner are verified.

demo:
  objective: Run TurtleBot3 Burger, Waffle, or Waffle Pi in MuJoCo from MBody-generated artifacts and validate motion plus LiDAR output.
  steps:
    - order: 1
      component: hakoniwa-business-pack
      action: Materialize the Burger assets and configure the managed build on the current host OS.
      command: python tools/recipe/mujoco_turtlebot3_mbody.py configure
    - order: 2
      component: hakoniwa-business-pack
      action: Build the Burger simulator in the Recipe workspace.
      command: python tools/recipe/mujoco_turtlebot3_mbody.py build
    - order: 3
      component: hakoniwa-business-pack
      action: Verify Foundation, source, generated configuration, and binary prerequisites.
      command: python tools/recipe/mujoco_turtlebot3_mbody.py doctor
    - order: 4
      component: hakoniwa-business-pack
      action: Start the viewer and joystick-free figure-eight route through the background Launcher lifecycle.
      command: python tools/recipe/mujoco_turtlebot3_mbody.py start
    - order: 5
      component: hakoniwa-business-pack
      action: Inspect the same session on either host OS.
      command: python tools/recipe/mujoco_turtlebot3_mbody.py status
  cleanup:
    owner: hakoniwa-launcher
    provider: hakoniwa-pdu-python
    mode: background
    target: work/recipes/mujoco-turtlebot3-mbody/runtime/launcher-session.json
    trigger: python tools/recipe/mujoco_turtlebot3_mbody.py stop
    expected_behavior:
      - hako_launcher_ctl terminate invokes the Launcher normal termination path.
      - Launcher records TERMINATED and stops only this Recipe's simulator and route assets.
    verification_checks:
      - Confirm the Launcher session reports TERMINATED.
      - Confirm no Recipe-owned simulator or route process remains.
    cautions:
      - Do not replace the session-file terminate command with OS-specific kill, taskkill, or broad process cleanup.
  observability:
    success_signals:
      - MuJoCo viewer shows TurtleBot3 Burger, Waffle, or Waffle Pi moving through a scripted figure-eight route.
      - LiDAR plot shows nearby scan points while the robot passes marker boxes.
      - MuJoCo runtime logs contain nonzero lidar_hits and nearby lidar_min values around the demo obstacles.
      - Route demo logs show completed figure-eight phases and a neutral hold before launcher shutdown.
    failure_signals:
      - Simulator starts but robot pose does not change after hako-cmd start and route demo launch.
      - LiDAR ranges remain only at far-range values even when the robot is near demo obstacles.
      - PDU channels are not created or Python scripts cannot import hakopy/hakoniwa-pdu in the selected Python environment.
    fixtures:
      - Demo marker boxes must intersect the TurtleBot3 LiDAR scan height; obstacles below the scan plane do not validate LiDAR.
      - MuJoCo viewer requires GUI access; Hakoniwa PDU SHM requires unsandboxed shared-memory access.
    automation:
      - tb3_route_demo.py provides joystick-free GameControllerOperation commands.
      - tb3-mbody-demo-launch.json starts the simulator before hako-cmd start and starts route/LiDAR assets after simulation start.
  verification_checks:
    lifecycle:
      - The cross-platform Recipe doctor reports READY before the executable demo is launched.
      - hako_launcher reports tb3_sim_mbody, lidar_visualizer, and route_demo assets.
      - hako-cmd start exits with status 0.
      - route_demo exit may intentionally trigger launcher abort-all shutdown after the route completes.
    behavior:
      - tb3_sim_mbody loads the selected MBody manifest and minimal world.
      - TB3 log lines show step advancement after simulation start.
      - TB3 position or joint values change during the route.
      - LiDAR log fields show nonzero lidar_hits and nearby lidar_min values around sensor-visible obstacles.
      - route_demo logs show figure-eight phases and TB3 route demo finished.
    logs:
      - logs/tb3_sim_mbody.out contains "Loaded TB3 manifest" and "TB3 model loaded successfully".
      - logs/tb3_sim_mbody.out contains "[TB3] step=" lines with changing pos, joint_pos, or lidar_min.
      - logs/route_demo.out contains "TB3 route demo finished".
      - logs/lidar_visualizer.out contains "PduManager initialized".

expected_result: >
  TurtleBot3 Burger, Waffle, or Waffle Pi generated from MBody Registry runs in MuJoCo,
  follows a scripted figure-eight route without a joystick, and produces
  LiDAR hits from sensor-visible demo obstacles.

