id: drone-single-mujoco-threejs-gamepad
title: Human-operated Hakoniwa Drone MuJoCo and Three.js Exhibition Demo
recipe_version: 0.6

goal:
  user_request: 展示会場で参加者がPS5コントローラを使って箱庭ドローンを飛ばし、MuJoCoとブラウザの両方で見たい
  description: >
    Generate and operate a single-drone exhibition runtime in which a human uses
    a PS5 controller with the verified ps4-control.json mapping. Hakoniwa Drone
    runs the physics simulation and native MuJoCo viewer, while the visual-state
    publisher, WebBridge, and Three.js viewer expose the same motion in a browser.
    The browser can also send wind and rotor-fault disturbances through the
    installed Bridge Core web_bridge_disturb configuration. Business Pack owns
    the generated Launcher, workspace portal, and operator workflow; Drone Core
    and Bridge Core remain unchanged.

feasibility:
  status: feasible
  confidence: high
  rationale:
    - Drone Core already provides the MuJoCo service, rc-custom.py, and the PS4 controller mapping confirmed to work with the PS5 controller.
    - DroneVisualStatePublisher, WebBridge, and Three.js already form a verified browser visualization path.
    - Bridge Core installs web_bridge_disturb as the maintained bidirectional DroneVisualStateArray and Drone/disturb configuration.
    - Three.js already provides viewer-config-disturb.json and pdudef-disturb.json for fleets rendering plus browser disturbance writes.
    - hakoniwa-pdu-python provides the common Launcher and OS-independent background lifecycle control.

validation:
  status: partially_verified
  verified_at: 2026-08-04
  summary: >
    PS5 operation, MuJoCo rendering, and Three.js browser rendering were exercised
    on the exhibition machine. Browser wind and rotor-fault submission exposed a
    Recipe wiring defect: the generated Launcher used the display-only fleets
    configuration copied from Drone Core. This revision switches the Recipe to
    the installed Bridge Core web_bridge_disturb configuration and the existing
    Three.js disturbance viewer. The corrected disturbance path still requires
    one live re-verification before it is marked verified.
  steps:
    - id: ps5_with_ps4_mapping
      status: verified
      evidence:
        - source: user-runtime-confirmation
          date: 2026-07-31
      notes:
        - The existing ps4-control.json mapping operates the PS5 controller; no separate PS5 mapping is required.
    - id: generated_launcher_topology
      status: verified
      evidence:
        - source: local macOS Launcher session
          date: 2026-07-31
      notes:
        - Unit tests validate the generated topology.
        - Drone service, visual-state publisher, WebBridge, rc-custom.py, and the HTTP server all stabilized in one background Launcher session.
        - TCP ports 8000 and 8765 were listening while the session remained RUNNING.
        - Session-file termination completed through Launcher control and left the persisted TERMINATED state.
        - The Drone service uses the MuJoCo one-drone config and drone-pdudef-1.json consistently with rc-custom.py.
    - id: foundation_python_venv
      status: verified
      evidence:
        - source: Business Pack generator tests
          date: 2026-07-31
        - source: local macOS configure and doctor
          date: 2026-07-31
      notes:
        - The generated Launcher uses only work/foundation/install/python for Launcher, gamepad control, and the Three.js HTTP server.
        - configure installs the pinned Recipe-specific Python requirements into that Foundation venv before generating the runtime.
        - Runtime doctor verifies hakopy, hakoniwa_pdu, and the Launcher import from the same Foundation venv.
        - Runtime doctor detected one connected gamepad after configure installed pygame 2.6.1.
    - id: generated_recipe_portal
      status: verified
      evidence:
        - source: Business Pack generator tests
          date: 2026-07-31
      notes:
        - configure generates index.html at the Recipe workspace root.
        - The portal records topology, Foundation Python, Bridge Core config, operator commands, resource links, and Agency Boundary without executing local commands.
    - id: exhibition_visualization_end_to_end
      status: verified
      evidence:
        - source: user-runtime-confirmation
          date: 2026-08-04
      notes:
        - python tools/recipe/drone_gamepad_exhibition.py start opened the MuJoCo viewer and served a working Three.js browser view.
    - id: browser_disturbance_end_to_end
      status: not_tested
      evidence: []
      notes:
        - Re-run configure and start after this Recipe update.
        - Verify that browser wind and rotor-fault controls write Drone/disturb through Bridge Core web_bridge_disturb and affect the simulated drone.

constraints:
  - single-pc
  - native
  - human-operated-gamepad
  - mujoco-native-viewer
  - threejs-browser-viewer
  - browser-disturbance-input
  - shared-memory-pdu
  - shared-foundation-python-venv
  - generated-recipe-workspace-portal
  - no-px4
  - business-pack-owned-launcher
  - no-drone-core-modification
  - no-bridge-core-modification

target_environment:
  required_for: executable-demo
  status: specified
  os: macOS | Linux | Windows
  os_version: current-supported-host
  architecture: host-native
  execution_mode: native
  runtimes:
    - name: MuJoCo
      required: true
      version: Drone-Core-compatible
      path: hakoniwa-drone-core/vendor/mujoco
    - name: Python
      required: true
      version: "3.12"
      path: work/foundation/install/python
    - name: Browser
      required: true
      version: current
      path: system-default
  hakoniwa:
    install_prefix: work/foundation/install
    components_built:
      - hakoniwa-core-pro
      - hakoniwa-pdu-python
      - hakoniwa-pdu-bridge-core
  notes:
    - Runtime executable names are selected by Business Pack platform adapters.
    - Architecture-specific arm64/x64 qualification is not a strict exhibition acceptance gate.
    - Initial live validation may be macOS-first, but the common Launcher model must not contain macOS-only paths.
    - All Python runtime participants must use work/foundation/install/python; arbitrary Python overrides are not permitted.
    - The WebBridge configuration is reused from work/foundation/install/share/hakoniwa-pdu-bridge/config/web_bridge_disturb.

execution_environment:
  required_for: executable-demo
  status: specified
  os: host-native
  os_version: current-supported-host
  architecture: host-native
  execution_mode: native
  gui:
    required: true
    status: required
  shared_memory:
    required: true
    access: local-host
  devices:
    - name: PS5 controller
      required: true
      available: user-confirmed
      mapping: hakoniwa-drone-core/drone_api/rc/rc_config/ps4-control.json
  python:
    environment: foundation-venv
    path: work/foundation/install/python
    version: "3.12"
    hakopy_available: required
    hakoniwa_pdu_available: required
    interpreter_override: forbidden
    invariant: Launcher, RC controller, and Python HTTP server use the same Foundation venv interpreter.
  hakoniwa:
    install_prefix: work/foundation/install
    hako_cmd_access: required
  notes:
    - TCP ports 8000 and 8765 must be available.
    - The operator uses one Python command surface on every supported OS.
    - OS-specific executable discovery is isolated under tools/recipe/platforms/drone_gamepad.
    - The Foundation Python executable path must be preserved without resolving its venv symlink to a system interpreter.
    - The generated workspace root index.html is the human-facing entry point for this Recipe result.
    - Recipe-specific Python packages are installed from recipes/requirements/drone-single-mujoco-threejs-gamepad.txt by configure.

runtime_dependencies:
  python:
    interpreter: work/foundation/install/python
    requirements: recipes/requirements/drone-single-mujoco-threejs-gamepad.txt
    packages:
      - name: pygame
        version: 2.6.1
        purpose: Read PS4/PS5 controller events from rc-custom.py.

agency_boundary:
  agent_actions:
    - id: generate_exhibition_runtime
      description: Run configure and doctor to generate and inspect the Recipe workspace, portal, and Launcher.
      autonomous: true
      preconditions:
        - user_requested_execution
    - id: inspect_exhibition_status
      description: Read Launcher status and logs without operating the gamepad or disturbance controls.
      autonomous: true
      preconditions:
        - launcher_started_by_operator
  human_decisions:
    - id: begin_participant_session
      description: Decide when the exhibition runtime is ready to hand to a participant.
      required_before:
        - operate_gamepad
  human_actions:
    - id: start_exhibition
      description: Start the generated Launcher on the exhibition machine.
      confirmation_required: true
      required_before:
        - operate_gamepad
    - id: operate_gamepad
      description: Hold and operate the PS5 controller to fly the simulated drone.
      confirmation_required: true
      required_before: []
    - id: inject_browser_disturbance
      description: Use the Three.js controls to apply wind or rotor-fault disturbance to the simulated drone.
      confirmation_required: true
      required_before: []
    - id: reset_for_next_participant
      description: Reset browser disturbance values and run the Recipe reset command between participants.
      confirmation_required: true
      required_before:
        - next_participant_session
    - id: stop_exhibition
      description: Terminate the owned Launcher session at the end of the demonstration.
      confirmation_required: true
      required_before: []
  required_permissions:
    - id: hakoniwa_drone_license
      description: Confirm that the exhibition machine has the required Hakoniwa Drone Core or PRO usage entitlement.
      status: required
      required_before:
        - start_exhibition

components:
  - id: hakoniwa-drone-core
    roles:
      - physics_runtime
      - simulation_core
    purpose: Run the MuJoCo drone service, native viewer, DroneVisualStatePublisher, and gamepad RC application.
  - id: hakoniwa-core-pro
    roles:
      - simulation_core
      - time_sync
    purpose: Provide shared-memory PDU space, simulation lifecycle, and hako-cmd.
  - id: hakoniwa-pdu-python
    roles:
      - language_binding
      - control_plane
    purpose: Provide the shared Foundation venv, Python Launcher, background session lifecycle, and operator command runtime.
  - id: hakoniwa-pdu-bridge-core
    roles:
      - bridge
      - communication_infrastructure
    purpose: Provide the installed web_bridge_disturb configuration that sends DroneVisualStateArray from SHM to WebSocket and Drone/disturb from WebSocket to SHM.
  - id: hakoniwa-threejs-drone
    roles:
      - visualizer
    purpose: Render the simulated drone and provide wind and rotor-fault controls through viewer-config-disturb.json.

foundation_requirements:
  hakoniwa-core-pro:
    capabilities:
      shared_memory: true
      hako_cmd: true
      python_binding: true
  hakoniwa-pdu-python:
    version:
      min: 1.6.5
    capabilities:
      hako_launcher: true
      launcher_background_lifecycle: true
      shm_backend: true
  hakoniwa-pdu-endpoint:
    capabilities:
      hakoniwa_core: true
      core_callback: true
      websocket: true
  hakoniwa-pdu-bridge-core:
    capabilities:
      hakoniwa_app: true
      web_bridge: true

connections:
  - from: hakoniwa-core-pro
    to: hakoniwa-drone-core
    interface: pdu
    data:
      - shared-memory-pdu-space
      - simulation-time
      - lifecycle
    contract:
      status: partially_verified
      requires:
        - matching Core configuration
        - one Conductor owner
      validation_notes:
        - The existing single-drone and RC launch paths use this contract.
  - from: hakoniwa-pdu-python
    to: hakoniwa-drone-core
    interface: python-and-pdu
    data:
      - Launcher lifecycle
      - GameControllerOperation
    contract:
      status: verified
      requires:
        - work/foundation/install/python
        - hakopy and hakoniwa_pdu importable from the same interpreter
        - rc-custom.py
        - ps4-control.json
      validation_notes:
        - The PS4 mapping is confirmed to operate the PS5 controller.
        - Arbitrary Python interpreter overrides are outside this Recipe contract.
  - from: hakoniwa-drone-core
    to: hakoniwa-pdu-bridge-core
    interface: shared-memory-pdu
    data:
      - DroneVisualStateArray
    contract:
      status: verified
      requires:
        - visual-state publisher configuration
        - installed web_bridge_disturb config root
      validation_notes:
        - The exhibition machine displayed the Drone through Three.js on 2026-08-04.
  - from: hakoniwa-pdu-bridge-core
    to: hakoniwa-threejs-drone
    interface: websocket
    data:
      - DroneVisualStateArray
    contract:
      status: verified
      requires:
        - TCP port 8765
        - viewer-config-disturb.json
        - wireVersion v2
      validation_notes:
        - Browser rendering was confirmed on the exhibition machine.
  - from: hakoniwa-threejs-drone
    to: hakoniwa-pdu-bridge-core
    interface: websocket
    data:
      - Drone/disturb
      - wind disturbance
      - rotor-fault ratios
    contract:
      status: not_tested
      requires:
        - viewer-config-disturb.json
        - pdudef-disturb.json
        - browser WebSocket connection
      validation_notes:
        - The previous fleets viewer configuration could render but did not declare Drone/disturb.
        - Live re-verification is required after switching to the existing disturbance viewer configuration.
  - from: hakoniwa-pdu-bridge-core
    to: hakoniwa-drone-core
    interface: shared-memory-pdu
    data:
      - Drone/disturb
    contract:
      status: not_tested
      requires:
        - work/foundation/install/share/hakoniwa-pdu-bridge/config/web_bridge_disturb
        - web_bridge_disturb_node1
        - WebBridgeDisturb asset registration
      validation_notes:
        - Bridge Core owns the bidirectional configuration; Business Pack only selects it.

data_flow:
  - source: PS5 controller
    path:
      - pygame joystick events
      - rc-custom.py
      - GameControllerOperation PDU
      - Hakoniwa Drone service
    destination: MuJoCo drone dynamics
  - source: Hakoniwa Drone service
    path:
      - DroneVisualStatePublisher
      - DroneVisualStateArray
      - Bridge Core web_bridge_disturb
      - WebSocket
    destination: Three.js browser viewer
  - source: Three.js disturbance controls
    path:
      - Drone/disturb over WebSocket
      - Bridge Core web_bridge_disturb
      - Hakoniwa shared memory
    destination: Hakoniwa Drone disturbance input

time_model:
  owner: hakoniwa-core-pro
  policy: shared-memory-simulation-time
  requirements:
    - Drone service, visual-state publisher, and WebBridge participate in the same Hakoniwa lifecycle.
    - The gamepad controller starts after hako-cmd start.
    - The browser HTTP server may start after the WebBridge path is active.

artifact_sets:
  foundation:
    status: partially_verified
    owner: work/foundation
    artifacts:
      - work/foundation/install
      - work/foundation/install/python
      - work/foundation/config/cpp_core_config.json
      - work/foundation/runtime/mmap
      - work/foundation/install/share/hakoniwa/receipts
      - work/foundation/install/share/hakoniwa-pdu-bridge/config/web_bridge_disturb
  recipe_runtime:
    status: partially_verified
    owner: work/recipes/drone-single-mujoco-threejs-gamepad
    artifacts:
      - index.html
      - config/launcher.json
      - config/drone
      - config/pdudef
      - config/controller
      - config/assets/visual_state_publisher
      - runtime/launcher-session.json
      - logs
      - validation
    notes:
      - Bridge configuration is not copied into the Recipe workspace; the Launcher directly reuses the installed Bridge Core artifact.

artifacts:
  generated:
    - path: work/recipes/drone-single-mujoco-threejs-gamepad/index.html
      owner: hakoniwa-business-pack
      purpose: Human-facing entry point with topology, workflow, environment, resources, and Agency Boundary.
    - path: work/recipes/drone-single-mujoco-threejs-gamepad/config/launcher.json
      owner: hakoniwa-business-pack
      purpose: Common cross-platform Launcher topology with resolved absolute executable and Bridge config paths.
    - path: work/recipes/drone-single-mujoco-threejs-gamepad/runtime/launcher-session.json
      owner: hakoniwa-pdu-python
      purpose: Background Launcher lifecycle and ownership record.
  reused:
    - path: hakoniwa-drone-core/drone_api/rc/rc-custom.py
      owner: hakoniwa-drone-core
    - path: hakoniwa-drone-core/drone_api/rc/rc_config/ps4-control.json
      owner: hakoniwa-drone-core
    - path: hakoniwa-drone-core/config/drone/mujoco
      owner: hakoniwa-drone-core
      purpose: One-drone MuJoCo dynamics configuration compatible with the native viewer.
    - path: hakoniwa-drone-core/config/pdudef/drone-pdudef-1.json
      owner: hakoniwa-drone-core
      purpose: PDU definition used consistently by the Drone service, visual-state publisher, and rc-custom.py.
    - path: work/foundation/install/python
      owner: hakoniwa-pdu-python
      purpose: The only Python environment used by Launcher, gamepad controller, and HTTP server.
    - path: work/foundation/install/share/hakoniwa-pdu-bridge/config/web_bridge_disturb
      owner: hakoniwa-pdu-bridge-core
      purpose: Maintained bidirectional visual-state and disturbance Bridge configuration selected directly by the Recipe.
    - path: hakoniwa-threejs-drone/config/viewer-config-disturb.json
      owner: hakoniwa-threejs-drone
      purpose: Existing fleets viewer profile that renders DroneVisualStateArray and enables wind and rotor-fault submission.

missing_pieces:
  - Re-verify browser wind and rotor-fault injection after regenerating the Recipe workspace.
  - Native Linux runtime validation.
  - Native Windows runtime validation and confirmation of distributed executable names.

demo:
  profiles:
    - id: human-gamepad-exhibition
      launcher: work/recipes/drone-single-mujoco-threejs-gamepad/config/launcher.json
      description: Start the Drone service, MuJoCo viewer, bidirectional browser path, and gamepad controller as one owned Launcher session.
  prerequisites:
    - command: python tools/foundation.py doctor --recipe recipes/examples/drone-single-mujoco-threejs-gamepad.yaml
      expected: Foundation SATISFIED, including the installed Bridge Core web_bridge_disturb configuration.
    - command: python tools/recipe/drone_gamepad_exhibition.py configure
      expected: Recipe workspace, index.html portal, and common Launcher JSON generated.
    - command: python tools/recipe/drone_gamepad_exhibition.py doctor
      expected: Foundation venv imports, gamepad presence, runtime binaries, Bridge Core disturbance config, ports, generated portal, and generated Launcher are ready.
  steps:
    - id: configure
      command: python tools/recipe/drone_gamepad_exhibition.py configure
      status: verified
      expected:
        - Pinned Recipe-specific Python requirements are installed into work/foundation/install/python.
        - index.html is generated at the Recipe workspace root.
        - Launcher JSON is generated under the Recipe workspace.
        - The Launcher references work/foundation/install/share/hakoniwa-pdu-bridge/config/web_bridge_disturb directly.
        - The selected Python is work/foundation/install/python and is not replaced by a system interpreter.
    - id: read_portal
      command: human opens work/recipes/drone-single-mujoco-threejs-gamepad/index.html
      status: not_tested
      expected:
        - The operator can recover the topology, exact commands, environment, resource paths, and Agency Boundary from one page.
        - The page offers command copy controls but does not execute local commands.
    - id: doctor
      command: python tools/recipe/drone_gamepad_exhibition.py doctor
      status: verified
      expected:
        - hakopy, hakoniwa_pdu, and the Launcher import from the same Foundation venv.
        - The PS5 controller is visible through pygame.
        - The installed Bridge Core disturbance bridge and endpoint definitions are present.
    - id: start
      command: python tools/recipe/drone_gamepad_exhibition.py start
      status: verified
      expected:
        - Background Launcher session starts.
        - MuJoCo viewer opens.
        - RC controller and HTTP server use the same Foundation Python interpreter.
    - id: open_viewer
      command: python tools/recipe/drone_gamepad_exhibition.py open-viewer
      status: not_tested
      expected:
        - Browser opens viewer-config-disturb.json on port 8000 and connects to WebBridge port 8765.
    - id: participant_operation
      command: human operates PS5 controller and browser disturbance controls
      status: not_tested
      expected:
        - Drone responds to the gamepad in MuJoCo and Three.js.
        - Wind and rotor-fault controls alter the simulated Drone through Drone/disturb.
    - id: reset
      command: python tools/recipe/drone_gamepad_exhibition.py reset
      status: not_tested
      expected:
        - Browser disturbance values are returned to neutral by the operator.
        - hako-cmd stop, reset, and start complete without terminating the Launcher session.
    - id: status
      command: python tools/recipe/drone_gamepad_exhibition.py status
      status: verified
      expected:
        - Launcher control reports the owned session state.
    - id: stop
      command: python tools/recipe/drone_gamepad_exhibition.py stop
      status: verified
      expected:
        - hako_launcher_ctl terminate invokes LauncherService.terminate.
  cleanup:
    owner: hakoniwa-launcher
    provider: hakoniwa-pdu-python
    mode: background
    target: work/recipes/drone-single-mujoco-threejs-gamepad/runtime/launcher-session.json
    trigger: python tools/recipe/drone_gamepad_exhibition.py stop
    expected_behavior:
      - hako_launcher_ctl terminate invokes the Launcher normal termination path.
      - Launcher reports state TERMINATED and terminates only the assets it owns.
    verification_checks:
      - Confirm no Launcher-managed asset remains.
      - Confirm no process is listening on TCP port 8000.
      - Confirm no process is listening on TCP port 8765.
      - Inspect the Launcher session log for incomplete cleanup.
    cautions:
      - Reset rotor ratios to 1.0 and wind speed to 0.0 before reset or shutdown.
      - Do not replace the session-file terminate command with OS-specific kill, taskkill, or broad process cleanup.
      - Do not treat hako-cmd stop as process termination.
      - Do not run Launcher, controller, or viewer server with a Python outside work/foundation/install/python.

expected_result: >
  A human can open the generated Recipe workspace index.html to recover the exact
  exhibition workflow, then use the PS5 controller with the existing ps4-control.json
  mapping to operate one simulated Hakoniwa Drone. The native MuJoCo viewer and
  Three.js browser viewer display the same run, while the browser can send wind and
  rotor-fault disturbance through the installed Bridge Core web_bridge_disturb
  configuration. Business Pack generates and owns the portal, common Launcher, and
  workspace without copying or modifying the Bridge Core configuration. All Python
  runtime participants use the same shared Foundation venv, the operator uses one
  Python command surface on every OS, and Drone Core remains unmodified.

