id: drone-single-mujoco-shibuya-map-gamepad
title: Human-operated Hakoniwa Drone in a Generated City World
recipe_version: 0.8

goal:
  user_request: PS4/PS5コントローラで任意都市のMuJoCo環境を単機飛行し、PLATEAU 3DビューとLeaflet地図で同時に確認したい
  description: >
    Extend the existing Shibuya single-drone gamepad Recipe so configure can
    consume a generated City World receipt. Business Pack composes the clean
    Drone Core MuJoCo model with City World physics, aligns Leaflet and Three.js
    to the receipt origin, and materializes an RC-enabled runtime without
    modifying owner repositories. Omitting --city-world preserves the legacy
    pinned Shibuya preset.

feasibility:
  status: feasible
  confidence: high
  rationale:
    - The existing gamepad Recipe already provides PS5 control, Launcher lifecycle, WebBridge, and Foundation integration.
    - Drone Core owns a clean single-drone MuJoCo model and PS4/PS5 RadioController path.
    - City World receipts identify matching MJCF, GLB, coordinate origin, and hashes.
    - Map Viewer already combines Leaflet and Three.js and can select a Recipe-generated viewer configuration.
    - Collision masks contype=2/conaffinity=1 preserve City-to-Drone collision while disabling Drone-to-Drone collision for the later fleet phase.
    - The runtime defaults to hakoniwa-drone-pro because generated City Worlds are compiled to MJB; the legacy Drone Core service must not be selected implicitly.

validation:
  status: partially_verified
  verified_at: 2026-08-05
  summary: >
    Legacy Shibuya materialization remains covered by its existing tests. Generated
    City World materialization is verified with an artificial receipt fixture and a
    real Numazu worker artifact. Configure compiles the canonical XML into a
    version-bound MJB and reload-validates it; the MJB-capable native Drone PRO
    Service loaded the composed model and the complete Launcher reached ready on
    2026-08-24. Gamepad flight, physical contact, browser alignment, and the
    complete operator lifecycle still require human end-to-end validation.
  steps:
    - id: source_asset_contract
      status: verified
      evidence:
        - source: hakoniwa-drone-core/config/drone/mujoco-shibuya-api-1
          date: 2026-07-31
      notes:
        - drone.xml is the complete MuJoCo world and must be copied byte-for-byte.
    - id: transformation_contract
      status: verified
      evidence:
        - source: design-review
          date: 2026-07-31
      notes:
        - Only four JSON paths may change in generated drone_config_0.json.
    - id: coordinate_contract
      status: verified
      evidence:
        - source: user-runtime-confirmation
          date: 2026-08-05
        - source: source-and-runtime-investigation
          date: 2026-08-05
      notes:
        - MuJoCo and the Drone visual-state PDU use local coordinates in this Recipe.
        - Drone Core simulation.location is retained independently for GPS and magnetic-field simulation.
        - Map Viewer alone converts the local ROS/ENU position into latitude and longitude.
        - Preserve the Map Viewer origin 35.6625, 139.70625 because it is the geographic anchor for the PLATEAU local-coordinate origin.
        - Do not derive the Map Viewer origin from Drone Core simulation.location.
    - id: generated_runtime
      status: verified
      evidence:
        - source: tools/recipe/test_drone_shibuya_gamepad.py
          date: 2026-08-05
        - source: work/recipes/drone-single-mujoco-shibuya-map-gamepad/validation/materialization.json
          date: 2026-07-31
      notes:
        - Unit tests verify both legacy Shibuya materialization and generated City World composition, coordinate derivation, collision filters, GLB provenance, Launcher topology, and session-file cleanup commands.
        - Foundation doctor is SATISFIED for the three required Foundation components.
        - macOS configure downloaded the real v0.0.1 PLATEAU GLB into the Recipe workspace and verified its declared SHA-256.
        - The generated browser path reuses the Recipe-local GLB through a hard link on the verified macOS workspace.
    - id: generated_city_world_composition
      status: verified
      evidence:
        - source: tools/recipe/test_drone_shibuya_gamepad.py
          date: 2026-08-24
        - source: work/remote-operation/city-world-worker/jobs/shizuoka-22203-lat35.099-lon138.859/build/world/city-world-receipt.json
          date: 2026-08-24
        - source: native-drone-service-model-load
          date: 2026-08-24
      notes:
        - The receipt hashes and X=North,Y=-East,Z=Up contract are checked before composition.
        - The clean Drone ground is removed, City World assets/worldbody are inserted, and the native Drone Service loaded the composed model.
        - Drone contype=2/conaffinity=1 was fixed by a collision-filter truth-table test; physical contact remains a human acceptance item.
    - id: compiled_mujoco_model
      status: verified
      evidence:
        - source: tools/mujoco_model_compiler.py
          date: 2026-08-24
        - source: hakoniwalab/hakoniwa-drone-pro#151
          date: 2026-08-24
        - source: work/recipes/drone-single-mujoco-shibuya-map-gamepad/validation/materialization.json
          date: 2026-08-24
      notes:
        - The canonical XML remains available, while runtime modelPath selects the configure-generated MJB.
        - Configure records XML/MJB/library hashes, MuJoCo version, size, and successful MJB reload validation.
        - The real Numazu model produced an approximately 57 MiB MJB with MuJoCo 3.9.0, and the full Launcher reached ready with the MJB-capable Drone PRO binary.
        - MJB is version-bound and must be regenerated when the runtime MuJoCo version changes.
    - id: end_to_end
      status: not_tested
      evidence: []
      notes:
        - Verify PS5 flight, collision, MuJoCo rendering, Three.js rendering, Leaflet tracking, reset, and cleanup after regenerating the Recipe workspace.

constraints:
  - single-pc
  - native
  - human-operated-gamepad
  - mujoco-native-viewer
  - generated-city-world-input
  - legacy-shibuya-preset
  - map-viewer-browser
  - threejs-city-world-view
  - leaflet-map
  - shared-memory-pdu
  - shared-foundation-python-venv
  - no-px4
  - no-envsim-runtime-asset
  - no-drone-core-modification
  - no-map-viewer-source-modification
  - preserve-plateau-map-georeference-origin
  - separate-map-origin-from-drone-simulation-location
  - business-pack-owned-materialization
  - configure-compiled-mujoco-mjb
  - xml-remains-canonical
  - mujoco-version-bound-binary
  - business-pack-owned-launcher

target_environment:
  required_for: executable-demo
  status: specified
  os: macOS | Linux | Windows
  os_version: current-supported-host
  architecture: host-native
  execution_mode: native
  runtimes:
    - name: MuJoCo
      required: true
      version: Drone-PRO-compatible
      path: hakoniwa-drone-pro/vendor/mujoco or the matching distributed runtime
    - name: Python
      required: true
      version: "3.12"
      path: work/foundation/install/python
    - name: Browser
      required: true
      version: current
      path: system-default
  hakoniwa:
    install_prefix: work/foundation/install
    components_built:
      - hakoniwa-core-pro
      - hakoniwa-pdu-python
      - hakoniwa-pdu-bridge-core
  notes:
    - Reuse the platform adapters and Foundation Python contract from drone-single-mujoco-threejs-gamepad.
    - TCP ports 8000 and 8765 must be available.

execution_environment:
  workspace:
    mode: managed
  required_for: executable-demo
  status: specified
  os: host-native
  os_version: current-supported-host
  architecture: host-native
  execution_mode: native
  gui:
    required: true
    status: required
  shared_memory:
    required: true
    access: local-host
  devices:
    - name: PS5 controller
      required: true
      available: user-confirmed
      mapping: hakoniwa-drone-core/drone_api/rc/rc_config/ps4-control.json
  python:
    environment: foundation-venv
    path: work/foundation/install/python
    version: "3.12"
    hakopy_available: required
    hakoniwa_pdu_available: required
    interpreter_override: forbidden
  hakoniwa:
    install_prefix: work/foundation/install
    hako_cmd_access: required
  notes:
    - Primary mode uses --city-world with a City World worker job or build/world artifact set.
    - The City World receipt is the source of the MJCF/GLB hashes, geographic origin, and local coordinate contract.
    - configure composes file-backed City World assets into canonical XML and then compiles a self-contained MJB using the Drone runtime's MuJoCo shared library.
    - Runtime selects the MJB, so XML asset paths are not traversed on each start. Reconfigure still requires the source City World job.
    - The materialization record pins XML, MJB, and MuJoCo library hashes; changing the MuJoCo runtime requires reconfigure.
    - The runtime does not launch hakoniwa-envsim; City World generation is an upstream operation.
    - The Shibuya PLATEAU GLB is pinned to the hakoniwa-map-viewer v0.0.1 Release.
    - "Release: https://github.com/hakoniwalab/hakoniwa-map-viewer/releases/tag/v0.0.1"
    - "Asset: https://github.com/hakoniwalab/hakoniwa-map-viewer/releases/download/v0.0.1/13113_shibuya-ku_pref_2023_citygml_2_op.glb"
    - "SHA-256: 2860f6db77f7d39af3320ca4e6650cd0e29082e5dfb5e081df6d810b0b172e9e"
    - configure downloads the pinned Asset into the Recipe workspace; --shibuya-glb remains available for an offline copy of the same Asset.
    - Omitting --city-world retains the legacy Shibuya path and its pinned GLB behavior.

runtime_dependencies:
  python:
    interpreter: work/foundation/install/python
    requirements: recipes/requirements/drone-single-mujoco-threejs-gamepad.txt
    packages:
      - name: pygame
        version: 2.6.1
        purpose: Read PS4/PS5 controller events from rc-custom.py.

agency_boundary:
  agent_actions:
    - id: materialize_runtime
      description: Copy source assets, apply the allowlisted JSON transformation, compile and reload-validate the MJB, materialize Map Viewer, and generate Launcher and portal.
      autonomous: true
      preconditions:
        - user_requested_execution
    - id: verify_materialization
      description: Record hashes, validate the allowlisted diff, and check coordinate invariants.
      autonomous: true
      preconditions:
        - materialize_runtime
  human_decisions:
    - id: approve_coordinate_change
      description: Approve any future change to the PLATEAU georeference origin or Drone simulation location.
      required_before:
        - modify_coordinate_contract
  human_actions:
    - id: start_runtime
      description: Start the generated Launcher, wait for Demo readiness, and hand the background session back to the operator.
      confirmation_required: true
      required_before:
        - operate_gamepad
    - id: operate_gamepad
      description: Operate the PS5 controller and validate flight and collision behavior.
      confirmation_required: true
      required_before: []
    - id: stop_runtime
      description: Terminate the owned Launcher session.
      confirmation_required: true
      required_before: []
  required_permissions:
    - id: hakoniwa_drone_license
      description: Confirm the required Hakoniwa Drone Core or PRO usage entitlement.
      status: required
      required_before:
        - start_runtime

components:
  - id: hakoniwa-drone-core
    roles:
      - physics_runtime
      - simulation_core
    purpose: Own the clean MuJoCo Drone model, MJB-capable Drone PRO runtime, and RC application.
  - id: hakoniwa-core-pro
    roles:
      - simulation_core
      - time_sync
    purpose: Provide shared-memory PDU space, lifecycle, and hako-cmd.
  - id: hakoniwa-pdu-python
    roles:
      - language_binding
      - control_plane
    purpose: Provide Foundation Python and Launcher background lifecycle.
  - id: hakoniwa-pdu-bridge-core
    roles:
      - bridge
      - communication_infrastructure
    purpose: Bridge the single Drone pos/motor PDUs from shared memory to WebSocket.
  - id: hakoniwa-map-viewer
    roles:
      - visualizer
      - monitor
      - integration_boundary
      - visualization_asset_source
    purpose: Present the live drone on Leaflet and the embedded Three.js City World while georeferencing local coordinates from the receipt.
  - id: hakoniwa-threejs-drone
    roles:
      - visualizer
    purpose: Render the drone and generated PLATEAU City World GLB inside Map Viewer.

foundation_contract:
  mode: required
  reason: This Recipe uses components installed and validated through the managed Business Pack Foundation.

foundation_requirements:
  hakoniwa-core-pro:
    capabilities:
      shared_memory: true
      hako_cmd: true
      python_binding: true
  hakoniwa-pdu-python:
    version:
      min: 1.6.5
    capabilities:
      hako_launcher: true
      launcher_background_lifecycle: true
      shm_backend: true
  hakoniwa-pdu-bridge-core:
    capabilities:
      hakoniwa_app: true
      web_bridge: true
      web_bridge_fleets_config_format: true

connections:
  - from: hakoniwa-pdu-python
    to: hakoniwa-drone-core
    interface: python-and-pdu
    data:
      - Launcher lifecycle
      - GameControllerOperation
    contract:
      status: partially_verified
      requires:
        - work/foundation/install/python
        - rc-custom.py
        - ps4-control.json
      validation_notes:
        - Reuse the parent gamepad Recipe contract.
  - from: hakoniwa-drone-core
    to: hakoniwa-pdu-bridge-core
    interface: shared-memory-pdu
    data:
      - Drone.pos
      - Drone.motor
    contract:
      status: partially_verified
      requires:
        - generated City World gamepad config
        - Foundation single-drone WebBridge configuration
      validation_notes:
        - The state path is inherited; the generated City World config remains partially verified.
  - from: hakoniwa-pdu-bridge-core
    to: hakoniwa-map-viewer
    interface: websocket
    data:
      - Drone.pos
      - Drone.motor
    contract:
      status: partially_verified
      requires:
        - TCP port 8765
        - wireVersion v2
        - generated City World legacy viewer configuration
      validation_notes:
        - Component checks exist; the coordinate path was confirmed at runtime on 2026-08-05.
  - from: hakoniwa-map-viewer
    to: hakoniwa-threejs-drone
    interface: public-browser-api
    data:
      - viewer configuration
      - scene configuration
      - drone visual state
    contract:
      status: partially_verified
      requires:
        - generated browser bundle
        - generated City World GLB
      validation_notes:
        - Materialize configuration without changing source repositories.

data_flow:
  - source: PS5 controller
    path:
      - pygame joystick events
      - rc-custom.py
      - GameControllerOperation PDU
      - RadioController
      - Hakoniwa Drone service
    destination: MuJoCo Drone composed with City World physics
  - source: Hakoniwa Drone service
    path:
      - Drone.pos and Drone.motor PDUs
      - Single-drone WebBridge
      - WebSocket
      - Hakoniwa Map Viewer
    destination: Leaflet map and Three.js City World view

time_model:
  owner: hakoniwa-core-pro
  policy: shared-memory-simulation-time
  requirements:
    - City World mode preserves simulation.timeStep 0.001 from the clean Drone Core MuJoCo configuration.
    - Legacy Shibuya mode preserves timestep 0.003.
    - The gamepad controller starts after hako-cmd start.

