  reused:
    - path: hakoniwa-drone-core/config/drone/mujoco-shibuya-api-1/drone.xml
      owner: hakoniwa-drone-core
      purpose: Complete MuJoCo drone and Shibuya collision world; copy byte-for-byte.
    - path: hakoniwa-drone-core/drone_api/rc/rc-custom.py
      owner: hakoniwa-drone-core
    - path: hakoniwa-drone-core/drone_api/rc/rc_config/ps4-control.json
      owner: hakoniwa-drone-core

coordinate_contract:
  policy: preserve-plateau-map-georeference
  source_repository_mutation: forbidden
  drone_simulation_location:
    source: hakoniwa-drone-core/config/drone/mujoco-shibuya-api-1/drone_config_0.json
    purpose: Geographic reference for GPS and magnetic-field simulation.
    latitude: 35.6625
    longitude: 139.69375
    altitude: 15.4
    mutation: forbidden-without-human-approval
  plateau_map_origin:
    source: hakoniwa-map-viewer/src/client/src/ui.js
    purpose: Geographic anchor corresponding to the PLATEAU local-coordinate origin.
    latitude: 35.6625
    longitude: 139.70625
    mutation: preserve
  derivation:
    map_origin_from_drone_simulation_location: forbidden
  notes:
    - MuJoCo and DroneVisualStateArray use local coordinates and do not require latitude or longitude for this Recipe's visual path.
    - Map Viewer converts local ROS coordinates to ENU and then to latitude and longitude.
    - The Map Viewer origin must therefore match the PLATEAU local-coordinate origin.
    - Recipe configure may center Leaflet on the PLATEAU origin, but must not replace it with Drone Core simulation.location.
    - Tests must fail if the generated Map Viewer origin is derived from Drone Core simulation.location.

implementation_plan:
  owner: codex-with-operator
  steps:
    - Extract reusable gamepad runtime helpers without changing the parent Recipe.
    - Copy the complete Shibuya source directory and patch only the four allowlisted JSON paths.
    - Assert that the generated drone.xml hash equals the source hash.
    - Generate the Map Viewer bundle and Shibuya fleets configuration.
    - Resolve the pinned Shibuya GLB Release Asset into the Recipe workspace, verify its SHA-256, and record its source. Accept --shibuya-glb only as an offline override.
    - Generate Launcher, portal, configure, doctor, and tests.
    - Preserve the PLATEAU Map Viewer origin independently from Drone Core simulation.location and validate the no-envsim boundary and coordinate invariants.
    - Perform live macOS validation before upgrading the remaining validation status.

acceptance_criteria:
  - configure creates the declared workspace without modifying source repositories.
  - generated drone.xml is byte-for-byte identical to the Drone Core source.
  - generated drone_config_0.json differs only at the four allowlisted JSON paths.
  - generated controller uses RadioController and the Recipe-owned parameter file.
  - Drone simulation location remains latitude 35.6625, longitude 139.69375, altitude 15.4.
  - Generated Map Viewer origin remains latitude 35.6625, longitude 139.70625.
  - Generated Leaflet initial center uses the PLATEAU origin 35.6625, 139.70625.
  - Generated validation evidence records that Map Viewer origin is not derived from Drone simulation.location.
  - Map Viewer source repository remains unchanged.
  - no generated dependency, config, Launcher asset, or command references hakoniwa-envsim.
  - Launcher includes Drone service, visual-state publisher, WebBridge, RC controller, and Map Viewer HTTP server.
  - PS5 operation moves the same drone in MuJoCo, Three.js, and Leaflet.
  - Shibuya MuJoCo collision is observable and recorded.
  - cleanup leaves no owned background process.

missing_pieces:
  - Component-owned machine-readable release manifest; this Recipe currently pins the v0.0.1 URL and SHA-256 directly.
  - Live collision and complete operator-lifecycle validation.
  - Native Linux validation.
  - Native Windows validation.

demo:
  profiles:
    - id: human-gamepad-shibuya-map
      launcher: work/recipes/drone-single-mujoco-shibuya-map-gamepad/config/launcher.json
      description: Fly one drone in the Shibuya MuJoCo collision world and show it in Leaflet and Three.js.
  prerequisites:
    - command: python tools/foundation.py doctor --recipe recipes/examples/drone-single-mujoco-shibuya-map-gamepad.yaml
      expected: Foundation SATISFIED
    - command: python tools/recipe/drone_shibuya_gamepad.py configure
      expected: MuJoCo assets, Map Viewer bundle, portal, validation record, and Launcher generated.
  readiness:
    lifecycle_state:
      source: work/recipes/drone-single-mujoco-shibuya-map-gamepad/runtime/launcher-session.json
      required: RUNNING
      sufficient: false
    checks:
      - id: mujoco_viewer_started
        kind: log
        target: work/recipes/drone-single-mujoco-shibuya-map-gamepad/logs/drone-service-1.out
        expected: Contains `Viewer thread started.`
      - id: simulation_running
        kind: log
        target: work/recipes/drone-single-mujoco-shibuya-map-gamepad/logs/drone-service-1.out
        expected: Contains `WAIT RUNNING`
      - id: map_viewer_http
        kind: tcp
        target: 127.0.0.1:8000
        expected: TCP connection succeeds.
      - id: web_bridge_websocket
        kind: tcp
        target: 127.0.0.1:8765
        expected: TCP connection succeeds.
    operator_handoff:
      background: true
      explain_command_return: true
      next_actions:
        - open-viewer
        - status
        - stop
      session_file: work/recipes/drone-single-mujoco-shibuya-map-gamepad/runtime/launcher-session.json
      logs: work/recipes/drone-single-mujoco-shibuya-map-gamepad/logs
  steps:
    - id: configure
      command: python tools/recipe/drone_shibuya_gamepad.py configure
      status: not_tested
      expected:
        - Source assets are copied and hashes recorded.
        - Only the allowlisted JSON paths are changed.
        - The PLATEAU Map Viewer origin remains independent from Drone simulation.location.
    - id: start
      command: python tools/recipe/drone_shibuya_gamepad.py start
      status: not_tested
      expected:
        - All runtime assets start in one owned Launcher session.
        - The command prints `[OK] Demo ready` only after MuJoCo, simulation, HTTP port 8000, and WebSocket port 8765 are ready.
        - The command then returns while the Launcher session continues in the background.
        - The output tells the operator how to open the viewer, inspect status, and stop the session.
    - id: open_viewer
      command: python tools/recipe/drone_shibuya_gamepad.py open-viewer
      status: partially_verified
      expected:
        - The browser displays Leaflet and the Shibuya Three.js scene.
        - Leaflet uses the PLATEAU georeference origin 35.6625, 139.70625.
    - id: validate_flight
      command: human operates the PS5 controller
      status: partially_verified
      expected:
        - MuJoCo, Three.js, and Leaflet show the same drone motion.
        - Collision with the Shibuya MuJoCo geometry is observable.
    - id: stop
      command: python tools/recipe/drone_shibuya_gamepad.py stop
      status: not_tested
      expected:
        - Launcher terminates all owned processes cleanly.
  cleanup:
    owner: hakoniwa-launcher
    provider: hakoniwa-pdu-python
    mode: background
    target: work/recipes/drone-single-mujoco-shibuya-map-gamepad/runtime/launcher-session.json
    trigger: python tools/recipe/drone_shibuya_gamepad.py stop
    expected_behavior:
      - Launcher invokes its normal termination path.
      - Only assets owned by this Recipe session are terminated.
    verification_checks:
      - Confirm no Launcher-managed asset remains.
      - Confirm no process is listening on TCP port 8000.
      - Confirm no process is listening on TCP port 8765.
      - Inspect the Launcher session log.
    cautions:
      - Do not use OS-specific broad process cleanup.
      - Do not treat hako-cmd stop as process termination.
      - Do not modify Drone Core source assets during cleanup.

expected_result: >
  A human can operate one Hakoniwa Drone with the PS5 controller inside the
  Shibuya MuJoCo collision world while the same local-coordinate state is shown
  in Hakoniwa Map Viewer as both a Three.js PLATEAU scene and a Leaflet map.
  Business Pack owns the generated configuration, browser bundle, Launcher,
  portal, and validation record. The generated Map Viewer preserves the PLATEAU
  georeference origin independently from Drone Core simulation.location, source
  repositories remain unmodified, and hakoniwa-envsim is absent.

