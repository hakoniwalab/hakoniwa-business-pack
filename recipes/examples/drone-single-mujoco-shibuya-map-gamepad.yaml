artifacts:
  generated:
    - path: work/recipes/drone-single-mujoco-shibuya-map-gamepad/config/drone/mujoco-shibuya-gamepad-1/drone_config_0.json
      owner: hakoniwa-business-pack
      purpose: RC-enabled copy of the Shibuya configuration.
      contract:
