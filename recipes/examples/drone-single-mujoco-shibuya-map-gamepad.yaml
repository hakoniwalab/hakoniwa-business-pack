        allowed_changes:
          - components.droneDynamics.mujoco.modelPath
          - controller.moduleDirectory
          - controller.moduleName
          - controller.paramFilePath
        all_other_values: preserve
    - path: work/recipes/drone-single-mujoco-shibuya-map-gamepad/config/controller/param-gamepad-mixer-mujoco-shibuya.txt
      owner: hakoniwa-business-pack
      purpose: Initial byte-for-byte copy of the Shibuya controller parameters.
    - path: work/recipes/drone-single-mujoco-shibuya-map-gamepad/web/map-viewer
      owner: hakoniwa-business-pack
      purpose: Map Viewer bundle, Recipe-specific configs, and a browser-visible link or copy of the pinned GLB.
    - path: work/recipes/drone-single-mujoco-shibuya-map-gamepad/assets/13113_shibuya-ku_pref_2023_citygml_2_op.glb
      owner: hakoniwa-business-pack
      purpose: Recipe-local distribution of the pinned hakoniwa-map-viewer v0.0.1 Release Asset.
      source: https://github.com/hakoniwalab/hakoniwa-map-viewer/releases/download/v0.0.1/13113_shibuya-ku_pref_2023_citygml_2_op.glb
      sha256: 2860f6db77f7d39af3320ca4e6650cd0e29082e5dfb5e081df6d810b0b172e9e
    - path: work/recipes/drone-single-mujoco-shibuya-map-gamepad/validation/materialization.json
      owner: hakoniwa-business-pack
