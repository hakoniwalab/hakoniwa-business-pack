version: 1

experiment:
  id: drone-fleet-single-host-mujoco-city-2

scale:
  drone_count: 2
  drones_per_process: 2
  # configure --process-count may split the fleet into independent City worlds.
  process_count: 1

runtime:
  mode: native
  visualization: true
  show_runner_real_time_sync: true

scenario:
  type: hakoniwa-word
  word: HAKONIWA
  letter_width_m: 2.0
  letter_height_m: 4.0
  letter_gap_m: 0.9
  altitude_m: 4.0
  duration_sec: 6.0
  hold_sec: 10.0
  speed_m_s: 3.0
  timeout_sec: 120.0
  land: false

results:
  enabled: false
  directory: results
