schema_version: 0.1
description: Machine-readable contracts used by generic Business Pack Recipe tooling.

demo_execution_context:
  applies_to: [demo.prerequisites, demo.steps]
  field: execution_context
  required: false
  type: non_empty_mapping
  required_fields: [location, terminal, cwd, environment]
  location:
    allowed: [host, container]
    semantics: Where the command starts executing, not where its child processes eventually run.
  terminal:
    type: non_empty_string
    semantics: Stable operator-facing terminal role; different roles require separate terminals.
  cwd:
    type: non_empty_string
    semantics: Human-readable directory precondition; never implicitly applied or expanded.
  environment:
    type: non_empty_string
    semantics: Environment required before running this command, not the environment it creates.
  shell_transition:
    type: boolean
    default: false
    semantics: Run separately and confirm the destination prompt before issuing another command.
  unknown_fields: rejected
  semantics:
    - Display metadata only; does not execute commands, activate environments, change cwd or verify readiness.
    - Explicitly contextual commands retain their interpreter spelling and order, including repeated commands.
    - Unannotated commands retain legacy Workspace interpreter normalization and command deduplication.

native_runtime_requirements:
  shared_schema: ../schemas/native-runtime.yaml
  semantics:
    - Select a component Catalog native runtime profile.
    - Declare required and optional binary roles without selecting an OS-specific dependency inspector.
    - Delegate dependency discovery and resolution to the shared validator platform adapter.

recipe_local_requirements:
  schema_version_field: recipe_local_requirements_schema_version
  supported_schema_versions:
    - 1
  type: mapping
  dependency_key: stable_dependency_id
  dependency:
    required_fields:
      - root
      - source
      - required_artifacts
    root:
      required_fields:
        - default_path
        - override_env
        - relative_to
      default_path:
        type: path
      override_env:
        type: environment_variable_name
      relative_to:
        allowed:
          - recipe_repository
    source:
      required_fields:
        - type
      type:
        allowed:
          - local
          - git
      git_required_fields:
        - url
      optional_fields:
        - url
        - revision
      configure_semantics:
        local: Never materialized; an absent root is reported as missing.
        git: Clone only through an explicit recipe.py configure operation.
    required_artifacts:
      type: non_empty_list
      item:
        required_fields:
          - path
          - kind
        path:
          type: dependency_root_relative_path
          placeholders:
            - NATIVE_BIN_PREFIX
            - NATIVE_EXECUTABLE_SUFFIX
        kind:
          allowed:
            - file
            - directory
            - executable

recipe_runtime:
  schema_version_field: recipe_runtime_schema_version
  supported_schema_versions:
    - 1
  required_fields:
    - environment
    - launcher
  environment:
    type: non_empty_mapping
    values: strings expanded from RECIPE_REPOSITORY, RECIPE_WORKSPACE, FOUNDATION_ROOT, FOUNDATION_INSTALL, FOUNDATION_PYTHON, NATIVE_BIN_PREFIX, NATIVE_EXECUTABLE_SUFFIX, or DEPENDENCY:<id>
    secrets: forbidden
  launcher:
    required_fields:
      - template
      - output
      - mode
    mode:
      allowed:
        - immediate
        - activate-only
        - serve

doctor_contract:
  mutation: none
  checks:
    - Foundation requirements and Receipts
    - local dependency root resolution
    - required local artifacts

configure_contract:
  mutation: explicit
  behavior:
    - Normalize Foundation and Recipe-local repositories into one source materialization plan.
    - Report existing checkouts as reused local input with available revision provenance.
    - Clone only missing git dependencies, including Foundation source repositories required by the plan.
    - Place automatically cloned repositories beside the Recipe repository.
    - Never overwrite an existing path.
    - Do not clone into a missing path selected through an override environment variable.
    - Execute the Foundation build plan through the internal Foundation engine.
    - Use an explicitly selected generated Foundation requirements file consistently for doctor, plan, configure, and guide status.
    - Install declared Recipe Python requirements into Foundation Python.
    - Atomically generate environment.json, POSIX and PowerShell activation, and the declared Launcher file.

launch_contract:
  behavior:
    - Compose the Workspace environment with the generated Recipe environment.
    - Validate the generated Launcher command, cwd, and library paths.
    - Invoke Hakoniwa Launcher directly with Foundation Python.
