id: recipe-id
title: Human readable recipe title
recipe_version: 0.1

goal:
  user_request: Original or normalized user request.
  description: >
    One paragraph describing the target Hakoniwa system.

feasibility:
  status: feasible | partially_feasible | not_feasible | unknown
  confidence: high | medium | low
  rationale:
    - Why the current catalog supports this judgement.

validation:
  status: not_tested | partially_verified | verified | blocked
  summary: What has and has not been executed.
  steps:
    - id: normalized_step_id
      status: not_tested | verified | blocked | skipped
      evidence:
        - repository: hakoniwalab/component
          path: path/to/evidence
          revision: main
      notes:
        - Concrete validation note or blocker.

# Optional. Add this section when execution involves meaningful human judgement,
# physical action, external permissions/credentials, license entitlement, cost,
# deployment, or a simulation-to-real-world boundary.
#
# Keep this separate from feasibility and validation:
# feasible != agent_can_execute
# verified != safe_to_execute_without_human
agency_boundary:
  agent_actions:
    - id: generate_configs
      description: Generate PDU, Endpoint, Bridge, launcher, or other simulation configuration.
      autonomous: true
      preconditions:
        - user_requested_execution

    - id: run_simulation
      description: Launch and validate the simulation-only composition.
      autonomous: true
      preconditions:
        - user_requested_execution
        - target_environment_confirmed

  human_decisions:
    - id: approve_model_fidelity
      description: Decide whether the selected physics, sensor, and environment models are sufficient.
      status: required | satisfied | not_required
      required_before:
        - customer_acceptance

  human_actions:
    - id: connect_physical_device
      description: Physically connect the target device when the Recipe crosses into hardware execution.
      status: required | confirmed | not_required
      confirmation_required: true
      required_before:
        - hardware_execution

  required_permissions:
    - id: external_access_or_license
      description: Confirm required private-repository access, credentials, license entitlement, or approval.
      status: required | satisfied | not_required
      required_before:
        - protected_or_commercial_execution

  notes:
    - Do not silently cross from simulation to real-world actuation.
    - Dependent steps must stop until required human or permission gates are satisfied.

constraints:
  - no-ros-runtime
  - single-pc

target_environment:
  required_for: executable-demo
  status: unspecified
  os: macOS | Linux | Windows | WSL2 | unknown
  os_version: unknown
  architecture: arm64 | x86_64 | unknown
  execution_mode: native | docker | vm | wsl | unknown
  runtimes:
    - name: Godot
      required: false
      version: unknown
      path: unknown
    - name: MuJoCo
      required: false
      version: unknown
      path: unknown
    - name: Python
      required: false
      version: unknown
      path: unknown
  hakoniwa:
    # Foundation-aware Recipes use the Business Pack-local prefix below.
    # Legacy Recipes may explicitly retain a system prefix such as /usr/local/hakoniwa.
    install_prefix: work/foundation/install
    components_built:
      - component-id
  notes:
    - Ask the user before producing runbook commands if this section is unspecified.

execution_environment:
  required_for: executable-demo
  status: unspecified
  # Use managed only when Foundation and Recipe operations own execution under work/.
  # A managed Recipe must also declare non-empty foundation_requirements below.
  workspace:
    mode: managed
  os: macOS | Linux | Windows | WSL2 | unknown
  os_version: unknown
  architecture: arm64 | x86_64 | unknown
  execution_mode: native | docker | vm | wsl | unknown
  gui:
    required: false
    status: unknown
  shared_memory:
    required: false
    access: unknown
  devices:
    - name: joystick
      required: false
      available: unknown
  python:
    environment: system | venv | conda | unknown
    hakopy_available: unknown
  hakoniwa:
    # Keep this aligned with target_environment for Foundation-aware Recipes.
    install_prefix: work/foundation/install
    hako_cmd_access: unknown
  notes:
    - Runtime verification must state these assumptions.

# Optional. Recipe-owned packages installed into an explicitly selected runtime.
# Foundation component packages remain owned by component Receipts.
runtime_dependencies:
  python:
    interpreter: work/foundation/install/python
    requirements: recipes/requirements/<recipe-id>.txt
    packages:
      - name: package-name
        version: 1.0.0
        purpose: Explain why this Recipe needs the package.

# Classify every migrated Recipe as Foundation-required or intentionally not required.
# A not_required Recipe must explain why it does not execute Core, SHM, hako-cmd, or hakopy.
foundation_contract:
  mode: required # required | not_required
  reason: This Recipe executes Hakoniwa Core shared memory through the managed Workspace.

# Optional only when foundation_contract.mode is not_required.
# Add this section when the Recipe uses the reusable local Foundation.
# Declare only component minimum versions, capabilities, or build limits that the Recipe actually needs.
# Omit this section for Recipes that intentionally use a legacy/system-installed runtime.
foundation_requirements:
  hakoniwa-core-pro:
    version:
      min: 1.0.0
    capabilities:
      shared_memory: true
      hako_cmd: true
  hakoniwa-pdu-endpoint:
    capabilities:
      hakoniwa_core: true
      core_callback: true

# Optional versioned contract for non-Foundation repositories or local inputs.
# Generic `tools/recipe.py doctor` validates these paths and artifacts.
# `tools/recipe.py plan` normalizes these and required Foundation repositories
# into one source plan. `configure` clones only missing git sources into a sibling
# repository path; it never overwrites an existing or environment-selected path.
recipe_local_requirements_schema_version: 1
recipe_local_requirements:
  sibling-component-id:
    root:
      default_path: ../sibling-repository
      override_env: HAKO_SIBLING_COMPONENT_ROOT
      relative_to: recipe_repository
    source:
      type: git
      url: https://github.com/hakoniwalab/sibling-repository.git
      revision: main
    required_artifacts:
      - path: path/to/required-file
        kind: file

# Optional resolved runtime contract. `configure` generates environment.json,
# activate/Activate.ps1, and the Recipe-owned Launcher under work/recipes/<id>/.
recipe_runtime_schema_version: 1
recipe_runtime:
  environment:
    HAKO_COMPONENT_ROOT: ${DEPENDENCY:sibling-component-id}
    HAKO_RECIPE_WORKSPACE: ${RECIPE_WORKSPACE}
    HAKO_FOUNDATION_INSTALL: ${FOUNDATION_INSTALL}
  launcher:
    template: recipes/launcher/<recipe-id>.launch.json
    output: config/launcher.json
    mode: immediate

process_topology:
  required_for: multi-process-demo
  conductor_owner: process-a
  viewer_owner: process-a
  simulator_processes:
    - id: process-a
      asset_name: asset-a
      conductor: owner | disabled
      viewer: enabled | disabled
      real_robots:
        - robot_name: ROBOT_A
          model: model-or-mjcf-name
          publishes:
            - base_link_pos
      mirrored_robots:
        - robot_name: ROBOT_B
          body_name: mirror-body-name
          subscribes:
            - base_link_pos
    - id: process-b
      asset_name: asset-b
      conductor: owner | disabled
      viewer: enabled | disabled
      real_robots:
        - robot_name: ROBOT_B
          model: model-or-mjcf-name
          publishes:
            - base_link_pos
      mirrored_robots:
        - robot_name: ROBOT_A
          body_name: mirror-body-name
          subscribes:
            - base_link_pos
  controller_processes:
    - id: controller-a
      target_robot: ROBOT_A
      target_pdu: hako_cmd_game
    - id: controller-b
      target_robot: ROBOT_B
      target_pdu: hako_cmd_game
  notes:
    - Use only one Conductor owner when multiple simulator processes run.
    - A viewer may be enabled for only one process when that process mirrors remote robots.

components:
  - id: hakoniwa-component-id
    roles:
      - recipe_role_from_catalog_schema
    purpose: Why this component is used in this recipe.

connections:
  - from: source-component-id
    to: target-component-id
    interface: pdu | endpoint | file | api | command | generated-artifact
    data:
      - data item or artifact name
    contract:
      status: not_tested | partially_verified | verified | blocked
      requires:
        - condition-or-adapter-needed-for-this-connection
      validation_notes:
        - What evidence exists for this specific connection.
    notes: How this connection works.

data_flow:
  summary: Short explanation of runtime data movement.
  steps:
    - from: producer
      to: consumer
      data:
        - pdu-or-artifact
      description: What moves here.

time_model:
  mode: shared-simulation-time | visualization-polling | wall-clock | external | unknown
  components:
    - component-id
  notes:
    - Timing assumption or synchronization strategy.

artifact_sets:
  physics_artifacts:
    description: Inputs consumed by the physics/runtime simulator.
    status: not_tested | partially_verified | verified | blocked
    artifacts:
      - artifact-name
    notes:
      - Runtime-specific assumptions such as world composition or visual mesh handling.
  visualization_artifacts:
    description: Inputs consumed by Godot, Foxglove, or another viewer.
    status: not_tested | partially_verified | verified | blocked
    artifacts:
      - artifact-name
    notes:
      - Visualization-specific assumptions such as GLB parts or scene mappings.
  pdu_artifacts:
    description: PDU definitions, endpoint configs, and sync profiles.
    status: not_tested | partially_verified | verified | blocked
    artifacts:
      - artifact-name
    notes:
      - PDU name/type compatibility assumptions.
  runtime_artifacts:
    description: Commands, manifests, generated worlds, or configs required to run the demo.
    status: not_tested | partially_verified | verified | blocked
    artifacts:
      - artifact-name
    notes:
      - Environment or component build assumptions.

artifacts:
  - name: artifact-name
    kind: mjcf | urdf | glb | godot-scene | endpoint-config | pdu-definition | profile | command | source
    producer: component-id
    consumer:
      - component-id
    path: optional/repo/path

missing_pieces:
  - Confirm exact runtime wiring.

demo:
  objective: What the minimal demo should prove.
  readiness:
    lifecycle_state:
      source: launcher-session
      required: RUNNING
      sufficient: false
    checks:
      - id: demo-ready-signal
        kind: log | tcp | http | websocket | pdu | process | human_observation
        target: Concrete port, URL, log path, PDU, process, or GUI.
        expected: Observable condition that must be true.
    operator_handoff:
      background: true
      explain_command_return: true
      next_actions:
        - open-viewer
        - status
        - stop
  steps:
    - order: 1
      id: demo-step-id
      component: component-id
      action: Concrete action.
      command: optional command
      agency: agent_action | human_decision | human_action | required_permission
      requires_gates:
        - optional-agency-boundary-id
      evidence:
        - repository: hakoniwalab/component
          path: README.md
          revision: main
  observability:
    success_signals:
      - What the user should see, plot, measure, or find in logs.
    failure_signals:
      - What indicates the demo started but the composition did not work.
    fixtures:
      - World, obstacle, lighting, sensor, or input conditions required to make the behavior observable.
    automation:
      - Scripted command source, launcher, or other mechanism that avoids unnecessary manual input.
  verification_checks:
    lifecycle:
      - Process, launcher, or hako-cmd condition that should occur.
    behavior:
      - Model loaded, simulation advanced, pose changed, sensor hit, PDU updated, or controller phase completed.
    logs:
      - Log file or message pattern that confirms the behavior evidence.

expected_result: >
  What the user should see when the recipe works.

source_catalogs:
  - component_id: component-id
    catalog_path: ../catalog/components/component-id.yaml

source_artifacts:
  - repository: hakoniwalab/component
    path: path/to/artifact
    revision: main
    description: Why this artifact matters.

tags:
  - hakoniwa
