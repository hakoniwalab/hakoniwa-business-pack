name: Apply Foundation test portability fix

on:
  push:
    branches:
      - fix/foundation-tests-windows-62

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundation-tests-windows-62
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply test-only portability fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/test_foundation.py')
          text = path.read_text(encoding='utf-8')
          if 'f"  prefix: {json.dumps(str(self.prefix))}\\n"' in text:
              raise SystemExit(0)
          replacements = {
              '            f\'  prefix: "{self.prefix}"\\n\'\n': '            f"  prefix: {json.dumps(str(self.prefix))}\\n"\n',
              '        self.assertTrue(data["foundation_root"].endswith("work/foundation"))\n': '        self.assertEqual(Path(data["foundation_root"]), foundation.repository_root() / "work" / "foundation")\n',
              '        self.assertTrue(\n            data["foundation_python"].endswith("work/foundation/install/python")\n        )\n': '        self.assertEqual(Path(data["foundation_python"]), foundation.repository_root() / "work" / "foundation" / "install" / "python")\n',
              '        self.assertTrue(data["recipe_root"].endswith("work/recipes/drone-threejs"))\n': '        self.assertEqual(Path(data["recipe_root"]), foundation.repository_root() / "work" / "recipes" / "drone-threejs")\n',
              '        self.assertIn(f\'hakoniwa_core_root: "{paths.install_prefix}"\', content)\n': '        self.assertIn(f"hakoniwa_core_root: {json.dumps(str(paths.install_prefix))}", content)\n',
              '        self.assertIn(\n            f\'  hakoniwa_core_root: "{paths.install_prefix}"\', content\n        )\n': '        self.assertIn(f"  hakoniwa_core_root: {json.dumps(str(paths.install_prefix))}", content)\n',
              '        self.assertIn(f\'  athrill_root: "{source.parent / "athrill"}"\', content)\n': '        self.assertIn(f"  athrill_root: {json.dumps(str(source.parent / \'athrill\'))}", content)\n',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match, found {text.count(old)}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          python -m unittest tools/test_foundation.py -v
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "tmori"
          git config user.email "164193+tmori@users.noreply.github.com"
          git add tools/test_foundation.py
          git commit -m "test: make Foundation paths portable on Windows"
          git push origin HEAD:fix/foundation-tests-windows-62
