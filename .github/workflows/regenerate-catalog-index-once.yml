name: Regenerate catalog index once

on:
  push:
    branches:
      - agent/refresh-pdu-rpc-python-catalog-v2

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refresh-pdu-rpc-python-catalog-v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Regenerate index and remove temporary workflow
        run: |
          ruby catalog/tools/generate_index.rb
          rm .github/workflows/regenerate-catalog-index-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.yaml .github/workflows/regenerate-catalog-index-once.yml
          git commit -m "docs: regenerate catalog index"
          git push origin HEAD:agent/refresh-pdu-rpc-python-catalog-v2
