name: Apply Foundation toolchain edge-case tests

on:
  push:
    branches:
      - fix/foundation-toolchain-install-dir-179

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundation-toolchain-install-dir-179
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add edge-case regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/test_foundation.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\nclass FoundationInspectorTest(unittest.TestCase):\n'
          addition = r'''
    def test_toolchain_relative_and_absolute_install_dir_resolve_same_prefix(self) -> None:
        with tempfile.TemporaryDirectory() as temporary:
            root = Path(temporary).resolve()
            vcpkg = root / "external" / "vcpkg"
            vcpkg.mkdir(parents=True)
            (vcpkg / ("vcpkg.exe" if sys.platform == "win32" else "vcpkg")).write_text("test\n", encoding="utf-8")
            cmake = vcpkg / "scripts" / "buildsystems" / "vcpkg.cmake"
            cmake.parent.mkdir(parents=True)
            cmake.write_text("# test\n", encoding="utf-8")
            install = root / "work" / "alt-prefix" / "install"
            old_cwd = Path.cwd()
            try:
                os.chdir(root)
                with mock.patch.object(foundation, "repository_root", return_value=root), mock.patch.object(foundation, "warn_if_workspace_invalid"):
                    relative_result = foundation.main([
                        "toolchain", "--recipe-id", "test-recipe",
                        "--install-dir", "work/alt-prefix/install",
                        "--vcpkg-root", str(vcpkg),
                    ])
                relative_config = foundation.foundation_toolchain_path(
                    foundation.resolve_workspace(root, "test-recipe", install.parent)
                )
                relative_bytes = relative_config.read_bytes()
                relative_config.unlink()
                with mock.patch.object(foundation, "repository_root", return_value=root), mock.patch.object(foundation, "warn_if_workspace_invalid"):
                    absolute_result = foundation.main([
                        "toolchain", "--recipe-id", "test-recipe",
                        "--install-dir", str(install),
                        "--vcpkg-root", str(vcpkg),
                    ])
            finally:
                os.chdir(old_cwd)
            self.assertEqual(relative_result, 0)
            self.assertEqual(absolute_result, 0)
            self.assertEqual(relative_bytes, relative_config.read_bytes())

    def test_failed_windows_component_reports_missing_prefix_toolchain_config(self) -> None:
        with tempfile.TemporaryDirectory() as temporary:
            root = Path(temporary).resolve()
            paths = foundation.resolve_workspace(root, "test-recipe")
            source = root / "athrill-target-v850e2m"
            hako = source / "tools" / "hako.py"
            hako.parent.mkdir(parents=True)
            hako.write_text("# test\n", encoding="utf-8")
            python = foundation.foundation_python_executable(paths.foundation_python)
            plan = {
                "blocked": [],
                "recipe": str(root / "test-recipe.yaml"),
                "actions": [{
                    "component": "athrill-target-v850e2m",
                    "source": str(source),
                    "operations": ["doctor"],
                    "requirements": {},
                }],
            }
            contract = {"version": "3.12.0", "soabi": "cpython-312-test"}
            with mock.patch.object(foundation, "ensure_foundation_python", return_value=(python, contract)), mock.patch.object(foundation.platform, "system", return_value="Windows"), mock.patch.object(
                foundation.subprocess,
                "run",
                return_value=subprocess.CompletedProcess([], 1),
            ):
                with self.assertRaises(foundation.FoundationError) as raised:
                    foundation.execute_build_plan(plan, paths)
            message = str(raised.exception)
            self.assertIn(str(paths.install_prefix), message)
            self.assertIn(str(foundation.foundation_toolchain_path(paths)), message)
            self.assertIn("foundation.py toolchain", message)
'''
          if text.count(marker) != 1:
              raise SystemExit(f'marker count={text.count(marker)}')
          path.write_text(text.replace(marker, '\n' + addition + marker), encoding='utf-8')
          PY
          git diff --check
          python -m unittest tools/test_foundation.py -v
      - name: Commit tests
        shell: bash
        run: |
          git config user.name "tmori"
          git config user.email "164193+tmori@users.noreply.github.com"
          git add tools/test_foundation.py
          git commit -m "test: cover Foundation toolchain prefix edge cases"
          git push origin HEAD:fix/foundation-toolchain-install-dir-179
