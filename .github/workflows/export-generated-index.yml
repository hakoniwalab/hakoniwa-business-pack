name: Commit Generated Catalog Index

on:
  push:
    branches:
      - agent/refine-add-two-ints-runtime-contract

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refine-add-two-ints-runtime-contract
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: ruby catalog/tools/generate_index.rb
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- catalog/index.yaml; then
            echo 'catalog/index.yaml is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/index.yaml
          git commit -m 'docs: regenerate catalog index'
          git push origin HEAD:agent/refine-add-two-ints-runtime-contract
