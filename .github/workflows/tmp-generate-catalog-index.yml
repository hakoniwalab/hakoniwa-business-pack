name: Temporary Generate Catalog Index

on:
  push:
    branches:
      - catalog/add-drone-show

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog/add-drone-show
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Generate index
        run: ruby catalog/tools/generate_index.rb
      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- catalog/index.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.yaml
          git commit -m "catalog: regenerate index"
          git push origin HEAD:catalog/add-drone-show
