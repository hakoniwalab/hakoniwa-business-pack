name: Regenerate catalog index on branch

on:
  push:
    branches:
      - agent/remove-generated-at

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-generated-at

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Regenerate catalog index
        run: ruby catalog/tools/generate_index.rb

      - name: Commit generated index when changed
        run: |
          if git diff --quiet -- catalog/index.yaml; then
            echo "catalog/index.yaml is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.yaml
          git commit -m "regenerate catalog index"
          git push origin HEAD:agent/remove-generated-at
