name: Validate Business Pack

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate catalog
        run: ruby catalog/tools/validate_catalog.rb

      - name: Check catalog/index.yaml is up to date
        run: |
          ruby catalog/tools/generate_index.rb
          git diff --exit-code catalog/index.yaml

      - name: Validate recipes
        run: ruby recipes/tools/validate_recipes.rb

      - name: Test shared native runtime schema
        run: ruby schemas/test_native_runtime_validation.rb

      - name: Test Drone Fleet performance experiment schema
        run: ruby schemas/recipes/drone-fleet-performance/test_experiment_validation.rb

      - name: Test Foundation schemas
        run: ruby foundation/tools/test_validation.rb

      - name: Test Foundation inspector and Recipe guide
        run: >-
          python -m unittest
          tools/test_foundation.py
          tools/test_recipe_guide.py
          -v

      - name: Test Recipe-specific tools
        run: >-
          python -m unittest discover
          -s tools/recipe
          -p "test_*.py"
          -v

      - name: Test shared tools helpers
        run: >-
          python -m unittest discover
          -s tools/tests
          -p "test_*.py"
          -v

      - name: Validate usecases
        run: ruby usecases/tools/validate_usecases.rb

      - name: Validate knowledge candidates
        run: ruby knowledge/tools/validate_candidates.rb

  workspace-cross-platform:
    name: Workspace Environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Workspace Environment
        run: >-
          python -m unittest
          tools/test_workspace.py
          tools/test_workspace_enter.py
          tools/test_workspace_guard.py
          -v

      - name: Test Recipe-specific tools
        run: >-
          python -m unittest discover
          -s tools/recipe
          -p "test_*.py"
          -v

      - name: Test shared tools helpers
        run: >-
          python -m unittest discover
          -s tools/tests
          -p "test_*.py"
          -v
