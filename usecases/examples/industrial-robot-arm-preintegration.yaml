id: industrial-robot-arm-preintegration
title: 産業用ロボットアーム導入前の指令・状態統合検証
usecase_version: 0.4

audience:
  primary:
    - manufacturing-engineering-team
    - robot-system-integrator
    - robot-control-developer
  notes:
    - The public reference (teras-project/hakoniwa-robot-arm) verifies DOBOT Nova5; FAIRINO FR5 and SO-101 follower are published with verification in progress.

situation: >
  A team is considering or integrating an articulated robot arm and wants to examine
  trajectory commands, simulated joint motion, joint-state feedback, and ROS 2 integration
  before physical-system integration.

problem: >
  Robot-specific models, actuator settings, command contracts, bridge configuration,
  and state-output paths must be aligned. Discovering these integration gaps only after
  hardware preparation makes the software integration phase harder to isolate and review.

desired_outcome: >
  Run a robot-arm model in MuJoCo as a Hakoniwa asset, send JointTrajectory-compatible
  commands, observe JointState-compatible output, and where verified connect ROS 2 through
  the Hakoniwa TCP/PDU bridge path before planning physical-system connection.

status:
  feasibility: feasible
  validation: partially_verified
  confidence: high
  rationale:
    - The public repository records Nova5 as verified on macOS host+Docker with ROS 2 Jazzy and on Ubuntu 24.04 native host-ros2.
    - FR5 and SO-101 are published there with verification still in progress; it should not be inferred from configuration availability.
    - JointTrajectory command handling and JointState output are supported by the common arm runtime and bridge architecture.

realized_by:
  - recipe_id: nova5-public-reference
    notes: Metadata-only entry pointing to the public Robot Arm procedures; not a Business Pack-owned executable Demo.

supported_by:
  - component_id: hakoniwa-robot-arm
    role: Provide the public robot-specific models and manifests (Nova5, FR5, SO-101), the common arm runtime, per-model Recipes and environment-specific procedures.
  - component_id: hakoniwa-mujoco-robots
    role: Provide the public MuJoCo and Hakoniwa robot simulation runtime.
  - component_id: hakoniwa-mbody-registry
    role: Supply or regenerate robot-body and MJCF artifacts.
  - component_id: hakoniwa-pdu-endpoint
    role: Provide command reception, state publication, and PDU runtime infrastructure.
  - component_id: hakoniwa-core-pro
    role: Provide Hakoniwa asset lifecycle and simulation synchronization.
  - component_id: hakoniwa-pdu-ros
    role: Convert ROS 2 JointTrajectory and JointState data across the TCP/PDU integration boundary.
  - component_id: hakoniwa-pdu-python
    role: Provide Python reference command senders and PDU conversion paths.

communication_notes:
  safe_statements:
    - Nova5 has verified simulation and ROS 2 paths on macOS host+Docker (Jazzy) and Ubuntu 24.04 native.
    - FR5 and SO-101 models and configuration are published; their verification is in progress.
    - The integration path accepts JointTrajectory-compatible commands and publishes JointState-compatible data.
    - Additional robot models can be onboarded but require robot-specific model and validation work.
  avoid_statements:
    - Every industrial robot arm is supported without robot-specific work.
    - Every provided ROS 2 profile is E2E verified for every robot.
    - MoveIt integration is verified unless a separate end-to-end verification is added.
    - Windows execution, or any robot other than Nova5, is verified based only on the presence of configuration or source code.
    - Simulation results prove physical performance or safety.

limitations:
  - Verification coverage differs by robot, ROS 2 distribution, execution mode, and host platform.
  - Model fidelity, actuator behavior, collision parameters, payloads, and acceptance criteria require human review.
  - The public Nova5 reference cites macOS host+Docker and Ubuntu 24.04 native host-ros2 evidence; other robots and host combinations require their own verification.
  - Simulation output must not be connected to physical hardware without an explicit approval and safety gate.
  - The public reference Recipe links externally owned setup/build/operation procedures; Business Pack does not provide a complete executable Nova5 runner.

next_steps:
  - Complete FR5 and SO-101 verification in the public repository and record it there.
  - Verify additional host environments (Windows) separately from the recorded macOS and Ubuntu paths.
  - Define repeatable model-fidelity and actuator-validation criteria for additional robot arms.

tags:
  - robot-arm
  - industrial-robot
  - joint-trajectory
  - joint-state
  - mujoco
  - ros2
  - tcp
  - commercial
  - preintegration
