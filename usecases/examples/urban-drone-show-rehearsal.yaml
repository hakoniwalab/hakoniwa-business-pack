id: urban-drone-show-rehearsal
title: PLATEAU都市空間を用いた多数機ドローンショー事前リハーサル
usecase_version: 0.1

audience:
  primary:
    - demonstration-owner
    - development-team
    - technical-sales
  notes:
    - The current reference implementation uses Hakoniwa Drone Show with Hakoniwa Drone Core/PRO and PLATEAU City World assets from Hakoniwa Envsim.

situation: >
  A team wants to prepare or demonstrate a multi-drone show in a specific urban setting
  before committing to the real venue, including formation motion, audience-visible
  appearance, city clearance, and repeatable environmental disturbances such as wind.

problem: >
  A visual animation alone does not show how the planned formation interacts with the
  city geometry or how the simulated fleet responds to environmental disturbance.
  Conversely, a drone dynamics simulator without the show plan and audience view does
  not provide a practical rehearsal workflow for show design.

desired_outcome: >
  Rehearse a resolved multi-drone show plan in a PLATEAU-derived city environment,
  execute the simulated fleet under Hakoniwa drone dynamics, inspect the show from
  audience-oriented viewers, and compare repeatable wind-scenario results while keeping
  simulation evidence separate from real-flight safety or operational approval.

status:
  feasibility: feasible
  validation: partially_verified
  confidence: high
  rationale:
    - Hakoniwa Drone Show owns show files and resolved plans, formation generation, assignment, transition planning, LED direction, show lifecycle, audience preview, AR preview, and wind-scenario evaluation.
    - A recorded city-show baseline verifies 128 drones across six processes, runtime launcher lifecycle, Show Runner registration, all-aircraft takeoff completion, Map Viewer response, and clean shutdown.
    - Hakoniwa Envsim provides PLATEAU-derived aligned GLB visual and MuJoCo physics city assets, while Hakoniwa Drone Core/PRO owns fleet dynamics.
    - The executable experiment Recipe is owned by the private Hakoniwa Drone Show repository; Business Pack records a pinned external reference instead of copying that Recipe.

realized_by:
  - repository: hakoniwalab/hakoniwa-drone-show
    path: recipes/experiments/virtual-drone-show-city.yaml
    revision: ccc55d3e193ec10b56fc21e3c154ae437490c25d
    role: Component-owned executable experiment Recipe for the 128-drone PLATEAU city show, viewer, wind scenario, and show-file composition.

supported_by:
  - component_id: hakoniwa-drone-show
    role: Provide show planning, formation generation, assignment, transition and LED direction, show lifecycle, audience preview, and reproducible wind-scenario evaluation.
  - component_id: hakoniwa-drone-core
    role: Provide multi-drone dynamics and the commercial Drone PRO runtime path used for the simulated fleet.
  - component_id: hakoniwa-envsim
    role: Provide PLATEAU-derived city visual and physics assets plus environmental disturbance fields.
  - component_id: hakoniwa-map-viewer
    role: Provide map and 3D monitoring for the running fleet and city context.
  - component_id: hakoniwa-threejs-drone
    role: Provide browser-based 3D drone visualization used by show-oriented viewer paths.

communication_notes:
  safe_statements:
    - The current reference implementation can execute a resolved multi-drone show plan in a PLATEAU-derived Hakoniwa city simulation.
    - A recorded baseline verifies 128 simulated drones across six processes through takeoff, show-runner lifecycle, viewer response, and clean shutdown.
    - Wind scenarios can be reproduced and compared in simulation when the same scenario inputs and execution conditions are used.
    - PLATEAU visual geometry and simulation collision geometry are separate representations with explicit fidelity limits.
  avoid_statements:
    - The simulation certifies that a real drone show is safe to fly.
    - A collision-free simulation proves regulatory or operational approval.
    - Wind-response results are equivalent to real aircraft behavior without model validation.
    - PLATEAU geometry is CAD-accurate or sufficient for final flight clearance by itself.
    - The component-owned private Recipe is a public one-command Recipe available without the required commercial dependencies.

limitations:
  - Hakoniwa Drone Show is a private commercial component and requires the appropriate access and license.
  - Commercial fleet execution follows the Hakoniwa Drone PRO licensing path represented by the dual-license Drone catalog component.
  - The executable reference Recipe is component-owned in the private Hakoniwa Drone Show repository; Business Pack stores only its repository, path, and pinned revision.
  - PLATEAU geometry fidelity depends on the source dataset, available LODs, semantic surfaces, textures, and terrain coverage.
  - Simulation collision geometry and wind response do not establish real-flight safety, regulatory compliance, venue approval, or aircraft certification.
  - The recorded 128-drone baseline is representative evidence, not a guarantee for arbitrary fleet size, city extent, hardware, or show complexity.

next_steps:
  - Keep the external Recipe reference pinned to the reviewed Hakoniwa Drone Show revision and refresh it only after reviewing source changes.
  - Record a repeatable A/no-wind, A/wind, and revised-B/same-wind rehearsal comparison with quantitative position and formation metrics.
  - Add explicit collision and city-clearance metrics only where their observation and classification are verified.
  - Keep real-flight safety, regulatory approval, and operational acceptance outside the simulation claim boundary.

tags:
