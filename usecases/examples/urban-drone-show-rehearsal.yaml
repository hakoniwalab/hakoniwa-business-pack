id: urban-drone-show-rehearsal
title: PLATEAU都市空間を用いた多数機ドローンショー事前リハーサル
usecase_version: 0.1

audience:
  primary:
    - demonstration-owner
    - development-team
    - technical-sales
  notes:
    - The reference implementation uses commercial Hakoniwa Drone Show capabilities together with Hakoniwa Drone Core/PRO and PLATEAU City World assets.

situation: >
  A team wants to prepare or demonstrate a multi-drone show in a specific urban setting
  before committing to the real venue, including formation motion, audience-visible
  appearance, city clearance, and repeatable environmental disturbances such as wind.

problem: >
  A visual animation alone does not show how the planned formation interacts with city
  geometry or how the simulated fleet responds to environmental disturbance. A generic
  drone dynamics simulator alone also does not provide the show-planning and audience-view
  workflow needed for rehearsal.

desired_outcome: >
  Rehearse a multi-drone show in a PLATEAU-derived city environment, inspect formation
  motion and audience-visible appearance, and compare repeatable wind-scenario results
  before real-world execution while keeping simulation evidence separate from real-flight
  safety, regulatory approval, and venue acceptance.

status:
  feasibility: feasible
  validation: partially_verified
  confidence: high
  rationale:
    - Hakoniwa Drone Show provides show-planning and show-execution capabilities for the reference workflow.
    - A recorded city-show baseline verifies 128 simulated drones across six processes through runtime launch, Show Runner registration, all-aircraft takeoff completion, viewer response, and clean shutdown.
    - Hakoniwa Envsim provides PLATEAU-derived aligned visual and physics city assets, while Hakoniwa Drone Core/PRO provides fleet dynamics.

realized_by: []

supported_by:
  - component_id: hakoniwa-drone-show
    role: Provide commercial drone-show planning, formation, show lifecycle, audience preview, and reproducible wind-scenario evaluation capabilities.
  - component_id: hakoniwa-drone-core
    role: Provide multi-drone dynamics and the commercial Drone PRO runtime path used for fleet execution.
  - component_id: hakoniwa-envsim
    role: Provide PLATEAU-derived city visual and physics assets plus environmental disturbance fields.
  - component_id: hakoniwa-map-viewer
    role: Provide map and 3D monitoring for the running fleet and city context.
  - component_id: hakoniwa-threejs-drone
    role: Provide browser-based 3D drone visualization used by show-oriented viewer paths.

communication_notes:
  safe_statements:
    - Hakoniwa can be used to rehearse a multi-drone show in a PLATEAU-derived city simulation.
    - A recorded reference baseline verifies 128 simulated drones across six processes through takeoff and viewer operation.
    - Repeatable wind scenarios can be applied and compared in simulation.
    - Commercial use, evaluation, and access to the required private components are available through Hakoniwa Lab inquiry.
  avoid_statements:
    - The simulation certifies that a real drone show is safe to fly.
    - A collision-free simulation proves regulatory or operational approval.
    - Wind-response results are equivalent to real aircraft behavior without model validation.
    - PLATEAU geometry is CAD-accurate or sufficient for final flight clearance by itself.

limitations:
  - This Use Case includes commercial and private Hakoniwa components; contact Hakoniwa Lab for evaluation, licensing, and access.
  - Commercial fleet execution follows the Hakoniwa Drone PRO licensing path represented by the dual-license Drone catalog component.
  - Private implementation Recipes and internal repository paths are intentionally not published in Business Pack.
  - PLATEAU geometry fidelity depends on the source dataset, available LODs, semantic surfaces, textures, and terrain coverage.
  - Simulation collision geometry and wind response do not establish real-flight safety, regulatory compliance, venue approval, or aircraft certification.
  - The recorded 128-drone baseline is representative evidence, not a guarantee for arbitrary fleet size, city extent, hardware, or show complexity.

next_steps:
  - Maintain public capability and validation metadata without exposing private implementation Recipes.
  - Record repeatable comparison results for no-wind, wind, and revised-plan scenarios with quantitative position and formation metrics.
  - Add explicit collision and city-clearance metrics only where their observation and classification are verified.

