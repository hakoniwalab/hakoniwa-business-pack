id: browser-based-simulation-visualization
title: シミュレーション実行系と分離したブラウザ可視化
usecase_version: 0.2

audience:
  primary:
    - web-visualization-developer
    - demonstration-owner
    - robot-development-team
  notes:
    - The verified references are local compositions, not validated Internet-facing deployments.

situation: >
  A team wants to observe live robot or drone behavior through a browser-facing UI
  while physics, simulation time, and control remain owned by native Hakoniwa
  processes. The visualization technology may be a custom Three.js application, a
  map-oriented viewer, or a general-purpose tool such as Foxglove.

problem: >
  Native simulator state is not directly usable by browser applications. Data
  contracts, transport, viewer assets, and readiness checks span different technology
  stacks, and coupling the UI to the physics runtime makes either side difficult to
  replace. Process startup alone also does not prove that live state reaches the UI.

desired_outcome: >
  Keep physics and simulation-time ownership outside the browser, bridge selected PDU
  state through an explicit WebSocket-facing boundary, and independently develop or
  replace a browser visualization while retaining observable end-to-end validation.

status:
  feasibility: feasible
  validation: verified
  confidence: high
  rationale:
    - A Three.js drone viewer, a georeferenced map viewer, and Foxglove JointState visualization provide independent reference paths.
    - The verified references keep physics and simulation time in native Hakoniwa processes and use explicit PDU/transport boundaries for visualization.
    - Validation is limited to the recorded local environments and does not establish a secured remote deployment.

realized_by:
  - recipe_id: drone-single-mujoco-threejs-mac
    relationship: reference_implementation
    validation_scope: >
      One simulated drone is controlled from a separate Python process and rendered
      through a local Three.js browser viewer on macOS arm64.
  - recipe_id: drone-single-mujoco-threejs-gamepad
    relationship: interaction_variant
    validation_scope: >
      A human-operated drone composition adds gamepad input while keeping physics,
      bridge, and browser rendering as separate runtime roles.
  - recipe_id: drone-single-mujoco-shibuya-map-gamepad
    relationship: geospatial_variant
    validation_scope: >
      A partially verified reference combines local simulation coordinates, a
      PLATEAU scene, Leaflet, and embedded Three.js rendering.
  - recipe_id: shadow-hand-hakoniwa-to-foxglove
    relationship: visualization_tool_variant
    validation_scope: >
      A verified Shadow Hand path bridges JointState-compatible data into Foxglove
      WebSocket and animates a prepared URDF in Foxglove 3D.

supported_by:
  - component_id: hakoniwa-drone-core
    role: Provide the drone physics, control, and visual-state source used by the Three.js and map-viewer references.
  - component_id: hakoniwa-core-pro
    role: Provide native lifecycle, shared-memory PDU, and simulation-time ownership in the Core-backed references.
  - component_id: hakoniwa-pdu-bridge-core
    role: Move selected native PDU state toward WebSocket-facing visualization boundaries.
  - component_id: hakoniwa-pdu-endpoint
    role: Provide the runtime communication boundaries used by the reference compositions.
  - component_id: hakoniwa-pdu-registry
    role: Provide explicit data contracts and conversion artifacts for viewer-facing state.
  - component_id: hakoniwa-threejs-drone
    role: Provide a replaceable custom browser rendering implementation for drone state.
  - component_id: hakoniwa-map-viewer
    role: Provide map-oriented and geospatial browser visualization.
  - component_id: hakoniwa-pdu-foxglove
    role: Provide a general-purpose Foxglove WebSocket and 3D visualization path.

communication_notes:
  safe_statements:
    - Verified local references keep simulation execution separate from browser visualization.
    - Multiple browser-facing visualization technologies consume explicitly bridged Hakoniwa state.
    - Viewer readiness requires live connection and data-change evidence, not only process startup.
  avoid_statements:
    - The current references are validated Internet-facing or multi-site deployments.
    - The browser owns or executes the authoritative robot physics.
    - Any PDU type can be visualized without schema, conversion, or viewer-specific work.

limitations:
  - Current end-to-end evidence is primarily macOS arm64 and local browser access.
  - Network security, authentication, public deployment, latency, and multi-user operation are not validated.
  - Viewer-specific schemas, models, coordinate transforms, and UI configuration remain necessary.
  - Human browser interaction is part of some verified flows.

next_steps:
  - Add Linux or containerized browser-visualization evidence.
  - Define and validate a secured network deployment before describing remote visualization.
  - Add a reusable comparison of viewer contracts without implying that all viewers expose identical features.

tags:
  - browser
  - visualization
  - websocket
  - decoupled-runtime
  - threejs
  - map
  - foxglove
