<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hakoniwa City World Generator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; color: #17222d; background: #eef2f5; }
    #app { display: grid; grid-template-columns: minmax(320px, 390px) 1fr; grid-template-rows: 1fr; height: 100%; }
    #app.viewer-open { grid-template-rows: minmax(300px, 55%) minmax(280px, 45%); }
    #panel { grid-row: 1 / 3; padding: 18px; overflow: auto; background: #fff; border-right: 1px solid #cad3db; }
    #map { grid-column: 2; grid-row: 1; height: 100%; min-height: 300px; }
    #viewer-panel { display: none; grid-column: 2; grid-row: 2; position: relative; min-height: 280px; border-top: 1px solid #cad3db; background: #17222d; }
    #app.viewer-open #viewer-panel { display: block; }
    #viewer-canvas { display: block; width: 100%; height: 100%; }
    #viewer-status { position: absolute; z-index: 1; top: 10px; left: 10px; max-width: calc(100% - 20px); padding: 6px 9px; border-radius: 5px; color: #fff; background: #101820cc; font-size: .78rem; }
    h1 { margin: 0; font-size: 1.45rem; }
    h2 { margin: 20px 0 8px; font-size: 1rem; }
    .lead { margin: 5px 0 16px; color: #526271; font-size: .88rem; }
    .connection { display: flex; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 7px; background: #f2f5f7; }
    .connection[data-state="connected"] { background: #e8f7ef; color: #17613a; }
    .connection[data-state="error"] { background: #fff0ee; color: #9b2c24; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #8a98a5; }
    .connection[data-state="connected"] .dot { background: #1f9d5a; }
    .connection[data-state="error"] .dot { background: #d6453d; }
    button { border: 0; border-radius: 6px; padding: 9px 12px; background: #1367a8; color: #fff; cursor: pointer; }
    button:hover { background: #0d568f; }
    button:disabled { opacity: .55; cursor: wait; }
    #connect { margin-left: auto; padding: 5px 9px; font-size: .78rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    label { display: grid; gap: 4px; font-size: .78rem; color: #536371; }
    input, .grid select { width: 100%; border: 1px solid #b9c5ce; border-radius: 5px; padding: 7px; font: inherit; color: #17222d; background: #fff; }
    .hint { color: #697a88; font-size: .75rem; line-height: 1.45; }
    #inspect, #generate, #cancel, #download, #view3d, #delete-artifact { width: 100%; margin-top: 12px; padding: 11px; font-weight: 700; }
    #generate { background: #18864b; }
    #generate:hover { background: #126d3c; }
    #cancel { background: #a96b18; }
    #cancel:hover { background: #895511; }
    #selection-summary, #mesh-summary { margin-top: 9px; font: .78rem ui-monospace, monospace; color: #526271; }
    #overall { padding: 10px; border-radius: 7px; background: #f2f5f7; font-weight: 650; overflow-wrap: anywhere; }
    #overall.available { background: #e8f7ef; color: #17613a; }
    #overall.unavailable, #overall.failed { background: #fff0ee; color: #9b2c24; }
    .generation { margin-top: 8px; padding: 0; border-radius: 7px; font-size: .84rem; overflow-wrap: anywhere; }
    .generation.running { padding: 9px; background: #eaf3fb; color: #185b8d; }
    .generation.ready { padding: 9px; background: #e8f7ef; color: #17613a; font-weight: 700; }
    .generation.failed { padding: 9px; background: #fff0ee; color: #9b2c24; }
    .generation.canceled { padding: 9px; background: #fff6df; color: #775113; font-weight: 700; }
    .artifact-controls { margin-top: 10px; padding: 10px; border: 1px solid #d8e0e6; border-radius: 7px; background: #f7f9fa; }
    .artifact-controls select { width: 100%; margin-top: 4px; padding: 7px; border: 1px solid #b9c5ce; border-radius: 5px; background: #fff; }
    .viewer-layers { display: flex; gap: 16px; margin: 10px 0 0; padding: 8px 10px; border: 1px solid #d8e0e6; border-radius: 5px; }
    .viewer-layers legend { padding: 0 4px; color: #526271; font-size: .75rem; }
    .viewer-layers label { display: flex; align-items: center; gap: 6px; font-size: .82rem; }
    .viewer-layers input { width: auto; }
    #artifact-path { margin-top: 7px; color: #526271; font: .72rem ui-monospace, monospace; overflow-wrap: anywhere; }
    #artifact-detail { margin-top: 7px; color: #33495b; font: .75rem ui-monospace, monospace; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.45; }
    #cache-info { margin-top: 7px; color: #526271; font: .72rem ui-monospace, monospace; overflow-wrap: anywhere; }
    .artifact-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #view3d { background: #6c42a1; }
    #view3d:hover { background: #593585; }
    #delete-artifact { grid-column: 1 / -1; background: #a93a32; }
    #delete-artifact:hover { background: #872d27; }
    .capabilities { display: grid; gap: 7px; margin-top: 8px; }
    .capability { display: grid; grid-template-columns: 28px 1fr; gap: 7px; padding: 9px; border: 1px solid #d8e0e6; border-radius: 7px; }
    .capability .symbol { font-size: 1.15rem; font-weight: 800; }
    .capability.candidate .symbol { color: #16864b; }
    .capability.limited .symbol { color: #b36a00; }
    .capability.unavailable .symbol { color: #8a98a5; }
    .capability strong { display: block; font-size: .87rem; }
    .capability small { display: block; margin-top: 2px; color: #687886; line-height: 1.35; }
    .municipality { margin-top: 8px; font-size: .8rem; color: #526271; }
    details { margin-top: 14px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #111922; color: #d8ffd8; padding: 10px; border-radius: 6px; max-height: 230px; overflow: auto; font-size: .7rem; }
    .leaflet-container { background: #dce5e9; }
    .selection-rectangle { cursor: move; }
    .selection-resize-handle { display: grid; place-items: center; background: transparent; }
    .selection-resize-handle span { display: block; width: 12px; height: 12px; border: 2px solid #fff; border-radius: 3px; background: #1367a8; box-shadow: 0 1px 4px #17222d99; }
    .selection-resize-handle-nw, .selection-resize-handle-se { cursor: nwse-resize; }
    .selection-resize-handle-ne, .selection-resize-handle-sw { cursor: nesw-resize; }
    @media (max-width: 760px) {
      #app, #app.viewer-open { grid-template-columns: 1fr; grid-template-rows: auto minmax(440px, 1fr) minmax(360px, 1fr); height: auto; min-height: 100%; }
      #panel { grid-column: 1; grid-row: 1; border-right: 0; border-bottom: 1px solid #cad3db; }
      #map { grid-column: 1; grid-row: 2; }
      #viewer-panel { grid-column: 1; grid-row: 3; }
    }
  </style>
</head>
<body>
  <main id="app">
    <section id="panel">
      <h1>Hakoniwa City World</h1>
      <p class="lead">地図で範囲を選び、PLATEAUデータの利用可能性を生成前に診断します。</p>

      <div id="connection" class="connection" data-state="connecting">
        <span class="dot"></span><span id="connection-text">Workerへ接続中</span>
        <button id="connect" type="button">再接続</button>
      </div>

      <h2>1. 対象範囲</h2>
      <div class="grid">
        <label>Latitude<input id="latitude" type="number" step="0.000001" value="35.0988"></label>
        <label>Longitude<input id="longitude" type="number" step="0.000001" value="138.8587"></label>
        <label>N/S half extent [m]<input id="northSouth" type="number" min="10" max="1000" step="10" value="100"></label>
        <label>E/W half extent [m]<input id="eastWest" type="number" min="10" max="1000" step="10" value="100"></label>
        <label>Building Physics Level
          <select id="physics-level">
            <option value="0">0 — P0のみ（最軽量）</option>
            <option value="1">1 — P1 → P0</option>
            <option value="2">2 — P2 → P1 → P0</option>
            <option value="3" selected>3 — P3 → P2 → P1 → P0</option>
          </select>
        </label>
      </div>
      <p class="hint">地図のクリック、中心マーカーまたは青い区画のドラッグで位置を変更できます。四隅のハンドルで範囲を変更できます。100m + 100mは一辺200mの範囲です。</p>
      <div id="selection-summary"></div>
      <div id="mesh-summary"></div>
      <button id="inspect" type="button" disabled>2. Capabilityを診断</button>

      <h2>診断結果</h2>
      <div id="overall">未診断</div>
      <div id="municipality" class="municipality"></div>
      <div id="capabilities" class="capabilities"></div>
      <button id="generate" type="button" disabled>3. City Worldを生成</button>
      <button id="cancel" type="button" disabled>生成をキャンセル</button>
      <div id="generation" class="generation"></div>

      <div class="artifact-controls">
        <label>生成結果<select id="artifact-select" disabled><option>生成結果はありません</option></select></label>
        <div id="artifact-path">—</div>
        <div id="artifact-detail">Physics Level: — / Collider: —</div>
        <div id="cache-info">共有キャッシュ: —</div>
        <fieldset class="viewer-layers">
          <legend>3D表示</legend>
          <label><input id="viewer-visual" type="checkbox" checked disabled>Visual</label>
          <label><input id="viewer-collider" type="checkbox" disabled>Collider</label>
        </fieldset>
        <div class="artifact-actions">
          <button id="download" type="button" disabled>Download ZIP</button>
          <button id="view3d" type="button" disabled>3D Viewer</button>
          <button id="delete-artifact" type="button" disabled>生成結果を削除</button>
        </div>
      </div>

      <details>
        <summary>通信ログ</summary>
        <pre id="log"></pre>
      </details>
    </section>
    <div id="map" aria-label="City World selection map"></div>
    <section id="viewer-panel" aria-label="Generated City World 3D viewer">
      <div id="viewer-status">3D Viewer</div>
      <canvas id="viewer-canvas"></canvas>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}
  </script>
  <script type="module" src="./city-world-ui.js"></script>
</body>
</html>
